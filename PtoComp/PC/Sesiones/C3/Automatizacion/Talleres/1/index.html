<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taller 2 · Los procesos de la empresa</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--ink:#152039;--hud:#0f1830;--y:#ffc83d;--teal:#14b39a;--ok:#1f9d55;--muted:#5a6683;--line:#dfe4ef}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{font-family:Rubik,system-ui,Arial,sans-serif;color:var(--ink);background:var(--hud);font-size:16px;line-height:1.5}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.app{height:100dvh;display:flex;flex-direction:column}

.foot{flex:none;text-align:center;font-size:13px;color:#9fb0d8;background:var(--hud);padding:6px;border-top:3px solid #000}.foot b{color:var(--y)}
.portrait svg{width:100%;height:100%;border-radius:50%;border:4px solid var(--ink);background:#fff;box-shadow:0 5px 0 var(--ink);display:block}
.gbtn{background:var(--y);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);font-weight:800;font-size:15.5px;padding:9px 18px}
.gbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}.gbtn.w{background:#fff}.gbtn.t{background:var(--teal);color:#fff}.gbtn:disabled{opacity:.45;cursor:default}
.sky{height:100%;overflow:auto;background:linear-gradient(180deg,#7cc8f7 0%,#bfe6ff 55%,#e6f7ec 100%);display:grid;place-items:center;padding:24px}
.welcome{max-width:760px;width:100%;background:#fff;border:3px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);padding:30px 34px;text-align:center}
.welcome .portrait{width:120px;height:120px;margin:0 auto 12px}
.pill{display:inline-block;background:var(--y);border:3px solid var(--ink);border-radius:12px;padding:2px 14px;font-weight:800;font-size:15px}
.welcome h1{font-size:clamp(28px,4vw,42px);line-height:1.1;margin:12px 0 10px}
.welcome p{font-size:17px;color:#394660;margin:0 auto 6px;max-width:620px}
.form{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin:22px auto 6px;max-width:560px;text-align:left}
.form label{font-weight:700;font-size:14px}.form input{display:block;width:100%;margin-top:4px;padding:10px 12px;border:3px solid var(--ink);border-radius:12px;font-size:16px}
.err{color:#c2410c;font-weight:700;min-height:1.5em;margin:4px 0 10px}
.stage{height:100%;display:grid;grid-template-columns:410px minmax(0,1fr)}
.comp{background:#fff5e1;border-right:3px solid #000;padding:18px;display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto}
.vivy{display:flex;align-items:center;gap:12px}.vivy .portrait{width:96px;height:96px;flex:none}
.mtitle{display:flex;flex-direction:column}.secl{font-size:12px;font-weight:800;letter-spacing:.06em;color:#138a7c;text-transform:uppercase}.mtitle b{font-size:22px;line-height:1.15}
.box{background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:14px 16px;flex:none}
.box p{margin:0;font-size:16.5px;line-height:1.55}
.box h3{margin:0 0 6px;font-size:18px;display:flex;align-items:center;gap:8px}
.box ul{margin:0;padding-left:20px;font-size:16px;line-height:1.55}.box li{margin:5px 0}
.box.cierre{background:#fff6d8}
.num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--y);border:2px solid var(--ink);font-weight:800;font-size:14px;flex:none}
.hint{color:var(--muted);font-size:14px}
.stepbar{display:flex;align-items:center;gap:8px}.stepbar .sp{flex:1}
.navrow{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:8px}.navrow .sp{flex:1}
.simarea{min-width:0;min-height:0;display:grid;place-items:center;background:linear-gradient(165deg,#d9f4ff,#f8fdff);padding:18px}
.ruta{font-size:14px;font-weight:700;color:#33507a;background:#fff;border:2px solid #c9d4ea;border-radius:10px;padding:4px 12px;margin-bottom:10px;width:max-content;max-width:100%}
.simcol{display:flex;flex-direction:column;align-items:center;max-width:100%}
.device{background:#1b2440;border:3px solid #000;border-radius:20px;padding:8px;box-shadow:0 22px 50px rgba(5,10,30,.35);max-width:100%}
.view{position:relative;line-height:0;border-radius:12px;overflow:hidden}
.view img{display:block;max-width:100%;max-height:calc(100dvh - 170px)}
.svgv{background:#fff;width:min(1000px,calc(100vw - 500px));padding:0}.svgv svg{display:block;width:100%;height:auto;max-height:calc(100dvh - 210px)}
.simcol{width:100%}
.spot{position:absolute;border-radius:8px;pointer-events:none;opacity:0;transition:all .45s;box-shadow:0 0 0 4px var(--y),0 0 0 9999px rgba(8,14,34,.45)}.spot.on{opacity:1}
.mk{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-weight:800;font-size:14px;display:grid;place-items:center;padding:0;z-index:3;box-shadow:0 3px 0 var(--ink);line-height:1}
.mk.next{background:var(--y);animation:pulse 1.4s infinite}.mk.seen{background:var(--teal);color:#fff}.mk.on{background:var(--ink);color:var(--y);transform:translate(-50%,-50%) scale(1.15)}

.dn{position:relative;width:220px;border:3px solid var(--ink);border-radius:16px;padding:16px;text-align:center;background:#f6f8fd;box-shadow:0 4px 0 var(--ink);transition:.3s}
.dn .e{font-size:34px;display:block}.dn b{display:block;font-size:16px}.dn small{color:var(--muted)}
.dn.on{background:#fff3c4;transform:translateY(-4px)}
.dn .mk{left:0;top:0;transform:translate(-40%,-40%)}
.arr{font-size:30px;font-weight:800;color:#33507a}
.card{background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:24px 28px;max-width:820px;width:100%;max-height:100%;overflow:auto;line-height:1.5}
.qtag{display:inline-block;background:var(--ink);color:var(--y);border-radius:8px;padding:2px 10px;font-weight:800;font-size:13px}
.qq{font-size:22px;font-weight:700;margin:12px 0 16px;line-height:1.35}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:#fff;border:3px solid #cfd6e6;border-radius:14px;box-shadow:0 3px 0 #cfd6e6;padding:12px 16px;font-weight:600;font-size:17px}
.opt:hover:not(:disabled){border-color:var(--ink)}.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:#e3f6ea;box-shadow:0 3px 0 var(--ok)}.opt.wrong{border-color:#d9472f;background:#fff0ea;box-shadow:0 3px 0 #d9472f}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{font-size:16px;border-radius:12px;margin-top:12px;padding:10px 12px}.fb:empty{display:none}.fb.good{background:#e3f6ea;color:#16653a}.fb.bad{background:#fff0ea;color:#9c2e1a}
.qnav{display:flex;justify-content:flex-end;margin-top:14px}
.bar{height:10px;background:#e3e8f2;border-radius:99px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--teal);transition:width .4s}
.cert{background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:10px;max-width:820px;width:100%}
.cin{border:3px double #d9b44a;border-radius:16px;padding:22px 26px;text-align:center;background:linear-gradient(#fffdf5,#fff)}
.cin .portrait{width:78px;height:78px;margin:0 auto 6px}
.ck{letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#b08a1e;font-size:12px}
.cin h1{margin:6px 0 2px;font-size:clamp(26px,3.6vw,36px)}.cin h2{margin:4px 0;font-size:clamp(22px,3.4vw,32px);color:#14806e}
.cin p{margin:2px 0;color:var(--muted)}
.cmeta{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}.cmeta span{background:#fff6d8;border:2px solid var(--ink);border-radius:10px;padding:3px 12px;font-weight:700;font-size:14px}
.cfirma{margin-top:14px;display:inline-flex;flex-direction:column;border-top:2px solid var(--ink);padding-top:6px;min-width:220px}.cfirma small{color:var(--muted)}
.deliver{display:grid;gap:8px}.deliver div{display:flex;gap:10px;align-items:flex-start;background:#f6f8fd;border:2px solid #d5ddec;border-radius:12px;padding:10px 12px;font-size:15px}
.deliver i{font-style:normal;flex:none;width:26px;height:26px;border-radius:50%;background:var(--y);border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:13px}
.certwrap{height:100%;overflow:auto;padding:22px;display:flex;flex-direction:column;align-items:center;gap:18px;background:linear-gradient(165deg,#d9f4ff,#f8fdff)}
.toc{position:fixed;top:58px;left:0;z-index:40;background:#fff;border:3px solid var(--ink);border-radius:0 0 16px 0;box-shadow:0 6px 0 var(--ink);padding:10px;display:grid;gap:4px;min-width:260px}
.toc[hidden]{display:none}.toc button{text-align:left;border:0;background:#f6f8fd;border-radius:10px;padding:8px 12px;font-weight:600}.toc button:hover{background:#ffeeb8}

@media print{body{overflow:visible;background:#fff}.app{height:auto}body *{visibility:hidden}#cert,#cert *{visibility:visible}#cert{position:absolute;left:0;top:0;width:100%;box-shadow:none}}

.ico{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 5px;border-radius:7px;background:#1a5fd6;color:#fff;font-weight:800;font-size:13px;font-style:italic;vertical-align:middle}

let VOZ=null;function pickVoice(){const vs=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang));const fem=/(sabina|helena|laura|dalia|elvira|paloma|paulina|m[oó]nica|luc[ií]a|camila|salom[eé]|francisca|elena|ximena|catalina|valentina|marisol|penelope|esperanza|google espa|female|mujer)/i,mal=/(pablo|ra[uú]l|jorge|[aá]lvaro|diego|enrique|miguel|carlos|gonzalo|tom[aá]s|andr[eé]s|jos[eé]|male|hombre)/i;VOZ=vs.find(v=>fem.test(v.name))||vs.find(v=>!mal.test(v.name))||null}

const P=[{"k": "welcome"}, {"k": "diag", "svg": "proc", "title": "El proceso de la empresa", "ruta": "Empresa de distribución · Proceso de un pedido", "intro": "Un <b>proceso</b> es un conjunto de <b>tareas en orden</b> que producen un resultado. Este es el proceso de una empresa de distribución, desde que llega un pedido hasta que se despacha.", "m": [{"l": "Inicio", "t": "El proceso arranca cuando un <b>cliente hace un pedido</b>.", "b": [3.0, 7.91, 20.0, 14.88], "pos": "t", "img": "proc"}, {"l": "Tarea 1 · Recibir el pedido", "t": "La empresa registra quién pide, qué producto y qué cantidad.", "b": [29.0, 6.05, 20.0, 18.6], "pos": "t", "img": "proc"}, {"l": "Tarea 2 · Verificar existencias", "t": "Revisa en el inventario si hay unidades suficientes del producto.", "b": [56.0, 6.05, 20.0, 18.6], "pos": "t", "img": "proc"}, {"l": "Decisión", "t": "Una pregunta con dos caminos: <b>¿hay existencias?</b>", "b": [55.0, 32.56, 22.0, 30.23], "pos": "tl", "img": "proc"}, {"l": "Camino Sí · Preparar y empacar", "t": "Si hay producto, se alista y se empaca el pedido.", "b": [29.0, 38.6, 20.0, 18.6], "pos": "t", "img": "proc"}, {"l": "Camino No · Tarea 3", "t": "Si no hay producto, alguien habla con el cliente para resolverlo: esperar, cambiar el producto o cancelar. Luego se vuelve a verificar.", "b": [82.0, 38.6, 16.0, 18.6], "pos": "t", "img": "proc"}, {"l": "Tarea 4 · Confirmar el despacho", "t": "Se le avisa al cliente que su pedido salió.", "b": [29.0, 73.49, 20.0, 18.6], "pos": "r", "img": "proc"}, {"l": "Fin", "t": "El proceso termina con el pedido entregado.", "b": [3.0, 76.28, 20.0, 13.02], "pos": "t", "img": "proc"}], "cierre": ["Un proceso tiene un <b>inicio</b>, <b>tareas en orden</b>, <b>decisiones</b> y un <b>fin</b>.", "Las decisiones abren caminos distintos."]}, {"k": "diag", "svg": "simb", "title": "Los símbolos del diagrama de flujo", "ruta": "Diagrama de flujo · Símbolos", "intro": "El proceso se dibuja con un <b>diagrama de flujo</b>. Cada forma tiene un significado.", "m": [{"l": "Óvalo", "t": "Marca el <b>inicio</b> y el <b>fin</b> del proceso.", "b": [4.0, 30.0, 20.0, 35.0], "pos": "t", "img": "simb"}, {"l": "Rectángulo", "t": "Es una <b>tarea</b>: algo que se hace.", "b": [29.0, 27.5, 20.0, 40.0], "pos": "t", "img": "simb"}, {"l": "Rombo", "t": "Es una <b>decisión</b>: una pregunta con respuesta Sí o No.", "b": [54.0, 15.0, 20.0, 65.0], "pos": "t", "img": "simb"}, {"l": "Flecha", "t": "Indica <b>hacia dónde sigue</b> el proceso.", "b": [79.0, 35.0, 17.0, 25.0], "pos": "t", "img": "simb"}], "cierre": ["Óvalo = inicio o fin · Rectángulo = tarea · Rombo = decisión · Flecha = orden.", "Son los mismos símbolos que usaste en PSeInt."]}, {"k": "diag", "svg": "proc2", "title": "¿Qué tareas se automatizan?", "ruta": "Empresa de distribución · Clasificación de tareas", "intro": "Una tarea se puede <b>automatizar</b> 🤖 cuando tiene <b>reglas claras</b>, se <b>repite</b> y usa <b>datos digitales</b>. Si necesita criterio, conversación o trabajo físico, es <b>humana</b> 🧠.", "m": [{"l": "🤖 Recibir el pedido", "t": "Automatizable: el cliente llena un formulario y el pedido se guarda solo. Siempre se hace igual.", "b": [29.0, 6.05, 20.0, 18.6], "pos": "t", "img": "proc2"}, {"l": "🤖 Verificar existencias", "t": "Automatizable: comparar las unidades del inventario con una regla es una pregunta con datos claros.", "b": [56.0, 6.05, 20.0, 18.6], "pos": "t", "img": "proc2"}, {"l": "🧠 Preparar y empacar", "t": "Humana: es trabajo físico en la bodega.", "b": [29.0, 38.6, 20.0, 18.6], "pos": "t", "img": "proc2"}, {"l": "🧠 Resolver la excepción", "t": "Humana: hay que conversar con el cliente y decidir. Lo automático aquí es <b>avisar</b> a la persona encargada.", "b": [82.0, 38.6, 16.0, 18.6], "pos": "t", "img": "proc2"}, {"l": "🤖 Confirmar el despacho", "t": "Automatizable: cuando el pedido sale, se envía el mismo tipo de correo a cada cliente.", "b": [29.0, 73.49, 20.0, 18.6], "pos": "r", "img": "proc2"}], "cierre": ["🤖 Automatizables: Recibir el pedido, Verificar existencias y Confirmar el despacho.", "🧠 Humanas: Preparar y empacar, y Resolver la excepción."]}, {"k": "diag", "svg": "p5", "title": "Las 5 piezas de una tarea automatizada", "ruta": "Automatización · Piezas de un flujo", "intro": "Para automatizar una tarea en Power Automate, identificamos 5 piezas.", "m": [{"l": "Desencadenante", "t": "Lo que <b>inicia</b> el flujo: llega un formulario, cambia un dato, llega una hora.", "b": [2.0, 19.23, 16.8, 65.38], "pos": "t", "img": "p5"}, {"l": "Conector", "t": "La <b>aplicación</b> que el flujo usa: Forms, Excel, Outlook, Teams.", "b": [21.8, 19.23, 16.8, 65.38], "pos": "t", "img": "p5"}, {"l": "Datos", "t": "La <b>información</b> que el flujo lee: nombre, producto, cantidad.", "b": [41.6, 19.23, 16.8, 65.38], "pos": "t", "img": "p5"}, {"l": "Condición", "t": "Una <b>pregunta</b> que decide qué hacer. Si no hay pregunta, los pasos van en orden (secuencia).", "b": [61.4, 19.23, 16.8, 65.38], "pos": "t", "img": "p5"}, {"l": "Acción", "t": "Lo que el flujo <b>hace</b>: guardar, avisar, enviar un correo.", "b": [81.2, 19.23, 16.8, 65.38], "pos": "t", "img": "p5"}], "cierre": ["Desencadenante → Conector → Datos → Condición → Acción."]}, {"k": "diag", "svg": "t1", "title": "Tarea 1 · Recibir el pedido", "ruta": "Tarea 1 · Recibir el pedido · Estructura: secuencia", "intro": "El cliente llena un formulario y el pedido queda guardado sin que nadie lo copie.", "m": [{"l": "Desencadenante", "t": "El flujo arranca cuando un cliente <b>envía el formulario «Pedidos»</b>.", "b": [2.0, 19.23, 16.8, 65.38], "pos": "t", "img": "t1"}, {"l": "Conectores", "t": "<b>Forms</b> recibe el pedido y <b>Excel</b> lo guarda.", "b": [21.8, 19.23, 16.8, 65.38], "pos": "t", "img": "t1"}, {"l": "Datos", "t": "Toma del formulario: <b>cliente, correo, producto y cantidad</b>.", "b": [41.6, 19.23, 16.8, 65.38], "pos": "t", "img": "t1"}, {"l": "Condición", "t": "No hay pregunta: los pasos van <b>uno después de otro</b>. Es let U={name:'',nrc:'',score:0,done:false,date:''};try{U=Object.assign(U,JSON.parse(localStorage.getItem('pa_t2_user')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('pa_t2_user',JSON.stringify(U))}catch(e){}};
let idx=0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function head(sec,title){return `<div class="vivy"><div class="portrait">${avatar()}</div><div class="mtitle"><span class="secl">${sec}</span><b>${title}</b></div><button class="voz" id="voz" title="Escuchar" aria-label="Escuchar la explicación" onclick="hablar()">🔊</button></div>`}
function nav(next=true){return `<div class="navrow">${idx?'<button class="gbtn w" id="prev">← Anterior</button>':''}<span class="sp"></span>${next&&idx<P.length-1?'<button class="gbtn" id="next">Siguiente →</button>':''}</div>`}
const screens=P.filter(p=>p.k==='diag');
function layout(left,right){$('#main').innerHTML=`<div class="stage"><aside class="comp">${left}</aside><section class="simarea">${right}</section></div>`}
function welcome(){$('#sub').textContent='Los procesos de la empresa';
 $('#main').innerHTML=`<div class="sky"><div class="welcome"><div class="portrait">${avatar()}</div><span class="pill">Taller 2 · Pensamiento Computacional</span><h1>Los procesos de la empresa</h1><p>Antes de automatizar hay que entender el proceso: qué tareas lo forman, en qué orden van y cuáles puede hacer un flujo de <b>Power Automate</b>.</p><div class="form"><label>Nombre completo<input id="nm" value="${esc(U.name)}" autocomplete="name"></label><label>NRC<input id="nrc" value="${esc(U.nrc)}" inputmode="numeric"></label></div><div class="err" id="err"></div><button class="gbtn" id="start">Comenzar →</button></div></div>`;
 $('#start').onclick=()=>{const n=$('#nm').value.trim(),r=$('#nrc').value.trim();if(n.split(/\s+/).length<2){$('#err').textContent='Escribe tu nombre completo (nombre y apellido).';return}if(!r){$('#err').textContent='Escribe tu NRC.';return}U.name=n;U.nrc=r;save();go(1)}}
let cur=0,seen=new Set();
function screenPage(p){const n=screens.indexOf(p)+1;seen=new Set();cur=-1;$('#sub').textContent=p.title||'¿Qué es un flujo?';
 if(p.k==='flujo'){p.title='¿Qué es un flujo?';p.intro='Un <b>flujo</b> es un proceso que se ejecuta solo cuando ocurre algo. Siempre tiene un <b>desencadenante</b> que lo inicia y una o varias <b>acciones</b> que se hacen después.';p.m=[{l:'Desencadenante',t:'Es lo que <b>pone en marcha</b> el flujo. Aquí: un cliente envía el formulario de pedido.'},{l:'Acción 1',t:'Lo primero que hace el flujo: <b>guardar el pedido</b> en una hoja de Excel.'},{l:'Acción 2',t:'Después: <b>enviar un correo</b> de confirmación al cliente. Nadie tuvo que hacerlo a mano.'},{l:'Conectores',t:'Forms, Excel y Outlook son <b>conectores</b>: las aplicaciones que el flujo une.'}];p.cierre=['Flujo = <b>desencadenante</b> + <b>acciones</b>.','Los <b>conectores</b> son las aplicaciones que el flujo une.']}
 layout(head(`Pantalla ${n} de ${screens.length}`,p.title)+`<div class="box"><p>${p.intro}</p></div><div class="box" id="exp"></div><div class="stepbar"><span class="hint" id="cnt"></span><span class="sp"></span><button class="gbtn t" id="stepBtn">Paso 1 ▸</button></div><div class="box cierre" id="cierre" hidden><h3>📌 Cierre</h3><ul>${p.cierre.map(c=>`<li>${c}</li>`).join('')}</ul></div>`+nav(),
  p.k==='flujo'?`<div class="device"><div class="diagram"><div class="dn" data-i="0"><span class="e">📝</span><b>Llega un formulario</b><small>Microsoft Forms</small></div><span class="arr">→</span><div class="dn" data-i="1"><span class="e">📊</span><b>Guardar el pedido</b><small>Excel</small></div><span class="arr">→</span><div class="dn" data-i="2"><span class="e">✉️</span><b>Enviar confirmación</b><small>Outlook</small></div></div></div>`:`<div class="simcol"><div class="ruta" id="ruta">📍 ${p.ruta}</div><div class="device"><div class="view svgv" id="view">${SVG[p.svg]}<div class="spot" id="spot"></div></div></div></div>`);
 if(p.k==='flujo'){document.querySelectorAll('.dn').forEach((d,i)=>{d.insertAdjacentHTML('beforeend',`<button class="mk" data-k="${i}">${i+1}</button>`)});document.querySelector('.diagram').insertAdjacentHTML('afterend','');const last=document.createElement('div');}
 
 const pick=i=>{cur=i;seen.add(i);const m=p.m[i];
  if(p.k==='diag'){const img=p.svg;drawMarks(p,img);const sp=$('#spot');if(m.b){sp.style.left=m.b[0]+'%';sp.style.top=m.b[1]+'%';sp.style.width=m.b[2]+'%';sp.style.height=m.b[3]+'%';sp.classList.add('on')}else sp.classList.remove('on')}
  else{document.querySelectorAll('.dn').forEach((d,j)=>d.classList.toggle('on',i===3?true:j===i));drawFlowMarks(p)}
  $('#exp').innerHTML=`<h3><span class="num">${i+1}</span>${m.l}</h3><p>${m.t}</p>`;setLeer(m.l+'. '+m.t+(seen.size===p.m.length?'. '+p.cierre.join('. '):''));
  $('#cnt').textContent=`Revisado ${seen.size} de ${p.m.length}`;
  const nx=p.m.findIndex((_,j)=>!seen.has(j));const sb=$('#stepBtn');if(nx<0){sb.hidden=true;$('#cierre').hidden=false}else{sb.textContent=`Paso ${nx+1} ▸`;sb.onclick=()=>pick(nx)}};
 window._pick=pick;
 $('#exp').innerHTML=`<p class="hint">Toca el número <b>1</b> en la pantalla o el botón <b>Paso 1</b>.</p>`;$('#cnt').textContent=`Revisado 0 de ${p.m.length}`;$('#stepBtn').onclick=()=>pick(0);setLeer(p.intro);
 drawMarks(p,p.svg)}
function mpos(m){const [a,c,w,h]=m.b;let x,y;const vy=c+Math.min(h/2,3);switch(m.pos){case 'l':x=a-.6;y=vy;break;case 'b':x=a+w/2;y=c+h+1.2;break;case 't':x=a+w/2;y=c-1.2;break;case 'tl':x=a+1.6;y=c+3;break;default:x=a+w+.6;y=vy}return [Math.min(98,Math.max(1.6,x)),Math.min(97,Math.max(2.5,y))]}
function drawMarks(p,img){const v=$('#view');v.querySelectorAll('.mk').forEach(x=>x.remove());const nx=p.m.findIndex((_,j)=>!seen.has(j));
 p.m.forEach((m,i)=>{if(!m.b)return;const b=document.createElement('button');b.className='mk'+(i===cur?' on':seen.has(i)?' seen':i===nx?' next':'');b.textContent=i+1;const [x,y]=mpos(m);b.style.left=x+'%';b.style.top=y+'%';b.setAttribute('aria-label','Paso '+(i+1)+': '+m.l);b.onclick=()=>window._pick(i);v.appendChild(b)})}
function drawFlowMarks(p){const nx=p.m.findIndex((_,j)=>!seen.has(j));document.querySelectorAll('.dn .mk').forEach(b=>{const i=+b.dataset.k;b.className='mk'+(i===cur?' on':seen.has(i)?' seen':i===nx?' next':'');b.onclick=()=>window._pick(i)});
 if(!document.querySelector('#mk3')){const d=document.querySelector('.diagram');const b=document.createElement('button');b.id='mk3';b.className='mk';b.textContent='4';b.style.cssText='position:static;transform:none;margin-left:6px';d.parentElement.insertAdjacentHTML('beforeend','');d.insertAdjacentElement('afterend',Object.assign(document.createElement('div'),{id:'conn',innerHTML:'<span style="display:inline-flex;align-items:center;gap:8px;margin-top:10px;background:#fff;border-radius:10px;padding:6px 12px;font-weight:700;line-height:1.3">🔗 Conectores: Forms · Excel · Outlook</span>',style:'text-align:center'}));document.querySelector('#conn span').prepend(b)}
 const b=$('#mk3');b.className='mk'+(3===cur?' on':seen.has(3)?' seen':3===nx?' next':'');b.style.cssText='position:static;transform:none';b.onclick=()=>window._pick(3)}
let ri=0,firstTry=true,score=0;
function retos(){$('#sub').textContent='Retos';ri=0;score=0;
 layout(head('Retos','¿Qué tanto entendiste el proceso?')+`<div class="box"><p>Responde una pregunta a la vez. Si te equivocas, puedes intentarlo de nuevo, pero solo suman las respuestas correctas al primer intento.</p><div class="bar"><i id="bar" style="width:0"></i></div><p class="hint" style="margin-top:6px" id="rprog"></p></div>`+nav(false),`<div class="card" id="qcard"></div>`);q()}
function q(){const r=R[ri];setLeer(r.q+'. '+r.o.join('. '));firstTry=true;$('#rprog').textContent=`Pregunta ${ri+1} de ${R.length}`;$('#bar').style.width=(ri/R.length*100)+'%';
 $('#qcard').innerHTML=`<span class="qtag">Reto ${ri+1} de ${R.length}</span><p class="qq">${r.q}</p><div class="opts">${r.o.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join('')}</div><div class="fb" id="fb"></div><div class="qnav"><button class="gbtn" id="qn" hidden>${ri<R.length-1?'Siguiente reto →':'Ver mi certificado →'}</button></div>`;
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(+b.dataset.j===r.c){b.classList.add('right');document.querySelectorAll('.opt').forEach(x=>x.disabled=true);if(firstTry)score++;$('#fb').className='fb good';$('#fb').textContent='✓ '+r.f;const n=$('#qn');n.hidden=false;n.onclick=()=>{if(ri<R.length-1){ri++;q()}else{const d=new Date();U.score=score;U.done=true;U.date=d.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' · '+d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});save();go(P.length-1)}}}else{firstTry=false;b.classList.add('wrong','shake');b.disabled=true;$('#fb').className='fb bad';$('#fb').textContent='Todavía no. Vuelve a intentarlo.'}})}

 if(!U.done){$('#main').innerHTML=`<div class="certwrap"><div class="card"><h2>Primero completa los retos</h2><p>El certificado aparece cuando respondes todos los retos.</p><button class="gbtn" id="tor">Ir a los retos →</button></div></div>`;$('#tor').onclick=()=>go(P.length-2);return}
 const pct=Math.round(U.score/R.length*100);
 $('#main').innerHTML=`<div class="certwrap"><div class="cert" id="cert"><div class="cin"><div class="portrait">${avatar()}</div><div class="ck">Certificado de participación</div><p>Se certifica que</p><h1>${esc(U.name)}</h1><p>completó el</p><h2>Taller 2 · Los procesos de la empresa</h2><p>Pensamiento Computacional · Fundación Universitaria del Área Andina</p><div class="cmeta"><span>NRC ${esc(U.nrc)}</span><span>Puntaje: ${U.score} de ${R.length} (${pct}%)</span><span>${U.date}</span></div><div class="cfirma"><b>@LaProfeVivy</b><small>Docente</small></div></div></div><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="gbtn" onclick="print()">🖨️ Imprimir o guardar PDF</button><button class="gbtn w" id="again">Volver a los retos</button></div><div class="card"><h2 style="margin-top:0">Ejercicio</h2><ol><li>Escoge una empresa o negocio que conozcas (panadería, tienda, restaurante, droguería…).</li><li>Dibuja el <b>diagrama de flujo</b> de uno de sus procesos, con inicio, tareas, al menos una decisión y fin.</li><li>Marca cada tarea como 🤖 <b>automatizable</b> o 🧠 <b>humana</b> y explica por qué.</li><li>Escoge una tarea automatizable e identifica sus <b>5 piezas</b>: desencadenante, conector, datos, condición y acción.</li></ol><h2>Entrega · pega en el espacio asignado</h2><div class="deliver"><div><i>1</i><span>Captura de este certificado.</span></div><div><i>2</i><span>Imagen de tu diagrama de flujo.</span></div><div><i>3</i><span>La lista de tareas clasificadas y las 5 piezas de la tarea que escogiste.</span></div></div></div></div></div>`;
 $('#again').onclick=()=>go(P.length-2)}
function render(){const p=P[idx];$('#pg').textContent=(idx+1)+' / '+P.length;
