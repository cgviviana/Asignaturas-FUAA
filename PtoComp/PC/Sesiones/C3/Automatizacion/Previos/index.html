stify-content:center;gap:14px}.index h1{margin:0 0 10px;text-align:center;font-size:clamp(30px,4vw,49px)}.chapters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:min(100%,1120px);margin:0 auto}.chapter{border:2px solid var(--navy);background:#fff;border-radius:14px;text-align:left;padding:15px;display:flex;gap:12px;align-items:center;min-height:76px;box-shadow:0 3px 0 var(--navy)}.chapter .emoji{font-size:27px}.chapter .num{display:grid;place-items:center;background:#e4f8f1;border:2px solid #152039;border-radius:9px;min-width:35px;height:35px;font-weight:800;font-size:16px}.chapter b{font-size:17px}.chapter:hover{background:#e7faf4}.scene{height:100%;min-height:0;display:flex;flex-direction:column;padding:clamp(12px,2vw,26px);gap:12px}.scenehead{display:flex;align-items:flex-start;gap:15px;padding-right:43px}.scenehead .emoji{font-size:37px}.scenehead small{color:#008b7e;font-size:12px;font-weight:800;letter-spacing:.05em}.scenehead h1{font-size:clamp(25px,2.6vw,38px);margin:0;line-height:1.15}.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(270px,310px);gap:18px}.visual,.aside{background:white;border:3px solid var(--navy);border-radius:17px;box-shadow:0 4px 0 var(--navy)}.visual{min-width:0;padding:clamp(15px,2vw,25px);overflow:auto;display:flex;flex-direction:column;gap:13px}.story{font-size:clamp(16px,1.35vw,20px);margin:0;line-height:1.45}.menu{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;padding:9px 10px;border-radius:12px;background:#fff8e3;border:1px solid #dfbe68}.menu b{width:100%;text-align:center}.menu span{background:white;border:1px solid #d5bf8a;border-radius:7px;padding:6px 10px;font-size:13px;font-weight:700}.stageArt{background:linear-gradient(135deg,#eaf8f5,#fff1d5);border-radius:16px;min-height:116px;padding:16px;text-align:center;display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap;border:2px dashed #b5cbd8}.bigval{font-size:clamp(26px,3vw,43px);font-weight:800;padding:12px 20px;background:white;border:3px solid var(--navy);border-radius:15px;min-width:170px}.bigval small{display:block;font-size:13px;font-weight:600;color:var(--muted)}.concept{background:#e6f7ed;padding:13px 15px;border-left:5px solid var(--green);border-radius:9px;font-size:16px}.stepbox{background:#f2f5fa;border:2px solid #d5deeb;border-radius:12px;padding:13px;font-size:16px}.stephead{display:flex;align-items:center;justify-content:space-between;gap:10px}.stephead button,.codebtn{background:var(--yellow);border:2px solid var(--navy);font-weight:800;border-radius:9px;padding:8px 11px}.progress{display:flex;gap:6px;margin-top:12px}.dot{flex:1;height:7px;border-radius:6px;background:#cbd6e5}.dot.done{background:var(--green)}.codebtn{background:#fff;align-self:flex-start;font-size:14px}.code{display:none;margin:0;white-space:pre-wrap;background:#162139;color:#e8fff7;padding:15px;border-radius:11px;font:15px/1.5 Consolas,monospace;overflow:auto}.code.open{display:block}.aside{padding:13px;overflow:auto;display:flex;flex-direction:column;gap:11px}.teacher{display:flex;align-items:center;gap:11px}.teacher b{font-size:16px}.aside h3{font-size:18px;line-height:1.3;margin:3px 0}.answers{display:grid;gap:8px}.answers button{border:2px solid #cbd5e5;box-shadow:0 2px 0 #cbd5e5;padding:11px 12px;background:#f4f6fb;border-radius:11px;font-weight:700;text-align:left;font-size:14px;min-height:55px;width:100%;line-height:1.4}.answers button.chosen{border-color:var(--navy);background:#fff0bd}.verify{margin-top:auto;background:var(--green);border:3px solid var(--navy);color:white;font-weight:800;border-radius:11px;padding:12px;width:100%;min-height:45px}.feedback{display:none;padding:10px;border-radius:10px;background:#e5f8ef;font-size:14px}.feedback.bad{background:#fff0e4}.end h1{font-size:clamp(34px,4vw,58px);margin:0}.end p{font-size:20px;max-width:690px}.end .portrait{width:118px;height:118px}@media(max-width:680px){.chapters{grid-template-columns:1fr}.layout{grid-template-columns:1fr}.scene{height:auto}.scenehead h1{font-size:26px}.visual{min-height:360px}.aside{min-height:290px}.bottom small{display:none}.sheet{overflow:auto}}@media(min-width:681px){.layout{grid-template-columns:minmax(0,1fr) 300px!important}.visual,.aside{min-height:0}.scene{height:100%}}

const scenes=[{"ch":"Preparativos del puesto","emoji":"🎪","type":"variable","label":"Pulseras para asignar","story":"Sara organiza el puesto de limonadas. Cada empleado debe llevar una pulsera identificada con un código. En el registro hay 4 pulseras disponibles y llegan 7 nuevas. Sara necesita actualizar cuántas pulseras puede asignar.","concept":"Una variable es como una casilla de un registro: guarda un dato que puede cambiar. La casilla «pulseras» tenía 4; al recibir 7, se actualiza a 11.","steps":["Sara revisa el registro: hay 4 pulseras disponibles.","Recibe 7 pulseras adicionales y debe actualizar el inventario.","Suma lo que había y lo que llegó: 4 + 7 = 11 pulseras disponibles."],"vals":["4 pulseras","4 + 7","11 pulseras"],"code":"Algoritmo PrepararPuesto\n  Definir pulseras Como Entero\n  pulseras <- 4\n  pulseras <- pulseras + 7\n  Escribir pulseras\nFinAlgoritmo","question":"Si llegan 2 pulseras adicionales, ¿cómo actualizamos el registro de 11?","opts":["pulseras <- pulseras + 2","pulseras <- 2","pulseras <- 11"],"correct":0,"why":"Había 11 pulseras registradas. Si llegan 2 adicionales, se suman a las anteriores: ahora hay 13 disponibles.","bridge":[["Dato guardado","«Hay 4 pulseras para asignar».","pulseras <- 4"],["Actualización","«Llegaron 7; agrégalas al registro».","pulseras <- pulseras + 7"]]},{"ch":"¿Cuántas personas entraron?","emoji":"🎟️","type":"counter","label":"Personas registradas","story":"La entrada a la feria es gratuita, pero los organizadores necesitan saber cuántas personas han ingresado para controlar el aforo. Sara registra una llegada cada vez que alguien cruza la entrada.","concept":"Un contador registra cuántas veces ocurre algo. Cada vez que una persona entra, aumenta 1. Así Sara sabe cuántas personas han ingresado y ayuda a controlar el aforo.","steps":["Antes de abrir: personas = 0.","Entra una persona: 0 + 1 = 1.","Entra otra persona: 1 + 1 = 2.","Entra una tercera: 2 + 1 = 3."],"vals":["0 personas","1 persona","2 personas","3 personas"],"code":"Algoritmo ControlDeIngreso\n  Definir personas Como Entero\n  personas <- 0\n  personas <- personas + 1\n  personas <- personas + 1\n  personas <- personas + 1\n  Escribir personas\nFinAlgoritmo","question":"El registro marca 3 personas. Entran dos más. ¿Cuántas hay registradas?","opts":["5, porque se suman las dos llegadas","2, porque solo contamos las nuevas","6, porque se duplica el registro"],"correct":0,"why":"El registro estaba en 3. Entraron dos personas más: 3 + 1 + 1 = 5 ingresos.","bridge":[["Inicio","«Todavía no ha entrado nadie».","personas <- 0"],["Cada llegada","«Entró una persona más».","personas <- personas + 1"]]},{"ch":"Las ventas de limonada","emoji":"🥤","type":"accum","label":"Total vendido","story":"Sara vende tres limonadas: clásica a $3.000, de frutos rojos a $5.000 y de hierbabuena a $4.000. Se vende una de cada sabor. Quiere saber cuánto dinero recibió en total.","concept":"Un acumulador guarda un total que va creciendo. Cada venta suma su precio al dinero vendido hasta ese momento: $3.000, después $8.000 y luego $12.000.","steps":["Antes de vender: total = $0.","Clásica: $0 + $3.000 = $3.000.","Frutos rojos: $3.000 + $5.000 = $8.000.","Hierbabuena: $8.000 + $4.000 = $12.000."],"vals":["$0","$3.000","$8.000","$12.000"],"code":"Algoritmo VentasLimonada\n  Definir total Como Entero\n  total <- 0\n  total <- total + 3000\n  total <- total + 5000\n  total <- total + 4000\n  Escribir total\nFinAlgoritmo","question":"Se vende otra limonada de frutos rojos ($5.000). ¿Cuál es el nuevo total?","opts":["$17.000, porque sumamos al total anterior","$5.000, porque solo cuenta la última venta","$15.000, porque todas cuestan lo mismo"],"correct":0,"why":"Total anterior: $12.000. Nueva venta: $5.000. El acumulador queda en $17.000.","bridge":[["Inicio","«Aún no se han realizado ventas».","total <- 0"],["Cada venta","«Suma el precio de la bebida vendida».","total <- total + precio"]]},{"ch":"Dos registros diferentes","emoji":"🧺","type":"compare","label":"Clientes y ventas","story":"En el puesto de limonadas, tres clientes han comprado una bebida cada uno: clásica ($3.000), frutos rojos ($5.000) y hierbabuena ($4.000). Sara necesita el número de compradores y el valor total vendido.","concept":"El contador aumenta 1 por cada cliente. El acumulador suma el precio de cada bebida. Los dos registros sirven para responder preguntas diferentes.","steps":["Cliente 1 compra clásica: compradores = 1; total = $3.000.","Cliente 2 compra frutos rojos: compradores = 2; total = $8.000.","Cliente 3 compra hierbabuena: compradores = 3; total = $12.000."],"vals":["1 cliente · $3.000","2 clientes · $8.000","3 clientes · $12.000"],"code":"Algoritmo RegistroVentas\n  Definir compradores, total Como Entero\n  compradores <- 0\n  total <- 0\n  compradores <- compradores + 1\n  total <- total + 3000\n  compradores <- compradores + 1\n  total <- total + 5000\n  compradores <- compradores + 1\n  total <- total + 4000\n  Escribir compradores, \" compradores\"\n  Escribir total, \" pesos\"\nFinAlgoritmo","question":"Un cuarto cliente compra limonada de hierbabuena ($4.000). ¿Cómo quedan los registros?","opts":["4 compradores y $16.000 en ventas","4 compradores y $4.000 en ventas","7 compradores y $16.000 en ventas"],"correct":0,"why":"Se agrega un comprador (3 + 1 = 4) y se suma su compra ($12.000 + $4.000 = $16.000).","bridge":[["Contador","«Entró un comprador más».","compradores <- compradores + 1"],["Acumulador","«Suma el precio de su bebida al total».","total <- total + precio"]]},{"ch":"Del pedido a la entrega","emoji":"📋","type":"sequence","label":"Pedido en preparación","story":"Una clienta pide una limonada de frutos rojos. Sara anota el pedido, confirma el pago, prepara la bebida y la entrega. Si prepara antes de confirmar el pago y la clienta cancela, puede desperdiciar ingredientes.","concept":"Una secuencia es hacer las tareas en un orden lógico: primero registrar el pedido; después confirmar el pago; luego preparar; y por último entregar.","steps":["1. Anotar: una limonada de frutos rojos.","2. Confirmar el pago de $5.000.","3. Preparar la bebida solicitada.","4. Entregar la limonada a la cliente."],"vals":["① Pedido","② Pago","③ Preparación","④ Entrega"],"code":"Algoritmo AtenderPedido\n  Escribir \"Anotar pedido\"\n  Escribir \"Confirmar pago\"\n  Escribir \"Preparar bebida\"\n  Escribir \"Entregar pedido\"\nFinAlgoritmo","question":"Si la bebida ya está preparada, ¿qué paso sigue en esta secuencia?","opts":["Entregarla a la cliente","Anotar de nuevo el mismo pedido","Volver a cobrar el pedido confirmado"],"correct":0,"why":"La bebida ya fue solicitada, pagada y preparada. El paso que sigue es entregarla.","bridge":[["Primero","«Anotar la bebida que pidió la clienta».","Escribir \"Anotar pedido\""],["Después","«Confirmar que el pedido está pagado».","Escribir \"Confirmar pago\""],["Luego","«Preparar y entregar».","Escribir \"Preparar bebida\""]]},{"ch":"Una decisión para preparar","emoji":"🔀","type":"if","label":"¿Con azúcar?","story":"Al pedir limonada, cada cliente indica si la quiere con azúcar o sin azúcar. Sara tiene que preparar la bebida tal como fue solicitada.","concept":"Si–SiNo permite elegir un camino. La pregunta es «¿pidió azúcar?». Si la respuesta es Sí, se agrega azúcar. Si es No, se prepara sin azúcar. No se hacen las dos cosas.","steps":["1. Leer el pedido y comprobar si indica «con azúcar».","2. Si la respuesta es Sí, agregar azúcar.","3. Si la respuesta es No, no agregar azúcar. Solo se cumple uno de los dos caminos."],"vals":["🧾 Pedido","◇ ¿Con azúcar?","🥤 Bebida correcta"],"code":"Algoritmo PrepararLimonada\n  Definir conAzucar Como Logico\n  Leer conAzucar\n  Si conAzucar Entonces\n    Escribir \"Agregar azúcar\"\n  SiNo\n    Escribir \"Preparar sin azúcar\"\n  FinSi\nFinAlgoritmo","question":"La cliente pidió limonada SIN azúcar. ¿Qué instrucción debe ejecutarse?","opts":["Preparar sin agregar azúcar","Agregar azúcar y luego retirarla","Preparar dos limonadas distintas"],"correct":0,"why":"La respuesta a «¿con azúcar?» es No. Solo se ejecuta la acción del SiNo.","bridge":[["Condición","«¿La clienta pidió azúcar?»","Si conAzucar Entonces"],["Si responde SÍ","«Agrega azúcar».","Escribir \"Agregar azúcar\""],["Si responde NO","«Prepara sin azúcar».","SiNo"]]},{"ch":"Los pedidos pendientes","emoji":"🧾","type":"while","label":"Pedidos por atender","story":"Al empezar la tarde hay 3 pedidos pendientes de limonada. Sara quiere procesar uno por uno hasta que no quede ninguno en la lista.","concept":"Mientras significa «seguir haciendo algo SI TODAVÍA se cumple la condición». Aquí, Mientras pendientes > 0, Sara atiende un pedido y le resta 1 a la cantidad pendiente. Cuando llega a 0, se detiene.","steps":["Hay 3 pedidos. ¿Quedan pendientes? Sí.","Se atiende 1. Ahora quedan 2. Se vuelve a preguntar.","Se atiende otro. Queda 1. Se vuelve a preguntar.","Se atiende el último. Quedan 0. La respuesta es No y termina."],"vals":["3 pedidos","2 pedidos","1 pedido","0 pendientes ✅"],"code":"Algoritmo PedidosPendientes\n  Definir pendientes Como Entero\n  pendientes <- 3\n  Mientras pendientes > 0 Hacer\n    Escribir \"Atender un pedido\"\n    pendientes <- pendientes - 1\n  FinMientras\n  Escribir \"Pedidos atendidos\"\nFinAlgoritmo","question":"¿Por qué el ciclo no continúa después de atender los tres pedidos?","opts":["Porque pendientes llega a 0 y la condición es falsa","Porque vuelve a sumar un pedido","Porque el programa no revisa la condición"],"correct":0,"why":"Cada vuelta resta 1: 3 → 2 → 1 → 0. Cuando pendientes > 0 es falso, se detiene.","bridge":[["Condición","«¿Queda al menos un pedido por atender?»","Mientras pendientes > 0 Hacer"],["Acción","«Atiende uno de los pedidos».","Escribir \"Atender un pedido\""],["Actualización","«Como ya atendiste uno, quedan uno menos».","pendientes <- pendientes - 1"],["Final","«Cuando quedan 0, ya no hay pedidos».","pendientes = 0"]]},{"ch":"Cinco mesas por preparar","emoji":"🪑","type":"for","label":"Mesa preparada","story":"Antes de abrir el puesto, Sara debe dejar un código QR con el menú en cada una de las 5 mesas. Ya sabe desde el principio cuántas mesas necesita revisar.","concept":"Para se usa cuando ya sabemos cuántas veces hay que repetir una tarea. Sara recorre las mesas de la 1 a la 5 y coloca un menú QR en cada una; al terminar la mesa 5, se detiene.","steps":["Mesa 1: colocar el menú QR.","Mesa 2: colocar el menú QR.","Mesa 3: colocar el menú QR.","Mesa 4: colocar el menú QR.","Mesa 5: colocar el menú QR. Se termina."],"vals":["1 de 5","2 de 5","3 de 5","4 de 5","5 de 5 ✅"],"code":"Algoritmo PrepararMesas\n  Definir mesa Como Entero\n  Para mesa <- 1 Hasta 5 Hacer\n    Escribir \"Colocar menú QR en mesa \", mesa\n  FinPara\nFinAlgoritmo","question":"Si hubiera 7 mesas, ¿qué habría que cambiar para recorrerlas todas?","opts":["El final del ciclo: de 5 a 7","Sumar 7 al número de la mesa","Cambiar Para por una decisión SiNo"],"correct":0,"why":"El ciclo Para necesita conocer el comienzo y el final del recorrido: ahora termina en 7.","bridge":[["Inicio y final","«Empieza en la mesa 1 y termina en la 5».","Para mesa <- 1 Hasta 5 Hacer"],["Acción repetida","«En cada mesa, coloca un menú QR».","Escribir \"Colocar menú QR...\""]]},{"ch":"El código de descuento","emoji":"🏷️","type":"repeat","label":"Validación del código","story":"En la feria hay un descuento para quienes escriban el código FERIA. Si alguien introduce otro código, el sistema le pide intentarlo de nuevo.","concept":"Repetir–Hasta Que hace primero el intento y luego comprueba. Sara pide el código de descuento; si no es FERIA, vuelve a pedirlo. Cuando es FERIA, termina.","steps":["Primer intento: SOL. ¿Es FERIA? No. Se repite.","Segundo intento: LUZ. ¿Es FERIA? No. Se repite.","Tercer intento: FERIA. ¿Es correcto? Sí. Termina."],"vals":["SOL ✗","LUZ ✗","FERIA ✓"],"code":"Algoritmo ValidarDescuento\n  Definir codigo Como Caracter\n  Repetir\n    Escribir \"Escribe el código\"\n    Leer codigo\n  Hasta Que codigo = \"FERIA\"\n  Escribir \"Código válido\"\nFinAlgoritmo","question":"Si la primera persona escribe FERIA de inmediato, ¿cuántas veces se solicita el código?","opts":["Una vez, porque se comprueba después del intento","Cero veces, porque se revisa antes","Tres veces, porque siempre son tres intentos"],"correct":0,"why":"Repetir ejecuta primero la solicitud, comprueba y termina porque ya recibió el código correcto.","bridge":[["Primero actúa","«Pide que escriban un código».","Repetir / Leer codigo"],["Después comprueba","«¿El código escrito es FERIA?»","Hasta Que codigo = \"FERIA\""]]},{"ch":"Un día de ventas completo","emoji":"⚙️","type":"integrated","label":"Stock y ventas","story":"Sara comienza con 4 limonadas clásicas listas para vender a $3.000 cada una. Cada compra confirma el pago, reduce el inventario y actualiza dos registros: compradores y ventas.","concept":"Aquí se unen varias ideas: Mientras haya limonadas, se realiza una venta; el contador añade 1 comprador; el acumulador suma $3.000; el inventario resta 1. Si el inventario llega a 0, se muestra «Agotadas».","steps":["Inicio: 4 limonadas. Compradores = 0; ventas = $0.","Venta 1: compradores = 1; ventas = $3.000; quedan 3.","Venta 2: compradores = 2; ventas = $6.000; quedan 2.","Venta 3: compradores = 3; ventas = $9.000; quedan 1.","Venta 4: compradores = 4; ventas = $12.000; quedan 0. Avisar «Agotadas»."],"vals":["4 limonadas","3 limonadas","2 limonadas","1 limonada","Agotadas ✅"],"code":"Algoritmo DiaDeVentas\n  Definir limonadas, compradores, ventas Como Entero\n  limonadas <- 4\n  compradores <- 0\n  ventas <- 0\n  Mientras limonadas > 0 Hacer\n    compradores <- compradores + 1\n    ventas <- ventas + 3000\n    limonadas <- limonadas - 1\n  FinMientras\n  Si limonadas = 0 Entonces\n    Escribir \"Agotadas\"\n  FinSi\n  Escribir \"Compradores: \", compradores\n  Escribir \"Total: $\", ventas\nFinAlgoritmo","question":"Al vender las cuatro limonadas, ¿qué dato muest const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let page=0,step=0,chosen=-1,solved=false,openCode=false;
function conceptRich(text,type){
 const pairs={
 variable:[['variable','key-blue'],['pulseras','key-green']],
 counter:[['contador','key-blue'],['aumenta 1','key-green']],
 accum:[['acumulador','key-blue'],['suma','key-green']],
 compare:[['contador','key-blue'],['acumulador','key-pink']],
 sequence:[['secuencia','key-blue'],['primero','key-pink'],['después','key-green']],
 if:[['Si–SiNo','key-blue'],['pregunta','key-pink'],['Sí','key-green'],['No','key-green']],
 while:[['Mientras','key-blue'],['pendientes > 0','key-pink'],['resta 1','key-green']],
 for:[['Para','key-blue'],['1 a la 5','key-pink'],['coloca','key-green']],
 repeat:[['Repetir–Hasta Que','key-blue'],['FERIA','key-pink']],
 integrated:[['Mientras','key-blue'],['contador','key-green'],['acumulador','key-green'],['inventario','key-pink']]
 }[type]||[];
 let html=esc(text);
 for(const [term,cls] of pairs){const pos=html.indexOf(term);if(pos!==-1)html=html.slice(0,pos)+'<strong class="'+cls+'">'+html.slice(pos,pos+term.length)+'</strong>'+html.slice(pos+term.length)}
 return html;
}
function bridgeHTML(s){
 const labels=s.bridge||[];
 return '<div class="bridge"><b class="bridge-title">Así lo diría Sara y así se escribe en PSeInt</b>'+
 labels.map(([name,plain,code],i)=>'<div class="bridge-row"><div class="bridge-plain"><span class="bridge-label '+(name==='Condición'||name==='Después comprueba'||name==='Inicio y final'?'key-pink':'key-green')+'">'+esc(name)+'</span><span>'+esc(plain)+'</span></div><code>'+esc(code)+'</code></div>').join('')+'</div>';
}
function portrait(){return `<div class="portrait">${avatar()}</div>`}
function go(p){if(p<0||p>scenes.length+2)return;page=p;step=0;chosen=-1;solved=false;openCode=false;render()}
function render(){const app=$('#app');$('#counter').textContent=`${page+1} / ${scenes.length+3}`;$('#prev').disabled=page===0;$('#next').disabled=page===scenes.length+2;
if(page===0){app.innerHTML=`<div class="cover">${portrait()}<h1>Un día en la feria con Sara</h1><p>Una historia para comprender cómo funcionan los programas.</p><button class="start" id="begin">Entrar a la feria →</button></div>`;$('#begin').onclick=()=>go(1);return}
if(page===1){app.innerHTML=`<div class="index"><h1>La aventura</h1><div class="chapters">${scenes.map((s,i)=>`<button class="chapter" data-page="${i+2}"><span class="num">${i+1}</span><span class="emoji">${s.emoji}</span><b>${esc(s.ch)}</b></button>`).join('')}</div></div>`;app.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(+b.dataset.page));return}
if(page===scenes.length+2){app.innerHTML=`<button class="home" aria-label="Volver al índice" id="home">⌂</button><div class="end">${portrait()}<h1>¡La feria está lista!</h1><p>Ya sabes guardar datos, contar, sumar, tomar decisiones y repetir tareas. ¡Eso es pensar como un programa!</p><button class="start" id="backIndex">Volver al índice</button></div>`;$('#home').onclick=()=>go(1);$('#backIndex').onclick=()=>go(1);return}
const s=scenes[page-2];app.innerHTML=`<button class="home" aria-label="Volver al índice" title="Volver al índice" id="home">⌂</button><div class="scene"><div class="scenehead"><div class="emoji">${s.emoji}</div><div><small>CAPÍTULO ${page-1} DE ${scenes.length}</small><h1>${esc(s.ch)}</h1></div></div><div class="layout"><section class="visual"><p class="story">${esc(s.story)}</p>${[2,3].includes(page-2)?`<div class="menu"><b>🥤 Menú del puesto</b><span>Clásica · $3.000</span><span>Frutos rojos · $5.000</span><span>Hierbabuena · $4.000</span></div>`:""}<div class="stageArt"><span style="font-size:52px">${s.emoji}</span><div class="bigval"><small>${esc(s.label)}</small><span id="value">${esc(s.vals[0])}</span></div></div><div class="concept"><b>¿Qué acabamos de descubrir?</b><div>${conceptRich(s.concept,s.type)}</div></div>${bridgeHTML(s)}<div class="stepbox"><div class="stephead"><b>Paso <span id="stepCount">1</span> de ${s.steps.length}</b><button id="stepBtn">Siguiente paso →</button></div><div id="stepText" style="margin-top:9px">${esc(s.steps[0])}</div><div class="progress" id="progress">${s.steps.map((_,i)=>`<div class="dot ${i===0?'done':''}"></div>`).join('')}</div></div><button class="codebtn" id="codeBtn">▸ Ver cómo se escribe en PSeInt</button><pre class="code" id="code">${esc(s.code)}</pre></section><aside class="aside"><div class="teacher">${portrait()}<b>LaProfeVivy</b></div><h3>${esc(s.question)}</h3><div class="answers">${s.opts.map((o,i)=>`<button data-answer="${i}">${esc(o)}</button>`).join('')}</div><div class="feedback" id="feedback"></div><button class="verify" id="verify">Comprobar</button></aside></div></div>`;
$('#home').onclick=()=>go(1);$('#stepBtn').onclick=()=>{step=(step+1)%s.steps.length;$('#stepCount').textContent=step+1;$('#stepText').textContent=s.steps[step];$('#value').textContent=s.vals[Math.min(step,s.vals.length-1)];$('#progress').innerHTML=s.steps.map((_,i)=>`<div class="dot ${i<=step?'done':''}"></div>`).join('');$('#stepBtn').textContent=step===s.steps.length-1?'Volver al inicio ↺':'Siguiente paso →'};
$('#codeBtn').onclick=()=>{$('#code').classList.toggle('open');$('#codeBtn').textContent=$('#code').classList.contains('open')?'▾ Ocultar PSeInt':'▸ Ver cómo se escribe en PSeInt'};
app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(solved)return;chosen=+b.dataset.answer;app.querySelectorAll('[data-answer]').forEach(x=>x.classList.toggle('chosen',x===b))});
$('#verify').onclick=()=>{let box=$('#feedback');box.style.display='block';if(chosen<0){box.className='feedback bad';box.textContent='Primero elige una respuesta.';return}if(chosen===s.correct){solved=true;box.className='feedback';box.textContent='✓ '+s.why;$('#verify').textContent='¡Muy bien!';$('#verify').disabled=true}else{box.className='feedback bad';box.textContent='Todavía no. Vuelve a mirar los pasos y prueba otra respuesta.'}};
}
$('#prev').onclick=()=>go(page-1);$('#next').onclick=()=>go(page+1);document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','BUTTON'].includes(document.activeElement?.tagName))return;if(e.key==='ArrowRight')go(page+1);if(e.key==='ArrowLeft')go(page-1)});render();
</script></body></html>
