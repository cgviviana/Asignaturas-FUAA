<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La feria de las ideas · LaProfeVivy</title>
<style>
:root{--navy:#152039;--cream:#fff9ed;--green:#10ae9d;--yellow:#ffcc47;--purple:#a48be8;--muted:#4b5b76}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,'Trebuchet MS',sans-serif;color:var(--navy);background:var(--navy)}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #ff9811;outline-offset:3px}.wrap{height:100dvh;min-height:390px;display:flex;flex-direction:column}.bar{height:49px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:7px 18px;font-size:14px}.bar b{font-size:17px}.counter{margin-left:auto;color:var(--yellow);font-weight:bold}.stage{flex:1;min-height:0;padding:10px 12px;display:flex}.sheet{position:relative;background:var(--cream);border-radius:20px;border:3px solid var(--navy);flex:1;min-height:0;overflow:auto}.bottom{height:61px;padding:9px 18px;display:flex;justify-content:space-between;gap:12px;background:var(--navy);align-items:center}.bottom button,.start{padding:9px 18px;background:#fff;border:2px solid var(--navy);border-radius:11px;font-weight:800}.bottom .next,.start{background:var(--yellow)}.bottom button:disabled{opacity:.4}.bottom small{color:#a9b9d7}.home{position:absolute;right:16px;top:13px;border:2px solid var(--navy);background:white;border-radius:10px;padding:5px 9px;font-size:20px;z-index:10}.cover,.index,.end{min-height:100%;background:linear-gradient(135deg,#fff9ed 5%,#dcf7eb 100%)}.cover,.end{display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:15px;padding:24px}.portrait{width:74px;height:74px;flex-shrink:0;border:4px solid var(--navy);border-radius:50%;background:#ffe9e4;overflow:hidden}.portrait svg{width:100%;height:100%}.cover .portrait{width:140px;height:140px}.cover h1{font-size:clamp(38px,5.7vw,78px);line-height:1;margin:0;letter-spacing:-1.6px}.cover p{margin:0;font-size:clamp(17px,2vw,24px);max-width:690px}.index{padding:clamp(18px,3vw,45px)}.index h1{margin:0 0 19px;font-size:clamp(30px,4vw,49px)}.chapters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:1080px}.chapter{border:2px solid var(--navy);background:#fff;border-radius:14px;text-align:left;padding:15px;display:flex;gap:12px;align-items:center;min-height:76px;box-shadow:0 3px 0 var(--navy)}.chapter .emoji{font-size:28px}.chapter b{font-size:17px}.chapter:hover{background:#e7faf4}.scene{height:100%;min-height:0;display:flex;flex-direction:column;padding:clamp(12px,2vw,26px);gap:12px}.scenehead{display:flex;align-items:flex-start;gap:15px;padding-right:43px}.scenehead .emoji{font-size:37px}.scenehead small{color:#008b7e;font-size:12px;font-weight:800;letter-spacing:.05em}.scenehead h1{font-size:clamp(25px,2.6vw,38px);margin:0;line-height:1.15}.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(270px,310px);gap:18px}.visual,.aside{background:white;border:3px solid var(--navy);border-radius:17px;box-shadow:0 4px 0 var(--navy)}.visual{min-width:0;padding:clamp(15px,2vw,25px);overflow:auto;display:flex;flex-direction:column;gap:13px}.story{font-size:clamp(16px,1.35vw,21px);margin:0;line-height:1.45}.stageArt{background:linear-gradient(135deg,#eaf8f5,#fff1d5);border-radius:16px;min-height:116px;padding:16px;text-align:center;display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap;border:2px dashed #b5cbd8}.bigval{font-size:clamp(26px,3vw,43px);font-weight:800;padding:12px 20px;background:white;border:3px solid var(--navy);border-radius:15px;min-width:170px}.bigval small{display:block;font-size:13px;font-weight:600;color:var(--muted)}.concept{background:#e6f7ed;padding:13px 15px;border-left:5px solid var(--green);border-radius:9px;font-size:16px}.stepbox{background:#f2f5fa;border:2px solid #d5deeb;border-radius:12px;padding:13px;font-size:16px}.stephead{display:flex;align-items:center;justify-content:space-between;gap:10px}.stephead button,.codebtn{background:var(--yellow);border:2px solid var(--navy);font-weight:800;border-radius:9px;padding:8px 11px}.progress{display:flex;gap:6px;margin-top:12px}.dot{flex:1;height:7px;border-radius:6px;background:#cbd6e5}.dot.done{background:var(--green)}.codebtn{background:#fff;align-self:flex-start;font-size:14px}.code{display:none;margin:0;white-space:pre-wrap;background:#162139;color:#e8fff7;padding:15px;border-radius:11px;font:15px/1.5 Consolas,monospace;overflow:auto}.code.open{display:block}.aside{padding:13px;overflow:auto;display:flex;flex-direction:column;gap:11px}.teacher{display:flex;align-items:center;gap:11px}.teacher b{font-size:16px}.aside h3{font-size:18px;line-height:1.3;margin:3px 0}.answers{display:grid;gap:8px}.answers button{border:2px solid #cbd5e5;box-shadow:0 2px 0 #cbd5e5;padding:11px 12px;background:#f4f6fb;border-radius:11px;font-weight:700;text-align:left;font-size:14px;min-height:55px;width:100%;line-height:1.4}.answers button.chosen{border-color:var(--navy);background:#fff0bd}.verify{margin-top:auto;background:var(--green);border:3px solid var(--navy);color:white;font-weight:800;border-radius:11px;padding:12px;width:100%;min-height:45px}.feedback{display:none;padding:10px;border-radius:10px;background:#e5f8ef;font-size:14px}.feedback.bad{background:#fff0e4}.end h1{font-size:clamp(34px,4vw,58px);margin:0}.end p{font-size:20px;max-width:690px}.end .portrait{width:118px;height:118px}@media(max-width:680px){.chapters{grid-template-columns:1fr}.layout{grid-template-columns:1fr}.scene{height:auto}.scenehead h1{font-size:26px}.visual{min-height:360px}.aside{min-height:290px}.bottom small{display:none}.sheet{overflow:auto}}@media(min-width:681px){.layout{grid-template-columns:minmax(0,1fr) 300px!important}.visual,.aside{min-height:0}.scene{height:100%}}
</style></head><body><div class="wrap"><header class="bar"><b>La feria de las ideas</b><span>Aprendiendo con @LaProfeVivy</span><div class="counter" id="counter"></div></header><div class="stage"><main class="sheet" id="app"></main></div><footer class="bottom"><button id="prev">← Anterior</button><small>Descubre cómo funciona cada idea paso a paso</small><button class="next" id="next">Siguiente →</button></footer></div>
<script>
let avn=0;
function avatar(){const id='avc'+(++avn);return `<svg viewBox="0 0 120 120" aria-hidden="true"><defs><clipPath id="${id}"><circle cx="60" cy="60" r="60"/></clipPath></defs><g clip-path="url(#${id})"><rect width="120" height="120" fill="#ffe9e4"/><path d="M27 66C22 32 42 16 61 16c22 0 37 17 32 50-2 13 1 23 6 32H21c5-9 8-20 6-32z" fill="#7d1a35"/><rect x="52" y="74" width="16" height="20" rx="6" fill="#ecc3a8"/><path d="M18 126c2-23 18-34 42-34s40 11 42 34z" fill="#2f8f83"/><path d="M50 92l10 12 10-12z" fill="#ecc3a8"/><ellipse cx="60" cy="58" rx="21" ry="24" fill="#f5d5bf"/><circle cx="39" cy="61" r="4" fill="#ecc3a8"/><circle cx="81" cy="61" r="4" fill="#ecc3a8"/><path d="M37 60c-3-22 9-33 25-33 16 0 26 11 23 28-4-8-10-11-17-12-3 4-9 7-16 8-6 1-11 4-15 9z" fill="#9b2445"/><path d="M47 32c9-5 22-4 30 4-9-2-19-2-30-4z" fill="#c4456a" opacity=".85"/><path d="M38 57c-4 10-4 20 1 30-7-6-10-18-8-30z" fill="#8a1f3d"/><path d="M83 52c4 11 4 22-1 33 7-8 10-20 7-33z" fill="#8a1f3d"/><path d="M45 51q5-2.5 10 0M65 51q5-2.5 10 0" stroke="#5a2a28" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M45 58q5-3 10 0M65 58q5-3 10 0" stroke="#2b1b1b" stroke-width="2.2" fill="none" stroke-linecap="round"/><circle cx="46" cy="67" r="3.5" fill="#ef9a8c" opacity=".45"/><circle cx="74" cy="67" r="3.5" fill="#ef9a8c" opacity=".45"/><path d="M53 70q7 5 14 0" stroke="#a8384a" stroke-width="2.4" fill="none" stroke-linecap="round"/><g transform="translate(78 88)"><path d="M4 10 7 0l7 7h8l7-7 3 10c2 4 2 9 0 13H2c-2-4-2-9 2-13z" fill="#8b7b68"/><path d="M8 9l3-5M28 9l-3-5" stroke="#5e5143" stroke-width="1.5"/><path d="M18 14c-5 0-8 3-8 7h16c0-4-3-7-8-7z" fill="#fff"/><path d="M11 13q2-1.5 4 0M21 13q2-1.5 4 0" stroke="#2b2b2b" stroke-width="1.4" fill="none" stroke-linecap="round"/><path d="M17 16h2l-1 1.2z" fill="#e89aa2"/></g></g></svg>`}
const scenes=[{"ch": "El puesto de las sorpresas", "emoji": "🎪", "type": "variable", "label": "Una cajita con memoria", "story": "La feria comienza. LaProfeVivy le entrega a Sara una caja con 4 pulseras. Después llegan 7 pulseras nuevas. ¿Qué debe recordar la caja?", "concept": "Una variable es una cajita con nombre que guarda un dato. Cuando guardas otro valor, reemplaza al anterior.", "steps": ["La caja llamada pulseras está vacía.", "Escribimos pulseras ← 4. La caja guarda 4.", "Después escribimos pulseras ← 7. Ahora guarda 7, no 11."], "vals": ["—", "4", "7"], "code": "Algoritmo LaCaja\n  Definir pulseras Como Entero\n  pulseras <- 4\n  pulseras <- 7\n  Escribir pulseras\nFinAlgoritmo", "question": "Si queremos conservar las 4 pulseras y añadir 7 más, ¿qué instrucción necesitamos?", "opts": ["pulseras <- pulseras + 7", "pulseras <- 7", "pulseras <- 4"], "correct": 0, "why": "Para agregar, usamos el valor que ya estaba guardado y le sumamos 7."}, {"ch": "¡Llegan visitantes!", "emoji": "🎟️", "type": "counter", "label": "Una marca por persona", "story": "Cada persona que entra recibe un boleto. Sara necesita saber cuántas han llegado, sin memorizar todos sus nombres.", "concept": "Un contador comienza normalmente en 0 y aumenta una cantidad fija. Aquí sube 1 por cada visitante.", "steps": ["Antes de abrir: visitantes = 0.", "Entra una persona: 0 + 1 = 1.", "Entra otra: 1 + 1 = 2.", "Llega una tercera: 2 + 1 = 3."], "vals": ["0", "1", "2", "3"], "code": "Algoritmo Visitantes\n  Definir visitantes Como Entero\n  visitantes <- 0\n  visitantes <- visitantes + 1\n  visitantes <- visitantes + 1\n  visitantes <- visitantes + 1\n  Escribir visitantes\nFinAlgoritmo", "question": "Entran dos personas más. ¿Qué valor guarda el contador?", "opts": ["5, porque subió dos veces", "2, porque solo cuenta las últimas", "6, porque duplica el resultado"], "correct": 0, "why": "El contador no vuelve a empezar: conserva 3 y suma 1 por cada nueva persona."}, {"ch": "La alcancía del puesto", "emoji": "🪙", "type": "accum", "label": "Sumar cantidades distintas", "story": "En el puesto venden limonada. Cada cliente paga una cantidad diferente: 2, 5 y 3 monedas. Sara debe guardar el dinero total.", "concept": "Un acumulador guarda un total que va creciendo. A diferencia del contador, puede sumar cantidades diferentes.", "steps": ["La alcancía empieza en 0 monedas.", "Primera venta: total = 0 + 2 = 2.", "Segunda venta: total = 2 + 5 = 7.", "Tercera venta: total = 7 + 3 = 10."], "vals": ["0", "2", "7", "10"], "code": "Algoritmo Ventas\n  Definir total Como Entero\n  total <- 0\n  total <- total + 2\n  total <- total + 5\n  total <- total + 3\n  Escribir total\nFinAlgoritmo", "question": "Si el siguiente cliente paga 4 monedas, ¿cuál es el nuevo total?", "opts": ["14 monedas", "4 monedas", "11 monedas"], "correct": 0, "why": "El acumulador guarda lo anterior (10) y agrega 4, para llegar a 14."}, {"ch": "Dos cajitas, dos trabajos", "emoji": "🧺", "type": "compare", "label": "¿Contar o sumar?", "story": "Al final de la mañana, Sara quiere saber dos cosas diferentes: cuántos clientes compraron y cuánto dinero dejaron.", "concept": "Contador: cuenta cuántas veces pasa algo. Acumulador: suma los valores que llegan. Pueden trabajar juntos.", "steps": ["Llega un cliente y paga 3 monedas: clientes = 1, dinero = 3.", "Llega otro y paga 6: clientes = 2, dinero = 9.", "Llega un tercero y paga 2: clientes = 3, dinero = 11."], "vals": ["1 cliente · 3 monedas", "2 clientes · 9 monedas", "3 clientes · 11 monedas"], "code": "Algoritmo DosCajitas\n  Definir clientes, dinero Como Entero\n  clientes <- 0\n  dinero <- 0\n  clientes <- clientes + 1\n  dinero <- dinero + 3\n  clientes <- clientes + 1\n  dinero <- dinero + 6\n  clientes <- clientes + 1\n  dinero <- dinero + 2\nFinAlgoritmo", "question": "Llega un cuarto cliente y paga 5. ¿Qué cambia?", "opts": ["Clientes = 4 y dinero = 16", "Clientes = 8 y dinero = 5", "Clientes = 4 y dinero = 5"], "correct": 0, "why": "El contador aumenta uno; el acumulador añade el valor de la compra."}, {"ch": "El camino de las tareas", "emoji": "🧩", "type": "sequence", "label": "Cada cosa en su turno", "story": "Para entregar un premio, primero hay que comprobar el boleto y después buscar el regalo. ¿Cómo evitamos que el proceso sea un enredo?", "concept": "Una secuencia son instrucciones que se realizan en orden: primero una, después otra.", "steps": ["Paso 1: recibir el boleto.", "Paso 2: revisar si el boleto es válido.", "Paso 3: entregar el premio correcto."], "vals": ["🎟️ Boleto", "🔎 Revisión", "🎁 Premio"], "code": "Algoritmo EntregarPremio\n  Escribir \"Recibir boleto\"\n  Escribir \"Revisar boleto\"\n  Escribir \"Entregar premio\"\nFinAlgoritmo", "question": "¿Qué debe ocurrir antes de entregar un premio?", "opts": ["Revisar el boleto", "Entregar el premio y luego revisar", "Dar un premio sin ver el boleto"], "correct": 0, "why": "El orden importa: no debemos entregar el premio sin validar el boleto."}, {"ch": "La puerta de los premios", "emoji": "🚪", "type": "if", "label": "Si pasa esto, entonces…", "story": "El premio especial se entrega únicamente cuando el boleto es dorado. Sara debe decidir entre dos caminos.", "concept": "Una condición es una pregunta que solo tiene dos respuestas: Sí o No. Si la respuesta es Sí, hacemos una acción; si es No, hacemos otra.", "steps": ["Sara recibe un boleto y mira su color.", "Pregunta: ¿es dorado? Si SÍ, entrega premio especial.", "Si NO, entrega premio normal. Solo sigue uno de los caminos."], "vals": ["🎟️ Mirar boleto", "◇ ¿Dorado?", "🎁 Un solo camino"], "code": "Algoritmo Premio\n  Definir dorado Como Logico\n  Leer dorado\n  Si dorado Entonces\n    Escribir \"Premio especial\"\n  SiNo\n    Escribir \"Premio normal\"\n  FinSi\nFinAlgoritmo", "question": "El boleto NO es dorado. ¿Qué camino se sigue?", "opts": ["El del premio normal", "Los dos caminos", "El del premio especial"], "correct": 0, "why": "Solo una rama se ejecuta: si la condición es falsa, se realiza la acción de SiNo."}, {"ch": "La fila que no termina… todavía", "emoji": "🧍", "type": "while", "label": "Mientras todavía falten", "story": "Hay personas esperando su turno. Sara quiere atenderlas mientras siga habiendo alguien en la fila.", "concept": "Mientras pregunta ANTES de cada vuelta. Si todavía hay personas, atiende una. Después vuelve a preguntar. Cuando no queda nadie, se detiene.", "steps": ["Hay 3 personas. Pregunta: ¿quedan personas? Sí.", "Atiende 1. Quedan 2. Vuelve a preguntar.", "Atiende otra. Queda 1. Vuelve a preguntar.", "Atiende la última. Quedan 0. Ahora la respuesta es No y se detiene."], "vals": ["🧍🧍🧍", "🧍🧍", "🧍", "Sin fila ✅"], "code": "Algoritmo LaFila\n  Definir pendientes Como Entero\n  pendientes <- 3\n  Mientras pendientes > 0 Hacer\n    Escribir \"Atender una persona\"\n    pendientes <- pendientes - 1\n  FinMientras\nFinAlgoritmo", "question": "¿Qué evita que el ciclo siga para siempre?", "opts": ["Que pendientes disminuye hasta llegar a 0", "Que pendientes aumenta en cada vuelta", "Que nunca se revisa la fila"], "correct": 0, "why": "En cada vuelta cambia algo (pendientes baja 1). Así la condición llega a ser falsa."}, {"ch": "Las cinco mesas", "emoji": "🪑", "type": "for", "label": "Ya sabemos cuántas veces", "story": "Antes de abrir, Sara debe poner un cartel en cada una de las 5 mesas. Sabe exactamente cuántas mesas hay.", "concept": "Para se usa cuando conocemos cuántas repeticiones queremos. El número de vuelta cambia automáticamente: 1, 2, 3, 4, 5.", "steps": ["Mesa 1: poner un cartel.", "Mesa 2: poner un cartel.", "Mesa 3: poner un cartel.", "Mesa 4: poner un cartel.", "Mesa 5: poner un cartel. Termina."], "vals": ["1 de 5", "2 de 5", "3 de 5", "4 de 5", "5 de 5 ✅"], "code": "Algoritmo CincoMesas\n  Definir mesa Como Entero\n  Para mesa <- 1 Hasta 5 Hacer\n    Escribir \"Poner cartel en mesa \", mesa\n  FinPara\nFinAlgoritmo", "question": "¿Cuántas veces se ejecuta la instrucción de poner un cartel?", "opts": ["5 veces", "4 veces", "Hasta que alguien diga basta"], "correct": 0, "why": "El ciclo PARA recorre las mesas de la 1 a la 5, una vez por cada mesa."}, {"ch": "La contraseña secreta", "emoji": "🔐", "type": "repeat", "label": "Primero intentamos, luego comprobamos", "story": "Para abrir el cofre de la feria hay que escribir una palabra secreta. Sara puede intentarlo varias veces.", "concept": "Repetir–Hasta Que hace el intento PRIMERO y comprueba DESPUÉS. Si la condición aún no se cumple, vuelve a intentarlo.", "steps": ["Primer intento: escribe SOL. Comprueba: incorrecta.", "Segundo intento: escribe LUZ. Comprueba: incorrecta.", "Tercer intento: escribe FERIA. Comprueba: correcta. Termina."], "vals": ["SOL ✗", "LUZ ✗", "FERIA ✓"], "code": "Algoritmo Cofre\n  Definir clave Como Caracter\n  Repetir\n    Escribir \"Escribe la clave\"\n    Leer clave\n  Hasta Que clave = \"FERIA\"\n  Escribir \"Cofre abierto\"\nFinAlgoritmo", "question": "¿Qué diferencia este ciclo de Mientras?", "opts": ["Hace al menos un intento antes de comprobar", "Siempre hace exactamente tres intentos", "Nunca comprueba nada"], "correct": 0, "why": "En REPETIR la comprobación está al final. Por eso hace la acción al menos una vez."}, {"ch": "La feria funciona sola", "emoji": "⚙️", "type": "integrated", "label": "¡Todas las ideas juntas!", "story": "Se acerca el cierre. Sara quiere registrar cada venta, contar compradores, sumar monedas y avisar si ya se agotaron las 4 limonadas.", "concept": "Podemos combinar estructuras: la secuencia organiza; el ciclo repite; el contador cuenta; el acumulador suma; y el Si decide.", "steps": ["Comienzan 4 limonadas. Clientes = 0; dinero = 0.", "Cliente 1 compra: clientes = 1, dinero = 3, quedan 3.", "Cliente 2 compra: clientes = 2, dinero = 6, quedan 2.", "Cliente 3 compra: clientes = 3, dinero = 9, quedan 1.", "Cliente 4 compra: clientes = 4, dinero = 12, quedan 0. ¡Avisar que se agotaron!"], "vals": ["🥤🥤🥤🥤", "🥤🥤🥤", "🥤🥤", "🥤", "Agotadas ✅"], "code": "Algoritmo PuestoLimonada\n  Definir limonadas, clientes, dinero Como Entero\n  limonadas <- 4\n  clientes <- 0\n  dinero <- 0\n  Mientras limonadas > 0 Hacer\n    clientes <- clientes + 1\n    dinero <- dinero + 3\n    limonadas <- limonadas - 1\n  FinMientras\n  Si limonadas = 0 Entonces\n    Escribir \"Limonadas agotadas\"\n  FinSi\n  Escribir clientes, \" clientes y \", dinero, \" monedas\"\nFinAlgoritmo", "question": "¿Qué variable es un acumulador en este puesto?", "opts": ["dinero, porque suma el valor de cada venta", "clientes, porque siempre aumenta en uno", "limonadas, porque disminuye en uno"], "correct": 0, "why": "Dinero acumula el valor de las ventas; clientes cuenta compradores y limonadas guarda las unidades disponibles."}];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let page=0,step=0,chosen=-1,solved=false,openCode=false;
function portrait(){return `<div class="portrait">${avatar()}</div>`}
function go(p){if(p<0||p>scenes.length+2)return;page=p;step=0;chosen=-1;solved=false;openCode=false;render()}
function render(){const app=$('#app');$('#counter').textContent=`${page+1} / ${scenes.length+3}`;$('#prev').disabled=page===0;$('#next').disabled=page===scenes.length+2;
if(page===0){app.innerHTML=`<div class="cover">${portrait()}<h1>La feria de las ideas</h1><p>Una aventura para descubrir cómo piensan los programas.</p><button class="start" id="begin">Entrar a la feria →</button></div>`;$('#begin').onclick=()=>go(1);return}
if(page===1){app.innerHTML=`<div class="index"><h1>La aventura</h1><div class="chapters">${scenes.map((s,i)=>`<button class="chapter" data-page="${i+2}"><span class="emoji">${s.emoji}</span><b>${esc(s.ch)}</b></button>`).join('')}</div></div>`;app.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(+b.dataset.page));return}
if(page===scenes.length+2){app.innerHTML=`<button class="home" aria-label="Volver al índice" id="home">⌂</button><div class="end">${portrait()}<h1>¡La feria está lista!</h1><p>Ya sabes guardar datos, contar, sumar, tomar decisiones y repetir tareas. ¡Eso es pensar como un programa!</p><button class="start" id="backIndex">Volver al índice</button></div>`;$('#home').onclick=()=>go(1);$('#backIndex').onclick=()=>go(1);return}
const s=scenes[page-2];app.innerHTML=`<button class="home" aria-label="Volver al índice" title="Volver al índice" id="home">⌂</button><div class="scene"><div class="scenehead"><div class="emoji">${s.emoji}</div><div><small>CAPÍTULO ${page-1} DE ${scenes.length}</small><h1>${esc(s.ch)}</h1></div></div><div class="layout"><section class="visual"><p class="story">${esc(s.story)}</p><div class="stageArt"><span style="font-size:52px">${s.emoji}</span><div class="bigval"><small>${esc(s.label)}</small><span id="value">${esc(s.vals[0])}</span></div></div><div class="concept"><b>¿Qué acabamos de descubrir?</b><div>${esc(s.concept)}</div></div><div class="stepbox"><div class="stephead"><b>Observa qué sucede · <span id="stepCount">1</span> de ${s.steps.length}</b><button id="stepBtn">Siguiente paso →</button></div><div id="stepText" style="margin-top:9px">${esc(s.steps[0])}</div><div class="progress" id="progress">${s.steps.map((_,i)=>`<div class="dot ${i===0?'done':''}"></div>`).join('')}</div></div><button class="codebtn" id="codeBtn">▸ Ver cómo se escribe en PSeInt</button><pre class="code" id="code">${esc(s.code)}</pre></section><aside class="aside"><div class="teacher">${portrait()}<b>LaProfeVivy</b></div><h3>${esc(s.question)}</h3><div class="answers">${s.opts.map((o,i)=>`<button data-answer="${i}">${esc(o)}</button>`).join('')}</div><div class="feedback" id="feedback"></div><button class="verify" id="verify">Comprobar</button></aside></div></div>`;
$('#home').onclick=()=>go(1);$('#stepBtn').onclick=()=>{step=(step+1)%s.steps.length;$('#stepCount').textContent=step+1;$('#stepText').textContent=s.steps[step];$('#value').textContent=s.vals[Math.min(step,s.vals.length-1)];$('#progress').innerHTML=s.steps.map((_,i)=>`<div class="dot ${i<=step?'done':''}"></div>`).join('');$('#stepBtn').textContent=step===s.steps.length-1?'Volver al inicio ↺':'Siguiente paso →'};
$('#codeBtn').onclick=()=>{$('#code').classList.toggle('open');$('#codeBtn').textContent=$('#code').classList.contains('open')?'▾ Ocultar PSeInt':'▸ Ver cómo se escribe en PSeInt'};
app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(solved)return;chosen=+b.dataset.answer;app.querySelectorAll('[data-answer]').forEach(x=>x.classList.toggle('chosen',x===b))});
$('#verify').onclick=()=>{let box=$('#feedback');box.style.display='block';if(chosen<0){box.className='feedback bad';box.textContent='Primero elige una respuesta.';return}if(chosen===s.correct){solved=true;box.className='feedback';box.textContent='✓ '+s.why;$('#verify').textContent='¡Muy bien!';$('#verify').disabled=true}else{box.className='feedback bad';box.textContent='Todavía no. Vuelve a mirar los pasos y prueba otra respuesta.'}};
}
$('#prev').onclick=()=>go(page-1);$('#next').onclick=()=>go(page+1);document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','BUTTON'].includes(document.activeElement?.tagName))return;if(e.key==='ArrowRight')go(page+1);if(e.key==='ArrowLeft')go(page-1)});render();
</script></body></html>
