<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AutoLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#152039;--hud:#0f1830;--y:#ffc83d;--y2:#f0a800;--teal:#14b39a;--coral:#ff6b57;--ok:#1f9d55;--ok-soft:#e3f6ea;--bad:#d9472f;--bad-soft:#fff0ea;--muted:#5a6683;--line:#dfe4ef}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Rubik,system-ui,Arial,sans-serif;color:var(--ink);background:var(--hud);font-size:16px;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column}
.hud{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--hud);color:#fff;border-bottom:3px solid #000}
.hb{display:flex;align-items:center;gap:8px;background:#1d2a4d;border:2px solid #31406b;border-radius:12px;padding:6px 12px;color:#fff;font-weight:600;font-size:14px;white-space:nowrap}
.hb:hover{background:#26365f}
.hb svg{width:20px;height:20px;flex:0 0 auto}
.hb.ic{padding:6px 8px}
.hinfo{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.hinfo b{font-weight:800;font-size:16px;white-space:nowrap}
.hinfo small{color:#9fb0d8;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpw{margin-left:auto;display:flex;align-items:center;gap:10px}
.xpbar{width:180px;height:14px;background:#22305a;border:2px solid #000;border-radius:99px;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--y));transition:width .7s}
.xp{position:relative;font-weight:800;color:var(--y);font-size:15px;white-space:nowrap}
.xpf{position:absolute;right:0;top:-16px;color:var(--y);font-weight:800;animation:xpf 1s forwards;pointer-events:none}
@keyframes xpf{to{transform:translateY(-26px);opacity:0}}
.chatb{padding:3px 12px 3px 3px;background:var(--y);border-color:#000;color:var(--ink)}
.chatb:hover{background:#ffd666}
.chatb svg{width:32px;height:32px}
main{flex:1;min-height:0;position:relative;overflow:hidden}
.foot{flex:0 0 auto;text-align:center;font-size:13px;color:#9fb0d8;background:var(--hud);padding:6px 12px;border-top:3px solid #000}
.foot b{color:var(--y)}
.sky1{background:linear-gradient(180deg,#7cc8f7 0%,#bfe6ff 55%,#e6f7ec 100%)}
.sky2{background:linear-gradient(180deg,#ff9f68 0%,#ff7f7a 40%,#8a63c9 100%)}
.sky3{background:linear-gradient(180deg,#0a1130 0%,#1a2759 60%,#2a3d78 100%)}
.scene{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.scene svg{width:100%;height:100%;display:block}
.cloud{animation:drift 40s linear infinite}
.cloud.b{animation-duration:65s}
@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(1300px)}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.mapv{overflow-y:auto;height:100%}
.zone{position:relative;padding:34px 16px 120px;min-height:480px}
.zin{position:relative;max-width:760px;margin:auto}
.mhero{display:flex;gap:20px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:18px 22px;margin-bottom:34px}
.mhero .av{width:104px;height:104px;flex:0 0 auto}
.mhero h1{margin:0;font-size:clamp(28px,4.5vw,40px);line-height:1.05;font-weight:800}
.mhero p{margin:6px 0 0;color:var(--muted);font-size:15.5px}
.mhero .row2{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ztitle{display:inline-flex;flex-direction:column;background:var(--ink);color:#fff;border-radius:14px;padding:8px 16px;border:3px solid #000;box-shadow:0 4px 0 #000;margin-bottom:22px}
.ztitle b{font-size:18px;font-weight:800;color:var(--y);letter-spacing:.04em;text-transform:uppercase}
.ztitle small{color:#c7d2ee;font-size:13px}
.path{display:flex;flex-direction:column;align-items:center;gap:6px}
.node{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;transform:translateX(var(--x));position:relative}
.nb{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:800;background:#fff;color:var(--ink);border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);transition:transform .15s}
.node:hover:not(:disabled) .nb{transform:translateY(-3px)}
.node.done .nb{background:var(--teal);color:#fff}
.node.cur .nb{background:var(--y);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 var(--ink),0 0 0 0 rgba(255,200,61,.7)}50%{box-shadow:0 6px 0 var(--ink),0 0 0 14px rgba(255,200,61,0)}}
.node:disabled{cursor:not-allowed}
.node:disabled .nb{background:#cfd6e6;color:#8590ab;border-color:#55617f;box-shadow:0 6px 0 #55617f}
.nl{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:2px 10px;font-weight:700;font-size:14px;margin-top:6px}
.ns{color:#ffb800;font-size:14px;letter-spacing:2px;height:18px;text-shadow:0 1px 0 #00000040}
.dots3{display:flex;flex-direction:column;gap:6px;align-items:center;padding:4px 0}
.dots3 i{width:8px;height:8px;border-radius:50%;background:#ffffffcc;border:2px solid var(--ink)}
.trophy .nb{width:86px;height:86px;font-size:34px;background:#fff6d6}
.resetl{display:block;margin:26px auto 0;background:none;border:0;color:#c7d2ee;text-decoration:underline;font-size:14px}
.zlock{display:inline-block;margin:-10px auto 18px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:6px 14px;font-weight:800;box-shadow:0 4px 0 var(--ink)}
.gbtn{background:var(--y);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);font-weight:800;font-size:15.5px;padding:9px 18px;transition:transform .08s,box-shadow .08s;white-space:nowrap}
.gbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.gbtn.w{background:#fff}
.gbtn.t{background:var(--teal);color:#fff}
.gbtn:disabled{opacity:.5;cursor:not-allowed}
.lbtn{background:none;border:0;padding:6px 4px;color:var(--muted);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 410px}
.simarea{position:relative;overflow:auto;padding:24px;display:flex;min-height:0}
.device{margin:auto;width:100%;min-width:0;max-width:760px;background:#1b2440;border:3px solid #000;border-radius:24px;padding:10px;box-shadow:0 22px 50px rgba(5,10,30,.35)}
.simwrap{min-width:0;position:relative;overflow:hidden;border-radius:14px;background:#fff}
.spot{position:absolute;border-radius:12px;pointer-events:none;opacity:0;box-shadow:0 0 0 4px var(--y),0 0 0 9999px rgba(8,14,34,.55);transition:left .45s,top .45s,width .45s,height .45s,opacity .3s;z-index:5}
.spot.on{opacity:1}
.ptr{position:absolute;width:34px;height:40px;z-index:6;pointer-events:none;opacity:0;transition:left .45s,top .45s,opacity .3s}
.ptr.on{opacity:1}
.ptr svg{width:100%;height:100%;animation:tap 1s ease-in-out infinite;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
@keyframes tap{50%{transform:translate(-7px,-7px)}}
.card{position:absolute;inset:0;z-index:7;background:#fff;padding:22px 24px;overflow:auto;animation:cardin .35s}
@keyframes cardin{from{transform:translateY(16px);opacity:0}}
.card h3{margin:0 0 4px;font-size:20px;font-weight:800}
.card .sub{margin:0 0 14px;color:var(--muted);font-size:14px}
.card table{border-collapse:collapse;width:100%;font-size:14px}
.card th,.card td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.card th{background:#f2f5fb;font-weight:700;font-size:13px;color:var(--muted)}
.card td:first-child{font-weight:700;min-width:96px}
.card td+td{font-weight:400}
.card .rule{margin:14px 0 0;background:#fff6d8;border-radius:10px;padding:10px 12px;font-size:14px}
.comp{position:relative;overflow-y:auto;padding:20px 20px 22px 4px;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;min-height:0}
.portrait{width:128px;height:128px;align-self:flex-start;margin-left:14px;margin-bottom:-26px;position:relative;z-index:2;flex:0 0 auto}
.portrait svg{width:100%;height:100%;border-radius:50%;border:4px solid var(--ink);background:#fff;box-shadow:0 5px 0 var(--ink)}
.portrait.hop{animation:hop .5s}
.portrait.no{animation:no .4s}
@keyframes hop{40%{transform:translateY(-14px)}}
@keyframes no{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.dlg{position:relative;background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:26px 20px 16px;flex:0 0 auto}
.tag{position:absolute;top:-17px;right:16px;display:flex;align-items:center;gap:6px;background:var(--y);border:3px solid var(--ink);border-radius:12px;padding:2px 12px;font-weight:800;font-size:14px}
.tag svg{display:none;width:24px;height:24px;margin-left:-6px}
.say{margin:0;font-size:17px;line-height:1.55;min-height:3.1em}
.qq{margin:0;font-size:17px;font-weight:700;line-height:1.45}
.ctrl{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.ctrl .sp{flex:1}
.dots{display:flex;gap:5px;flex-basis:100%;margin-bottom:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:#d5dbea}
.dots i.on{background:var(--ink);width:20px;border-radius:99px}
.spk{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:#fff;display:grid;place-items:center;padding:0}
.spk svg{width:20px;height:20px}
.spk.on{background:var(--y);border-color:var(--ink)}
.fb{font-size:15.5px;line-height:1.5;border-radius:12px;margin-top:10px;padding:10px 12px}
.fb:empty{display:none}
.fb.good{background:var(--ok-soft);color:#16653a}
.fb.bad{background:var(--bad-soft);color:#9c2e1a}
.fb.tip{background:#fff6d8;color:#6e5100}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:#fff;border:3px solid #cfd6e6;border-radius:14px;box-shadow:0 3px 0 #cfd6e6;padding:11px 14px;font-weight:600;font-size:15.5px;transition:border-color .12s,transform .08s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:active:not(:disabled){transform:translateY(2px)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 3px 0 var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad);opacity:.85}
.shake,.flashbad{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.huntm{display:flex;align-items:center;gap:10px;background:#ffffffe6;border:3px dashed var(--ink);border-radius:14px;padding:10px 14px;font-weight:600;font-size:15px}
.huntm svg{width:26px;height:30px;flex:0 0 auto;animation:tap 1s infinite}
.hunt [data-hot]{cursor:pointer}
.hunt [data-hot]:hover{outline:3px dashed var(--y2);outline-offset:2px}
.slots{display:grid;gap:7px}
.slot{display:flex;gap:10px;align-items:center;min-height:42px;border:2px dashed #b9c2d8;border-radius:12px;padding:7px 10px;background:#ffffffd9;color:var(--muted);font-size:14px}
.slot.f{border-style:solid;border-color:var(--ok);background:var(--ok-soft);color:#16653a;font-weight:600}
.slot i{font-style:normal;flex:0 0 24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pool .opt{padding:8px 12px;font-size:14px}
.stars{font-size:38px;letter-spacing:4px;color:#ffb800;line-height:1;text-shadow:0 3px 0 var(--ink)}
.stars s{color:#d5dbea;text-decoration:none}
.badge-l{font-weight:800;font-size:18px;margin:10px 0 2px}
.banner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:30}
.banner div{background:var(--y);border:4px solid var(--ink);box-shadow:0 8px 0 var(--ink);border-radius:22px;padding:18px 34px;text-align:center;animation:pop 1.5s forwards}
.banner b{display:block;font-size:clamp(28px,5vw,44px);font-weight:800;line-height:1.1}
.banner small{font-size:16px;font-weight:600}
@keyframes pop{0%{transform:scale(.3) rotate(-6deg);opacity:0}18%{transform:scale(1.08) rotate(2deg);opacity:1}28%{transform:scale(1) rotate(0)}82%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:0}}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:29}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* Simulador AutoLab */
.simarea,.comp{scrollbar-width:none}
.simarea::-webkit-scrollbar,.comp::-webkit-scrollbar{display:none}
.flow2{display:flex;flex-direction:column;max-width:540px;margin:0 auto}
.fb2{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:6px 12px;background:#fff}
.fb2.hl{border-color:var(--ink);background:#fff6d8}
.fic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;border:2px solid var(--ink)}
.fic svg{width:18px;height:18px}
.fb2 b{display:block;font-size:12.5px;color:var(--muted)}
.fb2 small{display:block;font-size:13.5px;font-weight:600;line-height:1.35}
.fb2 small.q{color:#b06000;font-weight:500;font-style:italic}
.k-act .fic{background:#ffc83d}.k-dat .fic{background:#cfe3ff}.k-con .fic{background:#e4dcff}.k-acc .fic{background:#bff0e4}.k-res .fic{background:#d4f5dc}.k-plan .fic{background:#ffd9cf}
.farr{width:2px;height:10px;background:var(--ink);margin:0 auto}
.ftitle{text-align:center;font-weight:800;margin:0 0 10px}
.trgs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.trg{border:2px solid var(--line);border-radius:14px;padding:12px;background:#fff;display:flex;flex-direction:column;gap:4px}
.trg.on{border-color:var(--ink);background:#fff6d8;box-shadow:0 4px 0 var(--ink)}
.ti{width:40px;height:40px;border-radius:12px;background:var(--y);border:2px solid var(--ink);display:grid;place-items:center}
.ti svg{width:22px;height:22px}
.trg small{color:var(--muted)}
.tex{font-size:13px;background:#f2f5fb;border-radius:8px;padding:6px 8px;margin-top:4px}
.algo{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;align-items:start}
.ps{background:#0f1830;color:#e8ecf7;border-radius:12px;padding:10px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.pl{padding:3px 6px;border-radius:6px;border-left:4px solid transparent}
.col .pl.t-sec{border-left-color:#7cb6ff}.col .pl.t-dec{border-left-color:#b9a4ff}.col .pl.t-rep{border-left-color:#ffb36b}
.pl.on{background:#ffc83d40}
.lgd{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin-top:8px;color:var(--muted)}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.glog{display:grid;gap:8px}
.gr{border:2px solid var(--line);border-radius:12px;padding:7px 12px;background:#fff;font-size:13px}
.gr.hl{border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.gr b{display:block}
.gr.ok{border-color:#9fdcc9}.gr.dato,.gr.falla{background:#fff6f3}.gr.per{background:#fff8ef}
.gr .pb{display:block;margin-top:3px;color:#0f6f60;font-weight:700}
.pend2{display:flex;align-items:center;gap:10px;margin-top:12px;border:2px solid var(--ink);border-radius:12px;padding:6px 12px;background:#fff6d8}
.pend2 svg{width:40px;height:40px;flex:0 0 auto}
.pend2 small{display:block;color:var(--muted)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tool{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;font-size:13px}
.tool b{font-size:15px;display:block}
.tool small{display:block;color:var(--muted);margin-top:4px}
.tool.on{border-color:var(--ink);background:#fff6d8;box-shadow:0 4px 0 var(--ink)}
.rulebox{background:#0f1830;color:#fff;border-radius:10px;padding:8px 12px;font-family:ui-monospace,Consolas,monospace;font-size:13.5px;margin-bottom:12px}
.rulebox.fix{background:#0f6f60}
.pass{color:var(--ok);font-weight:800}.failr{color:var(--bad);font-weight:800}
.lst tr.bad td{background:#fff0ea}
.lst tr.hl td{background:#fff6d8}
.fc{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:14px;align-items:start}
.fc svg{width:100%;height:auto;display:block}
.fn .sh{stroke:#152039;stroke-width:2.5}
.fn.hl .sh{stroke-width:4.5;filter:drop-shadow(0 0 7px #ffc83d)}
.fn .tg{font-size:9.5px;font-weight:800;letter-spacing:.06em;fill:#4a5675}
.fn .lb{font-size:12.5px;font-weight:600;fill:#152039}
.k-act .sh{fill:#ffc83d}.k-dat .sh{fill:#cfe3ff}.k-acc .sh{fill:#bff0e4}.k-con .sh{fill:#e4dcff}.k-res .sh{fill:#d4f5dc}.k-loop .sh{fill:#ffd9a8}
.fe path.v{stroke:#152039;stroke-width:2;fill:none}
.fe .hit{stroke:transparent;stroke-width:18;fill:none}
.fe text{font-size:12px;font-weight:800;fill:#152039}
.fe.loop path.v{stroke:#e07b00;stroke-width:3.5}
.fe.loop text{fill:#e07b00}
.fe.hl path.v{stroke:#14b39a;stroke-width:4;stroke-dasharray:8 5;animation:dash .5s linear infinite}
@keyframes dash{to{stroke-dashoffset:-13}}
.hunt .fn:hover .sh,.hunt .fe:hover path.v{stroke:#f0a800}
.dot{fill:#ffc83d;stroke:#152039;stroke-width:2.5}
.chips{display:grid;gap:6px}
.chip{display:flex;justify-content:space-between;gap:8px;border:2px solid var(--line);border-radius:10px;padding:4px 10px;font-size:13px;background:#fff}
.qans{margin-top:8px;border-radius:10px;padding:6px 10px;font-weight:600;font-size:13.5px}
.qans.y{background:var(--ok-soft);color:#16653a}.qans.n{background:#fff0ea;color:#9c2e1a}
.lst tr.dn td{color:var(--muted)}
#dpanel .lst{margin-top:10px;min-width:0}
.card td svg{display:block}
@media (max-width:640px){.trgs,.algo,.fc{grid-template-columns:1fr}}
.win{background:#fff;font-size:14px}
.wbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:#f6f8fc}
.wbar b{font-size:14px}.wsp{flex:1}.wtag{font-size:12px;color:var(--muted)}
.wbody{padding:16px}
.esc{display:flex;gap:16px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.who2{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);font-weight:600}
.who2 svg{width:64px;height:64px}
.lst{flex:1;min-width:220px;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.lst table{border-collapse:collapse;width:100%;font-size:13px}
.lst th,.lst td{padding:6px 10px;border-bottom:1px solid #eef1f6;text-align:left}
.lst th{background:#f2f5fb;color:var(--muted);font-size:12px}
.bd{font-size:11px;border-radius:6px;padding:1px 6px;font-weight:700;white-space:nowrap}
.bd.r{background:#fce8e6;color:#c5221f}.bd.a{background:#e6f4ea;color:#137333}
.proc{display:flex;flex-direction:column;gap:7px}
.pend{align-self:flex-start;background:var(--ink);color:#fff;border-radius:10px;padding:3px 12px;font-weight:700;font-size:13px}
.pend.fn{background:var(--teal)}
.paso{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:12px;padding:5px 12px;background:#fff}
.paso.hl{border-color:var(--ink);background:#fff6d8}
.paso i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--y);border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:13px;flex:0 0 auto}
.paso svg{width:22px;height:22px;flex:0 0 auto}
.paso span{flex:1;font-weight:600}
.paso small{color:var(--muted);font-weight:600}
.paso small.au{color:#0f8a76}
.lanes{display:grid;gap:14px}
.lane{border:3px solid var(--line);border-radius:16px;padding:12px 14px}
.lane.m{background:#fff8ef}.lane.a{background:#effaf6}
.lh{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.lh svg{width:52px;height:52px;flex:0 0 auto}
.lh small{display:block;color:var(--muted)}
.pbar{height:16px;border:2px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--coral)}
.lane.a .pbar i{background:var(--teal)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.stats span{background:#fff;border:2px solid var(--line);border-radius:10px;padding:2px 10px;font-size:13px}
.stats b{font-size:15px}
.stats .er b{color:var(--bad)}
.tabs2{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs2 span{padding:3px 12px;border-radius:99px;border:2px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.tabs2 span.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.mails{display:grid;gap:8px}
.mail{display:grid;grid-template-columns:auto 1fr;gap:0 10px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:7px 12px;background:#fff;font-size:13px}
.mail .ic{grid-row:span 3;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:#8590ab;font-size:12px}
.mail.ok .ic{background:var(--ok)}
.mail.bad{border-color:var(--bad);background:var(--bad-soft)}
.mail.bad .ic{background:var(--bad)}
.mail small{color:var(--muted);word-break:break-word}
.mail em{font-style:normal;font-weight:700;color:var(--bad);font-size:12px}
.log{margin-top:10px;background:#f2f5fb;border-radius:10px;padding:8px 12px;font-size:13px}
.ptitle{font-weight:800;margin:0 0 8px}
.tasks{display:grid;gap:6px}
.tk{border:2px solid var(--ink);border-radius:10px;padding:6px 10px;background:#fff;font-size:13px;font-weight:600}
.tk.fo{background:var(--y);box-shadow:0 3px 0 var(--ink)}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.bin{border:3px dashed var(--line);border-radius:14px;padding:10px;min-height:110px}
.bin h5{margin:0 0 8px;display:flex;align-items:center;gap:8px;font-size:14px}
.bin h5 svg{width:34px;height:34px;flex:0 0 auto}
.bin.a{background:#effaf6;border-color:#9fdcc9}.bin.p{background:#fff8ef;border-color:#f3c99b}
.bin .tk{margin-bottom:6px}

/* Final y certificado */
.fin{position:relative;max-width:760px;margin:auto;background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:26px 24px;text-align:center}
.fin h1{margin:6px 0 6px;font-size:clamp(28px,4.5vw,40px);font-weight:800}
.fin p{color:var(--muted);margin:0}
.nm{display:block;margin:6px auto 0;font:inherit;font-size:16px;padding:9px 12px;border:3px solid var(--ink);border-radius:12px;width:min(280px,100%)}
.code{margin:12px auto 0!important;text-align:center;letter-spacing:.2em}
.cerr{color:#c2410c!important;font-weight:700;min-height:1.4em}
.cbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.cert{background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:10px}
.cin{border:3px double #d9b44a;border-radius:16px;padding:22px 24px;text-align:center;background:linear-gradient(#fffdf5,#fff)}
.cav{width:80px;height:80px;margin:0 auto 6px}
.ck{letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#b08a1e;font-size:12px}
.cin h1{margin:6px 0 2px;font-size:clamp(26px,4vw,36px)}
.cin h2{margin:4px 0;font-size:clamp(24px,4vw,34px);color:#14806e}
.cin p{margin:2px 0;color:var(--muted)}
.cin h3{margin:16px 0 6px;font-size:16px}
.cmeta{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.cmeta span{background:#fff6d8;border:2px solid var(--ink);border-radius:10px;padding:3px 10px;font-weight:700;font-size:14px}
.cap{text-align:left;max-width:520px;margin:0 auto;padding-left:20px}
.cap li{margin:5px 0}
.cfirma{margin-top:18px;display:inline-flex;flex-direction:column;border-top:2px solid var(--ink);padding-top:6px;min-width:200px}
.cfirma small{color:var(--muted)}
.soon{color:#fff;font-weight:700;text-align:center;margin-top:10px}
@media print{body{overflow:visible;background:#fff}.app{height:auto}body *{visibility:hidden}#cert,#cert *{visibility:visible}#cert{position:absolute;left:0;top:0;width:100%;box-shadow:none}}

/* Chat */
.veil{position:fixed;inset:0;background:rgba(8,14,34,.5);z-index:50;display:none}
.veil.open{display:block}
.chat{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);background:#fff;z-index:51;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .3s;border-left:3px solid var(--ink)}
.chat.open{transform:none}
.chat-h{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--hud);color:#fff}
.chat-h svg{width:46px;height:46px;flex:0 0 auto;border-radius:50%;border:3px solid var(--y)}

.m.u{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:4px}
.sugg{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-top:1px solid var(--line)}
.sugg button{flex:0 0 auto;border:2px solid var(--ink);background:#fff;border-radius:99px;padding:5px 11px;font-size:13px;font-weight:600}
.chat-in{display:flex;gap:8px;padding:10px 12px 14px;border-top:1px solid var(--line)}

@media (max-width:980px){
 .stage{display:flex;flex-direction:column}

 .portrait{display:none}
 .tag{left:14px;right:auto}

}

 .hud{gap:8px;padding:7px 10px}

}

<body>
<div class="app">
 <header class="hud">
  <button class="hb" id="toMap" type="button" aria-label="Mapa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6.5v13L9 17l6 3 6-2.5v-13L15 7z"/><path d="M9 4v13M15 7v13"/></svg><span>Mapa</span></button>
  <div class="hinfo"><b>AutoLab</b><small id="hsub">Elige tu etapa</small></div>
  <div class="xpw"><div class="xpbar" aria-label="Progreso"><i id="bar"></i></div><span class="xp" id="xp">0 XP</span></div>
  <button class="hb ic" id="snd" type="button" aria-label="Sonido"></button>
  <button class="hb chatb" id="chatBtn" type="button" aria-label="Pregúntale a la profe"></button>
 </header>
 <main id="main"></main>
 <footer class="foot">Aprendiendo con <b>@LaProfeVivy</b></footer>
</div>
<div class="veil" id="veil"></div>
<section class="chat" id="chat" aria-label="Chat con la profe">
 <div class="chat-h" id="chatHead"></div>
 <div class="msgs" id="msgs"></div>
 <div class="sugg" id="sugg"></div>
 <form class="chat-in" id="chatForm"><input id="chatIn" placeholder="Escribe tu pregunta…" autocomplete="off"><button class="gbtn" type="submit">Enviar</button></form>
</section>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clone=o=>JSON.parse(JSON.stringify(o||{}));
const ini=n=>n.split(' ').map(p=>p[0]).join('').slice(0,2);

/* ---------- Avatar de la profe ---------- */
let avn=0;
function avatar(){const id='avc'+(++avn);return `<svg viewBox="0 0 120 120" aria-hidden="true"><defs><clipPath id="${id}"><circle cx="60" cy="60" r="60"/></clipPath></defs><g clip-path="url(#${id})"><rect width="120" height="120" fill="#ffe9e4"/><path d="M27 66C22 32 42 16 61 16c22 0 37 17 32 50-2 13 1 23 6 32H21c5-9 8-20 6-32z" fill="#7d1a35"/><rect x="52" y="74" width="16" height="20" rx="6" fill="#ecc3a8"/><path d="M18 126c2-23 18-34 42-34s40 11 42 34z" fill="#2f8f83"/><path d="M50 92l10 12 10-12z" fill="#ecc3a8"/><ellipse cx="60" cy="58" rx="21" ry="24" fill="#f5d5bf"/><circle cx="39" cy="61" r="4" fill="#ecc3a8"/><circle cx="81" cy="61" r="4" fill="#ecc3a8"/><path d="M37 60c-3-22 9-33 25-33 16 0 26 11 23 28-4-8-10-11-17-12-3 4-9 7-16 8-6 1-11 4-15 9z" fill="#9b2445"/><path d="M47 32c9-5 22-4 30 4-9-2-19-2-30-4z" fill="#c4456a" opacity=".85"/><path d="M38 57c-4 10-4 20 1 30-7-6-10-18-8-30z" fill="#8a1f3d"/><path d="M83 52c4 11 4 22-1 33 7-8 10-20 7-33z" fill="#8a1f3d"/><path d="M45 51q5-2.5 10 0M65 51q5-2.5 10 0" stroke="#5a2a28" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M45 58q5-3 10 0M65 58q5-3 10 0" stroke="#2b1b1b" stroke-width="2.2" fill="none" stroke-linecap="round"/><circle cx="46" cy="67" r="3.5" fill="#ef9a8c" opacity=".45"/><circle cx="74" cy="67" r="3.5" fill="#ef9a8c" opacity=".45"/><path d="M53 70q7 5 14 0" stroke="#a8384a" stroke-width="2.4" fill="none" stroke-linecap="round"/><g transform="translate(78 88)"><path d="M4 10 7 0l7 7h8l7-7 3 10c2 4 2 9 0 13H2c-2-4-2-9 2-13z" fill="#8b7b68"/><path d="M8 9l3-5M28 9l-3-5" stroke="#5e5143" stroke-width="1.5"/><path d="M18 14c-5 0-8 3-8 7h16c0-4-3-7-8-7z" fill="#fff"/><path d="M11 13q2-1.5 4 0M21 13q2-1.5 4 0" stroke="#2b2b2b" stroke-width="1.4" fill="none" stroke-linecap="round"/><path d="M17 16h2l-1 1.2z" fill="#e89aa2"/></g></g></svg>`}
const PTR='<svg viewBox="0 0 22 28"><path d="M1 1v21l6-6 4 10 4-2-4-10h8z" fill="#fff" stroke="#152039" stroke-width="2" stroke-linejoin="round"/></svg>';
const MARTA='<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="31" fill="#fff4dc" stroke="#152039" stroke-width="2"/><path d="M14 58c2-12 9-17 18-17s16 5 18 17z" fill="#5b3fd1"/><path d="M19 36c-2-15 5-23 13-23s15 8 13 23c-2-6-6-9-13-9s-11 3-13 9z" fill="#3b2a26"/><ellipse cx="32" cy="31" rx="10" ry="12" fill="#e9b996"/><path d="M22 27c3-6 7-8 10-8s8 2 10 8c-4-3-7-4-10-4s-7 1-10 4z" fill="#3b2a26"/><circle cx="28" cy="31" r="1.4" fill="#152039"/><circle cx="36" cy="31" r="1.4" fill="#152039"/><path d="M28.5 36q3.5 2.5 7 0" stroke="#a8384a" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>';
const ROBOT='<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="31" fill="#e3f6ef" stroke="#152039" stroke-width="2"/><path d="M32 10v7" stroke="#152039" stroke-width="2.5"/><circle cx="32" cy="9" r="3" fill="#ff6b57" stroke="#152039" stroke-width="2"/><rect x="17" y="17" width="30" height="24" rx="7" fill="#14b39a" stroke="#152039" stroke-width="2.5"/><circle cx="26" cy="29" r="4" fill="#fff" stroke="#152039" stroke-width="2"/><circle cx="38" cy="29" r="4" fill="#fff" stroke="#152039" stroke-width="2"/><path d="M27 36h10" stroke="#152039" stroke-width="2.5" stroke-linecap="round"/><rect x="21" y="44" width="22" height="12" rx="4" fill="#ffc83d" stroke="#152039" stroke-width="2.5"/></svg>';

/* ---------- Escenarios ---------- */
function scene(n){
 let seed=n*137;const r=()=>(seed=(seed*9301+49297)%233280)/233280;
 let s='';
 if(n===1){
  s+=`<g class="cloud" fill="#fff" opacity=".9"><ellipse cx="0" cy="60" rx="70" ry="20"/><ellipse cx="35" cy="45" rx="40" ry="22"/></g><g class="cloud b" fill="#fff" opacity=".75" style="animation-delay:-30s"><ellipse cx="0" cy="105" rx="60" ry="16"/><ellipse cx="-25" cy="94" rx="32" ry="17"/></g><g class="cloud" fill="#fff" opacity=".8" style="animation-delay:-18s"><ellipse cx="0" cy="30" rx="50" ry="14"/></g>`;
  s+=`<path d="M0 205 Q160 150 340 190 T680 178 T1000 168 T1200 182 V300 H0Z" fill="#a9de9b"/>`;
  s+=`<g transform="translate(870 128)"><rect x="0" y="40" width="210" height="92" fill="#fff4dc" stroke="#152039" stroke-width="3"/><path d="M-12 44 L105 0 L222 44Z" fill="#ff6b57" stroke="#152039" stroke-width="3" stroke-linejoin="round"/><circle cx="105" cy="26" r="9" fill="#fff" stroke="#152039" stroke-width="2.5"/><rect x="88" y="84" width="34" height="48" fill="#5a6683" stroke="#152039" stroke-width="3"/>${[18,52,140,174].map(x=>`<rect x="${x}" y="60" width="22" height="20" fill="#7cc8f7" stroke="#152039" stroke-width="2.5"/>`).join('')}<path d="M105 0V-34" stroke="#152039" stroke-width="3"/><path d="M105 -34h24l-6 7 6 7h-24z" fill="#ffc83d" stroke="#152039" stroke-width="2"/></g>`;
  s+=`<path d="M0 238 Q220 198 440 232 T860 228 T1200 222 V300H0Z" fill="#6cc070"/>`;
  [[90,232],[180,226],[1120,224],[640,236]].forEach(([x,y])=>{s+=`<rect x="${x-3}" y="${y-8}" width="6" height="18" fill="#7a4d2b"/><circle cx="${x}" cy="${y-20}" r="16" fill="#3f9d4f" stroke="#152039" stroke-width="2.5"/>`});
 } else if(n===2){
  s+=`<circle cx="230" cy="150" r="70" fill="#ffd27a" opacity=".85"/>`;
  for(let x=-10;x<1210;x+=40+r()*30){const h=70+r()*110,w=36+r()*30;s+=`<rect x="${x}" y="${300-h-40}" width="${w}" height="${h+40}" fill="#6a4fb0" opacity=".65"/>`}
  for(let x=-20;x<1220;x+=55+r()*35){const h=50+r()*80,w=50+r()*30;s+=`<rect x="${x}" y="${300-h}" width="${w}" height="${h}" fill="#3a2c78" stroke="#152039" stroke-width="2"/>`;for(let wy=300-h+12;wy<290;wy+=18)for(let wx=x+8;wx<x+w-10;wx+=14)if(r()>.55)s+=`<rect x="${wx}" y="${wy}" width="7" height="8" fill="#ffc83d"/>`}
 } else {
  for(let i=0;i<70;i++)s+=`<circle class="tw" style="animation-delay:${(r()*3).toFixed(2)}s" cx="${(r()*1200).toFixed(0)}" cy="${(r()*170).toFixed(0)}" r="${(r()*1.6+.6).toFixed(1)}" fill="#fff"/>`;
  s+=`<circle cx="1010" cy="62" r="26" fill="#f6f1c7"/>`;
  for(let x=-10;x<1210;x+=38+r()*28){const h=80+r()*120,w=34+r()*26;s+=`<rect x="${x}" y="${300-h-30}" width="${w}" height="${h+30}" fill="#1b285a"/>`}
  for(let x=-20;x<1220;x+=52+r()*36){const h=60+r()*90,w=48+r()*30;s+=`<rect x="${x}" y="${300-h}" width="${w}" height="${h}" fill="#0a1029" stroke="#000" stroke-width="2"/>`;for(let wy=300-h+12;wy<290;wy+=17)for(let wx=x+8;wx<x+w-10;wx+=13)if(r()>.6)s+=`<rect x="${wx}" y="${wy}" width="6" height="7" fill="${r()>.3?'#ffc83d':'#5fe0d0'}"/>`}
 }
 return `<svg viewBox="0 0 1200 300" preserveAspectRatio="xMidYMax slice">${s}</svg>`;
}

/* ---------- Simuladores ---------- */
const ICP={list:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>',count:'<path d="M6 5v14M10 5v14M14 5v14M4 15l14-7"/>',search:'<circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/>',write:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',send:'<path d="M3 11 21 3l-8 18-2-8z"/>'};
const svgP=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICP[k]}</svg>`;
const win=(title,body)=>`<div class="win"><div class="wbar"><b>${title}</b><span class="wsp"></span><span class="wtag">Colegio San Martín</span></div><div class="wbody">${body}</div></div>`;
const PASOS=[['Revisar la lista de llegadas','list'],['Contar los retardos de cada estudiante','count'],['Buscar el correo del acudiente','search'],['Escribir el correo según la norma','write'],['Enviar el correo','send']];
const LLEG=[['Camila Torres','07:08','Retardo'],['Daniel Ruiz','06:57','A tiempo'],['Mateo Gil','07:12','Retardo'],['Laura Peña','06:59','A tiempo']];
function procSim(ms){
 const lista=`<div class="lst" data-t="lista"><table><tr><th>Estudiante</th><th>Llegó</th><th>Estado</th></tr>${LLEG.map(l=>`<tr><td>${l[0]}</td><td>${l[1]}</td><td><span class="bd ${l[2]==='Retardo'?'r':'a'}">${l[2]}</span></td></tr>`).join('')}</table></div>`;
 const pasos=PASOS.map((p,k)=>`<div class="paso ${ms.hl===k+1?'hl':''}" data-t="p${k+1}" data-hot="p${k+1}"><i>${k+1}</i>${svgP(p[1])}<span>${p[0]}</span><small class="${ms.auto?'au':''}">${ms.auto?'Sistema':'Marta'}</small></div>`).join('');
 return win('Coordinación · Retardos',`<div class="esc" data-t="esc"><div class="who2">${MARTA}Marta</div>${lista}</div><div class="proc" data-t="proceso"><span class="pend" data-t="inicio">Inicio: un estudiante llega tarde</span>${pasos}<span class="pend fn" data-t="fin">Fin: la familia queda enterada</span></div>`);
}
const fmtMin=m=>m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+(m%60)+' min':'');
const laneVal=(K,n)=>K==='M'?{t:fmtMin(n*3),e:n>=21?2:n>=8?1:0}:{t:n?'menos de 1 min':'0 min',e:0};
function lane(K,st){
 const n=st==='done'?30:0,v=laneVal(K,n);
 const head=K==='M'?`${MARTA}<div><b>Manual</b><small>Marta hace cada tarea, una por una</small></div>`:`${ROBOT}<div><b>Automático</b><small>Un sistema hace las tareas siguiendo reglas</small></div>`;
 return `<div class="lane ${K==='M'?'m':'a'}" data-t="lane${K}" data-hot="lane${K}"><div class="lh">${head}</div><div class="pbar"><i id="pb${K}" style="width:${n/30*100}%"></i></div><div class="stats"><span>Correos <b id="c${K}">${n}</b>/30</span><span data-t="t${K}">Tiempo <b id="t${K}">${v.t}</b></span><span class="er" data-t="e${K}">Errores <b id="e${K}">${v.e}</b></span></div></div>`;
}
let ANIM=[];

function shp(ty,x,y,w,h,extra=''){

 if(ty==='proc')return `<rect class="sh" ${extra} x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="6"/>`;
 if(ty==='io')return `<polygon class="sh" ${extra} points="${x-w/2+12},${y-h/2} ${x+w/2},${y-h/2} ${x+w/2-12},${y+h/2} ${x-w/2},${y+h/2}"/>`;
 return `<polygon class="sh" ${extra} points="${x},${y-h/2} ${x+w/2},${y} ${x},${y+h/2} ${x-w/2},${y}"/>`;
}

 return s+'</svg>';
}

 return `<p class="ptitle">El ciclo en números</p><div class="chips"><div class="chip"><span>Vuelta</span><b>${f.v?f.v+' de 4':'—'}</b></div><div class="chip"><span>Avisos enviados</span><b>${f.av||0}</b></div></div>${f.q?`<div class="qans ${f.q==='Sí'?'y':'n'}">El rombo responde: <b>${f.q}</b></div>`:''}<div class="lst"><table><tr><th>Estudiante</th><th>Min.</th><th>Aviso</th></tr>${rows}</table></div>`;
}

function dotAlong(e){
 const svg=e.ownerSVGElement;if(!svg)return;svg.querySelectorAll('.dot').forEach(x=>x.remove());
 const NS='http://www.w3.org/2000/svg',c=document.createElementNS(NS,'circle'),a=document.createElementNS(NS,'animateMotion');
 c.setAttribute('class','dot');c.setAttribute('r','8');c.setAttribute('cx','0');c.setAttribute('cy','0');
 a.setAttribute('dur','.6s');a.setAttribute('fill','freeze');a.setAttribute('begin','indefinite');a.setAttribute('path',e.querySelector('path.v').getAttribute('d'));
 c.appendChild(a);svg.appendChild(c);try{a.beginElement()}catch(_){}
}
function fcApply(f,panel){
 const root=$('#simc');if(!root)return;
 root.querySelectorAll('.fn.hl,.fe.hl').forEach(g=>g.classList.remove('hl'));
 const n=root.querySelector(`[data-t="n-${f.n}"]`);if(n)n.classList.add('hl');
 const e=f.e&&root.querySelector(`[data-t="e-${f.e}"]`);if(e){e.classList.add('hl');dotAlong(e)}
 const p=$('#dpanel');if(p)p.innerHTML=panel(f);
}

{short:'Activadores',badge:'Chispa inicial',title:'¿Qué activa una automatización?',ask:['activador','partes','regla'],
 init:{on:''},
 tour:[
  {s:'Una automatización no trabaja todo el tiempo: espera una señal para empezar. Esa señal se llama activador o disparador.'},
  {s:'Hay tres tipos de activador. El primero es un evento: algo que pasa en el momento.',set:ms=>ms.on='ev',t:'tr-ev'},
  {s:'Ejemplo: cuando se registra una llegada tarde, el sistema arranca de inmediato.',set:ms=>ms.on='ev',t:'tr-ev'},
  {s:'El segundo es una hora programada: una fecha u hora fija, como la alarma del celular.',set:ms=>ms.on='hr',t:'tr-hr'},
  {s:'Ejemplo: todos los viernes a las 4:00 p. m., el sistema envía a la rectora el informe de retardos de la semana.',set:ms=>ms.on='hr',t:'tr-hr'},
  {s:'El tercero es una condición: un dato llega a cierto valor.',set:ms=>ms.on='co',t:'tr-co'},
  {s:'Ejemplo: cuando un estudiante completa 3 retardos, el sistema avisa a coordinación.',set:ms=>ms.on='co',t:'tr-co'},
  {s:'Este cuadro resume los tres activadores, con una pista para reconocerlos.',card:CARD_TRIG},
  {s:'Ahora te toca reconocer el activador de cada situación.'}
 ],
 sim:ms=>trigSim(ms),
 steps:[
  {t:'choice',q:'Cada lunes a las 6:00 a. m., el sistema envía a los docentes la lista de clases de la semana. ¿Qué activador es?',opts:['Hora programada','Evento','Condición'],ok:0,hint:'Busca las palabras “cada lunes a las…”.',good:'Una fecha y hora fija: hora programada.',pre:ms=>ms.on=''},
  {t:'choice',q:'Un acudiente envía el formulario de excusa y el sistema avisa a Marta. ¿Qué activador es?',opts:['Evento','Hora programada','Condición'],ok:0,hint:'Algo pasa en el momento.',good:'Enviar el formulario es un evento.'},
  {t:'choice',q:'Cuando un curso pasa de 10 retardos en el mes, el sistema avisa al director de grupo. ¿Qué activador es?',opts:['Condición','Evento','Hora programada'],ok:0,hint:'Un dato llega a cierto valor: “pasa de 10”.',good:'Un dato cumple una regla: condición.'},
  {t:'hot',q:'Toca el activador que usarías para enviar el informe semanal a la rectora.',ok:'tr-hr',hint:'El informe sale siempre el mismo día y a la misma hora.',good:'Todos los viernes a la misma hora: hora programada.',bad:'Piensa: el informe no depende de que pase algo, sino del día y la hora.'},
  {t:'choice',q:'¿Qué hace la automatización mientras no llega su activador?',opts:['Espera','Envía correos sin parar','Se borra'],ok:0,hint:'El activador es la señal para empezar.',good:'Espera su señal para empezar.'}
 ]},

  {t:'order',q:'Ordena las partes de una automatización.',items:['Activador','Datos de entrada','Condición','Acción','Resultado'],hint:'Empieza por lo que la pone en marcha.',good:'¡Las cinco partes en orden!'},
  {t:'hot',q:'Toca la parte que decide si el correo se envía o no.',ok:'f-con',hint:'Es una pregunta de sí o no.',good:'La condición decide si sigue o se detiene.',bad:'Esa parte no decide. Busca la pregunta.'},
  {t:'choice',q:'“Correo del acudiente.” ¿Qué parte es?',opts:['Datos de entrada','Acción','Activador'],ok:0,hint:'Es información que el sistema usa.',good:'Es un dato que el sistema necesita.'},
  {t:'choice',q:'“Enviar la citación al acudiente.” ¿Qué parte es?',opts:['Acción','Condición','Resultado'],ok:0,hint:'Es lo que hace el sistema.',good:'Es lo que hace: una acción.'},
  {t:'choice',q:'Daniel llegó a las 06:57. ¿Qué pasa en la condición?',opts:['Responde no y el sistema no envía nada','Responde sí y envía el correo','El sistema se detiene por error'],ok:0,hint:'¿Llegó más de 5 minutos tarde?',good:'Llegó a tiempo: la condición responde no.'},
  {t:'choice',q:'Esta automatización solo revisa el 1.er retardo. ¿Qué necesitas para avisar el 2.º retardo?',opts:['Otra condición para el 2.º retardo, con su propia acción','Borrar la condición','Cambiar el activador por una hora'],ok:0,hint:'Cada norma tiene su propia regla y su propia acción.',good:'Cada retardo tiene su condición y su acción.'}
 ]},
{short:'Diagrama',badge:'Ojo de diagramas',title:'El diagrama de flujo',ask:['diagrama','regla','condicion'],
 init:{f:{}},
 tour:[
  {s:'Un diagrama de flujo dibuja un algoritmo con figuras y flechas. Así se ve una automatización antes de crearla.',t:'chart'},
  {s:'Cada figura tiene un significado, y cada una corresponde a una parte de la automatización.',card:CARD_SIMB},
  {s:'El óvalo marca el inicio. En una automatización, el inicio es el activador, también llamado disparador.',set:ms=>ms.f={n:'ini'},t:'n-ini'},
  {s:'El paralelogramo es la entrada de datos: la información que llega para trabajar.',set:ms=>ms.f={n:'leer'},t:'n-leer'},
  {s:'El rectángulo es un proceso: algo que el sistema hace, como calcular o enviar.',set:ms=>ms.f={n:'calc'},t:'n-calc'},
  {s:'El rombo es la decisión. Ahí está la regla: una pregunta de sí o no, con dos salidas.',set:ms=>ms.f={n:'dec'},t:'n-dec'},
  {s:'Las flechas muestran el flujo de datos: el camino que siguen. Mira el punto amarillo: son los datos de Camila viajando.',set:ms=>ms.play=framesDec('Camila','07:08',8),t:'chart'},
  {s:'Camila llegó 8 minutos tarde. En el rombo la regla responde sí, y sus datos van hacia Enviar aviso.',set:ms=>ms.f=framesDec('Camila','07:08',8)[4],t:'e-si'},
  {s:'Ahora Daniel, que llegó a las 06:57. La regla responde no, y sus datos toman el otro camino.',set:ms=>ms.play=framesDec('Daniel','06:57',0),t:'chart'},
  {s:'Una regla se lee así: si pasa esto, entonces haz aquello. Si llegó más de 5 minutos tarde, entonces envía el aviso.',set:ms=>ms.f={n:'dec',e:'si'},t:'n-dec'},
  {s:'¡Ahora te toca leer el diagrama!'}
 ],

  {t:'hot',q:'Toca la figura donde se aplica la regla.',ok:'n-dec',hint:'Es la figura con una pregunta de sí o no.',good:'El rombo hace la pregunta de la regla.',bad:'Esa figura no pregunta nada. Busca el rombo.'},
  {t:'choice',q:'¿Qué figura se usa para los datos de entrada?',opts:['Paralelogramo','Rombo','Óvalo'],ok:0,hint:'Revisa el cuadro de figuras.',good:'El paralelogramo es la entrada de datos.'},

  {t:'choice',q:'¿Cuál es la regla de este diagrama?',opts:['Si llegó más de 5 minutos tarde, entonces enviar el aviso','Si se envía el aviso, entonces llegó tarde','Enviar el aviso a todos'],ok:0,hint:'Si (condición), entonces (acción).',good:'Condición en el rombo, acción en el rectángulo.'},
  {t:'choice',q:'¿Qué viaja por las flechas?',opts:['Los datos del estudiante, de una figura a otra','Los correos ya enviados','Nada: son decoración'],ok:0,hint:'Recuerda el punto amarillo.',good:'Las flechas son el flujo de datos.'}
 ]},

{short:'Casos reales',badge:'Ojo de experta',title:'Automatizaciones en el mundo real',ask:['activador','partes','persona'],

/* ---------- Estado ---------- */
const KEY='autolab-v2';
const def=()=>({xp:0,done:{},stars:{},mute:false,unlock:{}});
let USER=null,syncT=null;
const GS=!!(window.google&&google.script&&google.script.run);
function cacheKey(){return KEY+':'+(USER||'')}
function save(){try{localStorage.setItem(cacheKey(),JSON.stringify(S))}catch(e){}clearTimeout(syncT);syncT=setTimeout(sync,1200)}
const doneCount=()=>Object.keys(S.done).length;
function resumen(){let st=0;for(const k in S.stars)st+=S.stars[k]||0;const n=M.findIndex((_,i)=>!S.done[i]);return {xp:S.xp,etapas:doneCount(),estrellas:st,nivel:n<0?'Nivel '+LEVELS[lvl(M.length-1)][0]+' terminado':LEVELS[lvl(n)][0]+' · etapa '+(n+1)}}
function call(fn,...a){return new Promise((res,rej)=>{google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej((e&&e.message)||'Error'))[fn](...a)})}
function sync(){if(!GS||!USER)return;call('guardar',JSON.stringify(S),resumen()).catch(()=>{})}
let S=def(),cur=-1,ms=null,tw=null;
const built=l=>!!M[LEVELS[l][1]];
const needCode=i=>{const l=lvl(i);return l>0&&i===LEVELS[l][1]&&!(S.unlock&&S.unlock[l])};
const unlocked=i=>{if(i>=M.length)return false;if(i===0||S.done[i])return true;const l=lvl(i);if(i===LEVELS[l][1])return l===0||!!(S.unlock&&S.unlock[l]);return !!S.done[i-1]};

/* ---------- Ingreso ---------- */
function screen(inner){cur=-1;stopVoice();clearInterval(tw);const main=$('#main');main.className='';main.innerHTML=`<div class="mapv"><section class="zone sky1" style="min-height:100%"><div class="scene">${scene(1)}</div><div class="zin"><div class="fin"><div style="width:90px;height:90px;margin:auto">${avatar()}</div><h1>AutoLab</h1>${inner}</div></div></section></div>`}
function entrar(r){
 USER=r.correo;
 let local=null;try{local=JSON.parse(localStorage.getItem(cacheKey()))}catch(e){}
 let base=null;try{base=typeof r.datos==='string'?JSON.parse(r.datos):r.datos}catch(e){}
 if(!(base&&base.done))base=null;
 S=Object.assign(def(),(local&&(!base||(local.xp||0)>(base.xp||0)))?local:(base||{}));
 if(r.nombre)S.name=r.nombre;
 save();drawSnd();hud();
 if(!GS&&!S.name)return localName();
 home();
}
function localName(){
 screen(`<p>Escribe tu nombre para tu certificado.</p><input id="lnom" class="nm" maxlength="40" autocomplete="name" placeholder="Tu nombre completo"><p class="cerr" id="lerr"></p><div class="cbtns"><button class="gbtn" id="lok" type="button">Empezar</button></div>`);
 const ok=()=>{const n=$('#lnom').value.trim();if(!n){$('#lerr').textContent='Escribe tu nombre.';return}S.name=n;save();hud();home()};
 $('#lok').onclick=ok;$('#lnom').onkeydown=e=>{if(e.key==='Enter')ok()};
}
function nameScreen(r){
 screen(`<p>Hola, <b>${esc(r.correo)}</b>. Es tu primera vez: escribe tu nombre para tu certificado.</p><input id="lnom" class="nm" maxlength="40" autocomplete="name" placeholder="Tu nombre completo"><p class="cerr" id="lerr"></p><div class="cbtns"><button class="gbtn" id="lok" type="button">Empezar</button></div>`);
 const go_=()=>{const n=$('#lnom').value.trim();if(!n){$('#lerr').textContent='Escribe tu nombre.';return}$('#lok').disabled=true;call('registrar',n).then(entrar).catch(e=>{$('#lerr').textContent=String(e);$('#lok').disabled=false})};
 $('#lok').onclick=go_;$('#lnom').onkeydown=e=>{if(e.key==='Enter')go_()};
}
function arrancar(){
 hud('Cargando…');
 if(!GS){entrar({correo:'local',nombre:'',datos:null});return}
 screen('<p>Cargando tu progreso…</p>');
 call('cargar').then(r=>r.nuevo?nameScreen(r):entrar(r)).catch(e=>{screen(`<p class="cerr">${esc(String(e))}</p><div class="cbtns"><button class="gbtn" id="retry" type="button">Intentar de nuevo</button></div>`);$('#retry').onclick=arrancar});
}

/* ---------- Sonido ---------- */
let AC=null;
function tone(f,d,when=0,type='triangle',vol=.12){if(S.mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+when;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const sfx={ok:()=>{tone(660,.12);tone(990,.18,.1)},bad:()=>tone(170,.25,0,'square',.06),win:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.22,i*.11)),next:()=>tone(520,.06,0,'sine',.06)};
const ICS={on:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>',off:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="m17 9 5 6M22 9l-5 6"/>'};
function drawSnd(){$('#snd').innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${S.mute?ICS.off:ICS.on}</svg>`}
$('#snd').onclick=()=>{S.mute=!S.mute;save();drawSnd()};

/* ---------- HUD ---------- */
const nameIn=t=>t.replace('{n}',S.name?', '+S.name:'');
function hud(sub){
 $('#bar').style.width=(doneCount()/M.length*100)+'%';
 $('#xp').firstChild.textContent=(S.name?S.name+' · ':'')+S.xp+' XP';
 if(sub!==undefined)$('#hsub').textContent=sub;
}
function xpFloat(n){const s=document.createElement('span');s.className='xpf';s.textContent='+'+n;$('#xp').appendChild(s);setTimeout(()=>s.remove(),1000)}

/* ---------- Mapa ---------- */
function home(){
 cur=-1;stopVoice();clearInterval(tw);clearAnim();
 const next=M.findIndex((_,i)=>!S.done[i]);
 const started=doneCount()>0;
 const offs=[0,-80,0,80];let k=0;
 const node=i=>{const m=M[i];const st=S.done[i]?'done':i===next?'cur':'';const x=offs[(k++)%4];return `<button type="button" class="node ${st}" data-i="${i}" style="--x:${x}px" ${unlocked(i)?'':'disabled'}><span class="nb">${S.done[i]?'✓':i+1}</span><span class="nl">${m.short}</span><span class="ns">${S.stars[i]?'★'.repeat(S.stars[i])+'☆'.repeat(3-S.stars[i]):''}</span></button>`};
 const dots='<div class="dots3"><i></i><i></i></div>';
 const zone=z=>{const L=LEVELS[z];const ids=[];for(let i=L[1];i<=L[2]&&i<M.length;i++)ids.push(i);
  const hero=z===0?`<div class="mhero"><div class="av">${avatar()}</div><div><h1>AutoLab</h1><p>Aprende a automatizar paso a paso</p><p>Jugador: <b>${esc(S.name||'')}</b> · ${S.xp} XP</p><div class="row2"><button class="gbtn" id="start" type="button">${next<0?'Ver mi certificado':started?'Continuar etapa '+(next+1):'Empezar'}</button></div></div></div>`:'';
  const trophy=z===2&&ids.length?dots+`<button type="button" class="node trophy" id="trophy" style="--x:0px" ${next<0?'':'disabled'}><span class="nb">🏆</span><span class="nl">Experta</span></button>`:'';
  const lock=z>0&&ids.length&&CODEH[z]&&!(S.unlock&&S.unlock[z])?`<div style="text-align:center"><button type="button" class="zlock" data-code="${z}">🔒 Entrar con código</button></div>`:'';
  const body=ids.length?`${lock}<div class="path">${ids.map(node).join(dots)}${trophy}</div>${S.done[L[2]]?`<div style="text-align:center;margin-top:16px"><button type="button" class="zlock" data-cert="${z}">📜 Ver certificado</button></div>`:''}`:'<p class="soon">🔒 Muy pronto</p>';
  return `<section class="zone sky${z+1}"><div class="scene">${scene(z+1)}</div><div class="zin">${hero}<div style="text-align:center"><span class="ztitle"><b>Nivel ${L[0]}</b><small>${L[3]}</small></span></div>${body}${z===2&&started?'<button class="resetl" id="reset" type="button">Reiniciar progreso</button>':''}</div></section>`};
 const main=$('#main');main.className='';
 main.innerHTML=`<div class="mapv">${[0,1,2].map(zone).join('')}</div>`;
 main.querySelectorAll('.node[data-i]').forEach(b=>b.onclick=()=>go(+b.dataset.i));
 $('#start').onclick=()=>{next<0?certificate(lvl(M.length-1)):needCode(next)?codeScreen(lvl(next)):go(next)};
 main.querySelectorAll('[data-cert]').forEach(b=>b.onclick=()=>certificate(+b.dataset.cert));
 main.querySelectorAll('[data-code]').forEach(b=>b.onclick=()=>codeScreen(+b.dataset.code));
 const tr=$('#trophy');if(tr)tr.onclick=()=>certificate(2);
 const r=$('#reset');if(r)r.onclick=()=>{if(confirm('¿Borrar tu progreso y empezar de cero?')){const mu=S.mute,nn=S.name;S=def();S.mute=mu;S.name=nn;try{localStorage.removeItem(cacheKey())}catch(e){}save();home()}};
 hud(started?`${doneCount()} de ${M.length} etapas`:'Elige tu etapa');setSugg(['automatizar','programar','cuando']);
}

/* ---------- Certificado ---------- */
const fechaHora=()=>{const d=new Date();return d.toLocaleDateString('es-CO',{day:'2-digit',month:'long',year:'numeric'})+' · '+d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})};
function certificate(l){
 cur=-1;stopVoice();clearInterval(tw);clearAnim();
 if(!S.cert)S.cert={};if(!S.cert[l]){S.cert[l]=fechaHora();save()}
 const L=LEVELS[l];let st=0,mx=0;for(let i=L[1];i<=L[2]&&i<M.length;i++){st+=S.stars[i]||0;mx+=3}
 const last=l===LEVELS.length-1,nextOk=!last&&built(l+1);
 const main=$('#main');main.className='';
 main.innerHTML=`<div class="mapv"><section class="zone sky${l+1}" style="min-height:100%"><div class="scene">${scene(l+1)}</div><div class="zin"><div class="cert" id="cert"><div class="cin"><div class="cav">${avatar()}</div><small class="ck">AutoLab · Certificado de logro</small><h1>Nivel ${L[0]}</h1><p>Se certifica que</p><h2>${esc(S.name||'Estudiante')}</h2><p>completó el Nivel ${L[0]} de AutoLab.</p><div class="cmeta"><span>★ ${st} de ${mx} estrellas</span><span>${S.xp} XP</span><span>🗓 ${S.cert[l]}</span></div><h3>Aprendizajes obtenidos</h3><ul class="cap">${APRENDE[l].map(a=>`<li>${a}</li>`).join('')}</ul>${last?`<h3>Insignias</h3><div class="cmeta">${M.map((m,i)=>`<span>${'★'.repeat(S.stars[i]||0)} ${m.badge}</span>`).join('')}</div>`:''}<div class="cfirma"><b>Profe Vivy</b><small>Aprendiendo con @LaProfeVivy</small></div></div></div><div class="cbtns"><button class="gbtn w" id="cprint" type="button">Imprimir o guardar PDF</button><button class="gbtn w" id="cmap" type="button">Mapa</button>${nextOk?`<button class="gbtn" id="cnext" type="button">Seguir al Nivel ${LEVELS[l+1][0]}</button>`:''}</div>${!last&&!nextOk?`<p class="soon">El Nivel ${LEVELS[l+1][0]} llega muy pronto.</p>`:''}</div></section></div>`;
 $('#cprint').onclick=()=>window.print();$('#cmap').onclick=home;
 const n=$('#cnext');if(n)n.onclick=()=>codeScreen(l+1);
 confetti2();sfx.win();hud(`Certificado · Nivel ${L[0]}`);
}
function confetti2(){const c=document.createElement('div');c.className='confetti';c.style.position='fixed';const cols=['#ffc83d','#14b39a','#ff6b57','#7c6cff','#fff'];c.innerHTML=Array.from({length:50},()=>`<i style="left:${Math.random()*100}%;background:${cols[Math.floor(Math.random()*5)]};animation-delay:${(Math.random()*.8).toFixed(2)}s"></i>`).join('');document.body.appendChild(c);setTimeout(()=>c.remove(),3200)}
function codeScreen(l){
 if(!built(l))return home();
 if(!CODEH[l]||(S.unlock&&S.unlock[l]))return go(LEVELS[l][1]);
 cur=-1;stopVoice();clearInterval(tw);
 const L=LEVELS[l];const main=$('#main');main.className='';
 main.innerHTML=`<div class="mapv"><section class="zone sky${l+1}" style="min-height:100%"><div class="scene">${scene(l+1)}</div><div class="zin"><div class="fin"><div style="width:90px;height:90px;margin:auto">${avatar()}</div><h1>🔒 Nivel ${L[0]}</h1><p>Para entrar, escribe el código que te dará tu profe.</p><input id="code" class="nm code" type="password" autocomplete="off" placeholder="Código"><p class="cerr" id="cerr"></p><div class="cbtns"><button class="gbtn w" id="cmap" type="button">Mapa</button><button class="gbtn" id="cok" type="button">Entrar</button></div></div></div></section></div>`;
 const inp=$('#code');
 const tryIt=()=>{if(hcode(inp.value)===CODEH[l]){S.unlock=S.unlock||{};S.unlock[l]=true;save();sfx.win();go(LEVELS[l][1])}else{sfx.bad();$('#cerr').textContent='Ese código no es. Pídeselo a tu profe.';inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake')}};
 $('#cok').onclick=tryIt;inp.onkeydown=e=>{if(e.key==='Enter')tryIt()};$('#cmap').onclick=home;
 hud(`Nivel ${L[0]} · código`);
}

/* ---------- Etapa ---------- */
function clearAnim(){ANIM.forEach(clearInterval);ANIM=[]}
function go(i){
 if(!unlocked(i))return;
 cur=i;stopVoice();clearAnim();
 const m=M[i],z=lvl(i)+1;
 const main=$('#main');main.className='stage sky'+z;
 main.innerHTML=`<div class="scene">${scene(z)}</div>
 <div class="simarea"><div class="device"><div class="simwrap" id="simwrap"><div id="simc"></div><div class="spot" id="spot"></div><div class="ptr" id="ptr">${PTR}</div><div class="card" id="card" hidden></div></div></div></div>
 <aside class="comp"><div class="portrait" id="portrait">${avatar()}</div><div class="dlg" id="dlg"><span class="tag" id="tag"></span><div id="dbody"></div></div><div id="dextra"></div></aside>
 <div class="banner" id="banner"></div><div class="confetti" id="conf"></div>`;
 $('#simwrap').addEventListener('click',onSimClick);
 $('#dlg').addEventListener('click',e=>{if(e.target.closest('#say'))finishType()});
 hud(`Nivel ${LEVELS[lvl(i)][0]} · Etapa ${i+1}: ${m.title}`);setSugg(m.ask);
 if(i===LEVELS[lvl(i)][1]&&!S.done[i]&&LVINTRO[lvl(i)]){levelIntro(lvl(i));sfx.win()}
 else{showLine(0);const L0=LEVELS[lvl(i)];banner(`Nivel ${L0[0]}`,`Etapa ${i+1} · ${m.title}`,1800)}
}
function levelIntro(l){
 ms=Object.assign(stateFor(0),{phase:'intro',line:0});
 drawSim();spot(null);
 const card=$('#card');card.innerHTML=lvCard(l);card.hidden=false;card.scrollTop=0;
 $('#tag').innerHTML=tagHTML('Profe Vivy');
 $('#dbody').innerHTML=`<p class="say" id="say"></p><div class="ctrl"><span class="sp"></span>${speakBtn()}<button class="gbtn" id="next" type="button">¡Empecemos!</button></div>`;
 $('#dextra').innerHTML='';
 typeText(LVINTRO[l].say);bindSpeak(()=>nameIn(LVINTRO[l].say));
 $('#next').onclick=()=>{sfx.next();showLine(0)};
}
function stateFor(k){const m=M[cur];const st=clone(m.tourInit||m.init);const L=m.tour[k];if(L.set)L.set(st);return st}
const tagHTML=t=>avatar()+'<span>'+t+'</span>';
function drawSim(){
 clearAnim();
 const st=ms.phase==='play'?M[cur].steps[ms.step]:null;
 $('#simc').innerHTML=M[cur].sim(ms);
 $('#simwrap').classList.toggle('hunt',!!st&&st.t==='hot'&&!ms.lock);
 if(M[cur].after)M[cur].after(ms);
}
function showLine(k){
 const m=M[cur],L=m.tour[k];
 ms=Object.assign(stateFor(k),{phase:'tour',line:k});
 drawSim();
 const card=$('#card');
 if(L.card){card.innerHTML=L.card;card.hidden=false;card.scrollTop=0}else card.hidden=true;
 requestAnimationFrame(()=>spot(L.card?null:L.t));
 const last=k===m.tour.length-1;
 $('#tag').innerHTML=tagHTML('Profe Vivy');
 $('#dbody').innerHTML=`<p class="say" id="say"></p><div class="ctrl"><div class="dots">${m.tour.map((_,j)=>`<i class="${j===k?'on':''}"></i>`).join('')}</div><span class="sp"></span>${speakBtn()}${k>0?'<button class="gbtn w" id="back" type="button">Atrás</button>':''}<button class="gbtn" id="next" type="button">${last?'¡A los retos!':'Siguiente'}</button></div>`;
 $('#dextra').innerHTML='';
 typeText(L.s);bindSpeak(()=>nameIn(L.s));
 if(k>0)$('#back').onclick=()=>{sfx.next();showLine(k-1)};
 $('#next').onclick=()=>{sfx.next();last?startPlay():showLine(k+1)};
}
function typeText(t){
 t=nameIn(t);
 clearInterval(tw);const el=$('#say');let i=0;el.textContent='';el.dataset.full=t;
 tw=setInterval(()=>{i+=2;el.textContent=t.slice(0,i);if(i>=t.length)clearInterval(tw)},18);
}
function finishType(){const el=$('#say');if(el&&el.dataset.full){clearInterval(tw);el.textContent=el.dataset.full}}
function spot(t){
 const wrap=$('#simwrap'),s=$('#spot'),p=$('#ptr');if(!wrap)return;
 const el=t&&(wrap.querySelector(`[data-t="${t}"]`)||wrap.querySelector(`[data-hot="${t}"]`));
 if(!el){s.classList.remove('on');p.classList.remove('on');return}
 if(el.scrollIntoView)el.scrollIntoView({block:'nearest',inline:'nearest'});
 const wr=wrap.getBoundingClientRect(),r=el.getBoundingClientRect(),pad=5;
 Object.assign(s.style,{left:(r.left-wr.left-pad)+'px',top:(r.top-wr.top-pad)+'px',width:(r.width+pad*2)+'px',height:(r.height+pad*2)+'px'});
 const px=Math.min(r.right-wr.left-12,wr.width-36),py=Math.min(r.bottom-wr.top-10,wr.height-42);
 Object.assign(p.style,{left:px+'px',top:py+'px'});
 s.classList.add('on');p.classList.add('on');
}
addEventListener('resize',()=>{if(ms&&ms.phase==='tour'&&cur>=0){const L=M[cur].tour[ms.line];spot(L.card?null:L.t)}});
function banner(t,sub,d=1500){const b=$('#banner');if(!b)return;b.innerHTML=`<div><b>${t}</b><small>${sub}</small></div>`;setTimeout(()=>{if(b.isConnected)b.innerHTML=''},d)}
function startPlay(){
 const m=M[cur];
 spot(null);$('#card').hidden=true;
 ms=Object.assign(clone(m.init),{phase:'play',step:0,errs:0,se:0,lock:false});
 banner('¡Hora de los retos!',S.done[cur]?`Repaso · ${m.steps.length} retos · no suma XP, sí puede mejorar estrellas`:`${m.steps.length} retos · gana XP y estrellas`);
 sfx.win();drawTask();
}
function drawTask(){
 const m=M[cur],st=m.steps[ms.step];
 if(!st)return finish();
 ms.se=0;ms.lock=false;
 if(st.pre)st.pre(ms);
 $('#tag').innerHTML=tagHTML(`Reto ${ms.step+1} de ${m.steps.length}`);
 $('#dbody').innerHTML=`<p class="qq">${esc(st.q)}</p><div class="fb" id="fb" aria-live="polite"></div><div class="ctrl" id="acts"><button class="gbtn w" id="hint" type="button">Pista</button><span class="sp"></span><button class="lbtn" id="rev" type="button">Repasar explicación</button></div>`;
 let x='';
 if(st.t==='choice')x=`<div class="opts">${shuffle(st.opts.map((_,k)=>k)).map(k=>`<button type="button" class="opt" data-k="${k}">${esc(st.opts[k])}</button>`).join('')}</div>`;
 else if(st.t==='hot')x=`<div class="huntm">${PTR}<span>Toca la respuesta directamente en la pantalla.</span></div>`;
 else if(st.t==='order'){ms.ord=0;x=`<div class="slots">${st.items.map((_,k)=>`<div class="slot" data-s="${k}"><i>${k+1}</i><span></span></div>`).join('')}</div><div class="pool">${shuffle(st.items.map((_,k)=>k)).map(k=>`<button type="button" class="opt" data-o="${k}">${esc(st.items[k])}</button>`).join('')}</div>`}
 $('#dextra').innerHTML=x;
 drawSim();
 $('#hint').onclick=()=>setFb('tip','Pista: '+st.hint);
 $('#rev').onclick=()=>showLine(0);
 if(st.t==='choice')document.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>{
  if(ms.lock)return;const k=+b.dataset.k;
  if(k===st.ok){b.classList.add('right');document.querySelectorAll('.opt[data-k]').forEach(o=>o.disabled=true);right(st)}
  else{b.classList.add('wrong','shake');b.disabled=true;wrong(st.why&&st.why[k])}
 });
 if(st.t==='order')document.querySelectorAll('.opt[data-o]').forEach(b=>b.onclick=()=>{
  if(ms.lock)return;const k=+b.dataset.o;
  if(k===ms.ord){const s=document.querySelector(`.slot[data-s="${k}"]`);s.classList.add('f');s.querySelector('span').textContent=st.items[k];b.remove();ms.ord++;sfx.next();setFb('','');if(ms.ord===st.items.length)right(st)}
  else{b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');wrong('Ese paso va después. ¿Qué tiene que pasar antes?')}
 });
}
function onSimClick(e){
 if(!ms||ms.phase!=='play'||ms.lock)return;
 const st=M[cur].steps[ms.step];if(!st||st.t!=='hot')return;
 const h=e.target.closest('[data-hot]');if(!h)return;
 if(h.dataset.hot===st.ok)right(st);
 else{h.classList.add('flashbad');setTimeout(()=>h.classList.remove('flashbad'),400);wrong(st.bad||'Ese no es. Mira de nuevo o pide una pista.')}
}
function setFb(c,t){const f=$('#fb');f.className='fb '+c;f.textContent=t}
function react(c){const p=$('#portrait');p.classList.remove('hop','no');void p.offsetWidth;p.classList.add(c)}
function right(st){
 ms.lock=true;const g=S.done[cur]?0:(ms.se?5:10);if(g){S.xp+=g;save();hud();xpFloat(g)}sfx.ok();react('hop');
 if(st.apply)st.apply(ms);
 drawSim();
 setFb('good','¡Bien! '+st.good);
 const last=ms.step===M[cur].steps.length-1;
 $('#acts').innerHTML=`<span class="sp"></span><button class="gbtn t" id="cont" type="button">${last?'Terminar etapa':'Continuar'}</button>`;
 $('#cont').onclick=()=>{ms.step++;drawTask()};
}
function wrong(msg){ms.errs++;ms.se++;sfx.bad();react('no');setFb('bad',msg||'No es esa. Piénsalo de nuevo o toca Pista.')}
function confetti(){const c=$('#conf');const cols=['#ffc83d','#14b39a','#ff6b57','#7c6cff','#fff'];c.innerHTML=Array.from({length:40},()=>`<i style="left:${Math.random()*100}%;background:${cols[Math.floor(Math.random()*5)]};animation-delay:${(Math.random()*.6).toFixed(2)}s"></i>`).join('');setTimeout(()=>c.innerHTML='',3000)}
function finish(){
 const stars=ms.errs===0?3:ms.errs<=2?2:1;
 S.stars[cur]=Math.max(S.stars[cur]||0,stars);S.done[cur]=true;
 save();hud();
 ms.phase='done';$('#simwrap').classList.remove('hunt');
 confetti();sfx.win();react('hop');
 const lv=lvl(cur),endLv=cur===LEVELS[lv][2]||cur===M.length-1;
 $('#tag').innerHTML=tagHTML('¡Etapa completa!');
 $('#dbody').innerHTML=`<div class="stars">${'★'.repeat(stars)}<s>${'★'.repeat(3-stars)}</s></div><p class="badge-l">Insignia: ${M[cur].badge}</p>${endLv?`<p class="say" style="min-height:0;font-weight:700;color:#14806e">¡Completaste el Nivel ${LEVELS[lv][0]}! Ganaste tu certificado.</p>`:''}<p class="say" style="min-height:0">${stars===3?'Sin errores. ¡Impecable!':'Lo lograste. Si quieres sacar 3 estrellas, toca Repetir.'}</p><div class="ctrl"><button class="gbtn w" id="tomap2" type="button">Mapa</button><button class="gbtn w" id="rep" type="button">Repetir</button><span class="sp"></span><button class="gbtn" id="nx" type="button">${endLv?'Ver mi certificado':'Siguiente etapa'}</button></div>`;
 $('#dextra').innerHTML='';
 $('#tomap2').onclick=home;const ci=cur;$('#rep').onclick=()=>go(ci);
 $('#nx').onclick=()=>endLv?certificate(lv):go(ci+1);
}

/* ---------- Voz ---------- */
let speaking=false;
const speakBtn=()=>'speechSynthesis' in window?`<button class="spk" id="spk" type="button" aria-label="Escuchar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICS.on}</svg></button>`:'';
function bindSpeak(get){const b=$('#spk');if(!b)return;b.onclick=()=>{if(speaking){stopVoice();return}const u=new SpeechSynthesisUtterance(get());setVoice(u);u.onend=stopVoice;speechSynthesis.cancel();speechSynthesis.speak(u);speaking=true;b.classList.add('on')}}
let VOICE=null,VFEM=false;
function pickVoice(){
 if(!('speechSynthesis' in window))return;
 const vs=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang));
 const fem=/salome|salomé|dalia|sabina|paloma|paulina|m[oó]nica|helena|laura|elvira|elena|luc[ií]a|ximena|marisol|esperanza|conchita|lupe|pen[eé]lope|mia\b|female|mujer|google espa/i;
 const male=/pablo|ra[uú]l|jorge|diego|[aá]lvaro|gonzalo|carlos|juan|enrique|miguel|andr[eé]s|gerardo|tom[aá]s|alonso|jos[eé]|male\b|hombre/i;
 let best=null,bs=-99;
 vs.forEach(v=>{let sc=0;if(fem.test(v.name))sc+=10;if(male.test(v.name))sc-=20;if(/es-CO/i.test(v.lang))sc+=4;else if(/es-(MX|US|419)/i.test(v.lang))sc+=3;if(/natural|online|neural/i.test(v.name))sc+=2;if(sc>bs){bs=sc;best=v}});
 VOICE=best;VFEM=bs>=10;
}
function setVoice(u){if(!VOICE)pickVoice();if(VOICE){u.voice=VOICE;u.lang=VOICE.lang}else u.lang='es-CO';u.pitch=VFEM?1.05:1.35;u.rate=1}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function stopVoice(){if('speechSynthesis' in window)speechSynthesis.cancel();speaking=false;const b=$('#spk');if(b)b.classList.remove('on')}

/* ---------- Chat de la profe ---------- */
const KB={
 automatizar:{q:'¿Qué es automatizar?',k:['que es automatizar','automatizar','automatizacion','automatico'],a:'Es hacer que un sistema haga tareas solo, siguiendo reglas, sin que una persona las repita cada vez. Ejemplo: enviar el aviso de retardo a cada familia.'},
 programar:{q:'¿Tengo que programar?',k:['programar','codigo','pseint','programacion'],a:'No. Aquí aprendes la lógica: tareas, orden, reglas y decisiones. Las herramientas de automatización se configuran con bloques y menús.'},
 tarea:{q:'¿Tarea o proceso?',k:['tarea','proceso','pasos','inicio','fin'],a:'Una tarea es una acción concreta, como escribir un correo. Un proceso es una serie de tareas en orden, con un inicio y un fin.'},
 manual:{q:'¿Manual o automático?',k:['manual','diferencia','a mano'],a:'Manual: una persona hace cada tarea, una por una. Automático: un sistema hace las mismas tareas solo, siguiendo reglas.'},
 beneficio:{q:'¿Para qué sirve?',k:['sirve','beneficio','ventaja','ahorr','registro'],a:'Para ahorrar tiempo, reducir errores, trabajar siempre igual a cualquier hora y dejar registro de cada envío.'},
 limites:{q:'¿Qué límites tiene?',k:['limite','desventaja','falla','error','datos'],a:'No tiene criterio: solo sigue reglas. Si la regla o los datos están mal, se equivoca siempre igual. Por eso una persona lo revisa.'},
 cuando:{q:'¿Cuándo conviene?',k:['cuando','conviene','vale la pena','preguntas'],a:'Hazle cuatro preguntas a la tarea: ¿se repite mucho? ¿sigue siempre la misma regla? ¿los datos están en digital? ¿un error importa? Si todas son sí, conviene.'},
 persona:{q:'¿Qué hace la persona?',k:['persona','humano','supervision','decide','criterio'],a:'Decide lo que necesita criterio, como aprobar una excusa o hablar con una familia, y revisa que el sistema funcione bien. Eso es supervisión humana.'},
 regla:{q:'¿Qué es una regla?',k:['regla','norma','condicion'],a:'Es una instrucción Si … entonces …: “si llegó más de 5 minutos tarde, entonces envía el aviso”. En el diagrama de flujo va en el rombo. Las reglas las pone una persona.'},
 herramientas:{q:'¿Qué herramientas existen?',k:['make','n8n','power automate','apps script','herramienta'],a:'Make (visual, conecta muchas apps), n8n (visual, en servidor propio), Power Automate (Microsoft), Apps Script (Google, con código) y AppSheet Automation (bots de tu app).'},
 activador:{q:'¿Qué es un activador?',k:['activador','disparador','evento','hora programada','empieza'],a:'Es la señal que pone en marcha la automatización. Hay tres: evento (pasó algo), hora programada (llegó el momento) y condición (un dato cumple una regla).'},
 partes:{q:'¿Cuáles son las partes?',k:['partes','datos de entrada','accion','resultado'],a:'Activador, datos de entrada, condición, acción y resultado. Y un plan B para cuando algo falla.'},
 condicion:{q:'¿Qué es la condición?',k:['condicion','si entonces','if','decide'],a:'Es la pregunta de sí o no que decide si la automatización sigue. Ejemplo: ¿llegó más de 5 minutos tarde?'},
 diagrama:{q:'¿Qué es un diagrama de flujo?',k:['diagrama','flujo','rombo','ovalo','flecha','figura','paralelogramo'],a:'Es el dibujo de un algoritmo. Óvalo: inicio o fin (activador y resultado). Paralelogramo: datos de entrada. Rectángulo: proceso o acción. Rombo: decisión, donde va la regla. Flechas: el camino de los datos.'},
 ciclo:{q:'¿Qué es un ciclo?',k:['ciclo','bucle','vuelta','repetir','infinito','mientras'],a:'Es repetir los mismos pasos para cada dato, como pasar lista. Tiene inicio, condición (¿quedan?), cuerpo (los pasos) y avance (pasar al siguiente). Sin avance, se vuelve un ciclo infinito.'},
 pseint:{q:'¿Qué tiene que ver con PSeInt?',k:['pseint','algoritmo','secuencia','repeticion','finpara','finsi'],a:'Una automatización es un algoritmo: secuencia (pasos en orden), decisión (Si … Entonces) y repetición (Para … Hacer).'},
 error:{q:'¿Y si algo falla?',k:['plan b','falla','rebot','falta','error'],a:'Se diseña un plan B: reintentar, avisar a una persona o esperar su decisión. Casi siempre termina en supervisión humana.'},
 prueba:{q:'¿Cómo pruebo una automatización?',k:['prueba','probar','caso de prueba','limite','verificar'],a:'Con casos de prueba: datos inventados con el resultado esperado. Incluye un caso normal, uno que no debe activar, uno en el límite y uno con un dato faltante.'},
 appsheet:{q:'¿Y AppSheet?',k:['appsheet','bot'],a:'AppSheet también automatiza, en su menú Automation: ahí se crean los bots que envían los avisos de retardo.'}
};
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function reply(text){
 const n=norm(text);let best=null,score=0;
 for(const id in KB){let sc=0;KB[id].k.forEach(k=>{if(n.includes(norm(k)))sc+=k.length});if(sc>score){score=sc;best=id}}
 return best?KB[best].a:'Esa no la tengo clara todavía. Prueba con una de las preguntas de abajo o llévala a clase y la resolvemos juntos.';
}
function addMsg(html,who){const d=document.createElement('div');d.className='m '+who;d.innerHTML=html;$('#msgs').appendChild(d);$('#msgs').scrollTop=$('#msgs').scrollHeight}
function ask(text,html){addMsg(esc(text),'u');setTimeout(()=>addMsg(html||reply(text),'p'),350)}
function setSugg(ids){$('#sugg').innerHTML=ids.map(id=>`<button type="button" data-id="${id}">${esc(KB[id].q)}</button>`).join('');$('#sugg').querySelectorAll('button').forEach(b=>b.onclick=()=>ask(KB[b.dataset.id].q,KB[b.dataset.id].a))}
let greeted=false;
function openChat(){$('#chat').classList.add('open');$('#veil').classList.add('open');if(!greeted){greeted=true;addMsg('Hola, soy la profe Vivy. Escríbeme tu duda o toca una de las preguntas de abajo.','p')}}
function closeChat(){$('#chat').classList.remove('open');$('#veil').classList.remove('open')}
$('#chatBtn').innerHTML=avatar()+'<span>Pregúntale a la profe</span>';
$('#chatHead').innerHTML=avatar()+'<div><b>Profe Vivy</b><br><small>Dudas sobre automatización</small></div><button class="chat-x" id="chatX" type="button" aria-label="Cerrar">×</button>';
$('#chatBtn').onclick=openChat;$('#chatX').onclick=closeChat;$('#veil').onclick=closeChat;
$('#chatForm').onsubmit=e=>{e.preventDefault();const v=$('#chatIn').value.trim();if(!v)return;$('#chatIn').value='';ask(v)};
$('#toMap').onclick=()=>USER?home():arrancar();
drawSnd();
arrancar();
</script>
