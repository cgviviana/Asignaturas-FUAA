['Un desencadenante es el evento que pone en marcha un flujo. Cuando llega una respuesta nueva de Forms, Power Automate ejecuta automáticamente las acciones vinculadas.','Un formulario de pedidos puede activar el registro de una venta sin que alguien tenga que revisar manualmente las respuestas.'],

['La solicitud de 15 excede la disponibilidad de 9. Confirmar o descontar el pedido completo provocaría un saldo inconsistente. La ruta correcta es mantener el pedido pendiente, avisar al encargado y esperar una decisión.','El encargado puede consultar al cliente si acepta una entrega parcial o una nueva fecha.'],
['La notificación de salida debe estar vinculada a un hecho confirmado: el despacho real. Por ello el segundo formulario funciona como desencadenante del aviso, en lugar de enviar la notificación al recibir el pedido inicial.','Cuando bodega confirma la salida, el flujo puede enviar el mensaje correspondiente al cliente.'],
['Power Automate necesita localizar campos concretos en Forms y columnas de tablas reconocibles en Excel. Preparar nombres, identificadores y estructuras coherentes permite mapear cada dato y buscar productos sin depender de posiciones de filas.','Antes de construir el flujo se preparan las tablas de pedidos e inventario y los formularios que las alimentan.']
];
function home(){
  stopTimer();closeModal();started=false;reset.style.display='none';hud.textContent=`${TOTAL} RETOS`;
  el.innerHTML=`<div class="center"><div class="eyebrow">Piensa · Resuelve · Programa</div><h1 class="hero">CODE <em>ARENA</em></h1><div class="modebar">${Object.entries(MODE_ICONS).map(([k,v])=>`<button class="modeicon ${mode===k?'active':''}" data-mode="${k}" title="${k==='grupal'?'Grupal · proyección':k==='individual'?'Individual':'Consultar respuestas'}" aria-label="${k}">${v}</button>`).join('')}</div><div class="startrow"><button class="btn" id="start">▶ EMPEZAR</button></div></div>`;
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b))});
  document.getElementById('start').onclick=()=>{index=0;answers=[];started=true;reset.style.display='';renderQuestion()};
}
function renderQuestion(){
  stopTimer();closeModal();if(index>=TOTAL){results();return}
  answered=false;
  const q=QUESTIONS[index],r=ROUNDS[q.r];remaining=timeForQuestion(q);
  hud.textContent=`RETO ${index+1} / ${TOTAL}`;
  const opts=q.o.map((o,i)=>`<${mode==='individual'?'button':'div'} class="opt ${mode==='individual'?'':'displayonly'}" ${mode==='individual'?`data-n="${i}"`:''}><b>${'ABCD'[i]}</b>${esc(o)}</${mode==='individual'?'button':'div'}>`).join('');
  el.innerHTML=`<div class="quizhead"><div><span class="eyebrow">RONDA 0${q.r+1} · ${r.name}</span></div><div class="clock" id="clock">${clockFormat(remaining)}</div></div><div class="progress"><div class="fill" style="width:${index/TOTAL*100}%"></div></div><section class="card"><span class="tag">PREGUNTA ${index+1} DE ${TOTAL}</span><div class="question">${esc(q.q)}</div>${q.code?`<pre class="code">${esc(q.code)}</pre>`:''}<div class="opts">${opts}</div><div id="feedback" aria-live="polite"></div><div class="bottom"><span class="muted small" id="status"></span><div class="controlrow"><button class="btn secondary" id="prev" ${index===0?'disabled':''} aria-label="Anterior">←</button><button class="btn secondary" id="reveal" title="Abrir explicación">${mode==='respuestas'?'Ver respuesta':'Respuesta'}</button><button class="btn" id="next">${index===TOTAL-1?'FINALIZAR →':'SIGUIENTE →'}</button></div></div></section>`;
  if(mode==='individual')document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.n)));
  document.getElementById('prev').onclick=()=>{index=Math.max(0,index-1);renderQuestion()};
  document.getElementById('next').onclick=()=>{if(mode==='individual'&&!answered)answers[index]={correct:false,picked:null};index++;renderQuestion()};
  document.getElementById('reveal').onclick=showAnswer;
  if(mode!=='respuestas')timer=setInterval(()=>{remaining=Math.max(0,remaining-1);const clock=document.getElementById('clock');if(clock){clock.textContent=clockFormat(remaining);clock.classList.toggle('low',remaining<=10)}if(remaining===0){stopTimer();const status=document.getElementById('status');status.textContent='Tiempo agotado';if(mode==='individual'&&!answered){answered=true;answers[index]={correct:false,picked:null};document.querySelectorAll('[data-n]').forEach(x=>x.disabled=true)}document.getElementById('feedback').innerHTML='<div class="feedback">⏱ Tiempo agotado</div>'}},1000);
  else document.getElementById('clock').textContent='CONSULTA';
}
function choose(picked){
  if(answered||mode!=='individual')return;
  answered=true;stopTimer();
  const q=QUESTIONS[index];answers[index]={correct:picked===q.a,picked};
  document.querySelectorAll('[data-n]').forEach(b=>{b.disabled=true});
  document.getElementById('status').textContent='Respuesta registrada';
}
function showAnswer(){
  const q=QUESTIONS[index];
  document.getElementById('answerTitle').textContent=`${'ABCD'[q.a]}. ${q.o[q.a]}`;
  const d=q.r===1?DIDACTIC[index-10]:null;
  document.getElementById('answerText').innerHTML=`<h3>¿Por qué es correcta?</h3><div class="reason">${esc(d?d[0]:q.e)}</div><h3>Aplicación práctica</h3><div class="reason">${esc(d?d[1]:'Esta lógica permite comprender cómo se ejecuta el algoritmo y prever su resultado antes de probarlo en PSeInt.')}</div>`;
  modal.hidden=false;document.body.classList.add('modalopen');document.getElementById('closeAnswer').focus();
}
function results(){
  stopTimer();closeModal();hud.textContent='DESAFÍO COMPLETADO';
  const hit=answers.filter(x=>x&&x.correct).length;
  el.innerHTML=`<div class="center"><div class="eyebrow">Concurso finalizado</div><div class="introicon">🏆</div><h2>¡CODE ARENA FINALIZADA!</h2>${mode==='individual'?`<p class="lead">${hit} aciertos de ${TOTAL} preguntas.</p>`:''}<div class="startrow"><button class="btn" id="again">↻ VOLVER AL INICIO</button></div></div>`;
  document.getElementById('again').onclick=home;
}
reset.onclick=()=>{if(confirm('¿Reiniciar el concurso desde el principio?'))home()};
home();
</script>
</body>
</html>
