<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Automatizar · Diapositivas interactivas</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>

:root{--ink:#152039;--hud:#0f1830;--y:#ffc83d;--y2:#f0a800;--teal:#14b39a;--coral:#ff6b57;--ok:#1f9d55;--ok-soft:#e3f6ea;--bad:#d9472f;--bad-soft:#fff0ea;--muted:#5a6683;--line:#dfe4ef;--g:#1a73e8}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Rubik,system-ui,Arial,sans-serif;color:var(--ink);background:var(--hud);font-size:16px;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
code{font-family:ui-monospace,Consolas,monospace}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column}

/* HUD */
.hud{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--hud);color:#fff;border-bottom:3px solid #000}
.hb{display:flex;align-items:center;gap:8px;background:#1d2a4d;border:2px solid #31406b;border-radius:12px;padding:6px 12px;color:#fff;font-weight:600;font-size:14px;white-space:nowrap}
.hb:hover{background:#26365f}
.hb svg{width:20px;height:20px;flex:0 0 auto}
.hb.ic{padding:6px 8px}
.hinfo{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.hinfo b{font-weight:800;font-size:16px;letter-spacing:.01em;white-space:nowrap}
.hinfo small{color:#9fb0d8;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpw{margin-left:auto;display:flex;align-items:center;gap:10px}
.xpbar{width:180px;height:14px;background:#22305a;border:2px solid #000;border-radius:99px;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--y));transition:width .7s}
.xp{position:relative;font-weight:800;color:var(--y);font-size:15px;white-space:nowrap}
.xpf{position:absolute;right:0;top:-16px;color:var(--y);font-weight:800;animation:xpf 1s forwards;pointer-events:none}
@keyframes xpf{to{transform:translateY(-26px);opacity:0}}
.chatb{padding:3px 12px 3px 3px;background:var(--y);border-color:#000;color:var(--ink)}
.chatb:hover{background:#ffd666}
.chatb svg{width:32px;height:32px}

main{flex:1;min-height:0;position:relative;overflow:hidden}
.foot{flex:0 0 auto;text-align:center;font-size:13px;color:#9fb0d8;background:var(--hud);padding:6px 12px;border-top:3px solid #000}
.foot b{color:var(--y)}

/* Escenarios */
.sky1{background:linear-gradient(180deg,#7cc8f7 0%,#bfe6ff 55%,#e6f7ec 100%)}
.sky2{background:linear-gradient(180deg,#ff9f68 0%,#ff7f7a 40%,#8a63c9 100%)}
.sky3{background:linear-gradient(180deg,#0a1130 0%,#1a2759 60%,#2a3d78 100%)}
.scene{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.scene svg{width:100%;height:100%;display:block}
.cloud{animation:drift 40s linear infinite}
.cloud.b{animation-duration:65s}
@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(1300px)}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}

/* Mapa */
.mapv{overflow-y:auto;height:100%}
.zone{position:relative;padding:34px 16px 120px;min-height:480px}
.zin{position:relative;max-width:760px;margin:auto}
.mhero{display:flex;gap:20px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:18px 22px;margin-bottom:34px}
.mhero .av{width:104px;height:104px;flex:0 0 auto}
.mhero h1{margin:0;font-size:clamp(28px,4.5vw,40px);line-height:1.05;font-weight:800;letter-spacing:-.01em}
.mhero p{margin:6px 0 12px;color:var(--muted);font-size:15.5px}
.mhero .row2{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ztitle{display:inline-flex;flex-direction:column;background:var(--ink);color:#fff;border-radius:14px;padding:8px 16px;border:3px solid #000;box-shadow:0 4px 0 #000;margin-bottom:22px}
.ztitle b{font-size:18px;font-weight:800;color:var(--y);letter-spacing:.04em;text-transform:uppercase}
.ztitle small{color:#c7d2ee;font-size:13px}
.path{display:flex;flex-direction:column;align-items:center;gap:6px}
.node{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;transform:translateX(var(--x));position:relative}
.nb{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:800;background:#fff;color:var(--ink);border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);transition:transform .15s}
.node:hover:not(:disabled) .nb{transform:translateY(-3px)}
.node.done .nb{background:var(--teal);color:#fff}
.node.cur .nb{background:var(--y);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 var(--ink),0 0 0 0 rgba(255,200,61,.7)}50%{box-shadow:0 6px 0 var(--ink),0 0 0 14px rgba(255,200,61,0)}}
.node:disabled{cursor:not-allowed}
.node:disabled .nb{background:#cfd6e6;color:#8590ab;border-color:#55617f;box-shadow:0 6px 0 #55617f}
.nl{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:2px 10px;font-weight:700;font-size:14px;margin-top:6px}
.node:disabled .nl{opacity:.75}
.ns{color:#ffb800;font-size:14px;letter-spacing:2px;height:18px;text-shadow:0 1px 0 #00000040}
.dots3{display:flex;flex-direction:column;gap:6px;align-items:center;padding:4px 0}
.dots3 i{width:8px;height:8px;border-radius:50%;background:#ffffffcc;border:2px solid var(--ink)}
.sky3 .dots3 i{background:#ffffff55}
.trophy .nb{width:86px;height:86px;font-size:34px;background:#fff6d6}
.resetl{display:block;margin:26px auto 0;background:none;border:0;color:#c7d2ee;text-decoration:underline;font-size:14px}

/* Botones tipo juego */
.gbtn{background:var(--y);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);font-weight:800;font-size:15.5px;padding:9px 18px;transition:transform .08s,box-shadow .08s;white-space:nowrap}
.gbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.gbtn.w{background:#fff}
.gbtn.t{background:var(--teal);color:#fff}
.lbtn{background:none;border:0;padding:6px 4px;color:var(--muted);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}

/* Etapa */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 410px}
.simarea{position:relative;overflow:auto;padding:24px;display:flex;min-height:0}
.device{margin:auto;width:100%;min-width:0;max-width:860px;background:#1b2440;border:3px solid #000;border-radius:24px;padding:10px;box-shadow:0 22px 50px rgba(5,10,30,.35)}
.simwrap{min-width:0;position:relative;overflow:hidden;border-radius:14px;background:#fff}
.spot{position:absolute;border-radius:12px;pointer-events:none;opacity:0;box-shadow:0 0 0 4px var(--y),0 0 0 9999px rgba(8,14,34,.55);transition:left .45s,top .45s,width .45s,height .45s,opacity .3s;z-index:5}
.spot.on{opacity:1}
.ptr{position:absolute;width:34px;height:40px;z-index:6;pointer-events:none;opacity:0;transition:left .45s,top .45s,opacity .3s}
.ptr.on{opacity:1}
.ptr svg{width:100%;height:100%;animation:tap 1s ease-in-out infinite;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
@keyframes tap{50%{transform:translate(-7px,-7px)}}
.card{position:absolute;inset:0;z-index:7;background:#fff;padding:22px 24px;overflow:auto;animation:cardin .35s}
@keyframes cardin{from{transform:translateY(16px);opacity:0}}
.card h3{margin:0 0 4px;font-size:20px;font-weight:800}
.card .sub{margin:0 0 14px;color:var(--muted);font-size:14px}
.card table{border-collapse:collapse;width:100%;font-size:14px}
.card th,.card td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.card th{background:#f2f5fb;font-weight:700;font-size:13px;color:var(--muted)}
.card td:first-child{font-weight:700;min-width:96px}
.card code{background:#f1effd;color:#3c2fb8;padding:1px 6px;border-radius:5px;font-size:13px}

.comp{position:relative;overflow-y:auto;padding:20px 20px 22px 4px;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;min-height:0}
.portrait{width:128px;height:128px;align-self:flex-start;margin-left:14px;margin-bottom:-26px;position:relative;z-index:2;flex:0 0 auto}
.portrait svg{width:100%;height:100%;border-radius:50%;border:4px solid var(--ink);background:#fff;box-shadow:0 5px 0 var(--ink)}
.portrait.hop{animation:hop .5s}
.portrait.no{animation:no .4s}
@keyframes hop{40%{transform:translateY(-14px)}}
@keyframes no{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.dlg{position:relative;background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:26px 20px 16px;flex:0 0 auto}
.tag{position:absolute;top:-17px;right:16px;display:flex;align-items:center;gap:6px;background:var(--y);border:3px solid var(--ink);border-radius:12px;padding:2px 12px;font-weight:800;font-size:14px}
.tag svg{display:none;width:24px;height:24px;margin-left:-6px}
.say{margin:0;font-size:17px;line-height:1.55;min-height:3.1em}
.qq{margin:0;font-size:17px;font-weight:700;line-height:1.45}
.ctrl{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.ctrl .sp{flex:1}
.dots{display:flex;gap:5px;flex-basis:100%;margin-bottom:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:#d5dbea}
.dots i.on{background:var(--ink);width:20px;border-radius:99px}
.spk{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:#fff;display:grid;place-items:center;padding:0}
.spk svg{width:20px;height:20px}
.spk.on{background:var(--y);border-color:var(--ink)}
.fb{font-size:15.5px;line-height:1.5;border-radius:12px;margin-top:10px}
.fb:empty{display:none}
.fb{padding:10px 12px}
.fb.good{background:var(--ok-soft);color:#16653a}
.fb.bad{background:var(--bad-soft);color:#9c2e1a}
.fb.tip{background:#fff6d8;color:#6e5100}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:#fff;border:3px solid #cfd6e6;border-radius:14px;box-shadow:0 3px 0 #cfd6e6;padding:11px 14px;font-weight:600;font-size:15.5px;transition:border-color .12s,transform .08s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:active:not(:disabled){transform:translateY(2px)}
.opt:disabled{cursor:default}
.opt.code{font-family:ui-monospace,Consolas,monospace;font-size:13.5px;font-weight:500;word-break:break-word}
.opt.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 3px 0 var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad);opacity:.85}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.rel{display:grid;grid-template-columns:1fr auto 1.2fr;gap:14px;align-items:center;padding:22px 20px;background:#f6f8fc;font-size:13px}
.rt{background:#fff;border:2px solid #dfe4ef;border-radius:12px;padding:10px 12px;overflow-x:auto}
.rt h5{margin:0 0 6px;font-size:15px}
.rt h5 small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.rt table{border-collapse:collapse;width:100%}
.rt th,.rt td{padding:6px 6px;border-bottom:1px solid #eef1f6;text-align:left;white-space:nowrap}
.rt th{font-size:11px;color:var(--muted);font-weight:600}
.rt th em{font-style:normal;background:#152039;color:#fff;border-radius:4px;padding:0 4px;font-size:10px}
.rchip{display:inline-block;color:#fff;font-weight:700;border-radius:6px;padding:2px 7px;font-size:12px}
.rchip.glow{animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 5px rgba(124,108,255,.35);transform:scale(1.08)}}
.rmid{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;padding:6px}
.rmid svg{width:56px;height:20px}
.rmid b{background:var(--y);border:2px solid var(--ink);border-radius:8px;padding:0 8px}
.card .rule{margin:14px 0 0;background:#fff6d8;border-radius:10px;padding:10px 12px;font-size:14px}
.dd{border:1.5px solid #1a73e8;border-radius:6px;margin-top:3px;overflow:hidden}
.dd div{padding:4px 6px;border-bottom:1px solid #eee;font-size:10.5px}
.dd div:first-child{background:#e8f0fe;font-weight:700}
.hunt .rt tr[data-hot]:hover td{background:#fff4cc;cursor:pointer}
@media (max-width:640px){.rel{grid-template-columns:1fr;padding:12px}.rmid{flex-direction:row;justify-content:center}.rmid svg{transform:rotate(90deg);width:40px}}
.ph-body{position:relative}
.plus{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:50%;background:#1a73e8;color:#fff;display:grid;place-items:center;font-size:20px;font-weight:700;box-shadow:0 3px 8px rgba(0,0,0,.25);z-index:2}
.flow{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px;padding:20px;background:#f6f8fc}
.fcol{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px;border-radius:14px}
.fname{background:var(--ink);color:#fff;font-weight:700;font-size:12px;border-radius:8px;padding:2px 10px}
.flab{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted)}
.flab svg{width:40px;height:16px}
.ebtns{display:flex;gap:4px;border:0!important}
.ebtns span{flex:1;text-align:center;border:1.5px solid #1a73e8;border-radius:6px;padding:4px 2px;color:#1a73e8;font-weight:600;font-size:10px}
.ebtns span.on{background:#1a73e8;color:#fff}
.turnos{display:flex;gap:12px;justify-content:center;margin:4px 0 16px}
.turnos div{display:flex;flex-direction:column;align-items:center;gap:4px}
.tk{background:#fff6d8;border:2px dashed var(--ink);border-radius:8px;padding:8px 14px;font-weight:800;font-size:18px}
.turnos small{color:var(--muted)}
.resta{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:10px 0}
.resta div{display:flex;flex-direction:column;align-items:center;background:#f2f5fb;border-radius:12px;padding:10px 16px}
.resta div.r{background:var(--y);border:2px solid var(--ink)}
.resta b{font-size:28px;font-weight:800}
.resta small{color:var(--muted);font-size:12px}
.resta div.r small{color:var(--ink)}
.resta span{font-size:28px;font-weight:800}
.who{display:block;margin:6px 0 0;color:var(--muted);font-size:15px}
.nm{display:block;margin:6px auto 0 0;font:inherit;font-size:16px;padding:9px 12px;border:3px solid var(--ink);border-radius:12px;width:min(280px,100%)}
.mhero .nm{margin:6px 0 0}
.gbtn:disabled{opacity:.5;cursor:not-allowed}
.ruta,.qrflow{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.ruta div,.qrflow>div{display:flex;flex-direction:column;align-items:center;background:#f2f5fb;border-radius:12px;padding:10px 12px;text-align:center;gap:2px}
.ruta div.r{background:var(--y);border:2px solid var(--ink)}
.ruta small,.qrflow small{color:var(--muted);font-size:11.5px}
.ruta b{font-size:18px}
.ruta i,.qrflow i{font-style:normal;font-size:24px;font-weight:800}
.qrflow span{font-size:12.5px}
.qr{width:96px;height:96px;margin:4px 0}
code.c1{background:#e3f6ea!important;color:#16653a!important}
code.c2{background:#e8f0fe!important;color:#1967d2!important}
code.c3{background:#fff0ea!important;color:#c2410c!important}
code.c4{background:#f1effd!important;color:#5b3fd1!important}
code.c5{background:#fde8e4!important;color:#c5221f!important}
.ifd{display:flex;flex-direction:column;align-items:center;margin:6px 0 16px}
.ifd .q{background:var(--y);border:3px solid var(--ink);border-radius:14px;padding:10px 16px;font-weight:800;text-align:center;position:relative}
.ifd .br{display:flex;gap:40px;margin-top:22px;position:relative}
.ifd .br:before{content:"";position:absolute;top:-22px;left:25%;right:25%;height:18px;border:3px solid var(--ink);border-bottom:0;border-radius:10px 10px 0 0}
.ifd .br div{display:flex;flex-direction:column;align-items:center;border-radius:12px;padding:8px 18px;border:3px solid}
.ifd .si{background:#fde8e4;border-color:#c5221f!important;color:#c5221f}
.ifd .no{background:#e3f6ea;border-color:#16653a!important;color:#16653a}
.ifd small{font-weight:800}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.ctrls>div{display:flex;flex-direction:column;align-items:center;gap:8px;background:#f2f5fb;border-radius:12px;padding:12px;text-align:center}
.ctrls span{font-size:13px;color:var(--muted)}
.clk{width:64px;height:64px}
.cal2{display:grid;grid-template-columns:repeat(7,18px);gap:3px}
.cal2 i{font-style:normal;font-size:10px;background:#fff;border-radius:4px;padding:2px 0}
.cal2 i.on{background:#1a73e8;color:#fff;font-weight:700}
.kp{display:grid;grid-template-columns:repeat(5,22px);gap:3px}
.kp i{font-style:normal;font-size:12px;background:#fff;border:1px solid #dadce0;border-radius:4px;padding:2px 0;font-weight:700}
.ebtns.big span{font-size:12px;padding:6px 8px}
.two{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.mt{background:#f6f8fc;border-radius:12px;padding:8px 10px}
.mt table{font-size:12.5px}
.mt td,.mt th{padding:5px 8px!important;white-space:nowrap}
.mt tr.hl td{background:#fff6d8}
.tn{display:inline-block;border-radius:6px;padding:2px 8px;font-size:13px;margin-bottom:4px}
.tn.lg{background:#e3f6ea;color:#16653a}.tn.ss{background:#e8f0fe;color:#1967d2}
.st{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;font-size:10px;font-weight:800;margin-right:5px}
.arr{font-style:normal;font-size:26px;font-weight:800}
.pasos{margin:12px 0 0;padding-left:22px;font-size:14px}
.pasos li{margin:3px 0}
code.lg{background:#e3f6ea!important;color:#16653a!important}
code.ss{background:#e8f0fe!important;color:#1967d2!important}
code.op{background:#fff0ea!important;color:#c2410c!important}
code.fn{background:#f1effd!important;color:#5b3fd1!important}
code.tx{background:#fde8e4!important;color:#c5221f!important}
.ley{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;margin:-4px 0 10px;color:var(--muted)}
.sw{display:inline-block;width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #dadce0}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vs>div{border-radius:12px;padding:12px 14px;font-size:14px}
.vs ul{margin:8px 0 0;padding-left:18px}.vs li{margin:4px 0}
.malo{background:#fde8e4;color:#7a1d10}.bueno{background:#e3f6ea;color:#14532d}
.fecha{display:inline-block;margin-top:10px!important;background:#fff6d8;border:2px solid var(--ink);border-radius:10px;padding:4px 12px;font-weight:700;color:var(--ink)!important}
.chk{text-align:left;max-width:560px;margin:4px auto 20px;border:2px solid var(--ink);border-radius:14px;padding:4px 14px}
.chk summary{cursor:pointer;font-weight:800;padding:8px 0}
.chk label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:15px;cursor:pointer}
.chk input{width:18px;height:18px;margin-top:2px;accent-color:var(--teal)}
@media (max-width:640px){.vs{grid-template-columns:1fr}}
.ed-bar{gap:6px!important}
.aslogo{width:20px;height:20px;display:block}
.ed-app{font-size:14px;color:#202124!important}
.tb{width:26px;height:26px;display:grid;place-items:center;color:#5f6368;border-radius:50%}
.tb svg{width:17px;height:17px}.tb.ok{color:#188038}
.ed-btn.pri{font-weight:700;letter-spacing:.03em}
.pvt{display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:8px;color:#5f6368;font-size:11px}
.pvd{display:flex;gap:4px}.pvd svg{width:16px;height:16px}
.pve{display:flex;align-items:center;gap:4px}
.pva{width:100%;margin-top:8px;font-size:10.5px;color:#5f6368}
.pva div{display:flex;gap:4px;margin-top:3px}
.pva span{flex:1;background:#fff;border:1px solid #dadce0;border-radius:6px;padding:4px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

const LEVELS=[{"title":"De lo manual a lo automático","block":0,"type":"choose","industry":"Vida cotidiana","icon":"✉️","intro":"Automatizar es hacer que un sistema ejecute una tarea siguiendo instrucciones establecidas, sin repetirla manualmente cada vez.","question":"Una academia envía la misma confirmación a 40 inscritos. ¿Qué sería automatizar?","opts":["Que un empleado prepare una lista y envíe los mensajes al terminar el día","Que cada inscripción validada active el envío de su confirmación","Que se envíe una única confirmación general al cerrar las inscripciones"],"correct":1,"feedback":"La inscripción inicia el envío. La persona configura el proceso una vez; el sistema lo ejecuta cuando corresponde.","steps":[["✍️","Antes","40 correos uno por uno"],["⚡","Cambio","Una regla clara"],["📩","Después","Aviso automático"]]},{"title":"Tarea, proceso y resultado","block":0,"type":"order","industry":"Panadería","icon":"🥐","intro":"Una tarea es una acción. Un proceso reúne varias tareas en orden para obtener un resultado.","question":"Ordena cómo una panadería prepara un pedido.","items":["Entregar el pedido","Recibir la solicitud","Preparar los productos","Confirmar disponibilidad"],"order":[1,3,2,0],"feedback":"Primero llega el pedido, luego se comprueba, se prepara y finalmente se entrega. El orden evita errores."},{"title":"¿Cuándo vale la pena?","block":0,"type":"choose","industry":"Supermercado","icon":"🛒","intro":"Conviene automatizar una tarea cuando tiene reglas claras, se repite y el beneficio compensa el esfuerzo.","question":"¿Cuál de estas tareas conviene automatizar primero?","opts":["Revisar automáticamente existencias y alertar al llegar al umbral","Decidir de forma automática cómo resolver cada reclamación compleja","Idear una campaña publicitaria nueva a partir de las ventas"],"correct":0,"feedback":"El control de existencias tiene datos y reglas claras. Las situaciones delicadas o creativas necesitan evaluación humana.","steps":[["📦","Dato","Quedan 3 k":1,"type":"choose","industry":"Universidad","icon":"🎓","intro":"Una automatización puede repetir una misma acción para varios registros. En PSeInt conociste esta idea con los ciclos.","question":"Hay 25 estudiantes aprobados. ¿Cómo evitar enviar 25 certificados manualmente?","opts":["Generar el certificado de cada estudiante después de validar sus datos y aprobación","Crear un archivo general con todos los certificados, sin verificar las notas","Enviar cada certificado al estudiante cuando termine el semestre, sin consultar su resultado"],"correct":0,"feedback":"Se repite la acción para cada estudiante que cumple la condición. Primero se verifica; después se envía.","steps":[["📊","Datos","25 estudiantes"],["🔁","Repetir","Revisar cada nota"],["📜","Resultado","Enviar al aprobado"]]},{"title":"¿Y si algo falla?","block":1,"type":"choose","industry":"Restaurante","icon":"🍽️","intro":"Antes de automatizar, debemos prever datos incompletos, errores, permisos y situaciones que requieren a una persona.","question":"Un cliente pide domicilio, pero no escribió dirección. ¿Qué debería hacer el sistema?","opts":["Registrar la salida del pedido y solicitar al repartidor que averigüe la dirección","Detener el despacho y pedir al cliente que complete la dirección","Asignar la dirección del último pedido del mismo cliente sin confirmación"],"correct":1,"feedback":"Una automatización responsable valida datos. Si falta algo indispensable, solicita corrección antes de continuar.","steps":[["🛍️","Pedido","Solicitud recibida"],["❓","Validación","¿Hay dirección?"],["🛑","Si falta","Pedir dato; no enviar"]]},{"title":"Automatiza una empresa","block":2,"type":"choose","industry":"Hospital","icon":"🏥","intro":"En salud pueden automatizarse tareas administrativas como recordatorios y clasificación de solicitudes, con protección de datos.","question":"¿Cuál automatización es adecuada para un hospital?","opts":["Enviar recordatorios al verificar fecha, autorización y contacto","Confirmar cita let structStep=0;
function structSvg(type,step){
 const common=`<defs><marker id="sarr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1a7477"/></marker></defs>`;
 const path=(d)=>`<path d="${d}" stroke="#1a7477" stroke-width="2.4" fill="none" marker-end="url(#sarr)"/>`;
 const rect=(x,y,w,h,text,on,fill='#e9f8f5')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${fill}" stroke="#152039" stroke-width="2" ${on?'class="structureNodeActive"':''}/><text x="${x+w/2}" y="${y+h/2+5}" text-anchor="middle" font-size="15" font-weight="700" fill="#152039">${text}</text>`;
 const diamond=(cx,cy,w,h,label,on)=>`<polygon points="${cx},${cy-h/2} ${cx+w/2},${cy} ${cx},${cy+h/2} ${cx-w/2},${cy}" stroke="#152039" stroke-width="2.5" fill="#fff4dc" ${on?'class="structureNodeActive"':''}/><text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="15" font-weight="700" fill="#152039">${label}</text>`;
 let inner='';
 if(type==='secuencia'){

  inner+=path('M310 199 V220');inner+=rect(245,222,130,36,'Fin',step===3,'#fff1cd');
 }else if(type==='si'){
  inner+=rect(180,5,260,40,'Leer unidades',step===0);inner+=path('M310 45 V72');

 }else if(type==='mientras'){

  inner+=rect(478,238,124,35,'Fin',step===3,'#fff1cd');
 }else if(type==='para'){
  inner+=rect(185,8,250,40,'i empieza en 1',step===0);inner+=path('M310 48 V67');
  inner+=diamond(310,116,248,90,'¿i ≤ 4?',step===1||step===3);
  inner+=path('M310 161 V177');inner+=`<text x="321" y="175" font-size="14" font-weight="800">Sí</text>`;

  inner+=rect(477,230,125,36,'Fin',step===3,'#fff1cd');
 }else{
  inner+=rect(174,10,272,44,'Pedir y leer cupos',step===0||step===1||step===2);inner+=path('M310 54 V79');
  inner+=diamond(310,132,260,100,'¿Cupos > 0?',step===3);

  inner+=path('M440 132 H523 V223');inner+=`<text x="461" y="121" font-size="14" font-weight="800">Sí</text>`;

 }
 return `<svg viewBox="0 0 620 290" role="img" aria-label="Diagrama de flujo de ${STRUCTURES[type].name}: se destacan los pasos de uno en uno" xmlns="http://www.w3.org/2000/svg">${common}<g font-family="Rubik,Arial,sans-serif">${inner}</g></svg>`;
}
function renderStructure(item){
 const root=$('#root');
 if(item.kind==='structureIntro'){
 root.innerHTML=`<section class="slide"><div class="conceptSlide"><div class="deck-eyebrow">Representación de una automatización</div><h1>Tres formas de organizar las instrucciones</h1><p class="desc">Después de elegir una tarea, decidimos cómo debe pensar el sistema. Estas tres ideas también aparecen en PSeInt.</p><div class="structGrid"><div class="structTile"><span class="emoji">➡️</span><b>1. Secuencia</b><p>Primero una acción, después otra.</p><p><b>Ejemplo:</b> recibir → preparar → entregar.</p></div><div class="structTile"><span class="emoji">🔀</span><b>2. Decisión</b><p>Preguntar algo para elegir entre dos caminos.</p><p><b>Ejemplo:</b> ¿quedan pocas unidades?</p></div><div class="structTile"><span class="emoji">🔄</span><b>3. Repetición</b><p>Hacer una acción varias veces, con una regla para detenerse.</p><p><b>Ejemplo:</b> revisar todos los pedidos.</p></div></div><div class="microNote">Veremos la <b>secuencia</b>, <b>Si–SiNo</b> y tres formas de repetir: <b>Mientras</b>, <b>Para</b> y <b>Repetir–Hasta Que</b>. La diferencia clave: <b>Mientras pregunta antes</b>; <b>Repetir pregunta después</b>; <b>Para cuenta las vueltas</b>. En cada pantalla puedes avanzar por los pasos.</div></div></section>`;
 $('#context').textContent='Estructuras de control';return;
 }
 if(item.kind==='structureSummary'){
 root.innerHTML=`<section class="slide"><div class="conceptSlide"><div class="deck-eyebrow">Elegir la estructura adecuada</div><h1>¿Qué estructura necesito?</h1><div class="structGrid"><div class="structTile"><span class="emoji">➡️</span><b>Secuencia</b><p>¿Solo necesito realizar pasos en orden?</p></div><div class="structTile"><span class="emoji">🔀</span><b>Si–SiNo</b><p>¿Hay una pregunta que cambia el camino?</p></div><div class="structTile"><span class="emoji">🔄</span><b>Mientras</b><p>¿Debo repetir mientras siga pendiente algo?</p></div><div class="structTile"><span class="emoji">🔢</span><b>Para</b><p>¿Ya sé cuántas veces debo repetir?</p></div><div class="structTile"><span class="emoji">🔁</span><b>Repetir–Hasta Que</b><p>¿Debo intentarlo por lo menos una vez y comprobar después?</p></div><div class="structTile"><span class="emoji">🧩</span><b>En una automatización</b><p>Pueden mezclarse: recibir datos → decidir → revisar elementos → enviar aviso.</p></div></div><div class="microNote"><b>Importante:</b> los ciclos necesitan una forma de terminar. Si la condición nunca cambia, el proceso podría repetirse indefinidamente.</div></div></section>`;
 $('#context').textContent='Resumen de estructuras';return;
 }
 const d=STRUCTURES[item.type];structStep=0;$('#context').textContent=d.name;
 root.innerHTML=`<section class="slide"><div class="shead"><span class="icon">${d.icon}</span><div class="txt"><div class="eyebrow">Estructuras de control · ${d.sector}</div><h1>${d.name}: ${d.subtitle}</h1></div></div><div class="structureBody"><div class="structureDisplay"><div class="structureTop"><h2>Qué sucede en el proceso</h2><span class="tag">${d.sector}</span></div><p class="structureSituation">${d.situation}</p><div class="structureSplit"><div><div class="structureDiagram" id="structureDiagram">${structSvg(item.type,0)}</div><p class="structureLegend">Las flechas muestran hacia dónde sigue el proceso.</p></div><div><p style="font-weight:800;margin:0 0 7px">Así se representa en PSeInt</p><pre id="structureCode" class="structureCode"></pre></div></div><div class="structureExample"><b>Observa:</b> ${d.example}</div></div><aside class="structurePanel"><div class="conceptTeacher"><div class="portrait">${avatar()}</div><strong>Fundamento</strong></div><p>${d.definition}</p><h3>Vamos paso a paso</h3><div class="stepCount" id="strCount">Paso 1 de ${d.steps.length}</div><div class="stepMessage" id="strMessage" aria-live="polite"></div><div class="structureActions"><button id="strRestart" type="button">↺ Reiniciar</button><button class="primary" id="strNext" type="button">Siguiente paso →</button></div><p class="structureHint">El color verde señala la acción o condición que estamos explicando.</p></aside></div></section>`;
 $('#strNext').onclick=()=>{if(structStep<d.steps.length-1)structStep++;updateStructure(item.type)};
 $('#strRestart').onclick=()=>{structStep=0;updateStructure(item.type)};
 updateStructure(item.type);
}
function updateStructure(type){
 const d=STRUCTURES[type];$('#strCount').textContent=`Paso ${structStep+1} de ${d.steps.length}`;$('#strMessage').textContent=d.steps[structStep];$('#structureDiagram').innerHTML=structSvg(type,structStep);
 const hi=d.highlight[structStep];$('#structureCode').innerHTML=d.code.map((line,i)=>`<span ${i===hi?'class="codeHi"':''}>${esc(line)}</span>`).join('\n');
 $('#strNext').disabled=structStep===d.steps.length-1;
}

  } else if(item.kind==='pseint'){

FinAlgoritmo</pre><div class="microNote"><b>¿Qué hace?</b> Lee un valor, evalúa la condición y muestra el resultado. Aquí <b>simula</b> el aviso, no lo envía a un celular.</div></div><div class="conceptBox"><div class="conceptTeacher"><div class="portrait">${avatar()}</div><strong>Fundamento</strong></div><h2>Prueba la lógica</h2><p>Con <b>3 unidades</b> se muestra «Enviar aviso». Con <b>9 unidades</b> se muestra «Existencias suficientes».</p><p>El paso siguiente consiste en trasladar esa misma regla a una herramienta capaz de consultar datos y enviar una notificación real.</p><div class="microNote">PSeInt es un entorno para <b>aprender algoritmos</b>, no una plataforma de automatización conectada a servicios.</div></div></div></div></section>`;
  } else if(item.kind==='platform'){
    root.innerHTML=`<section class="slide"><div class="conceptSlide"><div class="deck-eyebrow">Entornos de aprendizaje y automatización</div><h1>De la lógica a una automatización conectada</h1><div class="conceptBox"><div class="compareGrid"><div class="compareCard"><b>🧩 PSeInt</b><p>Representa el algoritmo, prueba condiciones y simula resultados con datos de ejemplo. No necesita conectar servicios.</p></div><div class="compareCard"><b>⚙️ Make o Activepieces</b><p>Permite configurar un <b>desencadenante</b>, usar <b>conectores</b> para leer datos, evaluar <b>condiciones</b> y ejecutar <b>acciones</b> como enviar notificaciones.</p></div></div><div class="flowchart" style="margin-top:22px;max-width:960px;flex-direction:row;justify-content:center;flex-wrap:wrap;gap:10px"><div class="flowNode" style="min-width:130px">Desencadenante</div><span class="flowArrow">→</span><div class="flowNode" style="min-width:100px">Conector y datos</div><span class="flowArrow">→</span><div class="flowNode" style="min-width:100px">Condición</div><span class="flowArrow">→</span><div class="flowNode" style="min-width:100px">Acción / aviso</div></div><p class="desc" style="margin-top:18px"><b>Ejemplo:</b> al actualizarse una hoja de inventario, la herramienta lee unidades; si el valor es 5 o menos, envía una notificación. Los planes gratuitos tienen límites.</p></div></div></section>`;
  }
  $('#context').textContent=item.kind==='flow'?'Diagrama de flujo':item.kind==='elements'?'Partes de la automatización':item.kind==='process'?'Análisis de tareas':item.kind==='pseint'?'PSeInt':'Herramientas y conectores';
}

function render(){let item=slides[idx];$('#pagecounter').textContent=(idx+1)+' / '+slides.length;$('#prev').disabled=idx===0;$('#next').disabled=idx===slides.length-1;$('#next').textContent=idx===slides.length-2?'Finalizar →':'Siguiente →';let root=$('#root');$('#homeBtn').hidden=idx<=1;
if(['structureIntro','structure','structureSummary'].includes(item.kind)){renderStructure(item);return}
if(['elements','process','flow','pseint','platform'].includes(item.kind)){renderConcept(item);return}
if(item.kind==='cover'){root.innerHTML=`<section class="slide"><div class="coverSlide"><div class="coverPortrait portrait">${avatar()}</div><h1>Automatizar</h1></div></section>`;$('#context').textContent='Automatizar';return}
if(item.kind==='index'){const links=[['Fundamentos','Tarea, proceso y automatización','section',0],['Cuándo conviene','Evaluar tareas antes de automatizar','activity',2],['Cómo funciona','Desencadenantes, datos y condiciones','elements',null],['Estructuras de control','Secuencia, Si, Mientras, Para y Repetir','structureIntro',null],['Ejemplos','Procesos en diferentes empresas','process',null],['Herramientas','Opciones visuales con plan gratuito','platform',null]];
root.innerHTML=`<section class="slide"><div class="indexSlide"><div class="indexCard"><h1>Índice</h1><ol class="indexList">${links.map(([title,desc,kind,id],n)=>{let target=slides.findIndex(x=>x.kind===kind&&(id===null|| (kind==='section'?x.block===id:x.level===id)));return `<li><button type="button" class="indexLink" data-go="${target}"><span class="indexNum">${n+1}</span><span><b>${title}</b></span></button></li>`}).join('')}</ol></div></div></section>`;root.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));$('#context').textContent='Índice';return}
if(item.kind==='section'){const b=BLOCKS[item.block];root.innerHTML=`<section class="slide"><div class="sectionSlide"><div class="avatarBig">${avatar()}</div><div class="box"><div class="num">BLOQUE ${item.block+1} DE 3</div><h1>${b.title}</h1></div></div></section>`;$('#context').textContent=b.title;return}
if(item.kind==='end'){root.innerHTML=`<section class="slide"><div class="closeSlide"><div class="closeCard"><div class="portrait">${avatar()}</div><h1>¡Ya conoces las bases para automatizar!</h1><p>Recuerda: primero identificas una tarea, luego descubres qué la activa, qué datos necesita, qué reglas aplica y qué resultado produce.</p><p></p></div></div></section>`;$('#context').textContent='Cierre';return}
const i=item.level,l=LEVELS[i];answered=false;picked=[];order=l.type==='order'?l.items.map((_,j)=>j):[];simStock=8;$('#context').textContent=BLOCKS[l.block].title;
root.innerHTML=`<section class="slide"><div class="shead"><span class="icon">${l.icon}</span><div class="txt"><div class="eyebrow">${BLOCKS[l.block].title} · ${esc(l.industry)} · Actividad ${i+1} de 12</div><h1>${esc(l.title)}</h1></div></div><div class="sbody"><div class="visualpanel" id="visual">${visual(l)}</div><div class="explainpanel"><div class="lesson"><div class="lessonHead"><div class="portrait">${avatar()}</div><strong class="mentorName">Fundamento</strong></div><p class="intro">${esc(l.intro)}</p><p class="question">${esc(l.question)}</p><div id="interactive"></div><div id="feedback" class="fb" style="display:none" aria-live="polite"></div><button type="button" class="checkbtn" id="check">Comprobar respuesta</button></div></div></div></section>`;
mountInteractive();$('#check').onclick=check;
}
function mountInteractive(){const l=LEVELS[slides[idx].level],root=$('#interactive');if(l.type==='order'){root.innerHTML='<div id="orderList" class="order-list"></div>';drawOrder();return}
if(l.type==='classify'){root.innerHTML='<p class="simsub">Selecciona las situaciones que pueden automatizarse con reglas claras.</p>';document.querySelectorAll('[data-cl]').forEach(c=>c.onclick=()=>{if(answered)return;let i=Number(c.dataset.cl);picked.includes(i)?picked=picked.filter(x=>x!==i):picked.push(i);c.classList.toggle('picked',picked.includes(i))});return}
root.innerHTML=`<div class="opts">${l.opts.map((v,j)=>`<button type="button" class="opt" data-answer="${j}">${esc(v)}</button>`).join('')}</div>`;
root.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(answered)return;root.dataset.answer=b.dataset.answer;root.querySelectorAll('[data-answer]').forEach(x=>x.classList.toggle('selected',x===b))});
if(l.type==='simulate'){const range=$('#stockRange'); if(range){range.oninput=e=>{simStock=+e.target.value; $('#stockNum').textContent=simStock; $('#stockValue').textContent=simStock; $('#stockAlert').textContent=simStock<=5?'SÍ':'NO'; $('#stockOutcome').textContent=simStock<=5?'⚠️ Quedan pocas unidades: enviar aviso.':'✅ Existencias suficientes: no enviar aviso.'}}}
}
function drawOrder(){let holder=$('#orderList');if(!holder) return;holder.innerHTML=order.map((j,p)=>`<div class="order-item"><span style="font-weight:800;min-width:20px">${p+1}</span><span style="flex:1">${esc(LEVELS[slides[idx].level].items[j])}</span><button class="order-btn" data-move="${p},-1" ${p===0?'disabled':''}>↑</button><button class="order-btn" data-move="${p},1" ${p===order.length-1?'disabled':''}>↓</button></div>`).join('');holder.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{if(answered)return;let [i,d]=b.dataset.move.split(',').map(Number);[order[i],order[i+d]]=[order[i+d],order[i]];drawOrder()})}
function check(){let l=LEVELS[slides[idx].level],ok=false;if(l.type==='order')ok=order.every((x,i)=>x===l.order[i]);else if(l.type==='classify')ok=picked.length===l.good.length&&l.good.every(x=>picked.includes(x));else{let v=$('#interactive').dataset.answer;if(v===undefined){showFeedback('Elige una respuesta antes de comprobar.',false);return}ok=+v===l.correct}
if(ok){answered=true;showFeedback('✓ '+l.feedback,true);$('#check').textContent='Respuesta comprobada';$('#check').disabled=true;document.querySelectorAll('#interactive button').forEach(x=>x.disabled=true)}else showFeedback('Todavía no. '+(l.type==='order'?'Revisa qué sucede primero y qué después.':l.type==='classify'?'Recuerda cuáles decisiones necesitan supervisión humana.':'Observa el ejemplo y vuelve a intentarlo.'),false)}
function showFeedback(t,ok){let f=$('#feedback');f.style.display='block';f.className='fb '+(ok?'good':'bad');f.textContent=t}
function go(n){if(n<0||n>=slides.length)return;idx=n;render()}
function move(d){go(idx+d)}
$('#homeBtn').onclick=()=>go(1);$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();move(1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();move(-1)}});render();
</script></body></html>
