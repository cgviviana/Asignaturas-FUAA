<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pensamiento Computacional | Informática Educativa</title>
<style>
@font-face{font-family:Brown;src:local("BrownStd-Regular"),url("https://www.areandina.edu.co/assets/font-brown/BrownStd-Regular.woff2") format("woff2");font-display:swap}
@font-face{font-family:Brown;src:local("BrownStd-Bold"),url("https://www.areandina.edu.co/assets/font-brown/BrownStd-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
:root{--verde:#7fb536;--verde-o:#668e2c;--verde-s:#f0f6e5;--gris-o:#414141;--gris-c:#e1e1e1;--fondo:#f5f5f5;--sombra:0 8px 22px rgba(0,0,0,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;font-family:Brown,Arial,sans-serif;color:var(--gris-o);background:var(--fondo)}button{font:inherit}.limit{width:min(1180px,calc(100% - 48px));margin:auto}.topbar{height:30px;background:var(--gris-o)}.topbar .limit{height:100%;display:flex;justify-content:flex-end;align-items:center;color:#fff;font-size:12px}.site-header{background:#fff;border-bottom:1px solid #dedede}.header-inner{min-height:82px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:10px 0}.brand img{display:block;width:180px;height:48px;object-fit:contain;object-position:left}.section-name{margin:0;font-size:18px;font-weight:700;text-align:right}.section-name span{color:var(--verde-o)}.wrap{padding:30px 0 64px}.main-header{background:#fff;border:1px solid var(--gris-c);border-bottom:4px solid var(--verde);padding:22px 26px;margin-bottom:18px;box-shadow:var(--sombra)}.eyebrow{margin:0 0 5px;color:var(--verde-o);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}.main-header h1{margin:0;font-size:30px;line-height:1.1}.intro{max-width:850px;margin:12px 0 0;color:#5d5d5d;line-height:1.55;font-size:15px}.frame{display:grid;grid-template-columns:285px minmax(0,1fr);gap:18px;align-items:start}.tabs,.content{background:#fff;border:1px solid var(--gris-c);box-shadow:var(--sombra)}.tabs{padding-bottom:14px;position:sticky;top:16px}.tabs-title{background:var(--gris-o);color:#fff;padding:15px 18px;font-weight:700}.tab-btn{width:100%;border:0;border-bottom:1px solid #e6e6e6;border-left:5px solid transparent;background:#fff;color:#505050;padding:15px 17px;text-align:left;cursor:pointer;font-size:14px;font-weight:700;line-height:1.35}.tab-btn small{display:block;color:var(--verde-o);font-size:11px;text-transform:uppercase;margin-bottom:3px}.tab-btn:hover{background:#f7f7f7;color:var(--verde-o);border-left-color:#b9d58f}.tab-btn.active{background:var(--verde);color:#fff;border-left-color:var(--verde-o)}.tab-btn.active small{color:#fff}.content{min-height:640px;overflow:hidden}.section{border-bottom:12px solid var(--fondo)}.section:last-of-type{border-bottom:0}.section-head{width:100%;border:0;background:var(--gris-o);color:#fff;padding:18px 22px;border-bottom:4px solid var(--verde);display:flex;align-items:center;justify-content:space-between;gap:18px;cursor:pointer;text-align:left}.section-head:hover{background:#363636}.section-head small{color:#cfe7ad;font-size:13px;font-weight:700;display:block;margin-bottom:3px;text-transform:uppercase}.section-head strong{display:block;font-size:23px;line-height:1.18}.round-plus{flex:0 0 36px;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:#fff;color:var(--verde-o);font-size:23px;font-weight:700;transition:.2s}.round-plus.small{width:30px;height:30px;flex-basis:30px;font-size:18px;border:1px solid #cfcfcf}.section.open>.section-head .round-plus,.acc-item.open .round-plus{transform:rotate(45deg)}.section-body{display:none;padding:22px}.section.open>.section-body{display:block}.lead{border-left:5px solid var(--verde);background:var(--verde-s);padding:14px 16px;margin-bottom:18px;line-height:1.55}.accordion{display:grid;gap:12px}.acc-item{border:1px solid #dcdcdc;overflow:hidden}.acc-item.milestone{border-color:#c7d9aa}.acc-btn{width:100%;border:0;background:#f4f4f4;color:var(--gris-o);padding:14px 16px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:14px;cursor:pointer;font-size:15px;font-weight:700;line-height:1.35;border-left:5px solid var(--verde)}.acc-btn:hover{background:#ebebeb;color:var(--verde-o)}.acc-item.open .acc-btn{background:var(--verde);color:#fff}.acc-item.milestone .acc-btn{border-left-color:var(--gris-o)}.topic-code{display:inline-block;margin-right:8px;color:var(--verde-o)}.acc-item.open .topic-code{color:#fff}.topic-meta{display:flex;align-items:center;gap:12px;flex-shrink:0}.topic-meta time{font-size:12px;color:#707070}.acc-item.open time{color:#fff}.acc-content{display:none;padding:17px 20px 19px 24px;line-height:1.58;color:#555}.acc-item.open .acc-content{display:block}.acc-content p{margin:0}.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.tag{padding:6px 10px;border:1px solid #c9dca8;background:#f7faef;color:var(--verde-o);font-size:13px;font-weight:700}.tag-link{text-decoration:none;cursor:pointer}.tag-link:hover{background:var(--verde);border-color:var(--verde);color:#fff}.resource{margin-top:16px}.resource-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:8px 15px;border:1px solid var(--verde);border-radius:4px;background:var(--verde);color:#fff;text-decoration:none;font-size:13px;font-weight:700}.resource-btn:hover{background:var(--verde-o);border-color:var(--verde-o)}.resource-btn.pending{background:#efefef;border-color:#d0d0d0;color:#777;cursor:pointer}footer{margin-top:18px;background:var(--gris-o);color:#fff;padding:15px 20px;text-align:center;font-size:13px}footer strong{color:#cfe7ad}button:focus-visible,a:focus-visible{outline:3px solid #242424;outline-offset:3px}
@media(max-width:900px){.frame{grid-template-columns:1fr}.tabs{position:static}.main-header h1{font-size:26px}}@media(max-width:700px){.limit{width:calc(100% - 30px)}.brand img{width:145px}.section-name{font-size:15px}.main-header{padding:18px}.section-head strong{font-size:20px}.section-body{padding:15px}.topic-meta time{display:none}}@media(max-width:480px){.section-name{display:none}.main-header h1{font-size:24px}.section-head strong{font-size:18px}}
</style>
</head>
<body>
<div class="topbar"><div class="limit">Facultad de Ingeniería y Ciencias Básicas</div></div>
<header class="site-header"><div class="limit header-inner"><a class="brand" href="#inicio" aria-label="Ir al inicio"><img src="https://cms.areandina.edu.co/sites/default/files/styles/max_650x650_webp/public/2023-03/AREANDINA%20%281%29.png.webp?itok=r5N1M-5x" alt="Areandina"></a><p class="section-name">Pensamiento Computacional / <span>Informática Educativa</span></p></div></header>
<div class="limit wrap" id="inicio">
<header class="main-header"><p class="eyebrow">Contenido de aprendizaje</p><h1>Pensamiento Computacional</h1></header>
<div class="frame"><aside class="tabs" aria-label="Unidades del curso"><div class="tabs-title">Período Acádemico</div><div id="menu"></div></aside><main class="content" id="contenido"></main></div>
</div>
<script>
const unidades=[
{numero:'Unidad 1',titulo:'Inteligencia colectiva y pensamiento computacional',resumen:'Reconocimiento del curso, las tecnologías emergentes y las bases del pensamiento computacional para analizar una situación susceptible de automatización.',temas:[
['1.1','Presentación de la asignatura y normativa','14/08/2026','Exploración del propósito de la asignatura, sus resultados de aprendizaje, metodología, acuerdos de trabajo y criterios generales de evaluación.',['Propósito del curso','Ruta de aprendizaje','Acuerdos y evaluación']],
['1.2','Tecnologías emergentes y automatización de procesos','21/08/2026','Introducción a tecnologías como inteligencia artificial, internet de las cosas, realidad aumentada, ciencia de datos y robótica, y a su relación con la automatización de tareas y procesos.',[
['Tecnologías emergentes','https://cgviviana.github.io/Asignaturas-FUAA/PtoComp/2026/index.html#referencias'],
['Automatización','https://cgviviana.github.io/Asignaturas-FUAA/PtoComp/2026/Sesiones/TecnAutom/Auto/'],
['Ejemplo','https://cgviviana.github.io/Asignaturas-FUAA/PtoComp/2026/Sesiones/TecnAutom/CiuInt/']
],'https://docs.google.com/document/d/1pZd_Fxug_zlIsQcdelenN-UfpgT7mTVu/edit?usp=drivesdk&ouid=109469599526912264889&rtpof=true&sd=true'],
['1.3','Pilares del pensamiento computacional','28/08/2026',
'Acercamiento a la descomposición, el reconocimiento de patrones, la abstracción y el diseño de algoritmos como estrategias para resolver problemas.',
[
['Pilares','https://cgviviana.github.io/Asignaturas-FUAA/PtoComp/2026/Sesiones/Pilares/'],
'Descomposición',
'Patrones',
'Abstracción',
'Algoritmos'
]],,
['1.4','Diagnóstico del proceso','04/09/2026',
'Análisis del proceso actual para reconocer causas, efectos, datos y responsables antes de proponer una automatización.',
[
['Explicación','https://cgviviana.github.io/Asignaturas-FUAA/PtoComp/2026/Sesiones/Diagn/index.html'],
['Diagrama de Ishikawa','https://cgviviana.github.io/Asignaturas-FUAA/PtoComp/2026/Sesiones/Diagn/JuegoIshikawa/'],
['Árbol de problemas','https://cgviviana.github.io/Asignaturas-FUAA/PtoComp/2026/Sesiones/Diagn/JuegoArbol/'],
['Diagrama de flujo','https://cgviviana.github.io/Asignaturas-FUAA/PtoComp/2026/Sesiones/Diagn/JuegoAlgo/'],
['Froggy','https://cgviviana.github.io/Asignaturas-FUAA/PtoComp/2026/Sesiones/Diagn/froggy/']
],
'https://docs.google.com/document/d/1tXQX0NsJQoINOo5ItQeCGbu_Rwuc_cUt/edit?usp=drivesdk&ouid=109469599526912264889&rtpof=true&sd=true'],
['1.5','Socialización del proceso seleccionado','11/09/2026','Presentación breve del proceso elegido, su diagnóstico inicial y las razones que justifican su posible automatización.',[],null,true]]},
{numero:'Unidad 2',titulo:'Análisis y representación de algoritmos',resumen:'Construcción progresiva de una solución lógica mediante algoritmos, diagramas de flujo, pseudocódigo y un primer prototipo en PSeInt.',temas:[
['2.1','Conceptos básicos de algoritmos','18/09/2026','Identificación de instrucciones, variables, datos de entrada, operaciones y resultados necesarios para describir una solución paso a paso.',['Instrucciones','Variables','Entradas','Resultados']],
['2.2','Diagramas de flujo y pseudocódigo','25/09/2026','Representación gráfica y textual de un algoritmo para comunicar con claridad su secuencia, decisiones y resultados.',['Símbolos del diagrama','Flujo lógico','Pseudocódigo']],
['2.3','Estructuras secuenciales, condicionales y cíclicas','02/10/2026','Uso de estructuras de control para ejecutar instrucciones en orden, tomar decisiones y repetir acciones cuando sea necesario.',['Secuencia','Condición','Ciclo']],
['2.4','Construcción y prueba del prototipo lógico en PSeInt','09/10/2026','Implementación del algoritmo en PSeInt y realización de pruebas básicas. El LLM se utiliza de forma guiada para explicar, contrastar y depurar errores, sin sustituir el razonamiento del estudiante.',['PSeInt','Pruebas','Depuración guiada','Uso crítico de LLM']],
['2.5','Socialización del prototipo en PSeInt','16/10/2026','Demostración del funcionamiento del prototipo lógico, explicación de las decisiones tomadas y revisión de los resultados obtenidos.',[],null,true]]},
{numero:'Unidad 3',titulo:'Entornos de desarrollo',resumen:'Paso del prototipo lógico a una automatización funcional, integrando acciones, conectores, condiciones, pruebas y documentación.',temas:[
['3.1','Entornos de desarrollo: PSeInt y Power Automate','23/10/2026','Comparación del propósito de ambos entornos: PSeInt para modelar la lógica y Power Automate para implementar flujos automáticos conectados con aplicaciones y servicios.',['Entorno lógico','Entorno de automatización','Relación entre herramientas']],
['3.2','Elementos de un flujo automatizado','30/10/2026','Reconocimiento de los componentes que permiten iniciar y controlar un flujo: desencadenantes, acciones, conectores, condiciones y notificaciones.',['Desencadenante','Acciones','Conectores','Condiciones','Notificaciones']],
['3.3','Construcción guiada de la automatización','06/11/2026','Creación paso a paso del flujo en Power Automate a partir del proceso previamente diagnosticado y del algoritmo representado.',['Diseño del flujo','Configuración','Integración']],
['3.4','Pruebas, ajustes, documentación y elevator pitch','13/11/2026','Verificación del funcionamiento, corrección de fallos, registro de las decisiones del proyecto y preparación de una presentación breve y convincente.',['Casos de prueba','Ajustes','Documentación','Elevator pitch']],
['3.5','Socialización de la automatización','20/11/2026','Presentación final de la solución, demostración del flujo automatizado y reflexión sobre su utilidad, límites y oportunidades de mejora.',[],null,true]]}
];
const menu=document.getElementById('menu'),contenido=document.getElementById('contenido');
unidades.forEach((u,i)=>{
const id=`unidad-${i+1}`;
menu.insertAdjacentHTML('beforeend',`<button class="tab-btn" data-id="${id}" type="button">Corte ${i+1}</button>`);
const temas=u.temas.map(t=>`<article class="acc-item ${t[6]?'milestone':''}"><button class="acc-btn" type="button" aria-expanded="false"><span><span class="topic-code">${t[0]}</span>${t[1]}</span><span class="topic-meta"><span class="round-plus small">+</span></span></button><div class="acc-content"><p>${t[3]}</p>${t[4].length?`<div class="tags">${t[4].map(x=>Array.isArray(x)?`<a class="tag tag-link" href="${x[1]}" target="_blank" rel="noopener noreferrer">${x[0]} ↗</a>`:`<span class="tag">${x}</span>`).join('')}</div>`:''}${!t[6]?`<div class="resource">${t[5]?`<a class="resource-btn" href="${t[5]}" target="_blank" rel="noopener noreferrer">Actividad ↗</a>`:`<button class="resource-btn pending pending-activity" type="button">Actividad</button>`}</div>`:''}</div></article>`).join('');
contenido.insertAdjacentHTML('beforeend',`<section class="section" id="${id}"><button class="section-head" type="button" aria-expanded="false"><span><strong>${u.titulo}</strong></span><span class="round-plus">+</span></button><div class="section-body"><div class="lead">${u.resumen}</div><div class="accordion">${temas}</div></div></section>`);
});
contenido.insertAdjacentHTML('beforeend','<footer>Aprendiendo con <strong>@LaProfeVivy</strong></footer>');
function toggleSection(section){const open=section.classList.contains('open');document.querySelectorAll('.section').forEach(s=>{s.classList.remove('open');s.querySelector('.section-head').setAttribute('aria-expanded','false')});document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));if(!open){section.classList.add('open');section.querySelector('.section-head').setAttribute('aria-expanded','true');document.querySelector(`.tab-btn[data-id="${section.id}"]`).classList.add('active')}}
document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>{const s=document.getElementById(b.dataset.id);toggleSection(s);s.scrollIntoView({behavior:'smooth',block:'start'})}));
document.querySelectorAll('.section-head').forEach(b=>b.addEventListener('click',()=>toggleSection(b.closest('.section'))));
document.querySelectorAll('.acc-btn').forEach(b=>b.addEventListener('click',()=>{const item=b.closest('.acc-item'),open=item.classList.toggle('open');b.setAttribute('aria-expanded',String(open))}));
document.querySelectorAll('.pending-activity').forEach(b=>b.addEventListener('click',()=>alert('Esta clase aún no tiene actividad')));
</script>
</body>
</html>
