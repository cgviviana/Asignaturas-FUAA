<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ciudad Decisión</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: ciudad nocturna de videojuego. Mapa vertical tipo ruta; cada misión en una sola columna con barra de acciones fija abajo. Tema oscuro único, a propósito. */
:root{
  --night:#12172e; --night2:#1c2348; --street:#2b3366; --edge:#0a0e20;
  --ink:#f3f1ff; --muted:#a3abd3; --dim:#5d6590;
  --brand:#e21d38; --gold:#ffc93c; --vtrue:#38d996; --vfalse:#ff8f3c; --sky:#62c7ff; --err:#ff4d6d;
  --f-disp:"Bungee","Arial Black",Impact,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-code:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 60% at 50% 0%,#1f2856 0%,var(--night) 60%) fixed,var(--night);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
#app{min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.screen{max-width:760px;margin:0 auto}

/* Botones de juego */
.btn{font-family:var(--f-body);font-weight:700;font-size:14px;line-height:1.2;border:0;border-radius:10px;padding:7px 16px;min-height:38px;background:var(--street);color:var(--ink);box-shadow:0 3px 0 var(--edge);cursor:pointer;transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.btn.go{background:var(--gold);color:#2b1c00;box-shadow:0 3px 0 #b08218}
#btnMain,#btnStart,.mcard .btn.go{min-width:170px}
.btn.v{background:var(--vtrue);color:#032a1b;box-shadow:0 3px 0 #1d9264}
.btn.f{background:var(--vfalse);color:#341400;box-shadow:0 3px 0 #b25a17}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 2px var(--street)}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.row .btn{flex:0 1 auto}

/* HUD */
.hud{display:flex;align-items:center;gap:12px;max-width:760px;margin:0 auto 8px}
.hud .logo{font-family:var(--f-disp);font-size:15px;color:var(--gold);margin-right:auto;letter-spacing:.03em}
.pill{display:flex;align-items:center;gap:6px;font-family:var(--f-disp);font-size:14px;font-variant-numeric:tabular-nums}
.pill svg{width:22px;height:22px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:var(--street);box-shadow:0 3px 0 var(--edge);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:22px;height:22px}
.icon-btn.off{opacity:.45}

/* Inicio */
#scr-start{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding-top:4vh}
.title{font-family:var(--f-disp);font-size:clamp(40px,11vw,76px);line-height:.95;margin:0;text-wrap:balance;color:var(--ink);text-shadow:0 5px 0 var(--brand),0 10px 0 var(--edge)}
.title span{color:var(--gold)}
.tag{color:var(--muted);max-width:30ch;margin:0}
.skyline{width:100%;max-width:520px;height:auto}
.name-in{font:700 18px var(--f-body);width:min(320px,100%);padding:14px 16px;border-radius:14px;border:2px solid var(--street);background:var(--night2);color:var(--ink);text-align:center}
.name-in:focus{border-color:var(--gold);outline:none}

/* Mapa */
#mapSvg{width:100%;max-width:480px;height:auto;display:block;margin:0 auto}
.pin{cursor:pointer}
.pin .ring{fill:none;stroke:var(--gold);stroke-width:3;opacity:0}
.pin.next .ring{animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.55)}}
.pin .ring{transform-box:fill-box;transform-origin:center}
.pinlbl{font-family:var(--f-disp);font-size:11px;fill:var(--ink);letter-spacing:.04em}
.dist{font-family:var(--f-disp);font-size:12px;letter-spacing:.06em}

/* Misión */
#scr-mission{display:flex;flex-direction:column;gap:12px}
.mtop{display:flex;align-items:center;gap:10px}
.mtop h2{font-family:var(--f-disp);font-size:17px;margin:0;line-height:1.1;min-width:0}
.mtop small{display:block;font-family:var(--f-body);font-size:13px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.mtop .grow{flex:1;min-width:0}
.hearts{display:flex;gap:4px}
.hearts svg{width:24px;height:24px}
.say{display:flex;gap:12px;align-items:flex-start}
.vivy{width:44px;height:44px;flex:none}
.bub{flex:1;min-width:0;background:var(--night2);border-radius:4px 16px 16px 16px;padding:9px 13px;font-size:15px;border:2px solid transparent;transition:border-color .2s}
.bub.ok{border-color:var(--vtrue)} .bub.bad{border-color:var(--err)} .bub.hint{border-color:var(--gold)}
.bub b.tv,.tv{color:var(--vtrue)} .bub b.tf,.tf{color:var(--vfalse)}
#sayBtn.on{background:var(--gold)} #sayBtn.on svg{fill:#2b1c00}
#stage{display:flex;flex-direction:column;gap:16px;align-items:center}
#stage.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.duo{display:grid;grid-template-columns:1fr;gap:16px;width:100%;align-items:center;justify-items:center}
.duo>*{min-width:0}
@media(min-width:720px){.duo{grid-template-columns:1.1fr 1fr}}
.val{font-family:var(--f-code);font-weight:700;font-size:16px;background:rgba(98,199,255,.14);color:var(--sky);padding:6px 14px;border-radius:999px}
.expr{font-family:var(--f-code);font-size:clamp(16px,4.5vw,20px);font-weight:700;text-align:center}
*{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}
#play{display:flex;flex-direction:column;gap:12px}
.card{background:rgba(28,35,72,.55);border-radius:18px;padding:14px}
#stage.card{display:flex;flex-direction:column;gap:12px;align-items:center}
#play.shake{animation:shake .35s}
.work-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px}
.work{flex:1 1 280px;min-width:0;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.work:empty{display:none}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.work .row{justify-content:flex-start;flex-wrap:wrap}
.work .expr{font-size:18px;text-align:left}
.work .opts{max-width:none;flex-direction:row;flex-wrap:wrap}
.work .bank{justify-content:flex-start}
.qlbl{font-weight:700;color:var(--muted);font-size:14px;width:100%}
.cap{font-family:var(--f-disp);font-size:12px;letter-spacing:.06em;color:var(--sky)}
.tagb{font-family:var(--f-body);font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;margin-left:auto;background:rgba(255,201,60,.16);color:var(--gold)}
.tagb.tv{background:rgba(56,217,150,.16);color:var(--vtrue)} .tagb.tf{background:rgba(255,143,60,.16);color:var(--vfalse)}
.ln.new{animation:slideIn .45s ease-out}
@keyframes slideIn{from{opacity:0;transform:translateX(-14px)}}
.ln .body{display:flex;gap:12px;align-items:center;flex:1;min-width:0}

/* Diagramas */
.dg{width:100%;max-width:270px;height:auto;display:block}
.dg .s{fill:var(--night2);stroke:var(--muted);stroke-width:2;transition:stroke .2s,fill .2s}
.dg text{fill:var(--ink);font-family:var(--f-code);font-weight:500}
.dg .edge{stroke:var(--dim);stroke-width:2.2;fill:none;transition:stroke .2s}
.dg .ahp{fill:var(--dim)}
.dg .lbl{font-family:var(--f-disp);font-size:15px}
.dg .lv{fill:var(--vtrue)} .dg .lf{fill:var(--vfalse)}
.dg .nd.hl .s{stroke:var(--gold);fill:rgba(255,201,60,.13);stroke-width:3}
.dg .nd.empty .s{fill:rgba(255,255,255,.02);stroke-dasharray:7 5}
.dg .nd.empty text{fill:var(--dim);font-family:var(--f-disp)}
.dg .nd.cur .s{stroke:var(--gold);stroke-width:3;animation:glow 1.1s ease-in-out infinite alternate}
@keyframes glow{to{fill:rgba(255,201,60,.18)}}
.dg .nd.wrong .s{stroke:var(--err);stroke-width:3}
.dg .nd.click{cursor:pointer}
.dg.showV .ev,.dg.showVF .ev{stroke:var(--vtrue);stroke-width:3.5}
.dg.showF .ef,.dg.showVF .ef{stroke:var(--vfalse);stroke-width:3.5}
.dg.showV .nd-v .s,.dg.showVF .nd-v .s{stroke:var(--vtrue);fill:rgba(56,217,150,.16);stroke-width:3}
.dg.showF .nd-f .s,.dg.showVF .nd-f .s{stroke:var(--vfalse);fill:rgba(255,143,60,.16);stroke-width:3}
.dg.okAll .s{stroke:var(--vtrue)}
.dg .off{opacity:0}
.dg .nd{transform-box:fill-box;transform-origin:center}
.dg .nd.pop{animation:popIn .55s ease-out}
@keyframes popIn{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}}
.scene{width:100%;max-width:370px;height:auto;display:block;border-radius:16px}
.scol{display:flex;flex-direction:column;gap:14px;align-items:center;width:100%}
.tapme{cursor:pointer;animation:tapPulse .9s ease-in-out infinite alternate}
@keyframes tapPulse{from{filter:drop-shadow(0 0 0 rgba(255,201,60,0))}to{filter:drop-shadow(0 0 9px #ffc93c)}}
.tapTag{animation:bob .8s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-5px)}}
.tok{filter:drop-shadow(0 0 6px currentColor)}
.tok.tv{fill:var(--vtrue);color:var(--vtrue)} .tok.tf{fill:var(--vfalse);color:var(--vfalse)}

/* Código */
.code{font-family:var(--f-code);font-size:13px;background:#0b0f24;border-radius:14px;padding:10px 0;width:100%;overflow-x:auto}
.ln{display:flex;gap:12px;align-items:center;padding:2px 12px;white-space:pre;min-height:28px;border-left:4px solid transparent}
.ln .no{color:var(--dim);width:1.4em;text-align:right;flex:none;user-select:none}
.kw{color:#ff7fae;font-weight:700} .str{color:#ffd77a}
.ln.hl{background:rgba(255,201,60,.12);border-left-color:var(--gold)}
.ln.hv{background:rgba(56,217,150,.13);border-left-color:var(--vtrue)}
.ln.hf{background:rgba(255,143,60,.13);border-left-color:var(--vfalse)}
.ln.bad{background:rgba(255,77,109,.18);border-left-color:var(--err)}
.ln.good{background:rgba(56,217,150,.16);border-left-color:var(--vtrue)}
.ln.tap{cursor:pointer}
.ln.tap:hover{background:rgba(255,255,255,.05)}
.blank{font-family:var(--f-code);font-size:13px;font-weight:700;min-width:3em;min-height:24px;border:2px dashed var(--dim);background:transparent;border-radius:7px;padding:1px 6px;cursor:pointer}
.blank.filled{border-style:solid;border-color:var(--muted);color:#ff7fae}
.blank.cur{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,201,60,.25)}
.blank.good{border-color:var(--vtrue);color:var(--vtrue)}
.blank.bad{border-color:var(--err);color:var(--err)}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%}
.chip{font-family:var(--f-code);font-weight:700;font-size:14px;padding:7px 14px;min-height:38px;border-radius:10px;border:0;background:var(--street);box-shadow:0 3px 0 var(--edge);cursor:pointer;display:flex;align-items:center;gap:8px}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.chip svg{width:30px;height:20px;flex:none}
.opts{display:flex;flex-direction:column;gap:10px;width:100%;max-width:460px}

.opts .btn.right{background:var(--vtrue);color:#032a1b}
.legend{width:100%;max-width:420px;height:auto}
.legend .s{fill:var(--night2);stroke:var(--muted);stroke-width:2}
.legend .on .s{stroke:var(--gold);fill:rgba(255,201,60,.15);stroke-width:3}
.legend text{fill:var(--muted);font-family:var(--f-body);font-size:13px;font-weight:700}
.legend .on text{fill:var(--gold)}

.norm{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.nlbl{font-family:var(--f-disp);font-size:12px;letter-spacing:.08em;color:var(--gold)}
.ntitle{font-size:20px;margin:0;line-height:1.2;text-wrap:balance}
.term{font-size:13px;color:var(--sky);background:rgba(98,199,255,.12);padding:3px 12px;border-radius:999px;margin-top:4px}
.term b{font-family:var(--f-code)}
.tablewrap{width:100%;max-width:620px;overflow-x:auto}
.stable{width:100%;border-collapse:collapse;background:#0b0f24;border-radius:12px;overflow:hidden;font-size:14px}
.stable th{text-align:left;font-family:var(--f-disp);font-size:11px;letter-spacing:.06em;color:var(--muted);padding:10px 14px;background:#151a36}
.stable td{padding:8px 14px;border-top:1px solid #1c2348;vertical-align:middle}
.stable td:first-child{font-family:var(--f-code);white-space:pre;border-left:4px solid transparent}
.stable td:last-child{font-weight:700}
.stable tr.hl td:first-child{border-left-color:var(--gold)} .stable tr.hl td:last-child{color:var(--gold)}
.stable tr.hv td:first-child{border-left-color:var(--vtrue)} .stable tr.hv td:last-child{color:var(--vtrue)}
.stable tr.hf td:first-child{border-left-color:var(--vfalse)} .stable tr.hf td:last-child{color:var(--vfalse)}
.stable tr.new td{animation:slideIn .45s ease-out}
@media(max-width:560px){.stable tr:first-child{display:none}.stable tr{display:block;border-top:1px solid #1c2348}.stable td{display:block;border-top:0;padding:6px 12px}.stable td:first-child{padding-bottom:0}.stable td:last-child{padding-top:2px;border-left:4px solid transparent;font-size:13px}.stable tr.hl td:last-child{border-left-color:var(--gold)}.stable tr.hv td:last-child{border-left-color:var(--vtrue)}.stable tr.hf td:last-child{border-left-color:var(--vfalse)}}
.locker.sm{max-width:120px}
.lockrow{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-weight:700}
.locker{width:100%;max-width:210px;height:auto}
.op{color:var(--sky);font-weight:700}
.insp{display:flex;align-items:center;gap:12px;width:100%;max-width:600px}
.insp svg{flex:none}
.insp-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:15px}
.stamp{font-family:var(--f-disp);font-size:13px;color:var(--err);border:3px solid var(--err);padding:3px 8px;border-radius:6px;transform:rotate(-8deg);flex:none}
.stamp.ok{color:var(--vtrue);border-color:var(--vtrue)}
.irep{font-size:15px;color:#ffb3c1;background:rgba(255,77,109,.12);padding:6px 14px;border-radius:10px;max-width:600px}
.daybar{display:flex;align-items:center;gap:12px;width:100%;max-width:600px}
.daybar .hpl{flex:none}
.hp i.day{background:linear-gradient(90deg,var(--gold),var(--vfalse),#8b5cf6)}
.vign{width:100%;max-width:370px;height:auto;display:block;border-radius:14px}
/* Jefe */
.bossbar{display:flex;align-items:center;gap:14px;width:100%;max-width:420px}
.guard{width:62px;height:auto;flex:none}
.guard.hit{animation:shake .35s}
.hp{flex:1;height:16px;border-radius:999px;background:var(--night2);overflow:hidden;box-shadow:inset 0 0 0 2px var(--street)}
.hp i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--vfalse));transition:width .5s}
.hpl{font-family:var(--f-disp);font-size:12px;color:var(--muted)}

/* Coach, modal, certificado */
#coach{position:fixed;inset:0;z-index:20}
#coach.dim{background:rgba(5,8,20,.74)}
#cSpot{position:fixed;border-radius:18px;border:3px solid var(--gold);box-shadow:0 0 0 9999px rgba(5,8,20,.74);transition:all .3s;pointer-events:none}
#cBub{position:fixed;left:50%;transform:translateX(-50%);width:min(460px,calc(100% - 32px));display:flex;gap:12px;align-items:flex-start;background:var(--night2);border:2px solid var(--gold);border-radius:18px;padding:14px}
#cBub p{margin:0 0 10px}
#modal{position:fixed;inset:0;z-index:15;background:rgba(5,8,20,.78);display:grid;place-items:center;padding:16px}
.mcard{width:min(420px,100%);background:var(--night2);border-radius:22px;padding:24px 20px;text-align:center;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 0 var(--edge)}
.mcard h3{font-family:var(--f-disp);font-size:22px;margin:0;color:var(--gold)}
.mcard p{margin:0;color:var(--muted)}
.stars3{display:flex;justify-content:center;gap:8px}
.stars3 svg{width:52px;height:52px;animation:pop .4s backwards}
.stars3 svg:nth-child(2){animation-delay:.15s}.stars3 svg:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(0)}}
#scr-cert{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
#certImg{width:100%;max-width:720px;border-radius:12px;box-shadow:0 6px 0 var(--edge)}
#certDl{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.note{color:var(--muted);font-size:14px;margin:0}
.foot{text-align:center;color:var(--dim);font-size:13px;margin:22px 0 0;letter-spacing:.02em}
.foot b{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="app">
  <header class="hud" id="hud" hidden>
    <span class="logo">CIUDAD DECISIÓN</span>
    <span class="pill" id="hudStars" aria-label="Estrellas"></span>
    <span class="pill" id="hudCoins" aria-label="Monedas"></span>
    <button class="icon-btn" id="hudSnd" aria-label="Sonido encendido"></button>
  </header>

  <section class="screen" id="scr-start">
    <svg class="skyline" id="startSky" viewBox="0 0 520 150" aria-hidden="true"></svg>
    <h1 class="title">CIUDAD<br><span>DECISIÓN</span></h1>
    <input class="name-in" id="nameIn" maxlength="40" placeholder="Escribe tu nombre" autocomplete="name">
    <button class="btn go" id="btnStart">Entrar a la ciudad</button>
  </section>

  <section class="screen" id="scr-map" hidden>
    <svg id="mapSvg" viewBox="0 0 400 760" role="img" aria-label="Mapa de la ciudad con misiones"></svg>
  </section>

  <section class="screen" id="scr-mission" hidden>
    <div class="mtop">
      <button class="icon-btn" id="btnBack" aria-label="Volver al mapa"><svg viewBox="0 0 24 24" fill="#f3f1ff"><path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"/></svg></button>
      <div class="grow"><small id="mRound"></small><h2 id="mTitle"></h2></div>
      <div class="hearts" id="mHearts" aria-label="Vidas"></div>
    </div>
    <div class="say">
      <span id="sayAv"></span>
      <div class="bub" id="say" aria-live="polite"></div>
      <button class="icon-btn" id="sayBtn" aria-label="Escuchar instrucción"><svg viewBox="0 0 24 24" fill="#f3f1ff"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7" stroke="#f3f1ff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button>
    </div>
    <div id="play">
      <div class="card" id="stage"></div>
      <div class="card work-row">
        <div class="work" id="work"></div>
        <div class="ctrl">
          <button class="btn" id="btnHint">Pista</button>
          <button class="btn" id="btnUndo">Deshacer</button>
          <button class="btn" id="btnReset">Reiniciar</button>
          <button class="btn go" id="btnMain">Siguiente</button>
        </div>
      </div>
    </div>
  </section>

  <section class="screen" id="scr-cert" hidden>
    <h2 class="title" style="font-size:clamp(28px,7vw,44px)">¡MUNDO 1<br><span>SUPERADO!</span></h2>
    <img id="certImg" alt="Certificado de Ciudad Decisión">
    <div class="row">
      <a class="btn go" id="certDl" download="certificado-ciudad-decision.png">Descargar certificado</a>
      <button class="btn" id="certMap">Volver al mapa</button>
    </div>
    <p class="note">Si no se descarga, mantén presionada la imagen para guardarla.</p>
  </section>

  <p class="foot">Aprendiendo con <b>@LaProfeVivy</b></p>
</div>

<div id="coach" hidden>
  <div id="cSpot"></div>
  <div id="cBub"><span id="cAv"></span><div><p id="cTxt"></p><button class="btn go" id="cNext">Siguiente</button></div></div>
</div>
<div id="modal" hidden></div>

<script>
const $=s=>document.querySelector(s), NS='http://www.w3.org/2000/svg';
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

const DN={start:[180,30,110,34,'oval'],read:[180,92,172,40,'para'],cond:[180,182,204,86,'dia'],f:[92,286,172,56,'para'],v:[268,286,172,56,'para'],end:[180,404,110,34,'oval']};
const ORDER=['start','read','cond','v','f','end'];
function shp(sh,x,y,w,h){
  if(sh==='oval')return`<rect class="s" x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="${h/2}"/>`;
  if(sh==='para')return`<polygon class="s" points="${x-w/2+12},${y-h/2} ${x+w/2},${y-h/2} ${x+w/2-12},${y+h/2} ${x-w/2},${y+h/2}"/>`;
  if(sh==='dia')return`<polygon class="s" points="${x},${y-h/2} ${x+w/2},${y} ${x},${y+h/2} ${x-w/2},${y}"/>`;
  return`<rect class="s" x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="6"/>`}
function txt(x,y,s,size){const L=String(s).split('\n'),lh=size*1.3,y0=y-(L.length-1)*lh/2;
  return`<text x="${x}" y="${y0}" text-anchor="middle" dominant-baseline="central" font-size="${size}">`+L.map((l,i)=>`<tspan x="${x}"${i?` dy="${lh}"`:''}>${esc(l)}</tspan>`).join('')+'</text>'}
let dgId=0;
function diagram(n,o={}){
  const id='a'+(++dgId);
  let s=`<svg class="dg ${o.show?'show'+o.show:''}" viewBox="0 0 360 428" role="img" aria-label="Diagrama de flujo: ${esc(String(n.cond||'').replace(/\n/g,' '))}"><defs><marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahp" d="M0 0L10 5L0 10z"/></marker></defs>`;
  const vis=o.vis||ORDER,off=k=>vis.includes(k)?'':' off';
  [['M180 47V70','','read'],['M180 112V137','','cond'],['M78 182H92V256','ef','cond'],['M282 182H268V256','ev','cond'],['M92 314V354H180','ef','f',1],['M268 314V354H180','ev','v',1],['M180 354V385','','end']]
    .forEach(([d,c,t,nm])=>s+=`<path class="edge ${c}${off(t)}" d="${d}"${nm?'':` marker-end="url(#${id})"`}/>`);
  s+=`<circle class="${off('v')}" cx="180" cy="354" r="${o.join?9:4}" fill="${o.join?'#ffc93c':'#5d6590'}"/><text class="lbl lf${off('cond')}" x="58" y="174" text-anchor="middle">F</text><text class="lbl lv${off('cond')}" x="302" y="174" text-anchor="middle">V</text>`;
  ORDER.forEach(k=>{const[x,y,w,h,base]=DN[k];const sh=(o.shapes&&o.shapes[k])||base;const empty=o.empty&&o.empty.includes(k);
    const cls=['nd','nd-'+k,off(k),o.pop===k?'pop':'',o.hl&&o.hl.includes(k)?'hl':'',empty?'empty':'',o.cur===k?'cur':'',o.wrong&&o.wrong.includes(k)?'wrong':'',o.click?'click':''].join(' ');
    s+=`<g class="${cls}" data-k="${k}">${shp(sh,x,y,w,h)}${empty?txt(x,y,'?',20):txt(x,y,n[k]||'',12.5)}</g>`});
  return s+'</svg>'}
function token(svg,branch,cb){
  if(!svg){cb&&cb();return}
  const p=document.createElementNS(NS,'path');p.setAttribute('d',branch==='V'?'M180 30V182H268V354H180V404':'M180 30V182H92V354H180V404');p.setAttribute('fill','none');svg.appendChild(p);
  const c=document.createElementNS(NS,'circle');c.setAttribute('r','9');c.setAttribute('class','tok '+(branch==='V'?'tv':'tf'));svg.appendChild(c);
  const L=p.getTotalLength(),T=reduced?1:1700;let t0=null;
  (function f(ts){if(t0===null)t0=ts;const k=Math.min(1,(ts-t0)/T),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2,pt=p.getPointAtLength(L*e);c.setAttribute('cx',pt.x);c.setAttribute('cy',pt.y);
    if(k<1)requestAnimationFrame(f);else{svg.classList.add('show'+branch);c.remove();cb&&cb()}})(performance.now())}

function hiCode(s){return s.split(/("[^"]*")/).map((p,i)=>i%2?`<span class="str">${esc(p)}</span>`:esc(p).replace(/\b(FinAlgoritmo|Algoritmo|FinSi|SiNo|Si|Entonces|Leer|Escribir|Definir|Como|Entero|Real)\b/g,'<span class="kw">$1</span>').replace(/&lt;-/g,'<span class="op">&lt;-</span>')).join('')}
function codeHTML(lines,o={}){return'<div class="code">'+lines.map((ln,i)=>{
  const parts=ln.split(/\[\[(\d+)\]\]/);let h='';
  parts.forEach((p,j)=>{if(j%2){const b=+p,v=o.blanks?o.blanks[b]:null,m=o.marks?o.marks[b]:null;
      h+=`<button class="blank ${v?'filled':''} ${o.cur===b&&!o.marks?'cur':''} ${m===true?'good':m===false?'bad':''}" data-b="${b}" aria-label="Espacio ${b+1}">${v?esc(v):'&nbsp;'}</button>`}
    else h+=hiCode(p)});
  const cls=(o.lineCls&&o.lineCls[i])||'';
  return`<div class="ln ${cls} ${o.tap?'tap':''}" ${o.tap?`data-i="${i}" role="button" tabindex="0"`:''}><span class="no">${i+1}</span><span>${h}</span></div>`}).join('')+'</div>'}

  $('#hudSnd').innerHTML=sndIcon(S.snd);$('#hudSnd').classList.toggle('off',!S.snd);$('#hudSnd').setAttribute('aria-label',S.snd?'Apagar sonido':'Encender sonido')}

/* Ciudad de fondo */
function lcg(seed){return()=>(seed=(seed*16807)%2147483647)/2147483647}
function skyline(r,w,base,n,col,winCol,hMin,hMax,op){let s='';for(let i=0;i<n;i++){const bw=18+r()*34,x=r()*(w-bw),h=hMin+r()*(hMax-hMin),y=base-h;
  s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${col}" opacity="${op}"/>`;
  for(let wy=y+8;wy<base-8;wy+=11)for(let wx=x+5;wx<x+bw-6;wx+=8)if(r()<.28)s+=`<rect x="${wx.toFixed(1)}" y="${wy.toFixed(1)}" width="3.5" height="5" fill="${winCol}" opacity="${(.4+r()*.6).toFixed(2)}"/>`}return s}
function drawStartSky(){const r=lcg(7);let s='';for(let i=0;i<30;i++)s+=`<circle cx="${(r()*520).toFixed(0)}" cy="${(r()*70).toFixed(0)}" r="${(r()*1.4+.4).toFixed(1)}" fill="#f3f1ff" opacity=".7"/>`;
  s+=`<circle cx="430" cy="34" r="18" fill="#ffe7a8"/><circle cx="438" cy="28" r="16" fill="#1f2856"/>`;
  s+=skyline(r,520,150,16,'#1c2348','#ffc93c',40,110,1)+skyline(r,520,150,12,'#2b3366','#ffd77a',20,70,1);
  s+=`<rect x="0" y="146" width="520" height="4" fill="#e21d38"/>`;$('#startSky').innerHTML=s}

function renderMap(){const r=lcg(11);let s=`<defs><linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1f45"/><stop offset=".5" stop-color="#151b3a"/><stop offset="1" stop-color="#12172e"/></linearGradient></defs><rect width="400" height="760" fill="url(#skyg)"/>`;
  for(let i=0;i<40;i++)s+=`<circle cx="${(r()*400).toFixed(0)}" cy="${(r()*120).toFixed(0)}" r="${(r()*1.3+.3).toFixed(1)}" fill="#f3f1ff" opacity=".6"/>`;
  // tres barrios
  s+=`<g opacity=".5">${skyline(r,400,165,14,'#1c2348','#c49cff',40,120,1)}</g>`;
  s+=`<g opacity=".55">${skyline(r,400,270,14,'#1c2348','#62c7ff',30,90,1)}</g>`;
  s+=`<ellipse cx="200" cy="560" rx="260" ry="250" fill="#e21d38" opacity=".07"/>`;
  s+=skyline(r,400,760,16,'#1c2348','#ffc93c',30,80,.9);
  // carretera
  const road='M200 770C70 730 60 690 110 662S330 610 292 578 70 525 112 494 330 445 290 408 200 345 200 320 90 250 112 214 330 140 290 104';
  s+=`<path d="${road}" fill="none" stroke="#0a0e20" stroke-width="40" stroke-linecap="round"/><path d="${road}" fill="none" stroke="#2b3366" stroke-width="32" stroke-linecap="round"/><path d="${road}" fill="none" stroke="#ffc93c" stroke-width="2.5" stroke-dasharray="10 12" opacity=".8"/>`;
  // letreros de barrio
  const sign=(x,y,t,sub,col)=>`<g transform="translate(${x} ${y})"><rect x="-4" y="-16" width="${Math.max(t.length*10.5,sub.length*5.7)+22}" height="38" rx="6" fill="#0a0e20" stroke="${col}" stroke-width="2"/><text class="dist" x="8" y="0" fill="${col}">${t}</text><text x="8" y="15" font-size="10" fill="#a3abd3" font-family="Atkinson Hyperlegible,sans-serif">${sub}</text></g>`;
  s+=sign(192,708,'BARRIO SI','Mundo 1 · decisiones simples','#ffc93c');
  s+=sign(176,214,'AVENIDA BOOLEANA','Mundo 2 · Y, O, NO','#62c7ff');
  s+=sign(26,110,'TORRE ANIDADA','Mundo 3 · decisiones anidadas','#c49cff');
  // misiones
  const firstOpen=MORDER.findIndex((k,i)=>unlocked(i)&&!S.stars[k]);
  MORDER.forEach((k,i)=>{const[x,y]=PINS[k],open=unlocked(i),done=!!S.stars[k],boss=k==='boss';

      <g fill="${ic}" stroke="${ic}" stroke-width="0">${open?ICON[k]:ICON.lock}</g>
      <text class="pinlbl" y="${R+18}" text-anchor="middle">${MIS[k].label}</text>
      ${done?`<g transform="translate(-27 ${R+24})">${[0,1,2].map(j=>`<g transform="translate(${j*19} 0) scale(.75)">${star(j<S.stars[k]).replace(/<\/?svg[^>]*>/g,'')}</g>`).join('')}</g>`:''}</g>`});
  [[112,268,'w2','#62c7ff'],[300,150,'w3','#c49cff']].forEach(([x,y,id,c])=>s+=`<g class="pin" id="pin-${id}" data-w="${id}" role="button" tabindex="0" aria-label="${S[id]?'Mundo desbloqueado':'Mundo bloqueado: pide código'}" transform="translate(${x} ${y})"><circle r="30" fill="#0a0e20"/><circle r="26" fill="${S[id]?c:'#2b3366'}"/>${S[id]?'':`<g fill="#5d6590" stroke="#5d6590" stroke-width="0">${ICON.lock}</g>`}</g>`);
  $('#mapSvg').innerHTML=s}
$('#mapSvg').addEventListener('click',e=>{const p=e.target.closest('.pin');if(!p)return;
  if(p.dataset.w){sfx('tap');askCode(p.dataset.w);return}
  const k=p.dataset.m,i=MORDER.indexOf(k);
  if(!unlocked(i)){sfx('bad');modal('<h3>Misión bloqueada</h3><p>Primero completa la misión anterior.</p>',[['Entendido',null,'go']]);return}
  sfx('tap');startMission(k)});
$('#mapSvg').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.closest('.pin')){e.preventDefault();e.target.closest('.pin').dispatchEvent(new MouseEvent('click',{bubbles:true}))}});

/* ---------- Motor de misión ---------- */
let C=null;const stage=$('#stage'),work=$('#work'),play=$('#play');
function startMission(id){lastStruct=[];C={id,M:MIS[id],phase:'learn',step:0,round:0,hearts:3,errors:0,hints:0,lock:false,sub:{}};show('mission');renderMission()}
function setSay(t,kind){sayText=t.replace(/<[^>]+>/g,'');stopSpeak();const b=$('#say');b.innerHTML=t;b.className='bub'+(kind?' '+kind:'')}
function renderHearts(){$('#mHearts').innerHTML=[0,1,2].map(i=>heart(i<C.hearts)).join('')}
function btn(id,label,show,enabled=true){const b=$(id);b.hidden=!show;b.textContent=label;b.disabled=!enabled}
let onMain=null;
function main(label,fn,enabled=true){onMain=fn;btn('#btnMain',label||'',!!label,enabled)}
function renderMission(){$('#mTitle').textContent=C.M.name;renderHearts();$('#sayAv').innerHTML=vivy();
  if(C.phase==='learn'&&!C.M.learn.length){startPlay();return}
  if(C.phase==='learn'){const L=C.M.learn[C.step];
    $('#mRound').textContent=`Normas de la ciudad · ${C.step+1} de ${C.M.learn.length}`;$('#mHearts').hidden=true;
    setSay(L.say);stage.innerHTML=(L.norm?norm(L.norm[0],L.norm[1],L.norm[2]):'')+L.show();work.innerHTML='';
    if(L.anim)token(stage.querySelector('svg.dg'),L.anim);
    btn('#btnHint','Saltar',!!S.stars[C.id]);btn('#btnUndo','Deshacer',false);btn('#btnReset','Repetir',true);
    main(C.step===C.M.learn.length-1?'¡A jugar!':'Siguiente',()=>{sfx('tap');if(C.step<C.M.learn.length-1){C.step++;renderMission()}else startPlay()})}
  else renderPlay()}
function startPlay(){C.phase='play';C.round=0;renderPlay();

      const nx=sub.vals.findIndex((v,i)=>v===null&&i>sub.cur);sub.cur=nx>=0?nx:Math.max(0,sub.vals.indexOf(null));if(sub.vals.indexOf(null)<0)sub.cur=-1;drawFill(r)}}}
function drawFill(r){const sub=C.sub;
  stage.innerHTML=`<div class="duo">${codeHTML(r.lines,{blanks:sub.vals,cur:sub.cur,marks:sub.marks})}${diagram(r.nodes,{show:C.lock?'VF':''})}</div>`;work.innerHTML=C.lock?'':`<div class="bank">${r.bank.map(t=>`<button class="chip" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div>`;
  if(!C.lock){btn('#btnUndo','Deshacer',true,sub.stack.length>0);main('Comprobar',()=>checkFill(r),sub.vals.every(v=>v))}}
function checkFill(r){const sub=C.sub;sub.marks=sub.vals.map((v,i)=>v===r.ans[i]);
  if(sub.marks.every(Boolean)){C.lock=true;good(r.ok);btn('#btnUndo','Deshacer',true,false);drawFill(r);main('Siguiente',nextRound);return}
  const n=sub.marks.filter(m=>!m).length;bad(`${n===1?'Un espacio no va':'Hay '+n+' espacios que no van'} ahí. Los marqué en rojo: cámbialos.`);drawFill(r);main('Comprobar',null,false);
  if(C.hearts>0)setTimeout(()=>{sub.vals=sub.vals.map((v,i)=>sub.marks[i]?v:null);sub.cur=sub.vals.indexOf(null);sub.stack=sub.stack.filter(i=>sub.vals[i]!==null);sub.marks=null;drawFill(r)},1200)}

/* Armar el diagrama */
function playBuild(r){C.sub={fill:{},cur:'start',stack:[],wrong:[],bank:shuffle(r.pieces.map((p,i)=>i))};setSay(r.say);drawBuild(r);
  play.onclick=e=>{if(C.lock)return;const sub=C.sub,nd=e.target.closest('.nd'),pc=e.target.closest('[data-p]');
    if(nd){const k=nd.dataset.k;if(sub.fill[k]!=null){delete sub.fill[k];sub.stack=sub.stack.filter(x=>x!==k)}sub.cur=k;sfx('tap');drawBuild(r)}
    else if(pc&&sub.cur){sub.fill[sub.cur]=+pc.dataset.p;sub.stack.push(sub.cur);sub.wrong=sub.wrong.filter(x=>x!==sub.cur);sfx('tap');
      const i=ORDER.indexOf(sub.cur);sub.cur=ORDER.slice(i+1).concat(ORDER.slice(0,i)).find(k=>sub.fill[k]==null)||null;drawBuild(r)}}}
function drawBuild(r){const sub=C.sub,n={},shapes={},empty=[];
  ORDER.forEach(k=>{const p=sub.fill[k];if(p==null)empty.push(k);else n[k]=r.pieces[p].t});
  const used=Object.values(sub.fill);
  stage.innerHTML=`<div class="duo"><div class="scol">${vign(r.scene)}</div>${diagram(n,{empty,cur:C.lock?null:sub.cur,wrong:sub.wrong,shapes,click:!C.lock,show:C.lock?'VF':''})}</div>`;
  work.innerHTML=(C.lock?'':`<div class="bank">${sub.bank.filter(i=>!used.includes(i)).map(i=>`<button class="chip" data-p="${i}">${esc(r.pieces[i].t.replace('\n',' '))}</button>`).join('')}</div>`);
  if(!C.lock){btn('#btnUndo','Deshacer',true,sub.stack.length>0);main('Comprobar',()=>checkBuild(r),empty.length===0)}}
function checkBuild(r){const sub=C.sub;const wrong=ORDER.filter(k=>r.pieces[sub.fill[k]].k!==k);
  if(!wrong.length){C.lock=true;good(r.ok);btn('#btnUndo','Deshacer',true,false);drawBuild(r);main('Siguiente',nextRound);return}
  sub.wrong=wrong;bad(`${wrong.length===1?'Una pieza no va':wrong.length+' piezas no van'} ahí. Las marqué en rojo.`);drawBuild(r);main('Comprobar',null,false);
  if(C.hearts>0)setTimeout(()=>{wrong.forEach(k=>delete sub.fill[k]);sub.stack=sub.stack.filter(k=>sub.fill[k]!=null);sub.cur=ORDER.find(k=>sub.fill[k]==null);drawBuild(r)},1200)}

  const url=cv.toDataURL('image/png');$('#certImg').src=url;$('#certDl').href=url}
$('#certMap').onclick=()=>show('map');

/* Coach con la Profe Vivy */
function coach(steps,done){let i=0;const ov=$('#coach');ov.hidden=false;$('#cAv').innerHTML=vivy();
  function draw(){const s=steps[i],t=s.t?(typeof s.t==='string'?$(s.t):s.t()):null,spot=$('#cSpot'),bub=$('#cBub');
    $('#cTxt').textContent=s.say;$('#cNext').textContent=i===steps.length-1?'¡Listo!':'Siguiente';
    if(t){t.scrollIntoView({block:'center'});const r=t.getBoundingClientRect();spot.hidden=false;ov.classList.remove('dim');
      Object.assign(spot.style,{left:r.left-8+'px',top:r.top-8+'px',width:r.width+16+'px',height:r.height+16+'px'});
      const below=r.bottom+190<innerHeight;bub.style.top=below?r.bottom+20+'px':'auto';bub.style.bottom=below?'auto':(innerHeight-r.top+20)+'px'}
    else{spot.hidden=true;ov.classList.add('dim');bub.style.top='28%';bub.style.bottom='auto'}
    $('#cNext').focus()}
  $('#cNext').onclick=()=>{sfx('tap');i++;if(i>=steps.length){ov.hidden=true;done&&done()}else draw()};draw()}

/* Inicio */
drawStartSky();
if(S.name){$('#nameIn').value=S.name;$('#btnStart').textContent='Continuar'}
$('#btnStart').onclick=()=>{const n=$('#nameIn').value.trim();if(!n){$('#nameIn').focus();$('#nameIn').placeholder='Primero escribe tu nombre';return}
  S.name=n;save();sfx('win');show('map');
  if(!S.tut){S.tut=true;save();setTimeout(()=>coach([
    {say:`¡Hola, ${n}! Soy la Profe Vivy. En esta ciudad cada lugar tiene un problema que se resuelve tomando una decisión.`},
    {t:'#pin-cafe',say:'Las misiones siguen la carretera. Empieza por la Cafetería: tócala cuando termine este recorrido.'},
    {t:'#pin-boss',say:'Al final del barrio está el Reto final: un día completo en la ciudad. Supéralo para ganar tu certificado.'},
    {t:'#hudStars',say:'Cada misión da hasta 3 estrellas y monedas. Pierdes estrellas con errores y con muchas pistas.'},
    {t:'#hudSnd',say:'Aquí enciendes o apagas los sonidos del juego.'}]),400)}};
$('#nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('#btnStart').click()});
$('#hudSnd').onclick=()=>{S.snd=!S.snd;save();renderHud();sfx('tap')};
</script>
