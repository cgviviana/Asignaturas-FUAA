@media(max-width:1100px){.workspace{grid-template-columns:220px 1fr}.indicators{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}.indicatorList{display:grid;grid-template-columns:repeat(4,1fr)}.indicatorList article{padding:15px;border-right:1px solid var(--line);border-bottom:0}.conclusion{margin:13px 19px}.welcome{grid-column:2}.menuGuide{right:-26px}}
@media(max-width:760px){.header{height:60px}.headerNote{display:none}.intro h1{font-size:38px}.workspace{display:block}.menu{border-right:0;border-bottom:1px solid var(--line)}.menu nav{display:grid;grid-template-columns:repeat(2,1fr);padding:7px}.menuOption{border-left:0;border-bottom:2px solid transparent;padding:0 9px}.menuOption.selected{border-bottom-color:var(--green)}.menuGuide{display:none}.welcome{min-height:400px}.scenarioHeader{display:block}.simulateWrap{display:inline-block;margin-top:13px}.eventGuide{left:-28px;top:16px}.visual{height:300px}.steps{grid-template-columns:repeat(2,1fr)}.step:nth-child(2){border-right:0}.step:nth-child(-n+2){border-bottom:1px solid var(--line)}.indicatorList{grid-template-columns:repeat(2,1fr);padding:0}.indicatorList article{padding:15px 18px}.indicatorList article:nth-child(2){border-right:0}.indicatorList article:nth-child(-n+2){border-bottom:1px solid var(--line)}footer{height:auto;min-height:68px;padding-top:17px;padding-bottom:17px}.buildings span{width:54px}.device{width:92px}.platform{padding:13px}.residential{width:175px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<main class="site">
  <header class="header"><div class="brand"><span class="brandLines" aria-hidden="true"><i></i><i></i><i></i></span><div><b>Ciudad inteligente</b><small>SIMULADOR EDUCATIVO</small></div></div><span class="headerNote">Datos simulados</span></header>
  <section class="intro"><span class="eyebrow">TECNOLOGÍAS EMERGENTES EN CONTEXTO</span><h1>Observa qué ocurre y cómo <em>responde la ciudad.</em></h1><p>Cada escenario relaciona una medición, una decisión tecnológica y un cambio visible en el entorno.</p></section>
  <section class="workspace" id="workspace"></section>
  <footer><b>Aprendiendo con @LaProfeVivy</b></footer>
</main>
<script>
const scenarios=[{"id":"movilidad","name":"Movilidad inteligente","summary":"Coordinación de semáforos, desvíos y vehículos de emergencia.","eventLabel":"Simular accidente","normalTitle":"Circulación normal en la avenida principal","eventTitle":"Accidente y bloqueo de un carril","normalAction":"Los semáforos mantienen sus tiempos habituales.","eventAction":"El carril se cierra, la vía alterna recibe luz verde y la ambulancia avanza por el corredor despejado.","normalFlow":["Los carros circulan","Los sensores cuentan vehículos","Los semáforos alternan el paso","Las vías permanecen abiertas"],"flow":["Se detecta el choque","Se confirma el bloqueo","Cambian los semáforos","Entra la ambulancia"],"metrics":[["Vehículos en espera","8","34","En la intersección"],["Semáforo de vía alterna","Rojo","Verde","Cambio de prioridad"],["Carril principal","Abierto","Cerrado","Por el accidente"],["Ambulancia","En base","En camino","Por la vía despejada"]]},{"id":"ambiente","name":"Calidad del aire","summary":"Medición de partículas y respuesta ante una zona con contaminación alta.","eventLabel":"Simular contaminación alta","normalTitle":"El aire se mantiene en un nivel favorable","eventTitle":"La contaminación aumenta en el corredor central","normalAction":"La estación continúa midiendo sin generar restricciones.","eventAction":"La zona afectada se marca, el tráfico pesado se desvía y se publica una alerta preventiva.","normalFlow":["El aire circula por la zona","La estación mide 11 µg/m³","El nivel es favorable","El tránsito continúa sin restricciones"],"flow":["La estación mide el aire","Aumenta la lectura","Se ubica la zona afectada","Se desvía el tráfico"],"metrics":[["Partículas finas","11 µg/m³","38 µg/m³","Lectura del aire"],["Estado","Favorable","Elevado","Nivel simulado"],["Corredor central","Habilitado","Restringido","Para tráfico pesado"],["Alerta","Inactiva","Publicada","Información preventiva"]]},{"id":"energia","name":"Energía inteligente","summary":"Distribución de la carga entre generación solar, reserva y edificios.","eventLabel":"Simular pico de consumo","normalTitle":"La producción y el consumo están equilibrados","eventTitle":"Un edificio supera el consumo habitual","normalAction":"La energía solar cubre parte de la demanda y la batería conserva su reserva.","eventAction":"La batería entrega energía al edificio con mayor demanda y se aplazan cargas no prioritarias.","normalFlow":["Los paneles generan energía","La red distribuye la carga","La batería conserva reserva","Los edificios reciben suministro"],"flow":["El medidor registra el aumento","La red calcula el déficit","Se activa la batería","La carga se redistribuye"],"metrics":[["Demanda","8,4 MW","11,2 MW","Consumo del sector"],["Aporte solar","36 %","24 %","Energía disponible"],["Batería","En reserva","Suministrando","Apoyo temporal"],["Red","Estable","Redistribuyendo","Balance de carga"]]},{"id":"iot","name":"Internet de las cosas","summary":"Conexión de luminarias, contenedores y sistemas de riego con una plataforma urbana.","eventLabel":"Simular falla de sensores","normalTitle":"Los dispositivos envían datos a la plataforma","eventTitle":"Tres dispositivos dejan de enviar información","normalAction":"La luminaria, el contenedor y el riego reportan su estado con normalidad.","eventAction":"Los tres equipos aparecen sin conexión y la plataforma envía una orden al equipo de mantenimiento.","normalFlow":["Los dispositivos toman lecturas","Los datos viajan a la plataforma","Todos los equipos responden","Los servicios se actualizan"],"flow":["Se interrumpe la señal","La plataforma detecta el silencio","Identifica los equipos","Envía mantenimiento"],"metrics":[["Luminaria","Conectada","Sin conexión","Alumbrado público"],["Contenedor","Conectado","Sin conexión","Nivel de llenado"],["Riego","Conectado","Sin conexión","Humedad del suelo"],["Mantenimiento","Sin solicitud","Asignado","Revisión de equipos"]]},{"id":"ia","name":"Inteligencia artificial","summary":"Predicción de demanda de transporte con validación de un operador.","eventLabel":"Simular alta demanda","normalTitle":"La demanda prevista cabe en la capacidad disponible","eventTitle":"La demanda prevista supera la capacidad","normalAction":"La frecuencia actual de buses puede atender la demanda estimada.","eventAction":"El modelo recomienda cuatro buses adicionales y un operador valida el refuerzo del servicio.","normalFlow":["Entran datos de demanda","El modelo proyecta 820 personas","La demanda está bajo la capacidad","El operador supervisa"],"flow":["Entran datos de demanda","El modelo proyecta el aumento","Compara con la capacidad","El operador valida"],"metrics":[["Demanda prevista","820 personas","1.340 personas","Próxima hora"],["Capacidad","1.050 personas","1.050 personas","Servicio actual"],["Recomendación","Sin cambios","Agregar 4 buses","Resultado del modelo"],["Operador","Observando","Validando","Control humano"]]},{"id":"seguridad","name":"Respuesta a emergencias","summary":"Ubicación de una alerta y envío de la unidad disponible más cercana.","eventLabel":"Simular emergencia","normalTitle":"Las unidades mantienen la cobertura de la ciudad","eventTitle":"Se recibe una alerta en la zona residencial","normalAction":"Las unidades permanecen distribuidas en sus zonas de cobertura.","eventAction":"El centro verifica la alerta y la unidad más cercana sigue la ruta marcada hasta la zona residencial.","normalFlow":["Las unidades recorren sus zonas","El centro monitorea la ciudad","No hay alertas críticas","La cobertura está disponible"],"flow":["Llega la alerta con ubicación","El centro la verifica","Asigna la unidad más cercana","La unidad llega al lugar"],"metrics":[["Alertas críticas","0","1","Caso nuevo"],["Unidad cercana","Disponible","Asignada","Respuesta enviada"],["Tiempo estimado","—","4 min","Hasta el lugar"],["Caso","Sin novedad","En atención","Estado actual"]]}];
let selectedId=null,eventActive=false;
const workspace=document.getElementById('workspace');
function visual(id,on){
 if(id==='movilidad')return '<div class="visual mobilityVisual '+(on?'event':'')+'"><span class="road horizontal"></span><span class="road vertical"></span><span class="alternate">Vía alterna</span><i class="signal mainSignal"><b></b><b></b></i><i class="signal altSignal"><b></b><b></b></i><span class="vehicle carA"></span><span class="vehicle carB"></span><span class="vehicle carC"></span><span class="vehicle carD"></span><span class="vehicle divertedCar"></span><span class="crash">Accidente</span><span class="laneBarrier">Carril cerrado</span><span class="ambulanceUnit">Ambulancia</span><span class="routeArrow r1">→</span><span class="routeArrow r2">→</span></div>';
 if(id==='ambiente')return '<div class="visual airVisual '+(on?'event':'')+'"><div class="skyline"><i><b>Viviendas</b></i><i><b>Oficinas</b></i><i><b>Comercio</b></i></div><div class="airRoad"><span>Corredor central</span><i></i></div><div class="cleanAir"><span>Aire circulando</span><i></i><i></i><i></i></div><div class="airSensor"><b>Estación de calidad del aire</b><span>Lectura: '+(on?'38':'11')+' µg/m³</span></div><div class="particles">'+Array(12).fill('<i></i>').join('')+'</div><div class="affectedZone">Zona de medición</div><div class="heavyTraffic">Vehículo de carga</div><span class="routeArrow airArrow">→ ruta alterna</span></div>';
 if(id==='energia')return '<div class="visual energyVisual '+(on?'event':'')+'"><div class="solarSource"><span></span><span></span><b>Generación solar</b></div><div class="energyLine lineOne"></div><div class="gridCenter">Red eléctrica</div><div class="energyLine lineTwo"></div><div class="battery">Batería<b>'+(on?'Suministrando':'En reserva')+'</b></div><div class="buildings"><span>Edificio A</span><span>Edificio B</span><span class="highUse">Edificio C</span></div></div>';
 if(id==='iot')return '<div class="visual iotVisual '+(on?'event':'')+'"><div class="platform">Plataforma urbana</div><div class="networkLine"></div><div class="device lamp">Luminaria<i></i></div><div class="device bin">Contenedor<i></i></div><div class="device water">Sistema de riego<i></i></div><div class="maintenance">Equipo de mantenimiento</div></div>';
 if(id==='ia')return '<div class="visual aiVisual '+(on?'event':'')+'"><div class="chart"><span class="capacityLine">Capacidad: 1.050</span><i class="bar current"><b>Ahora<br>760</b></i><i class="bar forecast"><b>Próxima hora<br>'+(on?'1.340':'820')+'</b></i></div><div class="modelBox">Modelo de predicción<span>Analiza demanda y capacidad</span></div><div class="operator">Operador humano<b>'+(on?'Validando 4 buses adicionales':'Supervisando')+'</b></div></div>';
 return '<div class="visual securityVisual '+(on?'event':'')+'"><div class="residential">Zona residencial<span>'+(on?'Alerta activa':'Sin novedades')+'</span></div><div class="responseCenter">Centro de emergencias</div><div class="responseRoute"><i></i><i></i><i></i></div><div class="responseUnit">Unidad de respuesta</div></div>';
}
function menu(){return '<aside class="menu" aria-label="Tecnologías disponibles"><div class="asideTitle"><b>Tecnologías</b></div><nav>'+scenarios.map(s=>'<button class="menuOption '+(selectedId===s.id?'selected':'')+'" data-id="'+s.id+'"><span>'+s.name+'</span><i aria-hidden="true">›</i></button>').join('')+'</nav>'+(!selectedId?'<span class="guideArrow menuGuide" aria-hidden="true">←</span>':'')+'</aside>';}
function render(){
 const s=scenarios.find(x=>x.id===selectedId);
 if(!s){workspace.innerHTML=menu()+'<section class="welcome" aria-live="polite"><div class="welcomeGraphic" aria-hidden="true"><i></i><i></i><i></i><span></span></div><h2>Escenarios urbanos conectados</h2></section>';bind();return;}
 const steps=(eventActive?s.flow:s.normalFlow).map((x,i)=>'<div class="step '+(eventActive?'on':'normalStep')+'"><i>'+(i<3?'→':'✓')+'</i><p>'+x+'</p></div>').join('');
 const metrics=s.metrics.map(m=>'<article><span>'+m[0]+'</span><b>'+(eventActive?m[2]:m[1])+'</b><p>'+m[3]+'</p></article>').join('');
 workspace.innerHTML=menu()+'<section class="scenario" aria-live="polite"><div class="scenarioHeader"><div><div class="scenarioMeta"><span class="eyebrow">'+s.name+'</span><span class="stateBadge '+(eventActive?'eventState':'')+'">'+(eventActive?'Evento simulado':'Situación normal')+'</span></div><h2>'+(eventActive?s.eventTitle:s.normalTitle)+'</h2><p>'+s.summary+'</p></div><div class="simulateWrap">'+(!eventActive?'<span class="guideArrow eventGuide" aria-hidden="true">→</span>':'')+'<button class="simulate '+(eventActive?'active':'')+'" id="simulate">'+(eventActive?'Restablecer':s.eventLabel)+'</button></div></div>'+visual(s.id,eventActive)+'<div class="whatHappens"><span class="eyebrow">'+(eventActive?'CAMBIO PRODUCIDO':'FUNCIONAMIENTO NORMAL')+'</span><div class="steps">'+steps+'</div></div></section><aside class="indicators '+(eventActive?'changed':'')+'" aria-label="Cambios observados"><div class="asideTitle"><b>'+(eventActive?'Cambios observados':'Estado actual')+'</b><span>'+s.name+'</span></div><div class="indicatorList">'+metrics+'</div><div class="conclusion"><span>'+(eventActive?'RESPUESTA DEL SISTEMA':'OPERACIÓN NORMAL')+'</span><p>'+(eventActive?s.eventAction:s.normalAction)+'</p></div></aside>';
 bind();
}
function bind(){document.querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>{selectedId=b.dataset.id;eventActive=false;render()}));const sim=document.getElementById('simulate');if(sim)sim.addEventListener('click',()=>{eventActive=!eventActive;render()});}
render();
</script>
</body>
</html>
