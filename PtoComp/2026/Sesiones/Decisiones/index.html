<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Decisiones en acción · PSeInt</title><style>
:root{--green:#087f6b;--ink:#203742;--muted:#637983;--line:#d8e5e7;--bg:#f3f7f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,'Segoe UI',Arial,sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:17px max(20px,calc((100vw - 1180px)/2));font-size:21px;font-weight:800}header span{color:var(--green)}main{max-width:1180px;margin:25px auto;padding:0 18px}.intro{margin:0 0 18px;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(260px,290px) minmax(0,1fr);gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:19px;box-shadow:0 4px 16px #24495509}details{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden;background:white}summary{padding:12px 14px;font-weight:800;cursor:pointer;background:#f6faf9}details[open]>summary{background:var(--green);color:white}.situation{display:block;width:calc(100% - 16px);margin:6px 8px;padding:11px;text-align:left;border:0;border-radius:8px;background:transparent;color:var(--ink);cursor:pointer}.situation:hover{background:#eaf6f1}.situation.active{background:#e1f6ee;font-weight:750;color:#006d58}.eyebrow{text-transform:uppercase;color:var(--green);font-size:12px;letter-spacing:.08em;font-weight:850;margin:0 0 8px}h1{font-size:24px;line-height:1.2;margin:0 0 12px}.scenario{font-size:16px;margin:0 0 17px}.input-row{display:flex;gap:13px;flex-wrap:wrap;align-items:center;background:#eaf6f1;padding:13px;border-radius:11px}.input-row label{font-weight:750}.input-row input{width:110px;border:1px solid #abcfc2;border-radius:8px;padding:8px 10px;font-weight:700}.input-row .boolean{display:flex;align-items:center;gap:5px}.input-row .boolean input{width:auto}.columns{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,.9fr);gap:16px;margin-top:17px}.flowbox{border:1px solid var(--line);border-radius:12px;padding:8px;overflow-x:auto}svg{width:100%;height:auto;min-width:420px;display:block}svg text{font-family:Inter,'Segoe UI',Arial,sans-serif;fill:#27434f;font-weight:700;font-size:13px}svg .shape{fill:white;stroke:#8aa5b3;stroke-width:2}svg .edge{fill:none;stroke:#8aa5b3;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}svg .active .shape{fill:#bcf3dd;stroke:#049272;stroke-width:3}svg .done .shape{fill:#e5f6ee;stroke:#55ae90}svg .edge.active{stroke:#009c78;stroke-width:4;stroke-dasharray:8 5;animation:flow .65s linear infinite}@keyframes flow{to{stroke-dashoffset:-26}}.code{background:#142e3a;color:#effaf8;border-radius:11px;padding:13px;white-space:pre;overflow:auto;font:13px/1.7 Consolas,monospace}.code .line{display:block;padding:0 8px;border-left:3px solid transparent}.code .line.active{background:#23644e;border-left-color:#a6f0c6}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:13px 0}.controls button{border:0;background:var(--green);border-radius:9px;color:white;padding:10px 12px;font-weight:750;cursor:pointer}.controls button.secondary{background:#eaf1f3;color:#21404e}.explain{background:#f1f8f6;border-left:4px solid var(--green);padding:12px;border-radius:9px;min-height:72px}.output{margin-top:12px;background:#f7fafb;border:1px solid var(--line);border-radius:10px;padding:12px}.small{font-size:12px;color:var(--muted)}.footer{text-align:center;padding:24px;color:#73838b}@media(max-width:960px){.layout,.columns{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){svg .edge.active{animation:none}}
</style></head><body><header>Decisiones <span>en acción</span></header><main><p class="intro">Abre un tema, elige una situación, modifica los datos y sigue el recorrido del algoritmo.</p><div class="layout"><aside class="panel"><p class="eyebrow">Explora las estructuras</p><div id="accordion"></div></aside><article class="panel"><p class="eyebrow" id="category"></p><h1 id="title"></h1><p class="scenario" id="scenario"></p><div id="inputs" class="input-row"></div><div class="columns"><div><p class="eyebrow" style="margin-top:16px">Diagrama de flujo · recorrido animado</p><div class="flowbox"><svg id="flow" viewBox="0 0 600 640" role="img" aria-label="Diagrama completo: las ramas convergen antes de Fin"></svg></div></div><div><p class="eyebrow" style="margin-top:16px">Instrucciones PSeInt</p><div class="code" id="code"></div><div class="controls"><button id="next">▶ Paso siguiente</button><button id="auto" class="secondary">▶ Automático</button><button id="reset" class="secondary">↺ Reiniciar</button></div><div id="explain" class="explain" aria-live="polite"></div><div class="output"><span class="small">SALIDA DEL ALGORITMO</span><div id="output">Aún sin ejecutar.</div></div></div></div></article></div></main><footer class="footer">Aprendiendo con @LaProfeVivy</footer><script>
const groups=[
{name:'1 · Decisión simple',items:[
{id:'biblio',title:'Préstamo de biblioteca',context:'La biblioteca universitaria envía un aviso cuando un préstamo supera los 7 días. Experimenta con distintos plazos para descubrir cuándo aparece el aviso.',inputs:[['dias','Días de préstamo',9]],mode:'simple',cond:['dias > 7',d=>d.dias>7],yes:'Enviar recordatorio',no:'Sin mensaje',code:['Algoritmo Prestamo','  Definir dias Como Entero','  Leer dias','  Si dias > 7 Entonces','    Escribir "Enviar recordatorio"','  FinSi','FinAlgoritmo']},
{id:'alerta',title:'Datos móviles',context:'Un celular avisa cuando quedan menos de 500 MB en el plan de datos. Observa qué ocurre si el consumo deja el saldo por encima o por debajo del límite.',inputs:[['mb','MB disponibles',240]],mode:'simple',cond:['mb < 500',d=>d.mb<500],yes:'Activar alerta de datos',no:'Sin alerta',code:['Algoritmo DatosMoviles','  Definir mb Como Entero','  Leer mb','  Si mb < 500 Entonces','    Escribir "Activar alerta de datos"','  FinSi','FinAlgoritmo']}]},
{name:'2 · Decisión doble',items:[
{id:'transporte',title:'Saldo de transporte',context:'Antes de salir a clase, una aplicación revisa si el saldo de la tarjeta es inferior a $3.000. Si falta saldo pide recargar; de lo contrario permite continuar.',inputs:[['saldo','Saldo ($)',2500]],mode:'double',cond:['saldo < 3000',d=>d.saldo<3000],yes:'Recarga tu tarjeta',no:'Saldo disponible',code:['Algoritmo Transporte','  Definir saldo Como Real','  Leer saldo','  Si saldo < 3000 Entonces','    Escribir "Recarga tu tarjeta"','  SiNo','    Escribir "Saldo disponible"','  FinSi','FinAlgoritmo']},
{id:'entrega',title:'Entrega de un trabajo',context:'En el campus virtual, un trabajo se considera oportuno si se entrega hasta el día 15. Cambia el día de entrega para comparar los dos mensajes.',inputs:[['dia','Día de entrega',16]],mode:'double',cond:['dia <= 15',d=>d.dia<=15],yes:'Entrega a tiempo',no:'Entrega fuera de plazo',code:['Algoritmo EntregaTrabajo','  Definir dia Como Entero','  Leer dia','  Si dia <= 15 Entonces','    Escribir "Entrega a tiempo"','  SiNo','    Escribir "Entrega fuera de plazo"','  FinSi','FinAlgoritmo']}]},
{name:'3 · Decisiones encadenadas',items:[
{id:'estudio',title:'Situación 1 · Tiempo de estudio',context:'Una plataforma clasifica la duración de una sesión de estudio: menos de 20 minutos, breve; de 20 a 44, regular; desde 45, extensa.',inputs:[['minutos','Minutos de estudio',35]],mode:'chain',rules:[['minutos < 20',d=>d.minutos<20,'Sesión breve'],['minutos < 45',d=>d.minutos<45,'Sesión regular']],'otherwise':'Sesión extensa',code:['Algoritmo SesionEstudio','  Definir minutos Como Entero','  Leer minutos','  Si minutos < 20 Entonces','    Escribir "Sesión breve"','  SiNo','    Si minutos < 45 Entonces','      Escribir "Sesión regular"','    SiNo','      Escribir "Sesión extensa"','    FinSi','  FinSi','FinAlgoritmo']},
{id:'energia',title:'Situación 2 · Nivel de batería',context:'Una app distingue tres estados: batería crítica por debajo de 15 %, batería baja entre 15 % y 39 %, y batería suficiente desde 40 %.',inputs:[['bateria','Batería (%)',27]],mode:'chain',rules:[['bateria < 15',d=>d.bateria<15,'Batería crítica'],['bateria < 40',d=>d.bateria<40,'Batería baja']],'otherwise':'Batería suficiente',code:['Algoritmo EstadoBateria','  Definir bateria Como Entero','  Leer bateria','  Si bateria < 15 Entonces','    Escribir "Batería crítica"','  SiNo','    Si bateria < 40 Entonces','      Escribir "Batería baja"','    SiNo','      Escribir "Batería suficiente"','    FinSi','  FinSi','FinAlgoritmo']},
{id:'asistencia',title:'Situación 3 · Participación en clase',context:'Una aplicación clasifica las participaciones registradas: ninguna, participación inicial con 1 o 2, y participación constante con 3 o más.',inputs:[['n','Participaciones',2]],mode:'chain',rules:[['n == 0',d=>d.n===0,'Sin participación'],['n < 3',d=>d.n<3,'Participación inicial']],'otherwise':'Participación constante',code:['Algoritmo Participacion','  Definir n Como Entero','  Leer n','  Si n = 0 Entonces','    Escribir "Sin participación"','  SiNo','    Si n < 3 Entonces','      Escribir "Participación inicial"','    SiNo','      Escribir "Participación constante"','    FinSi','  FinSi','FinAlgoritmo']}]},
{name:'4 · Condiciones con Y / O',items:[
{id:'beca',title:'Situación 1 · Acceso a beneficio (Y)',context:'Una plataforma concede un beneficio solo cuando el promedio es al menos 4,0 Y la asistencia es de al menos 80 %. Prueba qué sucede cuando una de las dos condiciones falla.',inputs:[['promedio','Promedio',4.3],['asistencia','Asistencia (%)',75]],mode:'double',cond:['promedio >= 4 Y asistencia >= 80',d=>d.promedio>=4&&d.asistencia>=80],yes:'Beneficio aprobado',no:'No cumple requisitos',code:['Algoritmo Beneficio','  Definir promedio, asistencia Como Real','  Leer promedio, asistencia','  Si promedio >= 4 Y asistencia >= 80 Entonces','    Escribir "Beneficio aprobado"','  SiNo','    Escribir "No cumple requisitos"','  FinSi','FinAlgoritmo']},
{id:'alerta2',title:'Situación 2 · Alerta de conectividad (O)',context:'Una plataforma activa una alerta si el nivel de batería baja de 15 % O el saldo de datos baja de 200 MB. Basta con que se cumpla una condición.',inputs:[['bateria','Batería (%)',55],['mb','MB disponibles',160]],mode:'double',cond:['bateria < 15 O mb < 200',d=>d.bateria<15||d.mb<200],yes:'Mostrar alerta',no:'Funcionamiento normal',code:['Algoritmo AlertaConectividad','  Definir bateria, mb Como Entero','  Leer bateria, mb','  Si bateria < 15 O mb < 200 Entonces','    Escribir "Mostrar alerta"','  SiNo','    Escribir "Funcionamiento normal"','  FinSi','FinAlgoritmo']}]}
];
const $=id=>document.getElementById(id);let current=groups[0].items[0],steps=[],cursor=-1,timer=null;const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
function buildAccordion(){ $('accordion').innerHTML=groups.map((g,i)=>`<details ${i===0?'open':''}><summary>${g.name}</summary>${g.items.map(c=>`<button type="button" class="situation" data-id="${c.id}">${c.title}</button>`).join('')}</details>`).join('');document.querySelectorAll('.situation').forEach(b=>b.onclick=()=>{document.querySelectorAll('details').forEach(d=>d.open=d.contains(b));load(groups.flatMap(g=>g.items).find(c=>c.id===b.dataset.id))}) }
function el(tag,attrs={},body=''){return `<${tag} ${Object.entries(attrs).map(([k,v])=>`${k}="${v}"`).join(' ')}>${body}</${tag}>`}
function draw(){let chained=current.mode==='chain', svg=`<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#8aa5b3" stroke-width="1.5"/></marker></defs>`;
function path(id,d){svg+=`<path id="e-${id}" class="edge" d="${d}" marker-end="url(#arrow)"/>`}
function shape(id,type,x,y,w,h,txt){let geometry=type==='oval'?`<ellipse class="shape" cx="${x}" cy="${y}" rx="${w/2}" ry="${h/2}"/>`:type==='diamond'?`<polygon class="shape" points="${x},${y-h/2} ${x+w/2},${y} ${x},${y+h/2} ${x-w/2},${y}"/>`:`<rect class="shape" x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="8"/>`;let words=txt.length>23?txt.split(' '):null;let t=words&&txt.length>28?`<text text-anchor="middle" x="${x}" y="${y-7}"><tspan x="${x}">${esc(words.slice(0,Math.ceil(words.length/2)).join(' '))}</tspan><tspan x="${x}" dy="17">${esc(words.slice(Math.ceil(words.length/2)).join(' '))}</tspan></text>`:`<text text-anchor="middle" x="${x}" y="${y+4}">${esc(txt)}</text>`;svg+=`<g id="n-${id}">${geometry}${t}</g>`}
function label(x,y,t){svg+=`<text x="${x}" y="${y}" style="fill:#527789;font-size:12px">${t}</text>`}
shape('start','oval',300,35,120,38,'Inicio');shape('read','rect',300,111,240,48,'Leer datos');path('sr','M300 54 V87');
if(!chained){shape('c1','diamond',300,245,330,118,current.cond[0]);path('rc','M300 135 V185');shape('a','rect',115,395,220,60,current.yes);shape('b','rect',485,395,220,60,current.no);label(133,231,'Sí');label(443,231,'No');path('ya','M135 245 H115 V365');path('nb','M465 245 H485 V365');shape('end','oval',300,583,140,42,'Fin');path('am','M115 425 V500 H300');path('bm','M485 425 V500 H300');path('end','M300 500 V561');if(current.mode==='simple'){$('flow').setAttribute('viewBox','0 0 600 620')}else $('flow').setAttribute('viewBox','0 0 600 620')}
else{shape('c1','diamond',300,212,270,90,current.rules[0][0]);path('rc','M300 135 V167');shape('c2','diamond',370,347,265,90,current.rules[1][0]);shape('a','rect',105,315,180,58,current.rules[0][2]);shape('b','rect',280,470,180,58,current.rules[1][2]);shape('c','rect',505,470,180,58,current.otherwise);label(130,200,'Sí');label(320,275,'No');label(245,346,'Sí');label(480,347,'No');path('ya','M165 212 H105 V286');path('nextcond','M300 257 V347 H237'); // revised below after layout
// the second diamond must enter at its top; route right outside first diamond
svg=svg.replace('id="e-nextcond" class="edge" d="M300 257 V347 H237"','id="e-nextcond" class="edge" d="M300 257 V277 H370 V302"');
path('yb','M237 347 H280 V441');path('nc','M503 347 H505 V441');shape('end','oval',300,586,140,40,'Fin');path('am','M105 344 V537 H300');path('bm','M280 499 V537 H300');path('cm','M505 499 V537 H300');path('end','M300 537 V563');$('flow').setAttribute('viewBox','0 0 620 630')}
$('flow').innerHTML=svg}
function values(){return Object.fromEntries(current.inputs.map(([key])=>[key,Number(document.querySelector(`[data-var="${key}"]`).value)]))}
function plan(){stop();cursor=-1;let d=values(), mode=current.mode;steps=[['start',0,'Comienza el algoritmo.',null,null],['read',2,'Se leen los datos: '+Object.entries(d).map(([k,v])=>`${k} = ${v}`).join(', ')+'.','sr',null]];if(mode!=='chain'){let ok=current.cond[1](d);steps.push(['c1',mode==='simple'?3:3,`Se evalúa «${current.cond[0]}»: ${ok?'verdadero':'falso'}.`,'rc',null]);steps.push([ok?'a':'b',ok?4:(mode==='simple'?5:6),ok?`Se toma el camino Sí: ${current.yes}.`:(mode==='simple'?'La condición fue falsa: no se ejecuta ninguna acción.':`Se toma el camino No: ${current.no}.`),ok?'ya':'nb',ok?current.yes:(mode==='simple'?null:current.no)]);steps.push(['end',current.code.length-1,'Ambas alternativas llegan al mismo final.',ok?'am':'bm',null])}
else{let a=current.rules[0][1](d), b=current.rules[1][1](d);steps.push(['c1',3,`Primera condición: ${a?'verdadera':'falsa'}.`,'rc',null]);if(a){steps.push(['a',4,'Se elige el primer resultado.', 'ya',current.rules[0][2]]);steps.push(['end',current.code.length-1,'No hace falta evaluar la segunda condición.','am',null])}else{steps.push(['c2',6,`Primera condición falsa. Segunda condición: ${b?'verdadera':'falsa'}.`,'nextcond',null]);steps.push([b?'b':'c',b?7:9,'Se ejecuta la alternativa correspondiente.',b?'yb':'nc',b?current.rules[1][2]:current.otherwise]);steps.push(['end',current.code.length-1,'Se unen los caminos y finaliza el algoritmo.',b?'bm':'cm',null])}}
$('output').textContent='Aún sin ejecutar.';$('explain').textContent='Pulsa «Paso siguiente» para recorrer el diagrama.';$('next').disabled=false;highlight()}
function highlight(){document.querySelectorAll('#flow g').forEach(g=>g.classList.remove('active','done'));document.querySelectorAll('#flow .edge').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.code .line').forEach(e=>e.classList.remove('active'));steps.slice(0,cursor).forEach(s=>$('n-'+s[0])?.classList.add('done'));if(cursor>=0){let s=steps[cursor];$('n-'+s[0])?.classList.add('active');if(s[3])$('e-'+s[3])?.classList.add('active');$('code').children[s[1]]?.classList.add('active')}}
function advance(){if(cursor>=steps.length-1){stop();return}cursor++;highlight();let s=steps[cursor];$('explain').textContent=`Paso ${cursor+1} de ${steps.length}: ${s[2]}`;if(s[4])$('output').textContent=s[4];if(cursor===steps.length-1){$('next').disabled=true;stop()}}
function stop(){if(timer!==null){clearInterval(timer);timer=null}$('auto').textContent='▶ Automático'}
function load(c){current=c;$('category').textContent=groups.find(g=>g.items.includes(c)).name;$('title').textContent=c.title.replace(/^Situación \d+ · /,'');$('scenario').textContent=c.context;$('inputs').innerHTML=c.inputs.map(([k,label,val])=>`<label for="in-${k}">${label}</label><input type="number" step="any" id="in-${k}" data-var="${k}" value="${val}">`).join('');document.querySelectorAll('#inputs input').forEach(x=>x.addEventListener('input',plan));$('code').innerHTML=c.code.map(s=>`<span class="line">${esc(s)}</span>`).join('');document.querySelectorAll('.situation').forEach(b=>b.classList.toggle('active',b.dataset.id===c.id));draw();plan()}
$('next').onclick=advance;$('reset').onclick=plan;$('auto').onclick=()=>{if(timer!==null){stop();return}if(cursor===steps.length-1)plan();advance();if(cursor<steps.length-1){timer=setInterval(advance,1350);$('auto').textContent='⏸ Pausar'}};buildAccordion();load(current);
</script></body></html>
