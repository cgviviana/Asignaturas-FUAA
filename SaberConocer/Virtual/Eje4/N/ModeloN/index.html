<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OVA · Modelo de negocio de una app móvil</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--azul:#0b2d5b;--azul2:#1d4f91;--rojo:#c8102e;--amar:#f2a900;--verde:#1f8a4c;--fondo:#f4f6fa;--txt:#1b2333;--gris:#6b7486;--linea:#d9dee8}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--fondo);color:var(--txt);font-size:16px;line-height:1.4}
header{background:var(--azul);color:#fff;padding:14px max(16px,calc((100% - 900px)/2)) 0}
header h1{margin:0 0 10px;font-size:1.2rem;font-weight:800}
header p{margin:2px 0 10px;font-size:.85rem;opacity:.85}
#stepper{display:flex;gap:4px;overflow-x:auto}
#stepper button{flex:1;min-width:80px;background:transparent;color:#fff;border:0;border-bottom:4px solid transparent;padding:8px 4px;font:600 .9rem Nunito;cursor:pointer;opacity:.7}
#stepper button.on{border-color:var(--amar);opacity:1}
#stepper button.ok::after{content:" ✓";color:var(--amar)}
.wrap{max-width:900px;margin:0 auto;padding:12px 14px 24px}
#voz{display:flex;gap:12px;align-items:flex-start;margin:12px 0}
#voz>svg{flex:0 0 72px;height:72px}
.burbuja{flex:1;background:#fff;border-left:5px solid var(--amar);padding:10px 12px;border-radius:0 12px 12px 12px}
.burbuja{display:flex;gap:8px;align-items:center}.burbuja p{margin:0;flex:1}
.fila{display:flex;gap:8px;flex-wrap:wrap}
button.b{font:600 .85rem Nunito;padding:4px 12px;border-radius:6px;border:1.5px solid var(--azul2);background:#fff;color:var(--azul2);cursor:pointer;min-width:92px}
button.b:disabled{opacity:.4;cursor:default}
button.main{font:800 .95rem Nunito;padding:8px 22px;border-radius:8px;border:0;background:var(--rojo);color:#fff;cursor:pointer;min-width:220px}
h2{font-size:1.05rem;color:var(--azul);margin:18px 0 8px}
.preg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.preg3 div{background:#fff;border-top:4px solid var(--azul2);padding:8px;border-radius:8px;font-size:.88rem;text-align:center}
.preg3 b{display:block;font-size:1.3rem}
.modelos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.modelos button{background:#fff;border:2px solid var(--linea);border-radius:10px;padding:10px 6px;font:700 .9rem Nunito;color:var(--txt);cursor:pointer}
.modelos button span{display:block;font-size:1.6rem}
.modelos button.on{border-color:var(--azul2);background:#eaf1fb}
.modelos button.visto{border-style:dashed}
.detalle{background:#fff;border-radius:10px;padding:12px 14px;margin-top:10px;min-height:70px}
.detalle h3{margin:0 0 6px;color:var(--azul)}
.detalle dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:.92rem}
.detalle dt{font-weight:800;color:var(--gris)}
.detalle dd{margin:0}
.sello{display:inline-block;padding:2px 10px;border-radius:20px;font-weight:800;font-size:.8rem;color:#fff}
.si{background:var(--verde)}.no{background:var(--rojo)}.medio{background:var(--amar);color:#222}
.ops{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.ops button{text-align:left;background:#fff;border:2px solid var(--linea);border-radius:10px;padding:10px 12px;font:600 .93rem Nunito;color:var(--txt);cursor:pointer}
.ops button.bien{border-color:var(--verde);background:#e7f5ec}
.ops button.mal{border-color:var(--rojo);background:#fdecef}
.ops button.tachado{opacity:.35;text-decoration:line-through}
.fb{min-height:24px;font-weight:700;margin:4px 0 10px}
.fb.bien{color:var(--verde)}.fb.mal{color:var(--rojo)}
/* lienzo */
.lienzo{display:grid;grid-template-columns:repeat(5,1fr);grid-template-areas:"soc act prop rel seg" "soc rec prop can seg" "cos cos ing ing ing";gap:4px;margin-bottom:10px}
.celda{background:#fff;border:1.5px solid var(--linea);border-radius:6px;padding:6px;font-size:.75rem;min-height:62px}
.celda b{display:block;color:var(--azul);font-size:.72rem;text-transform:uppercase;letter-spacing:.02em}
.celda.actual{border-color:var(--amar);box-shadow:0 0 0 2px var(--amar);cursor:pointer}
.celda.lleno{background:#eaf1fb;border-color:var(--azul2)}
.bloque-t{font-size:.8rem;color:var(--gris);font-weight:700}
.registro{background:#fff;border-radius:8px;padding:8px 12px;font-size:.85rem;margin-top:10px}
.registro ol{margin:4px 0;padding-left:20px}
/* números */
.ctrl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;margin-bottom:10px}
.ctrl label{font-weight:700;font-size:.9rem}
.ctrl output{font-weight:800;color:var(--azul)}
.ctrl input{grid-column:1/3;width:100%;accent-color:var(--rojo)}
.barras{background:#fff;border-radius:10px;padding:12px}
.barra{margin:6px 0}
.barra small{font-weight:700}
.barra div{height:18px;border-radius:4px;transition:width .3s}
.resul{font-size:1.1rem;font-weight:800;margin-top:8px}
.formula{font-size:.85rem;color:var(--gris)}
.pro{font-size:.85rem;color:var(--gris);margin-bottom:6px}
button.ic{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--azul2);background:#fff;color:var(--azul2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative;padding:0;flex:0 0 auto}
button.ic:disabled{opacity:.35;cursor:default}
button.ic svg{width:20px;height:20px}
button.ic.mini{width:26px;height:26px;margin-left:8px;vertical-align:middle}button.ic.mini svg{width:15px;height:15px}
button.ic .n{position:absolute;top:-5px;right:-5px;background:var(--amar);color:#222;font:800 .65rem Nunito;border-radius:10px;padding:1px 5px}
#toast{z-index:70!important;position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.25s;background:#fff;border-radius:12px;box-shadow:0 6px 22px rgba(0,0,0,.2);padding:12px 14px;width:min(92vw,440px);display:flex;gap:10px;align-items:flex-start;z-index:40;border-left:6px solid var(--verde);font-weight:600}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast.mal{border-left-color:var(--rojo)}
#toast b{font-size:1.2rem;line-height:1}
#toast.mal b{color:var(--rojo)}#toast b{color:var(--verde)}
#modal,#preg,#dec{position:fixed;inset:0;background:rgba(11,45,91,.45);display:none;align-items:center;justify-content:center;z-index:45}
#modal>div,#preg>div,#dec>div{background:#fff;border-radius:12px;padding:14px 16px;width:min(92vw,480px);max-height:70vh;overflow:auto}
#modal h3,#preg h3,#dec h3{margin:0 0 8px;color:var(--azul);display:flex;justify-content:space-between;align-items:center}
.def{color:var(--gris);font-size:.9rem;margin:0 0 8px}
#pops{gap:0;margin:8px 0}
#pops button{border:0;border-bottom:1px solid #edf0f5;border-radius:0;background:none;padding:10px 4px 10px 30px;font:400 .93rem Nunito;position:relative}
#pops button::before{content:"";position:absolute;left:6px;top:12px;width:14px;height:14px;border:1.5px solid #b9c2d3;border-radius:50%}
#pops button:last-child{border-bottom:0}
#pops button.bien{background:none;color:var(--verde);font-weight:700}#pops button.bien::before{background:var(--verde);border-color:var(--verde)}
#pops button.mal{background:none;color:var(--rojo)}#pops button.mal::before{background:var(--rojo);border-color:var(--rojo)}
#preg h3{font-size:1rem}
#dops{gap:0;margin:8px 0}
#dops button{border:0;border-bottom:1px solid #edf0f5;border-radius:0;background:none;padding:10px 4px 10px 30px;font:400 .93rem Nunito;position:relative}
#dops button::before{content:"";position:absolute;left:6px;top:12px;width:14px;height:14px;border:1.5px solid #b9c2d3;border-radius:50%}
#dops button:last-child{border-bottom:0}
#dops button.bien{background:none;color:var(--verde);font-weight:700}#dops button.bien::before{background:var(--verde);border-color:var(--verde)}
#dops button.mal{background:none;color:var(--rojo)}#dops button.mal::before{background:var(--rojo);border-color:var(--rojo)}
table.t{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;font-size:.93rem;margin-bottom:12px}
table.t td{padding:8px 12px;border-bottom:1px solid #edf0f5}
table.t td:last-child{text-align:right;font-weight:700;white-space:nowrap}
table.t tr.tot td{font-weight:800;color:var(--azul);border-bottom:0;background:#eef3fa}
#modal ol{margin:0;padding-left:20px;font-size:.9rem}
/* números */
.datos{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.92rem;margin-bottom:10px}
.chips{display:inline-flex;gap:4px;margin-left:4px}
.chips button{font:700 .8rem Nunito;padding:2px 10px;border-radius:14px;border:1.5px solid var(--azul2);background:#fff;color:var(--azul2);cursor:pointer}
.chips button.on{background:var(--azul2);color:#fff}
.deja{font-size:1.05rem;font-weight:800;color:var(--azul)}
.deja small{display:block;font-weight:600;color:var(--gris);font-size:.8rem}
.pista{position:relative;height:46px;background:#e3e8f1;border-radius:8px;margin:28px 0 8px;overflow:visible}
.seg{position:absolute;top:0;height:100%;background:var(--azul2);border-right:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:1.1rem;transition:.3s}
.seg:first-child{border-radius:8px 0 0 8px}
.meta{position:absolute;top:-24px;bottom:-6px;border-left:3px dashed var(--rojo)}
.meta span{position:absolute;top:0;left:6px;white-space:nowrap;font:800 .75rem Nunito;color:var(--rojo)}
.contador{display:flex;align-items:center;gap:12px;margin:8px 0;font-weight:800}
.contador span{font-size:1.1rem;min-width:110px;text-align:center}
footer{text-align:center;color:var(--gris);font-size:.85rem;padding:16px}
footer b{color:var(--rojo)}
@media(max-width:620px){
 .modelos{grid-template-columns:repeat(2,1fr)}
 .lienzo{grid-template-columns:repeat(2,1fr);grid-template-areas:"seg prop" "can rel" "ing ing" "rec act" "soc soc" "cos cos"}
 .celda{min-height:48px}
 #voz>svg{flex-basis:56px;height:56px}
 button.main{width:100%}
}
</style>
</head>
<body>
<header>
 <h1>Modelo de negocio de una app móvil</h1>
 <nav id="stepper">
  <button data-s="0" class="on">1. Aprende</button>
  <button data-s="1">2. Lienzo</button>
  <button data-s="2">3. Números</button>
  <button data-s="3">4. Reto</button>
 </nav>
</header>

<div class="wrap">
 <section id="voz">
  <svg viewBox="0 0 100 100" aria-label="Profe Vivy">
   <circle cx="50" cy="50" r="48" fill="#eaf1fb"/>
   <path d="M22 62c-4-30 10-46 28-46s32 16 28 46c-4-6-6-14-6-22H28c0 8-2 16-6 22z" fill="#e3824f"/>
   <path d="M26 98c2-18 12-26 24-26s22 8 24 26z" fill="#0b2d5b"/>
   <rect x="44" y="62" width="12" height="12" fill="#f3cfb3"/>
   <ellipse cx="50" cy="46" rx="19" ry="22" fill="#f6d8bf"/>
   <path d="M30 40c4-14 14-18 22-18 10 0 18 6 19 18-8-2-18-8-22-14-4 8-11 12-19 14z" fill="#e3824f"/>
   <circle cx="43" cy="47" r="2.3" fill="#2b2b2b"/><circle cx="57" cy="47" r="2.3" fill="#2b2b2b"/>
   <path d="M44 57q6 5 12 0" stroke="#b8454b" stroke-width="2.2" fill="none" stroke-linecap="round"/>
   <circle cx="38" cy="53" r="3" fill="#f2a7a0" opacity=".6"/><circle cx="62" cy="53" r="3" fill="#f2a7a0" opacity=".6"/>
  </svg>
  <div class="burbuja">
   <p id="dice"></p>
   <button class="ic" id="oir" title="Escuchar" aria-label="Escuchar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></button><button class="ic" id="parar" title="Detener" aria-label="Detener"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg></button>
  </div>
 </section>

 <main id="stage"></main>
</div>
<footer>Aprendiendo con <b>@LaProfeVivy</b></footer>

<div id="toast"><b></b><span></span></div>
<div id="preg"><div><h3><span id="pt"></span><button class="ic" id="pcerrar" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h3><p style="margin:0"><b id="pq"></b></p><div class="ops" id="pops"></div><div class="fila"><button class="ic" id="pis" title="Pista" aria-label="Pista"></button></div></div></div>
<div id="dec"><div><h3><span>Tu decisión</span><button class="ic" id="dcerrar" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h3><p style="margin:0"><b>¿Qué modelo eliges para la app de retardos?</b></p><div class="ops" id="dops"></div></div></div>
<div id="modal"><div><h3><span id="mt">Registro de decisiones</span> <button class="ic" id="cerrar" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h3><ol id="regList"></ol><div id="mbody"></div></div></div>

<script>
const $=s=>document.querySelector(s);
const fmt=n=>'$'+Math.round(n).toLocaleString('es-CO');
const st={s:0,hechas:[false,false,false,false],vistos:new Set(),modelo:null,eleccion:false,bi:0,resp:[],pista:0,tachados:[],log:[],qi:0,score:0,qres:[],eq:null};

const ICO={"oir": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"><path d=\"M4 9h4l5-4v14l-5-4H4z\"/><path d=\"M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11\"/></svg>", "parar": "<svg viewBox=\"0 0 24 24\"><rect x=\"6\" y=\"6\" width=\"12\" height=\"12\" rx=\"2\" fill=\"currentColor\"/></svg>", "pista": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z\"/></svg>", "undo": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 14L4 9l5-5\"/><path d=\"M4 9h10a6 6 0 0 1 0 12h-3\"/></svg>", "reset": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12a9 9 0 1 0 3-6.7L3 8\"/><path d=\"M3 3v5h5\"/></svg>", "lista": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01\"/></svg>", "menos": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\"><path d=\"M5 12h14\"/></svg>", "mas": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/></svg>", "x": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6L6 18\"/></svg>"};
let tt;function aviso(msg,ok){const t=$('#toast');t.className=ok?'show':'show mal';t.querySelector('b').textContent=ok?'✓':'✗';t.querySelector('span').textContent=msg;clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),5000);hablar(msg)}
$('#toast').onclick=()=>$('#toast').classList.remove('show');
function hablar(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-CO';const v=vozMujer();if(v)u.voice=v;u.pitch=1.1;speechSynthesis.speak(u)}catch(e){}}
function ordenCon(n,ok,pos){const r=mez(n).filter(i=>i!==ok);r.splice(pos,0,ok);return r}
function mez(n){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
/* ---------- Voz ---------- */
function decir(t){$('#dice').textContent=t}
function vozMujer(){
 const v=speechSynthesis.getVoices().filter(x=>x.lang&&x.lang.startsWith('es'));
 const f=/(helena|sabina|laura|paulina|monica|mónica|elvira|dalia|paloma|lucia|lucía|marisol|female|mujer|google español)/i;
 return v.find(x=>f.test(x.name))||v[0]||null;
}
$('#oir').onclick=()=>hablar($('#dice').textContent);
$('#parar').onclick=()=>{try{speechSynthesis.cancel()}catch(e){}};
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}

/* ---------- Navegación ---------- */
document.querySelectorAll('#stepper button').forEach(b=>b.onclick=()=>ir(+b.dataset.s));
function ir(s){st.s=s;$('#dec').style.display='none';$('#toast').classList.remove('show');try{speechSynthesis.cancel()}catch(e){}
 document.querySelectorAll('#stepper button').forEach((b,i)=>{b.classList.toggle('on',i===s);b.classList.toggle('ok',st.hechas[i])});
 [e1,e2,e3,e4][s]();window.scrollTo({top:0,behavior:'smooth'})}
function marcar(i){st.hechas[i]=true;document.querySelectorAll('#stepper button')[i].classList.add('ok')}

/* ---------- Etapa 1: Aprende ---------- */
const MODELOS=[
 {ic:'🔁',n:'Suscripción',como:'El cliente paga cada mes o cada año mientras usa la app.',ej:'Spotify, Canva, Netflix',v:'si',vt:'Sirve',por:'El colegio paga una suscripción anual según su número de estudiantes. Ingreso estable para mantener la app.'},
 {ic:'🎁',n:'Freemium',como:'Una versión básica gratis y funciones avanzadas pagas.',ej:'Duolingo, Zoom, Dropbox',v:'si',vt:'Sirve para empezar',por:'Un mes de prueba gratis para que el colegio conozca la app y luego pase a la suscripción.'},
 {ic:'🔑',n:'Licencia única',como:'El cliente paga una sola vez y la app queda suya.',ej:'Minecraft, Office 2021',v:'medio',vt:'Con cuidado',por:'El colegio paga una vez, pero la nube y el soporte cuestan todos los meses. El dinero se acaba.'},
 {ic:'🚕',n:'Pago por uso',como:'Se cobra una comisión por cada transacción.',ej:'Uber, Rappi, Mercado Libre',v:'no',vt:'No sirve',por:'Cobrar por cada QR escaneado vuelve el precio impredecible y el colegio no puede presupuestarlo.'},
 {ic:'📢',n:'Publicidad',como:'La app es gratis y gana dinero mostrando anuncios.',ej:'Instagram, TikTok, juegos gratis',v:'no',vt:'No sirve',por:'Los usuarios son menores de edad y el aula es un espacio académico. El ingreso viene del colegio.'},
 {ic:'🛒',n:'Compras en la app',como:'El usuario compra extras dentro de la app.',ej:'Free Fire, Candy Crush',v:'no',vt:'No sirve',por:'Cargaría costos a estudiantes y acudientes. Quien paga es el cliente: el colegio.'}
];
function e1(){
 decir(st.eleccion?'¡Muy bien! Elegiste el modelo de la app. Ahora vamos a armar su lienzo de negocio, bloque por bloque.':'Un modelo de negocio explica cómo tu app crea valor y cómo gana dinero para sostenerse.');
 $('#stage').innerHTML=`
 <h2>Tres preguntas de todo modelo de negocio</h2>
 <div class="preg3"><div><b>❓</b>¿Qué problema resuelve?</div><div><b>👥</b>¿Para quién?</div><div><b>💵</b>¿Quién paga y cómo?</div></div>
 <h2>Seis modelos de negocio de apps</h2>
 <div class="modelos">${MODELOS.map((m,i)=>`<button data-i="${i}" class="${st.modelo===i?'on':''} ${st.vistos.has(i)?'visto':''}"><span>${m.ic}</span>${m.n}</button>`).join('')}</div>
 ${st.modelo===null?'':`<div class="detalle">${detalle(st.modelo)}</div>`}
`;
 document.querySelectorAll('.modelos button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;st.modelo=i;st.vistos.add(i);const m=MODELOS[i];decir(m.n+'. '+m.como+' Para la app de retardos: '+m.por);e1keep();if(st.vistos.size===6&&!st.eleccion)setTimeout(abrirDec,1800)});
}
function e1keep(){const keepDecir=$('#dice').textContent;e1();decir(keepDecir)}
function detalle(i){const m=MODELOS[i];return `<h3>${m.ic} ${m.n}</h3><dl><dt>Cómo gana</dt><dd>${m.como}</dd><dt>Ejemplos</dt><dd>${m.ej}</dd><dt>En nuestra app</dt><dd>${m.por}</dd></dl>`}
const DOPS=[{x:'Suscripción anual que paga el colegio, con un mes de prueba gratis',ok:1},{x:'App gratis con publicidad para estudiantes'},{x:'Cobro a cada estudiante por cada retardo'}];
const DORD=ordenCon(3,0,1);
function abrirDec(){
 if(st.s!==0)return;
 $('#dops').innerHTML=DORD.map(i=>`<button data-i="${i}">${DOPS[i].x}</button>`).join('');
