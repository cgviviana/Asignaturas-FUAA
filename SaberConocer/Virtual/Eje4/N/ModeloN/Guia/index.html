<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Miniguía · Lienzo Modelo Canvas</title><style>
:root{--frame:#d6d6d6;--page:#e9e9e9;--stage:#9cc8ef;--card:#fff;--line:#c8c8c8;--ink:#1d1d1d;--soft:#555;--bar1:#4a4a4a;--bar2:#2b2b2b;--hover:#e8f1fb;--active:#d9e8f7;--blue:#2f78c4;--board:#c8955a;--board-dark:#a8763f;--clip:#9aa3ad;--paper:#fffef9;--green:#248342;--red:#b3261e}*{box-sizing:border-box}body{margin:0;background:var(--page);font-family:"Segoe UI",Calibri,Arial,sans-serif;color:var(--ink);padding:16px;display:flex;justify-content:center}button{font:inherit;cursor:pointer}.player{width:100%;max-width:980px;background:var(--frame);border-radius:8px;padding:10px;box-shadow:0 2px 8px #0003}.stage{background:var(--stage);padding:12px;border-radius:4px}.card{background:#fff;border:1px solid #8fb3d6;border-radius:3px;overflow:hidden}.titlebar{background:linear-gradient(var(--bar1),var(--bar2));color:white;font-size:17px;font-weight:600;letter-spacing:.5px;padding:10px 16px}.cover{padding:30px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:13px;min-height:395px;justify-content:center}.tag{font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--blue)}h1{font-size:clamp(28px,4vw,39px);margin:0}.cover p{color:var(--soft);margin:0;max-width:55ch;line-height:1.45}.robot{width:110px;height:100px}.start{background:linear-gradient(#3d8ad6,#2a6bb0);color:white;font-weight:700;border:0;border-radius:6px;padding:12px 28px;box-shadow:0 2px 0 #1d4f85}.body{display:flex;gap:20px;padding:18px;align-items:stretch}.clip{flex:0 0 36%;background:var(--board);border-radius:14px;padding:43px 15px 16px;position:relative;box-shadow:inset 0 0 0 3px var(--board-dark)}.clip:before{content:"";position:absolute;top:10px;left:29%;width:42%;height:30px;background:linear-gradient(#c3cad1,var(--clip));border-radius:8px 8px 4px 4px;box-shadow:0 2px 0 #0003}.sheet{background:var(--paper);border-radius:4px;padding:16px 10px;min-height:100%;box-shadow:0 1px 3px #0003}.sheet h3{margin:0 0 12px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:3px}.steps button{display:flex;gap:9px;align-items:center;text-align:left;border:0;background:transparent;border-radius:5px;width:100%;padding:8px 6px;color:#333;font-size:14px}.steps button:hover{background:var(--hover)}.steps button.active{background:var(--active)}.check{flex:none;width:21px;height:21px;border-radius:4px;background:linear-gradient(#fff,#ddd);border:2px solid #bbb;display:grid;place-items:center;color:var(--green);font-size:16px;font-weight:900}.panel{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;min-height:465px}.panel-header{display:flex;align-items:center;gap:10px}.mini-icon{font-size:40px;line-height:1}.panel h2{font-size:21px;font-weight:400;margin:0 0 3px}.lead{font-size:14px;color:var(--soft);margin:0 0 10px}.content{font-size:15px;line-height:1.5}.content h3{font-size:15px;margin:13px 0 4px}.content p{margin:7px 0}.example{background:#eef5fc;border-left:4px solid var(--blue);padding:10px 12px;border-radius:4px;margin:12px 0}.tip{background:#fff7e0;border:1px solid #ecd89a;border-radius:6px;padding:10px 12px;margin:10px 0;font-size:14px}.options{display:grid;gap:7px;margin:8px 0}.option{text-align:left;border:1px solid #c9dcef;background:#f7fbff;padding:10px;border-radius:6px;font-size:14px}.option:hover{background:#e8f1fb}.option.correct{border-color:var(--green);background:#e7f5ec}.option.wrong{border-color:var(--red);background:#fdecef}.feedback{font-size:14px;min-height:42px;color:var(--soft);margin:8px 0}.subtle{color:var(--soft);font-size:13px}.canvas{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-areas:'soc act prop rel seg' 'soc rec prop can seg' 'cos cos ing ing ing';gap:4px;margin:10px 0}.cell{border:1px solid #c8d7e6;background:#fff;border-radius:5px;padding:7px 5px;min-height:54px;font-size:11px;overflow-wrap:anywhere}.cell b{font-size:11px;display:block;color:#235e9d}.cell.done{background:#e7f5ec;border-color:#9ac7a8}.cell.current{outline:3px solid #e5ad43;outline-offset:-3px;background:#fff7e0}.controls{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}.btn{border:1px solid #aaa;background:linear-gradient(#f7f7f7,#dadada);border-radius:4px;padding:8px 13px;font-size:13px;font-weight:700}.btn:disabled{opacity:.4}.counter{font-size:13px;color:var(--soft);text-align:center}footer{text-align:center;padding:10px 6px 2px;font-size:13px;font-weight:600;color:#343434}[hidden]{display:none!important}@media(max-width:730px){.body{flex-direction:column}.clip{flex:none}.panel{min-height:0}.canvas{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:'seg prop' 'can rel' 'ing ing' 'rec act' 'soc soc' 'cos cos'}.steps{display:grid;grid-template-columns:repeat(2,1fr)}.steps button{font-size:13px}}
</style></head><body><div class="player"><div class="stage"><div class="card"><div class="titlebar">Miniguía · Lienzo de Modelo Canvas</div><section id="cover" class="cover"><div class="tag">Proyecto de app móvil · Saber Conocer</div><h1>Construye tu Modelo Canvas</h1><svg class="robot" viewBox="0 0 120 100" aria-hidden="true"><line x1="60" y1="14" x2="60" y2="30" stroke="#2f5f8f" stroke-width="4"/><circle cx="60" cy="12" r="6" fill="#f2a23a"/><rect x="22" y="30" width="76" height="60" rx="18" fill="#9cc8ef" stroke="#2f5f8f" stroke-width="4"/><circle cx="46" cy="58" r="11" fill="white" stroke="#2f5f8f" stroke-width="3"/><circle cx="74" cy="58" r="11" fill="white" stroke="#2f5f8f" stroke-width="3"/><circle cx="46" cy="58" r="4"/><circle cx="74" cy="58" r="4"/><path d="M48 76q12 8 24 0" fill="none" stroke="#2f5f8f" stroke-width="4"/></svg><p></p><button class="start" id="start">COMENZAR ›</button></section><section class="body" id="main" hidden><div class="clip"><div class="sheet"><h3>Bloques del lienzo</h3><ol class="steps" id="steps"></ol></div></div><div class="panel"><div class="panel-header"><span class="mini-icon" id="symbol">🧩</span><div><h2 id="heading"></h2><p class="lead" id="lead"></p></div></div><div class="content" id="content"></div></div></section></div></div><div class="controls"><button class="btn" id="prev">‹ ANTERIOR</button><span class="counter" id="counter"></span><button class="btn" id="next">SIGUIENTE ›</button></div><footer>Aprendiendo con @LaProfeVivy · Saber Conocer</footer></div><script>
const BL=[
{k:'seg',t:'Segmentos de clientes',def:'Quién usa la app y quién paga por ella.',q:'¿Quiénes son los clientes de la app de retardos?',ops:[
 {x:'El colegio, que paga; estudiantes, docentes y directivos, que la usan',ok:1,r:'Exacto: el cliente paga y los usuarios usan. Aquí son actores distintos.'},
 {x:'Todos los jóvenes del país que tengan celular',r:'Es demasiado amplio. El problema ocurre en un colegio y quien decide la compra es el colegio.'},
 {x:'Las empresas de transporte escolar',r:'Influyen en las llegadas, pero la app registra y hace seguimiento dentro del colegio.'}],
 c:'Colegio (paga) · estudiantes, docentes, directivos (usan)',h:['Piensa en dos grupos: quien firma el contrato y quienes abren la app cada mañana.','La rectoría decide la compra; el docente proyecta el QR y el estudiante lo escanea.']},
{k:'prop',t:'Propuesta de valor',def:'El problema que la app resuelve y por qué el cliente la elige.',q:'¿Qué valor ofrece la app al colegio?',ops:[
 {x:'Registrar la llegada en segundos con QR y ver reportes de reincidencia para actuar a tiempo',ok:1,r:'Bien: el valor está en lo que hace la app: registrar rápido y dar datos para decidir.'},
 {x:'Dar puntos canjeables por premios a los estudiantes puntuales',r:'Los premios generan costos al cliente. El valor sale de lo que resuelve la app.'},
 {x:'Organizar jornadas de sensibilización sobre puntualidad',r:'Una jornada ocurre fuera de la app. La propuesta de valor describe lo que resuelve la app.'}],
 c:'Registro QR en segundos + reportes de reincidencia',h:['Fíjate en lo que la app hace por sí sola.','El directivo necesita datos para decidir; el docente, rapidez al registrar.']},
{k:'can',t:'Canales',def:'Cómo llega la app al cliente y a los usuarios.',q:'¿Por dónde llega la app al colegio y a sus usuarios?',ops:[
 {x:'Demostración a rectoría y descarga desde Play Store y App Store',ok:1,r:'Correcto: la venta se hace al colegio y la instalación, en las tiendas de apps.'},
 {x:'Anuncios en TikTok dirigidos a estudiantes',r:'Los estudiantes usan la app, pero la compra la decide el colegio.'},
 {x:'Volantes repartidos en la entrada del colegio',r:'El volante llega a quien usa, y la venta se decide en rectoría.'}],
 c:'Demo a rectoría · Play Store / App Store',h:['Hay dos momentos: convencer a quien compra y entregar la app a quien la usa.','¿Dónde descarga apps un estudiante? ¿Con quién se reúne quien vende software escolar?']},
{k:'rel',t:'Relación con clientes',def:'Cómo acompañas al cliente para que siga usando la app.',q:'¿Cómo acompañas al colegio después de la venta?',ops:[
 {x:'Capacitación inicial a docentes y soporte durante el año escolar',ok:1,r:'Así es: si los docentes la dominan, el colegio renueva.'},
 {x:'Entregar la app y que cada docente aprenda por su cuenta',r:'Con acompañamiento el uso crece y el colegio renueva; sin él, el uso baja.'},
 {x:'Abrir un chat para que los estudiantes discutan sus sanciones',r:'Las justificaciones las valida coordinación; la relación comercial es con el colegio.'}],
 c:'Capacitación a docentes · soporte todo el año',h:['Piensa en qué hace que el colegio renueve el contrato el próximo año.','Los docentes proyectan el QR cada día: ellos necesitan saber usarla.']},
{k:'ing',t:'Fuentes de ingreso',def:'De dónde sale el dinero que recibe la app.',q:'¿Cómo gana dinero la app de retardos?',ops:[
 {x:'Suscripción anual que paga el colegio según su número de estudiantes',ok:1,r:'Correcto: ingreso que se repite, pagado por el cliente y proporcional a su tamaño.'},
 {x:'Cobrar $1.000 al estudiante por cada retardo',r:'Esto genera costos a los usuarios. El ingreso lo paga el cliente: el colegio.'},
 {x:'Mostrar publicidad dentro de la app',r:'Los usuarios son menores de edad. El ingreso viene del colegio.'}],
 c:'Suscripción anual por estudiante (paga el colegio)',h:['Recuerda quién es el cliente en el bloque 1.','Busca un pago que se repita cada año y crezca con el tamaño del colegio.']},
{k:'rec',t:'Recursos clave',def:'Lo indispensable para que la app funcione.',q:'¿Qué recursos necesita la app?',ops:[
 {x:'Servidor en la nube, base de datos de asistencia y equipo de desarrollo',ok:1,r:'Bien: servidor, datos y equipo mantienen la app funcionando.'},
 {x:'Torniquetes y lectores de huella en la entrada',r:'Es hardware costoso. La app usa el celular y el QR que proyecta el docente.'},
 {x:'Un vigilante adicional en la portería',r:'Es una solución fuera de la app. Los recursos clave son los de la app.'}],
 c:'Nube · base de datos · equipo de desarrollo',h:['Pregúntate: si falta esto, ¿la app deja de funcionar?','El registro QR guarda datos en algún lugar y alguien mantiene el código.']},
{k:'act',t:'Actividades clave',def:'Lo que el equipo hace siempre para entregar el valor.',q:'¿Qué hace el equipo de la app de forma permanente?',ops:[
 {x:'Mantener la app, generar reportes automáticos y dar soporte',ok:1,r:'Correcto: son las tareas que sostienen la propuesta de valor.'},
 {x:'Llamar a cada acudiente cuando hay un retardo',r:'La app envía el correo de notificación automáticamente: esa es su ventaja.'},
 {x:'Organizar campañas de puntualidad en el colegio',r:'Es una actividad fuera de la app. Aquí van las tareas del equipo de la app.'}],
 c:'Mantener la app · reportes automáticos · soporte',h:['Piensa en el equipo que construyó la app.','Lo automático (correos, reportes) lo hace la app; el equipo la mantiene y da soporte.']},
{k:'soc',t:'Socios clave',def:'Aliados externos de los que depende la app.',q:'¿Con quién se alía la app para funcionar?',ops:[
 {x:'Proveedor de nube (p. ej. Firebase) y servicio de envío de correos',ok:1,r:'Exacto: con ellos la app guarda datos y notifica a los acudientes.'},
 {x:'Marcas que patrocinen premios para los puntuales',r:'Los socios sostienen el funcionamiento de la app; los premios quedan por fuera.'},
 {x:'Las empresas de buses del sector',r:'Los socios clave participan en el registro o los reportes de la app.'}],
 c:'Proveedor de nube · servicio de correos',h:['¿Qué servicios externos usa la app para guardar datos y enviar mensajes?','El primer retardo genera un correo al acudiente: alguien entrega ese correo.']},
{k:'cos',t:'Estructura de costos',def:'En qué gasta dinero la app para operar.',q:'¿En qué se va el dinero de la app?',ops:[
 {x:'Nube, envío de correos, salarios de soporte y cuentas en tiendas de apps',ok:1,r:'Correcto: son los costos de lo que pusiste en recursos, actividades y socios.'},
 {x:'Celulares para todos los estudiantes',r:'El docente marca a quien no tiene celular; así la app evita ese gasto.'},
 {x:'Premios para los estudiantes puntuales',r:'La solución funciona con lo que resuelve la app, sin premios.'}],
 c:'Nube · correos · soporte · tiendas de apps',h:['Mira lo que pusiste en Recursos, Actividades y Socios: todo eso cuesta.','Publicar en las tiendas de apps tiene un pago y la nube cobra por uso.']}
];

const icons=['👥','💎','📣','🤝','💰','🧰','⚙️','🔗','🧾'];
const order=['soc','act','prop','rel','seg','rec','can','cos','ing'];
let step=0;
const el=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function canvas(i){
 return '<div class="canvas">'+order.map(k=>{
  const n=BL.findIndex(x=>x.k===k),b=BL[n];
  return '<div class="cell '+(n===i?'current':'')+'" style="grid-area:'+k+'"><b>'+(n+1)+'. '+esc(b.t)+'</b></div>';
 }).join('')+'</div>';
}
function fill(){
 el('steps').innerHTML=BL.map((b,i)=>'<li><button type="button" data-step="'+i+'" class="'+(i===step?'active':'')+'"><span class="check">'+(i===step?'✓':'')+'</span><span>'+(i+1)+'. '+esc(b.t)+'</span></button></li>').join('');
 el('steps').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>show(Number(b.dataset.step))));
}
function show(i){
 step=i;
 el('cover').hidden=true;
 el('main').hidden=false;
 const b=BL[i];
 if(i===9){
  el('heading').textContent='Lienzo de Modelo Canvas';
  el('lead').textContent='Vista general de los nueve bloques';
  el('symbol').textContent='🧩';
  el('content').innerHTML=canvas(-1);
 }else{
  el('heading').textContent=(i+1)+'. '+b.t;
  el('lead').textContent=b.def;
  el('symbol').textContent=icons[i];
  el('content').innerHTML=canvas(i)+'<h3>Explicación</h3><p>'+esc(b.def)+'</p><div class="example"><b>Ejemplo: app de retardos</b><p>'+esc(b.c)+'</p></div>';
 }
 fill();
 el('prev').disabled=i===0;
 el('next').disabled=i===9;
 el('next').textContent=i===8?'VER LIENZO COMPLETO ›':'SIGUIENTE ›';
 el('counter').textContent=i===9?'Lienzo completo':'Bloque '+(i+1)+' de 9';
}
el('start').onclick=()=>show(0);
el('prev').onclick=()=>{if(step>0)show(step-1)};
el('next').onclick=()=>{if(step<9)show(step+1)};
show(0);
</script></body></html>
