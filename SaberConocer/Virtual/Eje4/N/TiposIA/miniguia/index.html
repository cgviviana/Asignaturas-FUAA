<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tabla de tipos de IA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: reproductor tipo e-learning (marco gris, escenario azul, tarjeta con barra de título). Izquierda: portapapeles con los 4 bloques; derecha: panel que muestra el bloque elegido. Estilo único y claro, a propósito. */
:root{
  --frame:#d6d6d6; --page:#e9e9e9; --stage:#9cc8ef; --card:#ffffff; --line:#c8c8c8; --ink:#1d1d1d; --soft:#555555;
  --bar1:#4a4a4a; --bar2:#2b2b2b; --hover:#e8f1fb; --active:#d9e8f7; --blue:#2f78c4;
  --board:#c8955a; --board-dark:#a8763f; --clip:#9aa3ad; --paper:#fffef9; --rule:#dfe7f1;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:"Segoe UI",Calibri,Arial,sans-serif;display:flex;justify-content:center;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px}
.player{width:100%;max-width:900px;background:var(--frame);border-radius:8px;padding:10px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.stage{background:var(--stage);padding:12px;border-radius:4px}
.card{background:var(--card);border:1px solid #8fb3d6;border-radius:3px;overflow:hidden}
.titlebar{background:linear-gradient(var(--bar1),var(--bar2));color:#fff;font-weight:600;letter-spacing:.5px;padding:10px 16px;font-size:17px}
.body{display:flex;gap:22px;padding:18px;align-items:stretch}
.clip{flex:0 0 38%;position:relative;background:var(--board);border-radius:14px;padding:44px 16px 18px;box-shadow:inset 0 0 0 3px var(--board-dark)}
.clip::before{content:"";position:absolute;top:10px;left:50%;transform:translateX(-50%);width:42%;height:30px;background:linear-gradient(#c3cad1,var(--clip));border-radius:8px 8px 4px 4px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.sheet{background:var(--paper);border-radius:4px;padding:16px 12px 14px;min-height:100%;;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sheet h3{margin:0 0 10px;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.list button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;padding:8px;border-radius:4px;font-size:16px;color:#333;box-sizing:border-box}
.list button:hover{background:var(--hover)}
.list button.active{background:var(--active)}
.list button:focus-visible{outline:2px solid var(--blue)}
.list small{display:block;font-size:12.5px;color:var(--soft)}
.box{width:24px;height:24px;border:2px solid #b9b9b9;border-radius:4px;background:linear-gradient(#fafafa,#dcdcdc);display:grid;place-items:center;flex:none}
.box svg{width:18px;height:18px;opacity:0;transition:opacity .2s}
.done .box svg{opacity:1}
.panel{flex:1;position:relative;border:1px solid var(--line);border-radius:6px;padding:16px 16px 12px;display:flex;flex-direction:column;min-height:420px;min-width:0}
.panel h2{font-weight:400;font-size:21px;margin:0 0 4px}
.lead{margin:0 0 12px;color:var(--soft);font-size:15px}
.text{overflow-y:auto;flex:1;max-height:470px;padding-right:4px}
.intro{display:flex;gap:14px;align-items:flex-start}
.intro p{margin:0 0 12px;font-size:15px;line-height:1.4}
.intro svg{width:120px;flex:none}
.tip{background:#fff7e0;border:1px solid #ecd89a;border-radius:6px;padding:10px 12px;font-size:14px}
.type{border-top:1px solid #e3e3e3;padding:11px 0}
.type:first-child{border-top:none;padding-top:2px}
.type h4{margin:0;font-size:16px}
.type h4 em{font-style:normal;font-size:12px;color:#b3261e;margin-left:6px;font-weight:600}
.type p{margin:2px 0 0;font-size:15px;line-height:1.35}
.type .ej{color:var(--soft);font-size:14px}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tools a{font-size:13px;color:#174f86;background:#eef5fc;border:1px solid #c9dcef;border-radius:999px;padding:2px 10px;text-decoration:none}
.tools a:hover{background:#dcebf9}
.tools a:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.tools small{font-size:12.5px;color:var(--soft);align-self:center}
.arrow{position:absolute;height:14px;pointer-events:none;display:none}
.controls{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.btn{border:1px solid #aaa;background:linear-gradient(#f7f7f7,#dadada);border-radius:4px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer;color:#333}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.counter{font-size:13px;color:var(--soft);text-align:center}
footer{text-align:center;padding:10px 6px 2px;color:#343434;font-size:13px;font-weight:600}
.mini{width:34px;height:34px;flex:none}
.phead{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.phead svg{width:58px;height:58px;flex:none}
.phead h2{margin:0}
.phead .lead{margin:2px 0 0}
.cover{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:26px 12px 18px}
.cover .tag{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin:0}
.cover h1{margin:0;font-size:clamp(28px,4.4vw,40px);line-height:1.1;font-weight:700}
.cover p{margin:0;max-width:52ch;color:var(--soft);font-size:16px}
.crew{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin:8px 0 4px}
.crew figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:600;color:#333}
.crew svg{width:92px;height:92px}
.start{border:none;background:linear-gradient(#3d8ad6,#2a6bb0);color:#fff;font-weight:700;font-size:15px;letter-spacing:.04em;border-radius:6px;padding:11px 26px;cursor:pointer;box-shadow:0 2px 0 #1d4f85}
.start:hover{background:linear-gradient(#4a96e0,#2f74bd)}
.start:focus-visible{outline:3px solid #1d4f85;outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.crew svg{animation:bob 3s ease-in-out infinite}.crew figure:nth-child(2) svg{animation-delay:.4s}.crew figure:nth-child(3) svg{animation-delay:.8s}.crew figure:nth-child(4) svg{animation-delay:1.2s}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (max-width:680px){
  .body{flex-direction:column}
  .clip{flex:none}
  .arrow{display:none!important}
  .panel{min-height:0}
  .text{max-height:none}
  .intro svg{width:84px}
}
@media (prefers-reduced-motion:reduce){.box svg{transition:none}}
</style>

<div class="player">
  <div class="stage">
    <div class="card">
      <div class="titlebar">Tipos de IA para tu app</div>
      <div class="body cover" id="cover">
        <p class="tag">Proyecto app móvil</p>
        <h1>¿Cómo incluir un servicio de IA en tu app?</h1>
        <div class="crew" id="crew"></div>
        <button class="start" id="start" type="button">COMENZAR ›</button>
      </div>
      <div class="body" id="main" hidden>
        <div class="clip">
          <div class="sheet">
            <h3>Servicios de IA para tu app</h3>
            <ul class="list" id="list"></ul>
          </div>
        </div>
        <div class="panel" id="panel" aria-live="polite">
          <svg class="arrow" id="arrow" viewBox="0 0 80 14" preserveAspectRatio="none" aria-hidden="true"><path d="M78 7H12" stroke="#fff" stroke-width="6"/><path d="M78 7H12" stroke="#c9c9c9" stroke-width="3"/><path d="M2 7l12-6v12z" fill="#fff" stroke="#bbb"/></svg>
          <div class="phead"><span id="pmascot"></span><div><h2 id="ptitle"></h2><p class="lead" id="plead"></p></div></div>
          <div class="text" id="ptext"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="controls">
    <button class="btn" id="prev" type="button">‹ ANTERIOR</button>
    <span class="counter" id="counter"></span>
    <button class="btn" id="next" type="button">SIGUIENTE ›</button>
  </div>
  <footer>Aprendiendo con @LaProfeVivy · Saber Conocer</footer>
</div>

<script>
var TM = 'https://teachablemachine.withgoogle.com', MLK = 'https://developers.google.com/ml-kit', AIS = 'https://aistudio.google.com', OAI = 'https://platform.openai.com', ORA = 'https://orangedatamining.com', SKL = 'https://scikit-learn.org', SUPA = 'https://supabase.com/docs/guides/ai';
var BLOQUES = [
 {t:'Ver', d:'La app entiende fotos, video o lo que ve la cámara.', items:[
  ['Clasificación de imágenes','Reconoce qué hay en una foto.','Tomas foto a un residuo y te dice si es plástico, papel u orgánico.',[['Teachable Machine',TM,'entrena con tus fotos'],['ML Kit',MLK]]],
  ['Detección de objetos','Encuentra y cuenta cosas en una imagen.','Cuenta cuántos productos quedan en un estante.',[['Roboflow','https://roboflow.com'],['ML Kit',MLK]]],
  ['Reconocimiento de poses','Ve cómo está ubicado el cuerpo.','Te avisa si estás haciendo mal un ejercicio.',[['Teachable Machine',TM,'entrena con tus movimientos'],['MediaPipe','https://ai.google.dev/edge/mediapipe/solutions/guide']]],
  ['Texto en fotos (OCR)','Lee el texto que aparece en una foto.','Fotografías una factura y copia el valor total.',[['ML Kit',MLK],['Google Cloud Vision','https://cloud.google.com/vision']]],
  ['Realidad aumentada','Pone información sobre lo que ve la cámara.','Apuntas a un edificio y te muestra qué salones tiene.',[['ARCore','https://developers.google.com/ar']]],
  ['Reconocimiento facial','Reconoce a una persona por su cara. Son datos sensibles: evítalo con menores.','Abrir una puerta con la cara.',[['ML Kit',MLK,'solo detecta caras']],1]
 ]},
 {t:'Escuchar y hablar', d:'La app entiende sonidos y voz, o habla.', items:[
  ['Reconocimiento de sonidos','Reconoce sonidos del ambiente.','Avisa en pantalla a una persona sorda que suena el timbre.',[['Teachable Machine',TM,'entrena con tus sonidos']]],
  ['Voz a texto','Escribe lo que dices.','Dictas una nota y queda escrita.',[['Google Speech-to-Text','https://cloud.google.com/speech-to-text'],['Whisper','https://github.com/openai/whisper']]],
  ['Voz sintética','Lee textos en voz alta.','Lee las noticias a una persona con baja visión.',[['Google Text-to-Speech','https://cloud.google.com/text-to-speech'],['ElevenLabs','https://elevenlabs.io']]]
 ]},
 {t:'Leer, escribir y conversar', d:'La app entiende textos, los escribe o conversa.', items:[
  ['Análisis de texto','Entiende de qué trata un texto y si es positivo o negativo.','Separa las reseñas buenas de las malas.',[['Cloud Natural Language','https://cloud.google.com/natural-language'],['Hugging Face','https://huggingface.co']]],
  ['Resumen y redacción','Resume o escribe textos.','Resume una lectura larga en cinco líneas.',[['Google AI Studio',AIS],['API de OpenAI',OAI],['API de Claude','https://docs.claude.com']]],
  ['Traducción','Traduce entre idiomas.','Traduce el menú de un restaurante.',[['ML Kit',MLK],['Cloud Translation','https://cloud.google.com/translate']]],
  ['Extracción de datos','Saca datos de un documento y los guarda solo.','Lee una factura y guarda la fecha y el valor.',[['Document AI','https://cloud.google.com/document-ai']]],
  ['Chatbot','Conversa con el usuario.','Un tutor que responde dudas de matemáticas.',[['Botpress','https://botpress.com'],['Voiceflow','https://www.voiceflow.com'],['Google AI Studio',AIS]]],
  ['Respuestas sobre documentos','Responde solo con la información que tú le das.','Responde preguntas sobre el reglamento estudiantil.',[['Google AI Studio',AIS],['Supabase IA',SUPA]]],
  ['Búsqueda inteligente','Entiende lo que buscas aunque no uses la palabra exacta.','Buscas “algo rápido para cenar” y muestra recetas fáciles.',[['Supabase IA',SUPA]]]
 ]},
 {t:'Crear, predecir y automatizar', d:'La app crea contenido, anticipa o hace tareas sola.', items:[
  ['Generación de imágenes','Crea una imagen a partir de lo que el usuario escribe.','Escribes “un gato astronauta” y la app lo dibuja.',[['API de OpenAI',OAI],['Stability AI','https://stability.ai']]],
  ['Generación de video','Crea un video corto a partir de un texto.','Genera un video explicativo de 10 segundos.',[['Runway','https://runwayml.com']]],
  ['Recomendador','Sugiere cosas según lo que le gusta a cada usuario.','Recomienda cursos, como Netflix recomienda películas.',[['TensorFlow Recommenders','https://www.tensorflow.org/recommenders']]],
  ['Predicción','Anticipa lo que puede pasar.','Avisa qué estudiantes podrían abandonar un curso.',[['Orange Data Mining',ORA],['scikit-learn',SKL]]],
  ['Detección de anomalías','Avisa cuando algo es raro.','Alerta un gasto mucho mayor de lo normal.',[['Orange Data Mining',ORA],['scikit-learn',SKL]]],
  ['Automatización con IA','Hace tareas sola.','Cuando llega un pedido, envía un mensaje y crea un recordatorio.',[['n8n','https://n8n.io'],['Make','https://www.make.com'],['Zapier','https://zapier.com']]]
 ]}
];
var ROBOT = '<svg viewBox="0 0 120 130" aria-hidden="true"><line x1="60" y1="8" x2="60" y2="24" stroke="#2f78c4" stroke-width="4" stroke-linecap="round"/><circle cx="60" cy="8" r="6" fill="#f2a23a"/><rect x="18" y="24" width="84" height="62" rx="18" fill="#9cc8ef" stroke="#2f78c4" stroke-width="4"/><circle cx="44" cy="54" r="9" fill="#fff"/><circle cx="76" cy="54" r="9" fill="#fff"/><circle cx="46" cy="55" r="4.5" fill="#1d1d1d"/><circle cx="78" cy="55" r="4.5" fill="#1d1d1d"/><path d="M46 72q14 9 28 0" fill="none" stroke="#2f78c4" stroke-width="4" stroke-linecap="round"/><rect x="34" y="92" width="52" height="30" rx="10" fill="#d9e8f7" stroke="#2f78c4" stroke-width="4"/><circle cx="60" cy="107" r="5" fill="#2fa52f"/></svg>';
var COLORS = ['#9cc8ef','#b9e4c9','#ffd9a8','#e3c8f2'];
var NAMES = ['Ver','Escuchar y hablar','Leer y conversar','Crear y predecir'];
function mascot(k){
  var c = COLORS[k], st = '#2f5f8f';
  var head = '<rect x="22" y="30" width="76" height="60" rx="18" fill="'+c+'" stroke="'+st+'" stroke-width="4"/>';
  var eyes = '<circle cx="46" cy="58" r="8" fill="#fff"/><circle cx="74" cy="58" r="8" fill="#fff"/><circle cx="47" cy="59" r="4" fill="#1d1d1d"/><circle cx="75" cy="59" r="4" fill="#1d1d1d"/>';
  var mouth = '<path d="M48 76q12 8 24 0" fill="none" stroke="'+st+'" stroke-width="4" stroke-linecap="round"/>';
  var ant = '<line x1="60" y1="14" x2="60" y2="30" stroke="'+st+'" stroke-width="4" stroke-linecap="round"/><circle cx="60" cy="12" r="6" fill="#f2a23a"/>';
  var extra = '';
  if (k===0){ eyes = '<circle cx="46" cy="58" r="11" fill="#fff" stroke="'+st+'" stroke-width="3"/><circle cx="74" cy="58" r="11" fill="#fff" stroke="'+st+'" stroke-width="3"/><line x1="57" y1="58" x2="63" y2="58" stroke="'+st+'" stroke-width="3"/><circle cx="47" cy="59" r="5" fill="#1d1d1d"/><circle cx="75" cy="59" r="5" fill="#1d1d1d"/>'; }
  if (k===1){ extra = '<path d="M20 60a40 40 0 0 1 80 0" fill="none" stroke="'+st+'" stroke-width="5"/><rect x="10" y="52" width="14" height="26" rx="6" fill="#2fa52f" stroke="'+st+'" stroke-width="3"/><rect x="96" y="52" width="14" height="26" rx="6" fill="#2fa52f" stroke="'+st+'" stroke-width="3"/>'; ant=''; }
  if (k===2){ extra = '<path d="M84 6h28a6 6 0 0 1 6 6v14a6 6 0 0 1-6 6h-18l-8 7v-7h-2a6 6 0 0 1-6-6V12a6 6 0 0 1 6-6z" fill="#fff" stroke="'+st+'" stroke-width="3"/><circle cx="92" cy="19" r="2.5" fill="'+st+'"/><circle cx="100" cy="19" r="2.5" fill="'+st+'"/><circle cx="108" cy="19" r="2.5" fill="'+st+'"/>'; }
  if (k===3){ ant = '<line x1="60" y1="20" x2="60" y2="30" stroke="'+st+'" stroke-width="4"/><path d="M60 0a11 11 0 0 1 6 20h-12a11 11 0 0 1 6-20z" fill="#ffd54a" stroke="'+st+'" stroke-width="3"/><path d="M50 4l-6-4M70 4l6-4M48 12h-7M72 12h7" stroke="#f2a23a" stroke-width="3" stroke-linecap="round"/>'; }
  return '<svg viewBox="0 0 120 100" aria-hidden="true">'+ant+extra+head+eyes+mouth+'</svg>';
}
var CHECK = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 10.5l4.5 4.5L17 4.5" fill="none" stroke="#2fb52f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var list = document.getElementById('list'), arrow = document.getElementById('arrow'), panel = document.getElementById('panel');
var cur = -1, vistos = new Set();
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
BLOQUES.forEach(function(b, i){
  var li = document.createElement('li');
  li.innerHTML = '<button type="button" aria-controls="panel"><span class="box">'+CHECK+'</span><span class="mini">'+mascot(i)+'</span><span>'+esc(b.t)+'<small>'+b.items.length+' tipos de IA</small></span></button>';
  li.firstChild.addEventListener('click', function(){ show(i); });
  list.appendChild(li);
});
function show(i){
  cur = i;
  var btns = list.querySelectorAll('button');
  btns.forEach(function(b){ b.classList.remove('active'); b.removeAttribute('aria-current'); });
  var t = document.getElementById('ptitle'), l = document.getElementById('plead'), x = document.getElementById('ptext');
  if (i < 0){
    document.getElementById('pmascot').innerHTML = '';
    t.textContent = '¿Cómo incluir un servicio de IA en tu app?';
    l.textContent = 'Lista de chequeo';
    x.innerHTML = '<div class="intro"><div><p>Un servicio de IA es una herramienta que le da a tu app una habilidad nueva: ver, escuchar, leer o crear.</p><p>Selecciona cada bloque del portapapeles para conocer los tipos de IA, un ejemplo y las herramientas para hacerlo. Cada bloque que revises queda marcado.</p>'+
      '<p class="tip"><b>Teachable Machine</b> sirve para entrenar tu propia IA sin programar, con fotos, sonidos o movimientos.</p></div>'+ROBOT+'</div>';
    arrow.style.display = 'none';
  } else {
    var b = BLOQUES[i];
    vistos.add(i);
    btns[i].classList.add('active'); btns[i].setAttribute('aria-current','true');
    t.textContent = b.t; l.textContent = b.d;
    document.getElementById('pmascot').innerHTML = mascot(i);
    x.innerHTML = b.items.map(function(it){
      return '<div class="type"><h4>'+esc(it[0])+(it[4]?'<em>Uso delicado</em>':'')+'</h4><p>'+esc(it[1])+'</p><p class="ej">Ej.: '+esc(it[2])+'</p><div class="tools">'+
        it[3].map(function(tl){ return '<a href="'+tl[1]+'" target="_blank" rel="noopener">'+esc(tl[0])+'</a>'+(tl[2]?'<small>'+esc(tl[2])+'</small>':''); }).join('')+'</div></div>';
    }).join('');
    placeArrow(btns[i]);
  }
  vistos.forEach(function(k){ btns[k].classList.add('done'); });
  x.scrollTop = 0;
  document.getElementById('prev').disabled = false;
  document.getElementById('next').disabled = (i === BLOQUES.length - 1);
  document.getElementById('counter').textContent = i < 0 ? 'Introducción · '+vistos.size+' de '+BLOQUES.length+' revisados' : 'Bloque '+(i+1)+' de '+BLOQUES.length+' · '+vistos.size+' revisados';
}
function placeArrow(btn){
  if (window.innerWidth <= 680){ arrow.style.display = 'none'; return; }
  var pr = panel.getBoundingClientRect(), br = btn.getBoundingClientRect();
  var start = br.right - 6;
  arrow.style.display = 'block';
  arrow.style.left = (start - pr.left) + 'px';
  arrow.style.width = Math.max(10, pr.left - start + 8) + 'px';
  arrow.style.top = (br.top + br.height/2 - pr.top - 7) + 'px';
}
document.getElementById('prev').addEventListener('click', function(){ if (cur >= 0) show(cur - 1); else showCover(); });
var cover = document.getElementById('cover'), main = document.getElementById('main');
document.getElementById('crew').innerHTML = NAMES.map(function(n, k){ return '<figure>'+mascot(k)+'<figcaption>'+n+'</figcaption></figure>'; }).join('');
function showCover(){ cover.hidden = false; main.hidden = true; arrow.style.display='none'; document.getElementById('prev').disabled = true; document.getElementById('next').disabled = false; document.getElementById('counter').textContent = 'Presentación'; nextFromCover = true; }
var nextFromCover = true;
function startCourse(){ nextFromCover = false; cover.hidden = true; main.hidden = false; show(-1); }
document.getElementById('start').addEventListener('click', startCourse);
document.getElementById('next').addEventListener('click', function(){ if (nextFromCover){ startCourse(); return; } if (cur < BLOQUES.length - 1) show(cur + 1); });
window.addEventListener('resize', function(){ if (cur >= 0) placeArrow(list.querySelectorAll('button')[cur]); });
showCover();
</script>

</body></html>
