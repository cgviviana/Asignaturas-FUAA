<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Miniguía · Qué declarar en tu app</title>
<style>
:root{--frame:#d6d6d6;--page:#e9e9e9;--stage:#9cc8ef;--card:#fff;--line:#c8c8c8;--ink:#15213d;--soft:#555;--bar1:#4a4a4a;--bar2:#2b2b2b;--hover:#e8f1fb;--active:#d9e8f7;--blue:#2f78c4;--board:#c8955a;--board-dark:#a8763f;--clip:#9aa3ad;--paper:#fffef9;--navy:#15213d;--peach:#fee6d1;--orange:#ff9c52}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:'Segoe UI',Calibri,Arial,sans-serif;display:flex;justify-content:center;padding:16px}button{font:inherit}[hidden]{display:none!important}.player{width:100%;max-width:1120px;background:var(--frame);border-radius:8px;padding:10px;box-shadow:0 2px 8px #0004}.stage{background:var(--stage);padding:12px;border-radius:4px}.card{background:white;border:1px solid #8fb3d6;border-radius:3px;overflow:hidden}.titlebar{background:linear-gradient(var(--bar1),var(--bar2));color:#fff;font-weight:600;letter-spacing:.5px;padding:10px 16px;font-size:17px}.body{display:flex;gap:20px;padding:18px;align-items:stretch}.clip{flex:0 0 29%;position:relative;background:var(--board);border-radius:14px;padding:44px 16px 18px;box-shadow:inset 0 0 0 3px var(--board-dark)}.clip:before{content:'';position:absolute;top:10px;left:50%;transform:translateX(-50%);width:42%;height:30px;background:linear-gradient(#c3cad1,var(--clip));border-radius:8px 8px 4px 4px;box-shadow:0 2px 0 #0003}.sheet{background:var(--paper);border-radius:4px;padding:16px 10px 14px;height:100%;box-shadow:0 1px 3px #0003}.sheet h3{margin:0 0 12px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}.list button{border:0;background:transparent;cursor:pointer;display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:9px 7px;border-radius:5px;color:#333;font-size:15px}.list button:hover{background:var(--hover)}.list button.active{background:var(--active)}.list button:focus-visible,.btn:focus-visible,.start:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.box{height:23px;width:23px;border:2px solid #b9b9b9;border-radius:4px;background:linear-gradient(#fafafa,#dcdcdc);display:grid;place-items:center;flex:none}.box svg{height:17px;width:17px;visibility:hidden}.done .box svg{visibility:visible}.mascot{font-size:27px;line-height:1}.panel{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:16px;min-height:480px;display:flex;flex-direction:column}.phead{display:flex;align-items:center;gap:11px;margin-bottom:12px}.phead h2{margin:0;font-size:22px;font-weight:500}.phead p{margin:2px 0 0;font-size:14px;color:var(--soft)}.pemoji{font-size:36px}.text{flex:1;overflow:auto;max-height:610px;padding-right:4px}.controls{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}.btn{border:1px solid #aaa;background:linear-gradient(#f7f7f7,#dadada);border-radius:4px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer;color:#333}.btn:disabled{opacity:.45;cursor:default}.counter{color:var(--soft);font-size:13px}footer{text-align:center;padding:10px 6px 2px;color:#343434;font-size:13px;font-weight:600}.cover{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:40px 15px}.cover .tag{font-weight:700;color:var(--blue);font-size:13px;letter-spacing:.08em}.cover h1{margin:0;font-size:clamp(29px,4vw,41px)}.crew{font-size:56px;letter-spacing:8px}.start{border:none;background:linear-gradient(#3d8ad6,#2a6bb0);color:#fff;font-weight:700;font-size:15px;border-radius:6px;padding:11px 26px;cursor:pointer;box-shadow:0 2px 0 #1d4f85}
/* Tarjetas reproduciendo la composición de las tres diapositivas */
.slide{background:#faf6f0;border-radius:10px;padding:17px;color:var(--navy)}.eyebrow{display:inline-block;background:var(--navy);color:var(--orange);border-radius:40px;padding:6px 25px;min-width:178px;text-align:center;letter-spacing:.12em;font-size:12px;font-weight:700}.slide h3{font-weight:800;font-size:clamp(24px,3vw,32px);letter-spacing:-.035em;margin:24px 0 24px}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.tile{border:2px solid var(--navy);box-shadow:5px 6px 0 var(--navy);border-radius:12px;background:#fffdfa;padding:16px;line-height:1.48;font-size:15px}.tile.peach{background:var(--peach)}.tile h4{margin:0 0 9px;font-size:17px;font-weight:750}.tile p{margin:0 0 2px}.tile ul{margin:9px 0 0;padding-left:22px}.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}.tiles.three .tile{padding:13px;font-size:14px}.tiles.three h4{font-size:15px}.muted{color:#465471}.darkslide{background:var(--navy);color:#eef3ff}.darkslide .eyebrow{background:#f9a45e;color:var(--navy)}.darkslide h3{font-size:clamp(22px,2.8vw,30px);font-weight:400;line-height:1.3;color:#d3ddf0}.darkslide .tiles .tile{background:#202f52;border:1.5px solid #39c8f6;box-shadow:none;color:#fff}.darkslide .tile h4{color:#42cbfa;font-weight:700;text-transform:uppercase;letter-spacing:.02em}.darkslide .tile ul{margin-top:0}.warning{margin-top:18px;background:#2c3b60;border:1px solid #f99b55;border-radius:9px;padding:12px 15px;color:white;font-size:14px}.warning strong{color:#ffab64}
@media(max-width:960px){.tiles.three{grid-template-columns:1fr}.tiles{grid-template-columns:1fr}.slide h3{margin:18px 0}.panel{min-height:350px}}@media(max-width:680px){.body{flex-direction:column;gap:14px;padding:12px}.clip{flex:none;padding:36px 12px 12px}.sheet{padding:12px}.panel{padding:10px}.text{max-height:none}.tiles{grid-template-columns:1fr}.slide{padding:12px}.controls{gap:4px}.btn{padding:7px 8px}}
</style></head><body><div class="player"><div class="stage"><div class="card"><div class="titlebar">Qué declarar al crear y publicar una app</div><div class="cover" id="cover"><div class="tag">SABER CONOCER · APP MÓVIL</div><h1>Qué declarar en tu app</h1><div class="crew" aria-hidden="true">📱 🛡️ 📋</div><button class="start" id="start">COMENZAR ›</button></div><div class="body" id="main" hidden><div class="clip"><div class="sheet"><h3>Los temas</h3><ul class="list" id="list"></ul></div></div><section class="panel" aria-live="polite"><div class="phead"><span class="pemoji" id="pemoji">📱</span><div><h2 id="ptitle"></h2><p id="plead"></p></div></div><div class="text" id="ptext"></div></section></div></div></div><div class="controls"><button class="btn" id="prev" disabled>‹ ANTERIOR</button><span class="counter" id="counter"></span><button class="btn" id="next">SIGUIENTE ›</button></div><footer>Aprendiendo con @LaProfeVivy · Saber Conocer</footer></div>
<template id="s0"><div class="slide"><span class="eyebrow">QUÉ DECLARAR</span><h3>Dentro de la app</h3><div class="tiles"><article class="tile"><h4>1. Autorización de datos y términos</h4><p><b>Cuándo:</b> antes de pedir nombre, correo, foto o ubicación.</p><p><b>Dónde:</b> pantalla de registro, con casillas sin marcar.</p><p><b>Términos:</b> dicen que la IA puede equivocarse.</p><p><b>Menores:</b> autoriza el padre o acudiente.</p></article><article class="tile"><h4>2. Política de privacidad</h4><p><b>Cuándo:</b> siempre que la app recoja datos.</p><p><b>Dónde:</b> en el menú de la app y como enlace en la ficha de la tienda.</p><p><b>Dice:</b> qué datos, para qué, quién los ve, dónde se guardan (también si es fuera de Colombia) y cómo borrarlos.</p></article><article class="tile peach"><h4>3. Aviso de IA</h4><p><b>Cuándo:</b> solo si la app tiene IA dentro.</p><p><b>Dónde:</b> antes de abrir el chatbot o la función de IA.</p><p><b>Ejemplo:</b> “Estás hablando con una IA. Puede equivocarse.”</p></article><article class="tile peach"><h4>4. Permiso para enviar datos a una IA</h4><p><b>Cuándo:</b> si la app manda datos a ChatGPT, Gemini u otra IA externa.</p><p><b>Dónde:</b> pantalla antes del primer uso, diciendo a qué IA van.</p></article></div></div></template>
<template id="s1"><div class="slide"><span class="eyebrow">QUÉ DECLARAR</span><h3>En las tiendas y entidades</h3><div class="tiles three"><article class="tile"><h4>▷ Google Play Console</h4><p class="muted">Sección “Contenido de la app”</p><ul><li>Público objetivo: edades y si es para niños</li><li>Seguridad de los datos</li><li>Clasificación del contenido</li><li>Enlace a la política de privacidad</li><li>Enlace para borrar cuenta y datos</li></ul></article><article class="tile"><h4>♙ App Store Connect</h4><p class="muted">Ficha de la app</p><ul><li>Privacidad de la app: qué datos recoges</li><li>Clasificación por edad</li><li>Enlace a la política de privacidad</li><li>Opción de borrar la cuenta dentro de la app</li></ul></article><article class="tile peach"><h4>⌂ Entidades en Colombia</h4><p class="muted">Según tu caso</p><ul><li><b>SIC · RNBD:</b> solo empresas obligadas</li><li><b>DNDA:</b> registro del software (voluntario)</li><li><b>SIC:</b> registro de marca (voluntario)</li><li><b>DIAN:</b> RUT, si vas a cobrar</li></ul></article></div></div></template>
<template id="s2"><div class="slide darkslide"><span class="eyebrow">NIVEL 7 · COBRAR</span><h3>¿Tu app va a <b>cobrar</b> o la venderás a un cliente?</h3><div class="tiles three"><article class="tile"><h4>◈ Formalízate</h4><ul><li><b>RUT</b> ante la DIAN (gratis)</li><li>Matrícula en la <b>Cámara de Comercio:</b> persona natural comerciante o SAS</li></ul></article><article class="tile"><h4>▥ Factura y precio</h4><ul><li><b>Facturación electrónica</b> DIAN, según tu régimen</li><li>Las tiendas cobran comisión: inclúyela en el precio</li></ul></article><article class="tile"><h4>♧ Clientes empresa</h4><ul><li>Contrato con alcance, soporte y precio</li><li>Acuerdo de manejo de datos: tú serías <b>encargado del tratamiento</b></li></ul></article></div><div class="warning"><strong>¿Y si no lo hago?</strong> La DIAN puede imponerte multas y otras sanciones por incumplir obligaciones de facturación.</div></div></template>
<script>
const steps=[{title:'Dentro de la app',lead:'Autorizaciones, privacidad y uso de IA',icon:'📱'},{title:'En tiendas y entidades',lead:'Información para publicar y registros aplicables',icon:'🏬'},{title:'Si vas a cobrar',lead:'Formalización, facturación y clientes',icon:'💼'}];let current=-1;const seen=new Set();const list=document.getElementById('list');const check='<svg viewBox="0 0 20 20"><path d="M3 10.5l4.5 4.5L17 4.5" fill="none" stroke="#2fb52f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
steps.forEach((s,i)=>{const li=document.createElement('li');li.innerHTML=`<button type="button"><span class="box">${check}</span><span class="mascot" aria-hidden="true">${s.icon}</span><span>${i+1}. ${s.title}</span></button>`;li.firstElementChild.onclick=()=>show(i);list.append(li)});
function show(i){current=i;seen.add(i);document.getElementById('cover').hidden=true;document.getElementById('main').hidden=false;document.getElementById('ptitle').textContent=steps[i].title;document.getElementById('plead').textContent=steps[i].lead;document.getElementById('pemoji').textContent=steps[i].icon;document.getElementById('ptext').replaceChildren(document.getElementById('s'+i).content.cloneNode(true));document.getElementById('ptext').scrollTop=0;[...list.querySelectorAll('button')].forEach((b,j)=>{b.classList.toggle('active',i===j);b.classList.toggle('done',seen.has(j));b.setAttribute('aria-current',i===j?'step':'false')});document.getElementById('counter').textContent=`${i+1} de ${steps.length}`;document.getElementById('prev').disabled=false;document.getElementById('next').disabled=i===steps.length-1;}
function home(){current=-1;document.getElementById('cover').hidden=false;document.getElementById('main').hidden=true;document.getElementById('prev').disabled=true;document.getElementById('next').disabled=false;document.getElementById('counter').textContent='';}
document.getElementById('start').onclick=()=>show(0);document.getElementById('prev').onclick=()=>current===0?home():show(current-1);document.getElementById('next').onclick=()=>show(Math.min(current+1,steps.length-1));
</script></body></html>
