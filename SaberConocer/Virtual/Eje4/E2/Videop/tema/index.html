<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Videopitch · Saber Conocer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--marca:#86a91e;--marca2:#5f7a0f;--tinta:#1f2b3a;--suave:#5b6878;--fondo:#e9eff3;--linea:#dfe6ec}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);font-family:Nunito,Arial,sans-serif;color:var(--tinta);line-height:1.5}
.top{height:50px;background:#fff;display:flex;align-items:center;padding:0 26px;font-size:14px;color:#536052;border-bottom:1px solid #d9e1e7}
.top:before{content:"";width:4px;height:22px;background:var(--marca);margin-right:12px}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 40px}
.tarjeta{background:#fff;border-radius:20px;box-shadow:0 10px 28px rgba(31,43,58,.1);overflow:hidden}
.barra{padding:14px 22px;border-bottom:1px solid var(--linea)}
.barra h1{font-family:Fredoka,sans-serif;font-weight:600;font-size:22px;margin:0}
.cuerpo{display:grid;grid-template-columns:360px 1fr;gap:26px;padding:24px 26px;min-height:500px}
/* claqueta */
.claq{align-self:start;background:#2b3542;border-radius:16px;overflow:hidden}
.claq-top{height:30px;background:repeating-linear-gradient(-45deg,#fff 0 18px,#2b3542 18px 36px);border-bottom:4px solid #1b232d}
.claq-in{padding:14px 12px 12px;color:#fff}
.claq-in h2{font-family:Fredoka,sans-serif;font-weight:600;font-size:16px;margin:0 6px 8px;color:#c9d4de}
.lista{list-style:none;margin:0;padding:0}
.lista li{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:7px 8px;border-radius:9px;font-weight:700;font-size:14.5px;color:#dde5ec}
.lista li.activo{background:rgba(255,255,255,.12);color:#fff}
.lista li small{font-weight:800;color:#9fb0bf;font-size:12px}
.caja{width:22px;height:22px;border:2px solid #6c7a88;border-radius:6px;display:grid;place-items:center}
.lista li.ok .caja{background:var(--marca);border-color:var(--marca)}
.lista li.ok .caja:after{content:"";width:8px;height:5px;border:3px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.reloj{margin-top:10px;background:rgba(255,255,255,.08);border-radius:12px;padding:10px 12px}
.reloj small{display:block;font-weight:700;color:#c9d4de;font-size:12.5px}
.reloj b{font-family:Fredoka,sans-serif;font-weight:600;font-size:22px}
.barra-t{height:8px;border-radius:4px;background:rgba(255,255,255,.15);margin-top:6px;overflow:hidden}
.barra-t span{display:block;height:100%;background:var(--marca);width:0;transition:width .3s}
.barra-t span.pasa{background:#e06a52}
/* panel */
.marco{border:2px solid var(--linea);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;animation:entra .25s ease-out}
@keyframes entra{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
.p-cab{display:flex;align-items:center;gap:14px;margin-bottom:14px;padding-bottom:12px;border-bottom:2px dashed var(--linea)}
.p-cab svg{width:60px;height:60px;flex-shrink:0}
.p-cab h2{font-family:Fredoka,sans-serif;font-weight:600;font-size:26px;margin:0;line-height:1.1}
.etq{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;margin-top:4px;background:#e0eefa;color:#2f5f93}
.secs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.sec{border-radius:14px;padding:12px 14px;background:#f6f8fa}
.sec h3{font-family:Fredoka,sans-serif;font-weight:600;font-size:16px;margin:0 0 4px}
.sec p{margin:0;font-size:15px}
.sec.verde{background:#f2f7e6}.sec.ambar{background:#fff6e5}
.escribe label{display:block;font-weight:800;font-size:14px;margin:6px 0 4px}
textarea{width:100%;min-height:110px;font-family:inherit;font-size:15px;border:2px solid #d5dee5;border-radius:12px;padding:10px 12px;resize:vertical;color:var(--tinta)}
textarea:focus,select:focus,input:focus{outline:none;border-color:var(--marca)}
.fila{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px}
select,input{font-family:inherit;font-size:15px;font-weight:700;border:2px solid #d5dee5;border-radius:10px;padding:7px 10px;color:var(--tinta);background:#fff}
.estimado{font-size:13px;font-weight:800;border-radius:999px;padding:4px 10px;background:#eef1f4;color:var(--suave)}
.estimado.ok{background:#eef5dc;color:var(--marca2)}.estimado.largo{background:#fde3dc;color:#a8402c}
/* integrantes */
.inte{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.inte span{display:inline-flex;align-items:center;gap:6px;background:#eef1f4;border-radius:999px;padding:5px 6px 5px 12px;font-weight:800;font-size:14px}
.inte button{border:0;background:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer;font-weight:800;color:var(--suave)}
.reglas{margin:6px 0 0;padding:0;list-style:none}
.reglas li{background:#f6f8fa;border-radius:12px;padding:9px 12px;margin:6px 0;font-size:15px;display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start}
.reglas li b{display:block}
.reglas svg{width:26px;height:26px}
.btn{font-family:inherit;font-weight:800;font-size:15px;background:var(--tinta);color:#fff;border:0;border-radius:12px;padding:9px 16px;cursor:pointer}
.btn.clara{background:#fff;color:var(--tinta);border:2px solid #cfd8df}
/* guion final */
.final{grid-column:1/-1}
.chequeos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.chequeos div{border-radius:14px;padding:10px 14px;font-weight:800;font-size:14.5px;background:#eef5dc;color:var(--marca2)}
.chequeos div.mal{background:#fde3dc;color:#a8402c}
.chequeos small{display:block;font-weight:700;color:var(--suave);font-size:13px}
.tl{border-left:4px solid var(--linea);margin-left:10px;padding-left:18px}
.tl-item{position:relative;margin:0 0 14px}
.tl-item:before{content:"";position:absolute;left:-27px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--marca);border:3px solid #fff;box-shadow:0 0 0 2px var(--marca)}
.tl-item.vacio:before{background:#fff;box-shadow:0 0 0 2px #c3ccd4}
.tl-item h3{font-family:Fredoka,sans-serif;font-weight:600;font-size:17px;margin:0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tl-item h3 small{font-family:Nunito,sans-serif;font-size:12.5px;font-weight:800;color:var(--suave)}
.tl-item p{margin:4px 0 0;white-space:pre-wrap;font-size:15px}
.tl-item .falta{color:#a8402c;font-weight:700}
.acciones{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.controles{display:flex;justify-content:space-between;align-items:center;padding:12px 22px;border-top:1px solid var(--linea);background:#fafbfc}
.controles button{font-family:inherit;font-weight:800;font-size:14px;border:2px solid #cfd8df;background:#fff;color:var(--tinta);border-radius:10px;padding:8px 16px;cursor:pointer}
.controles button.prim{background:var(--tinta);border-color:var(--tinta);color:#fff}
.controles button:disabled{opacity:.4;cursor:default}
.contador{font-size:13px;color:var(--suave);font-weight:700}
.lista li{cursor:pointer}
.lista li:hover{background:rgba(255,255,255,.08)}
.tipos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.tipos div{background:#fff;border-radius:10px;padding:8px 10px;font-size:14.5px}
.tipos b{display:block;font-size:15px}
.tipos span{color:var(--suave)}
.revision{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.revision li{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;background:#f6f8fa;border-radius:12px;padding:10px 12px;font-size:15px;font-weight:700}
.caja2{width:22px;height:22px;border:2px solid #c3ccd4;border-radius:6px;background:#fff;margin-top:1px}
.pie{text-align:center;font-size:13px;color:#556055;margin-top:24px}
@media(max-width:900px){.cuerpo{grid-template-columns:1fr}.secs,.tipos,.revision{grid-template-columns:1fr}}
@media print{.top,.controles,.claq,.acciones,.pie{display:none}.cuerpo{display:block}.tarjeta{box-shadow:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header class="top">Aprendiendo con @LaProfeVivy</header>
<div class="wrap">
  <div class="tarjeta">
    <div class="barra"><h1 id="titulo"></h1></div>
    <div class="cuerpo" id="cuerpo"></div>
    <div class="controles"><button id="ant">‹ Anterior</button><span class="contador" id="contador"></span><button class="prim" id="sig">Siguiente ›</button></div>
  </div>
  <p class="pie">Aprendiendo con @LaProfeVivy</p>
</div>
<script>
const K='#1f2b3a',V='#86a91e',VL='#e4efc7',AM='#f2b632',AZ='#6e9ccf',RO='#e06a52',PI='#f2c9a0',GR='#c9d2da',BL='#fff',LI='#b8a3d6';
const sv=b=>`<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" fill="none" stroke="${K}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${b}</svg>`;
const ICON_gancho=sv(`<circle cx="32" cy="32" r="29" fill="#fdf0d2" stroke="none"/><path d="M36 10v24a10 10 0 11-10-10"/><path d="M30 18l6-8 6 8" fill="${AM}"/>`);
const ICON_problema=sv(`<circle cx="32" cy="32" r="29" fill="#fde3dc" stroke="none"/><path d="M32 12l22 38H10z" fill="${RO}"/><path d="M32 26v12" stroke="${BL}" stroke-width="4"/><circle cx="32" cy="44" r="2" fill="${BL}" stroke="${BL}"/>`);
const ICON_solucion=sv(`<circle cx="32" cy="32" r="29" fill="${VL}" stroke="none"/><path d="M24 40c-4-3-6-7-6-12a14 14 0 0128 0c0 5-2 9-6 12v6H24z" fill="${AM}"/><path d="M26 52h12"/>`);
const ICON_demo=sv(`<circle cx="32" cy="32" r="29" fill="#e0eefa" stroke="none"/><rect x="20" y="10" width="24" height="44" rx="5" fill="${BL}"/><path d="M29 24v16l12-8z" fill="${AZ}"/>`);
const ICON_dif=sv(`<circle cx="32" cy="32" r="29" fill="${VL}" stroke="none"/><path d="M32 12l6 13 14 2-10 10 3 14-13-7-13 7 3-14-10-10 14-2z" fill="${AM}"/>`);
const ICON_negocio=sv(`<circle cx="32" cy="32" r="29" fill="#fdf0d2" stroke="none"/><rect x="10" y="22" width="44" height="26" rx="4" fill="${V}"/><circle cx="32" cy="35" r="7" fill="${BL}"/><path d="M14 18h36"/>`);
const ICON_equipo=sv(`<circle cx="32" cy="32" r="29" fill="#e0eefa" stroke="none"/><circle cx="20" cy="26" r="6" fill="${PI}"/><path d="M11 46c0-7 4-11 9-11s9 4 9 11" fill="${AZ}"/><circle cx="44" cy="26" r="6" fill="${PI}"/><path d="M35 46c0-7 4-11 9-11s9 4 9 11" fill="${V}"/><circle cx="32" cy="20" r="6" fill="${PI}"/><path d="M23 40c0-7 4-11 9-11s9 4 9 11" fill="${AM}"/>`);
const ICON_cierre=sv(`<circle cx="32" cy="32" r="29" fill="#eee7f5" stroke="none"/><path d="M14 28v10h8l16 10V18L22 28z" fill="${LI}"/><path d="M44 26c3 3 3 9 0 12M48 22c5 5 5 15 0 20"/>`);
const P=[
 {id:"gancho",n:"Gancho",s:"0:20",i:ICON_gancho,
  d:"La primera frase del video. Su tarea es que quien mira quiera seguir viendo.",a:"Debe tener relación directa con el problema y durar pocos segundos.",
  lt:"Tipos de gancho",l:[
   ["Dato que sorprende","Una cifra real del problema dicha con su fuente: \"Según [fuente], …\""],
   ["Pregunta directa","\"¿Cuánto tiempo pierde un coordinador anotando llegadas en papel?\""],
   ["Situación que el público reconoce","\"Son las 7:05, suena el timbre y la fila de la entrada sigue llena.\""],
   ["Historia corta","Un caso real de alguien que vive el problema, contado en dos frases."],
   ["Contraste antes y después","\"Antes: una libreta. Ahora: un QR y un reporte al instante.\""],
   ["Demostración inmediata","Abrir el video mostrando la app resolviendo el problema."]]},
 {id:"problema",n:"Problema",s:"0:45",i:ICON_problema,
  d:"Qué pasa, a quién le pasa, dónde y por qué es importante resolverlo.",a:"Cada afirmación se apoya en evidencia y se dice de dónde sale.",
  lt:"Evidencias que sirven",l:[
   ["Datos de fuentes confiables","Cifras de entidades, investigaciones o informes revisados en el Eje 2."],
   ["Datos propios","Resultados de una encuesta u observación hecha por el equipo."],
   ["Testimonio","Lo que dice un usuario real sobre el problema."],
   ["Árbol de problemas","Las causas y los efectos que identificaron en el Eje 1."]]},
 {id:"solucion",n:"Solución",s:"0:40",i:ICON_solucion,
  d:"Qué es la app y qué permite hacer, en pocas palabras.",a:"Se explica cómo resuelve el problema que se acaba de mostrar, no cómo se programó.",
  lt:"Una fórmula para decirlo",l:[
   ["Estructura","[Nombre de la app] ayuda a [usuario] a [acción] para [resultado]."],
   ["Ejemplo","\"RetardApp ayuda a coordinación a registrar las llegadas con un QR para saber quién reincide.\""]]},
 {id:"demo",n:"Demostración",s:"1:15",i:ICON_demo,
  d:"La app publicada funcionando, grabada en pantalla mientras alguien explica.",a:"Es la prueba de que la solución existe: se ve funcionar con datos guardados en la nube.",
  lt:"Qué mostrar",l:[
   ["Entrada","Cómo se abre la app y cómo entra el usuario."],
   ["Tarea principal","El recorrido completo de la función más importante."],
   ["Resultado guardado","Que lo registrado queda en la app y se puede consultar."],
   ["Otro rol","Si hay varios usuarios, qué ve cada uno."],
   ["Lo que se deja por fuera","Diseños, maquetas o pantallas que no funcionan."]]},
 {id:"diferencial",n:"Diferencial",s:"0:30",i:ICON_dif,
  d:"Por qué elegir esta app y no las que ya existen.",a:"Se nombran los competidores de la matriz de originalidad y se dice qué hace la app que ellos no hacen.",
  lt:"Cómo decirlo",l:[
   ["Frase de originalidad","A diferencia de [competidor], nuestra app [diferencia] para [usuario]."],
   ["Qué cuenta como diferencia","Resolver algo que los otros no resuelven, hacerlo más fácil o más barato."],
   ["Qué no cuenta","Cambiar el diseño, el nombre o agregar una opción básica."]]},
 {id:"negocio",n:"Cliente y modelo de negocio",s:"0:45",i:ICON_negocio,
  d:"Quién paga la app, cómo paga y cómo se sostiene.",a:"Se usan los resultados de las actividades de cliente, modelo de negocio y costos, con números.",
  lt:"Lo que debe quedar claro",l:[
   ["Cliente","Quién paga y por qué es un cliente real."],
   ["Modelo","Suscripción, licencia, pago por uso u otro, y cuánto se cobra."],
   ["Costos","Cuánto cuesta mantener la app al mes."],
   ["Sostenibilidad","Cuántos clientes se necesitan para cubrir los costos."]]},
 {id:"equipo",n:"Equipo",s:"0:25",i:ICON_equipo,
  d:"Quiénes hicieron la app y qué aportó cada uno.",a:"Todos los integrantes aparecen en cámara.",
  lt:"Cómo presentarse",l:[
   ["Una frase por persona","Nombre y aporte: \"Soy Laura y me encargué de la base de datos y las pruebas.\""],
   ["En cámara","Cada integrante se ve y se escucha con su propia voz."]]},
 {id:"cierre",n:"Cierre",s:"0:20",i:ICON_cierre,
  d:"La última frase: lo que se quiere que haga quien vio el video.",a:"Una invitación concreta y corta.",
  lt:"Tipos de cierre",l:[
   ["Invitar a probar","\"Pruébenla un mes en su colegio.\""],
   ["Proponer una reunión","\"Agendemos una demostración con su equipo.\""],
   ["Retomar el gancho","Volver al dato o a la situación del inicio, ya resuelta."],
   ["Frase que resume","Una idea que quede en la memoria del cliente."]]}
];
const PASOS=[{intro:1},...P.map((p,i)=>({parte:i})),{final:1}];
let paso=0;const vistos=new Set();
const $=id=>document.getElementById(id);
const ICO={camara:sv(`<rect x="8" y="18" width="34" height="28" rx="4" fill="${AZ}"/><path d="M42 28l14-8v24l-14-8z" fill="${AZ}"/>`),
 sin:sv(`<circle cx="32" cy="32" r="22" fill="#fde3dc"/><path d="M18 46L46 18" stroke="${RO}" stroke-width="4"/><path d="M26 30l4-8 4 8M27 28h6" />`),
 lupa:sv(`<circle cx="28" cy="28" r="14" fill="${VL}"/><path d="M38 38l14 14" stroke-width="4"/>`),
 reloj:sv(`<circle cx="32" cy="34" r="20" fill="#fdf0d2"/><path d="M32 22v12l8 6M26 10h12"/>`),
 yt:sv(`<rect x="8" y="16" width="48" height="32" rx="9" fill="${RO}"/><path d="M28 25v14l12-7z" fill="${BL}" stroke="${BL}"/>`)};
function claqueta(activo){
 return `<div class="claq"><div class="claq-top"></div><div class="claq-in"><h2>Videopitch · 5:00</h2><ul class="lista">
 <li class="${paso===0?'activo':''} ${vistos.has(0)?'ok':''}" data-ir="0"><span class="caja"></span>Condiciones<small></small></li>
 ${P.map((p,i)=>`<li class="${i===activo?'activo':''} ${vistos.has(i+1)?'ok':''}" data-ir="${i+1}"><span class="caja"></span>${p.n}<small>${p.s}</small></li>`).join('')}
 <li class="${paso===PASOS.length-1?'activo':''} ${vistos.has(PASOS.length-1)?'ok':''}" data-ir="${PASOS.length-1}"><span class="caja"></span>Revisión del video<small></small></li></ul></div></div>`;
}
function intro(){
 return `<div class="marco"><div class="p-cab"><div><h2>El videopitch</h2><span class="etq">Duración: 5 minutos</span></div></div>
 <p style="margin:0 0 10px;font-size:16px">Un video corto para convencer a un cliente de que la app resuelve un problema real y vale la pena.</p>
 <ul class="reglas">
  <li>${ICO.reloj}<span><b>Dura 5 minutos.</b>Se reparte en 8 partes con un tiempo sugerido para cada una.</span></li>
  <li>${ICO.camara}<span><b>Aparecen todos los integrantes.</b>Cada uno habla en cámara con su propia voz.</span></li>
  <li>${ICO.sin}<span><b>Lo graba el equipo.</b>Sin voces, avatares ni presentadores creados con inteligencia artificial.</span></li>
  <li>${ICO.lupa}<span><b>Está argumentado.</b>Cada afirmación se apoya en datos, fuentes o en la app funcionando.</span></li>
  <li>${ICO.yt}<span><b>Se entrega en enlace de YouTube.</b>El video se publica en YouTube y se entrega el enlace funcionando.</span></li>
 </ul></div>`;
}
function parte(i){
 const p=P[i];
 return `<div class="marco"><div class="p-cab">${p.i}<div><h2>${i+1}. ${p.n}</h2><span class="etq">Tiempo sugerido: ${p.s}</span></div></div>
 <div class="secs"><div class="sec"><h3>¿Qué es?</h3><p>${p.d}</p></div><div class="sec verde"><h3>¿Cómo argumentarlo?</h3><p>${p.a}</p></div></div>
 <div class="sec ambar"><h3>${p.lt}</h3><div class="tipos">${p.l.map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div></div></div>`;
}
function final(){
 const items=["Dura máximo 5 minutos.","Aparecen todos los integrantes, con su propia voz.","No tiene voces, avatares ni presentadores creados con IA.","Empieza con un gancho relacionado con el problema.","El problema se apoya en datos y se dice su fuente.","La demostración muestra la app publicada funcionando con datos en la nube.","Nombra a los competidores y explica la diferencia.","Dice quién paga, cuánto cuesta mantener la app y cuántos clientes se necesitan.","Termina con una invitación concreta.","Se entrega el enlace de YouTube y el video abre."];
 return `<div class="marco"><div class="p-cab"><div><h2>Revisión del video</h2><span class="etq">Antes de entregarlo</span></div></div>
 <ul class="revision">${items.map(x=>`<li><span class="caja2"></span>${x}</li>`).join('')}</ul></div>`;
}
function pintar(){
 const s=PASOS[paso];vistos.add(paso);
 $('titulo').textContent='Arma tu videopitch';
 $('cuerpo').innerHTML=claqueta(s.parte!==undefined?s.parte:-1)+(s.intro?intro():s.final?final():parte(s.parte));
 $('contador').textContent=`${paso+1} de ${PASOS.length}`;
 $('ant').disabled=paso===0;$('sig').disabled=paso===PASOS.length-1;
 document.querySelectorAll('[data-ir]').forEach(li=>li.onclick=()=>{paso=+li.dataset.ir;pintar();});
}
$('sig').onclick=()=>{if(paso<PASOS.length-1){paso++;pintar();}};
$('ant').onclick=()=>{if(paso>0){paso--;pintar();}};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('sig').click();if(e.key==='ArrowLeft')$('ant').click();});
pintar();
</script>
</body>
</html>
