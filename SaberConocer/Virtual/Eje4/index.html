:root{
  --verde:#86a91e;--verde-oscuro:#5f7d14;--verde-suave:#eef5dc;

  --amarillo:#d7a527;--amarillo-suave:#fff9e8;--azul:#446a73;--azul-suave:#eef5f6;
  --morado:#67547c;--morado-suave:#f4f0f8;--rojo:#a75d57;--rojo-suave:#fdf5f4;

*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fondo);color:var(--tinta)}
.topbar{background:#29352d;color:#fff;padding:9px 7%;font-size:12px;letter-spacing:.7px}

.brand{display:flex;align-items:center;gap:14px}.brand img{width:116px;max-height:42px;object-fit:contain}
.brand span{color:var(--gris);border-left:1px solid var(--borde);padding-left:14px;font-size:14px}
.badge{background:var(--verde-suave);color:var(--verde-oscuro);border:1px solid #cbdca6;padding:8px 14px;border-radius:20px;font-size:13px;font-weight:bold}
.app{width:min(1180px,92%);min-height:700px;margin:30px auto;display:grid;grid-template-columns:305px 1fr;background:#fff;border:1px solid var(--borde);border-radius:16px;overflow:hidden;box-shadow:0 12px 35px rgba(37,55,39,.08)}
.sidebar{padding:30px 20px;background:#fbfcfa;border-right:1px solid var(--borde)}
.sidebar h1{margin:0 0 8px;color:var(--verde-oscuro);font-size:20px}.sidebar-intro{margin:0 0 24px;color:var(--gris);font-size:13px;line-height:1.5}
.topic-button{width:100%;display:flex;gap:11px;align-items:flex-start;text-align:left;border:0;border-radius:11px;background:transparent;color:#465047;padding:15px 11px;margin:7px 0;cursor:pointer;font-size:14px;line-height:1.4}
.topic-button:hover{background:#f0f5e5}.topic-button.active{background:var(--verde);color:#fff;font-weight:bold}
.number{min-width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:#e4ecd4;color:var(--verde-oscuro);font-size:12px;font-weight:bold}
.topic-button.active .number{background:#fff;color:var(--verde-oscuro)}
.topic-text strong{display:block;margin-bottom:3px;font-size:12px;text-transform:uppercase}
.workspace{padding:42px 46px 48px}.eyebrow{margin:0 0 10px;color:var(--verde-oscuro);font-size:12px;text-transform:uppercase;letter-spacing:1px;font-weight:bold}
h2{margin:0;font-size:30px;line-height:1.18}.intro{max-width:800px;margin:14px 0 26px;color:var(--gris);font-size:15px;line-height:1.65}
.bridge{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 24px}
.bridge-card{padding:12px;border:1px solid var(--borde);border-radius:10px;background:#fafcf8;font-size:12px;line-height:1.45}
.bridge-card strong{display:block;color:var(--verde-oscuro);margin-bottom:4px}.bridge-card.current{background:var(--verde-suave);border-color:#cbdca6}
.accordion{margin-bottom:12px;overflow:hidden;border:1px solid var(--borde);border-radius:12px;background:#fff}
.accordion-trigger{width:100%;padding:17px 19px;display:flex;align-items:center;justify-content:space-between;gap:15px;border:0;background:#fff;color:var(--tinta);text-align:left;font-size:15px;font-weight:bold;cursor:pointer}
.accordion-trigger:hover{background:#fafcf7}.accordion.open>.accordion-trigger{background:var(--verde-suave);color:var(--verde-oscuro)}
.accordion-icon,.sub-icon{width:27px;height:27px;display:grid;place-items:center;border-radius:50%;background:#e5edd5;color:var(--verde-oscuro);flex-shrink:0;font-size:19px}
.accordion-icon::after,.sub-icon::after{content:"+"}.accordion.open>.accordion-trigger .accordion-icon::after,.subaccordion.open>.sub-trigger .sub-icon::after{content:"−"}
.accordion-content{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}.accordion.open>.accordion-content{grid-template-rows:1fr}
.accordion-inner{overflow:hidden}.accordion-body{padding:21px;color:#475149;font-size:14px;line-height:1.65}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.card{padding:15px 16px;border-left:4px solid var(--verde);border-radius:0 9px 9px 0;background:#f8faf5}.card h4{margin:0 0 6px;color:var(--verde-oscuro);font-size:12px;text-transform:uppercase}.card p{margin:0}
.card.blue{border-left-color:var(--azul);background:var(--azul-suave)}.card.blue h4{color:var(--azul)}
.card.purple{border-left-color:var(--morado);background:var(--morado-suave)}.card.purple h4{color:var(--morado)}
.card.alert{border-left-color:var(--rojo);background:var(--rojo-suave)}.card.alert h4{color:var(--rojo)}
.project{margin-top:14px;padding:16px 17px;border-left:4px solid var(--amarillo);border-radius:0 8px 8px 0;background:var(--amarillo-suave)}.project strong{color:#86620a}
.example{margin-top:14px;padding:16px;border:1px dashed #b9cc84;border-radius:9px;background:#f4f7ed}
.teacher-note{margin-top:12px;padding:13px 15px;border-left:4px solid var(--azul);background:var(--azul-suave);border-radius:0 8px 8px 0}.teacher-note strong{color:var(--azul)}
.code{display:block;margin-top:12px;padding:14px;border-radius:8px;background:#26342c;color:#eaf3d6;white-space:pre-wrap;font-family:Consolas,monospace;font-size:13px;line-height:1.65}
.subaccordion{margin-top:10px;border:1px solid #e2e7df;border-radius:10px;overflow:hidden;background:#fff}
.sub-trigger{width:100%;border:0;background:#fbfcfa;padding:13px 14px;display:flex;justify-content:space-between;align-items:center;text-align:left;font-weight:bold;color:#465047;cursor:pointer}
.sub-content{display:grid;grid-template-rows:0fr;transition:.22s}.subaccordion.open>.sub-content{grid-template-rows:1fr}.sub-inner{overflow:hidden}.sub-body{padding:15px 16px}
.slide-box{margin-top:14px;border:1px solid var(--borde);border-radius:12px;background:#fff;overflow:hidden}
.slide-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#f7faf3;border-bottom:1px solid var(--borde);font-size:12px;color:var(--gris)}
.slide-stage{min-height:225px;padding:20px}
.slide-stage h4{margin:0 0 10px;color:var(--verde-oscuro);font-size:18px}.slide-stage p{margin:7px 0}
.slide-nav{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-top:1px solid var(--borde);background:#fbfcfa}
.slide-btn{border:1px solid #b9cc84;background:#fff;color:var(--verde-oscuro);padding:8px 12px;border-radius:7px;font-weight:bold;cursor:pointer}.slide-btn:hover{background:var(--verde-suave)}
.slide-dots{font-size:12px;color:var(--gris)}
.steps{display:grid;gap:10px;margin-top:12px}.step{display:grid;grid-template-columns:32px 1fr;gap:11px;padding:12px 14px;border:1px solid #e0e7da;border-radius:8px;background:#fff}
.step .n{width:29px;height:29px;display:grid;place-items:center;border-radius:50%;background:var(--verde);color:#fff;font-size:12px;font-weight:bold}
.ai-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}.ai-card{border:1px solid var(--borde);border-radius:10px;padding:14px;background:#fff}.ai-card strong{display:block;color:var(--verde-oscuro);margin-bottom:5px}.ai-card small{color:var(--gris)}
.pill{display:inline-block;padding:5px 9px;margin:3px 4px 3px 0;border-radius:14px;background:#eef2eb;color:#49554b;font-size:12px}
.checklist{padding-left:0;list-style:none}.checklist li{margin:8px 0;padding-left:27px;position:relative}.checklist li::before{content:"✓";position:absolute;left:0;width:19px;height:19px;border-radius:50%;background:var(--verde-suave);color:var(--verde-oscuro);display:grid;place-items:center;font-weight:bold;font-size:12px}
.timebox{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.time{border:1px solid #dfe6da;border-radius:10px;padding:13px;background:#fff}.time strong{display:block;color:var(--verde-oscuro);margin-bottom:4px}
footer{padding:5px 5% 28px;text-align:center;color:#7b837c;font-size:12px}
@media(max-width:950px){.bridge{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){header{padding:14px 5%}.brand span{display:none}.badge{display:none}.app{width:94%;grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--borde)}.workspace{padding:29px 22px}h2{font-size:25px}.grid,.ai-grid,.timebox{grid-template-columns:1fr}}
</style>

<main class="app">

<footer>Aprendiendo con @LaProfeVivy · Saber Conocer</footer>

<script>
const topics={
encuentro1:{
  eyebrow:"Saber Conocer · Eje 4 · Encuentro 1",
  title:"IA aplicada al desarrollo de soluciones",
  intro:"Qué puede hacer hoy la IA, cómo se usa para construir una aplicación y cómo elegir una función inteligente que aporte valor real al proyecto.",
  sections:[
    {
      title:"1. Cómo trabajamos hoy con IA",
      body:`
        <p>Cómo ha cambiado <strong>la forma práctica o el formato </strong> de trabajar con IA</strong>: Pasamos de usar la IA como un simple buscador (pedir una respuesta) a usarla como un asistente autónomo delegar procesos más completos.<br> <br>Para ello identificamos <b> 1. Entrada </b> ( Prompt y Contexto)<b> 2. Capacidades</b> (Tools y Skill) y <b>3. Cerebro </b>(Agente y Agente Loop)</p>

        <div class="subaccordion">
          <button class="sub-trigger"><span>Componentes</span><span class="sub-icon"></span></button>
          <div class="sub-content"><div class="sub-inner"><div class="sub-body">
            <div class="ai-grid">
              <div class="ai-card"><strong>Prompt</strong><small>La instrucción que damos.</small><p>Ej.: “Crea una pantalla para registrar un retardo”. "Redacta un correo de disculpa".</p></div>
              <div class="ai-card"><strong>Contexto</strong><small>La información extra que se le das para que no trabaje a ciegas, es lo que necesita para entender.</small><p>Ej.: roles, datos, reglas y objetivo del proyecto. "El cliente está molesto porque el paquete llegó tarde, es un cliente VIP y nuestro tono debe ser formal".</p></div>
              <div class="ai-card"><strong>Tools</strong><small>Son los programas externos o herramientas que la IA puede abrir y usar para cumplir su objetivo. .</small><p>Ej.: archivos, código, base de datos, APIs.</p></div>
              <div class="ai-card"><strong>Skills</strong><small>Procedimientos reutilizables (que ya sabe hacer paso a paso de forma repetitiva). </small><p>Ej.: revisar siempre roles, datos, flujo y prueba.  Saber cómo estructurar una auditoría o cómo revisar un código.</p></div>
              <div class="ai-card"><strong>Agente</strong><small> Es la IA actuando por sí misma. En lugar de darnos una respuesta de inmediato, piensa: "Para cumplir esta orden, primero debo abrir este archivo (Tool), luego aplicar mi conocimiento (Skill) y después escribir el resultado". Puede analizar, actuar y corregirse sobre la marcha, es decir, ejecuta una tarea de varios pasos.</small><p>Puede analizar, actuar, revisar y continuar.</p></div>
              <div class="ai-card"><strong>Agent Loop</strong><small>Es el ciclo infinito que hace el Agente hasta que termina el trabajo, es decir, repite hasta completar.</small><p>Decidir → actuar → observar → corregir. <br> Si algo sale mal, vuelve a empezar el ciclo de forma automática hasta que el resultado sea el correcto.</p></div>
            </div>
          </div></div></div>
        </div>

        <div class="subaccordion">
          <button class="sub-trigger"><span>Arquitectura de Agentes o Patrones de Diseño de Sistemas de IA</span><span class="sub-icon"></span></button>
          <div class="sub-content"><div class="sub-inner"><div class="sub-body">
            <p><strong>Workflow (Flujo de trabajo):</strong>  Es el mapa o la carretera que sigue el proceso. Define qué paso va primero y cuál va después para que la IA no improvise la estructura del trabajo.secuencia organizada de pasos.</p>            <p><strong>Handoff (Transferencia):</strong> Es el relevo en una carrera de velocidad. Ocurre cuando un agente termina su parte especializada (por ejemplo, programar un código) y le pasa el resultado a otro agente especializado (por ejemplo, probar si el código tiene errores).</p>
            <p><strong>Multi-agent:(Multi-agente)</strong> Es el trabajo en equipo. En lugar de tener una sola IA que intente hacerlo todo, creas un "departamento" de mini-IAs donde cada una tiene un rol (un redactor, un editor, un diseñador) y colaboran entre sí.</p>
            <p><strong>Human in the loop: (Humano en el ciclo)</strong> Es el control de calidad. El sistema automatizado se detiene por completo en un punto crítico para ser revisado, se apruebe o se corrija lo que la IA ha hecho antes de que continúe.</p>
            <div class="teacher-note"><strong>Para explicar:</strong> “Más autonomía no significa abandonar el control. Nosotros seguimos revisando lo que la IA hace”.</div>
          </div></div></div>
        </div>

        <div class="subaccordion">
          <button class="sub-trigger"><span>Guía de explicación en clase, paso a paso</span><span class="sub-icon"></span></button>
          <div class="sub-content"><div class="sub-inner"><div class="sub-body">
            <div class="slide-box" data-slides="ia-evolucion">
              <div class="slide-head"><span>Mini guía docente</span><span class="slide-counter"></span></div>
              <div class="slide-stage"></div>
              <div class="slide-nav"><button class="slide-btn prev">← Anterior</button><span class="slide-dots"></span><button class="slide-btn next">Siguiente →</button></div>
            </div>
          </div></div></div>
        </div>
      `
    },

    {
      title:"2. Qué tipos de uso de  IA puede incorporar una aplicación",
      body:`
        <p>Para el proyecto es más útil hablar de <strong>tipos de uso de IA</strong>: qué capacidad inteligente aporta a la aplicación. Una app puede combinar más de una, pero el MVP debería escoger solo la que realmente ayude.</p>

        <div class="subaccordion">
          <button class="sub-trigger"><span>IA generativa y asistentes</span><span class="sub-icon"></span></button>
          <div class="sub-content"><div class="sub-inner"><div class="sub-body">
            <p><strong>Qué hace:</strong> genera texto, imágenes, código, audio o respuestas conversacionales.</p>
            <div class="example"><strong>Control de Retardos:</strong> un asistente podría responder “¿cuántos retardos tengo este mes?” o resumir los casos de un curso.</div>
            <p><strong>Otros proyectos:</strong> generar descripciones, redactar recomendaciones, explicar resultados, ayudar a llenar formularios.</p>
          </div></div></div>
        </div>

        <div class="subaccordion">
          <button class="sub-trigger"><span>Sistemas de recomendación</span><span class="sub-icon"></span></button>
          <div class="sub-content"><div class="sub-inner"><div class="sub-body">
            <p><strong>Qué hacen:</strong> sugieren opciones según datos, preferencias, comportamiento o reglas del contexto.</p>
            <div class="grid">
              <div class="card"><h4>Ejemplo comercial</h4><p>Recomendar productos según compras o intereses.</p></div>
              <div class="card blue"><h4>Ejemplo educativo</h4><p>Sugerir recursos de apoyo según dificultades detectadas.</p></div>
              <div class="card"><h4>Control de Retardos</h4><p>Sugerir qué casos requieren seguimiento prioritario según reincidencia y motivo.</p></div>
              <div class="card blue"><h4>Salud / bienestar</h4><p>Sugerir hábitos o contenidos, sin reemplazar decisiones profesionales.</p></div>
            </div>
          </div></div></div>
        </div>

        <div class="subaccordion">
          <button class="sub-trigger"><span>Clasificación y reconocimiento</span><span class="sub-icon"></span></button>
          <div class="sub-content"><div class="sub-inner"><div class="sub-body">
            <p><strong>Qué hace:</strong> aprende a colocar una entrada en una categoría.</p>
            <div class="example"><strong>Control de Retardos:</strong> clasificar un motivo escrito como transporte, salud, familiar u otro.</div>
            <p>También puede clasificar imágenes, sonidos o posturas.</p>
          </div></div></div>
        </div>

        <div class="subaccordion">
          <button class="sub-trigger"><span>Entrenar un modelo propio: Teachable Machine</span><span class="sub-icon"></span></button>
          <div class="sub-content"><div class="sub-inner"><div class="sub-body">
            <p><strong>Entrenamiento no es otro “tipo” de IA:</strong> es la forma de enseñarle al modelo ejemplos para que aprenda a reconocer categorías.</p>
            <p><strong>Teachable Machine</strong> permite crear modelos de clasificación sin programar, usando imágenes, sonidos o poses.</p>
            <div class="slide-box" data-slides="teachable">
              <div class="slide-head"><span>Teachable Machine · paso a paso</span><span class="slide-counter"></span></div>
              <div class="slide-stage"></div>
              <div class="slide-nav"><button class="slide-btn prev">← Anterior</button><span class="slide-dots"></span><button class="slide-btn next">Siguiente →</button></div>
            </div>
            <div class="teacher-note"><strong>Ejemplo:</strong> una app ambiental podría entrenar un clasificador sencillo para diferenciar tipos de residuos mediante imágenes. Una app de ejercicios podría reconocer dos o tres posturas. No todos los proyectos necesitan entrenar un modelo.</div>
          </div></div></div>
        </div>

        <div class="subaccordion">
          <button class="sub-trigger"><span>Predicción, visión y voz</span><span class="sub-icon"></span></button>
          <div class="sub-content"><div class="sub-inner"><div class="sub-body">
            <p><strong>Predicción:</strong> estima un resultado futuro usando datos históricos. Requiere suficientes datos y evaluación.</p>
            <p><strong>Visión:</strong> interpreta imágenes o video. Ej.: reconocer objetos, leer documentos o analizar fotografías.</p>
            <p><strong>Voz:</strong> convierte voz a texto, texto a voz o permite interacción hablada.</p>
            <div class="project"><strong>Para este curso:</strong> chatbot, resumen, clasificación o recomendación suelen ser más viables que una predicción compleja.</div>
          </div></div></div>
        </div>
      `
    },

    {
      title:"3. Del proyecto a las instrucciones para la IA",
      body:`
        <p>Los ejes anteriores son los insumos que ahora se convierten en instrucciones de construcción.</p>

        <div class="slide-box" data-slides="ejes">
          <div class="slide-head"><span>Cómo se transforma el proyecto</span><span class="slide-counter"></span></div>
          <div class="slide-stage"></div>
          <div class="slide-nav"><button class="slide-btn prev">← Anterior</button><span class="slide-dots"></span><button class="slide-btn next">Siguiente →</button></div>
        </div>

        <div class="subaccordion">
          <button class="sub-trigger"><span>Construir el prompt maestro</span><span class="sub-icon"></span></button>
          <div class="sub-content"><div class="sub-inner"><div class="sub-body">
            <div class="steps">
              <div class="step"><span class="n">1</span><div><strong>Problema.</strong><br>Escribe qué situación debe ayudar a resolver la app.</div></div>
              <div class="step"><span class="n">2</span><div><strong>Usuarios y roles.</strong><br>Quién entra y qué puede hacer cada persona.</div></div>
              <div class="step"><span class="n">3</span><div><strong>Datos.</strong><br>Qué información debe guardar o consultar.</div></div>
              <div class="step"><span class="n">4</span><div><strong>Funciones del MVP.</strong><br>Solo lo indispensable para demostrar la solución.</div></div>
              <div class="step"><span class="n">5</span><div><strong>UX.</strong><br>Cómo debería verse y sentirse.</div></div>
              <div class="step"><span class="n">6</span><div><strong>Función de IA.</strong><br>Qué capacidad inteligente aporta valor y con qué datos trabajará.</div></div>
              <div class="step"><span class="n">7</span><div><strong>Límite.</strong><br>Qué no debe construir todavía.</div></div>
            </div>
          </div></div></div>
        </div>

        <div class="subaccordion">
          <button class="sub-trigger"><span>Trabajar en Lovable</span><span class="sub-icon"></span></button>
          <div class="sub-content"><div class="sub-inner"><div class="sub-body">
            <p>Después de construir el prompt maestro, pasa al entorno de Lovable para desarrollar la aplicación.</p>
            <div class="project">
              <strong>Recurso:</strong>
              <a href="https://cgviviana.github.io/Asignaturas-FUAA/SaberConocer/Virtual/Eje4/Lovable/" target="_blank" rel="noopener noreferrer">
                Abrir guía de Lovable
              </a>
            </div>
          </div></div></div>
        </div>
      `
    },

    {
      title:"4. De Google Sheets y AppSheet a Lovable y Supabase",

function renderTopic(key){
 const topic=topics[key];
 document.getElementById("eyebrow").textContent=topic.eyebrow;
 document.getElementById("topicTitle").textContent=topic.title;
 document.getElementById("topicIntro").textContent=topic.intro;
 document.getElementById("accordions").innerHTML=topic.sections.map(s=>`
 <article class="accordion">
   <button class="accordion-trigger"><span>${s.title}</span><span class="accordion-icon"></span></button>
   <div class="accordion-content"><div class="accordion-inner"><div class="accordion-body">${s.body}</div></div></div>
 </article>`).join("");
 bindInteractions();
}

function bindInteractions(){
 document.querySelectorAll(".accordion-trigger").forEach(btn=>{
   btn.onclick=()=>btn.parentElement.classList.toggle("open");
 });
 document.querySelectorAll(".sub-trigger").forEach(btn=>{
   btn.onclick=()=>btn.parentElement.classList.toggle("open");
 });
 document.querySelectorAll(".slide-box").forEach(box=>{
   const key=box.dataset.slides, slides=slideSets[key]||[];
   let i=0;
   const stage=box.querySelector(".slide-stage");
   const counter=box.querySelector(".slide-counter");
   const dots=box.querySelector(".slide-dots");
   const render=()=>{
     const s=slides[i];
     stage.innerHTML=`<h4>${s.t}</h4><p>${s.b}</p>`;
     counter.textContent=`${i+1} / ${slides.length}`;
     dots.textContent="● ".repeat(i+1)+"○ ".repeat(slides.length-i-1);
     box.querySelector(".prev").disabled=i===0;
     box.querySelector(".next").disabled=i===slides.length-1;
   };
   box.querySelector(".prev").onclick=()=>{if(i>0){i--;render()}};
   box.querySelector(".next").onclick=()=>{if(i<slides.length-1){i++;render()}};
   render();
 });
}

document.querySelectorAll(".topic-button").forEach(btn=>{
 btn.onclick=()=>{
   document.querySelectorAll(".topic-button").forEach(b=>b.classList.remove("active"));
   btn.classList.add("active");
   renderTopic(btn.dataset.topic);
 }
});
