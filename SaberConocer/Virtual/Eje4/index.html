<script>
const topics={
encuentro1:{
eyebrow:"Saber Conocer · Eje 4 · Encuentro 1",
title:"IA aplicada al desarrollo de soluciones",
intro:"Qué puede hacer hoy la IA, cómo se usa para construir una aplicación y cómo elegir una función inteligente que aporte valor real al proyecto.",
sections:[
{
title:"1. Cómo trabajamos hoy con IA",
body:`
<p>Cómo ha cambiado <strong>la forma práctica o el formato </strong> de trabajar con IA</strong>: Pasamos de usar la IA como un simple buscador (pedir una respuesta) a usarla como un asistente autónomo delegar procesos más completos. Para ello identificamos<br> <br>  <b> 1. Entrada </b> ( Prompt y Contexto)<b> 2. Capacidades</b> (Tools y Skill) y <b>3. Cerebro </b>(Agente y Agente Loop)</p>

<div class="subaccordion">
<button class="sub-trigger"><span>Componentes</span><span class="sub-icon"></span></button>
<div class="sub-content"><div class="sub-inner"><div class="sub-body">
<div class="ai-grid">
<div class="ai-card"><strong>Prompt</strong><small>La instrucción que damos.</small><p>Ej.: “Crea una pantalla para registrar un retardo”. "Redacta un correo de disculpa".</p></div>
<div class="ai-card"><strong>Contexto</strong><small>La información extra que se le das para que no trabaje a ciegas, es lo que necesita para entender.</small><p>Ej.: roles, datos, reglas y objetivo del proyecto. "El cliente está molesto porque el paquete llegó tarde, es un cliente VIP y nuestro tono debe ser formal".</p></div>
<div class="ai-card"><strong>Tools</strong><small>Son los programas externos o herramientas que la IA puede abrir y usar para cumplir su objetivo. .</small><p>Ej.: archivos, código, base de datos, APIs.</p></div>
<div class="ai-card"><strong>Skills</strong><small>Procedimientos reutilizables (que ya sabe hacer paso a paso de forma repetitiva). </small><p>Ej.: revisar siempre roles, datos, flujo y prueba.  Saber cómo estructurar una auditoría o cómo revisar un código.</p></div>
<div class="ai-card"><strong>Agente</strong><small> Es la IA actuando por sí misma. En lugar de darnos una respuesta de inmediato, piensa: "Para cumplir esta orden, primero debo abrir este archivo (Tool), luego aplicar mi conocimiento (Skill) y después escribir el resultado". Puede analizar, actuar y corregirse sobre la marcha, es decir, ejecuta una tarea de varios pasos.</small><p>Puede analizar, actuar, revisar y continuar.</p></div>
<div class="ai-card"><strong>Agent Loop</strong><small>Es el ciclo infinito que hace el Agente hasta que termina el trabajo, es decir, repite hasta completar.</small><p>Decidir → actuar → observar → corregir. <br> Si algo sale mal, vuelve a empezar el ciclo de forma automática hasta que el resultado sea el correcto.</p></div>
</div>
</div></div></div>
</div>

<div class="subaccordion">
<button class="sub-trigger"><span>Arquitectura de Agentes o Patrones de Diseño de Sistemas de IA</span><span class="sub-icon"></span></button>
<div class="sub-content"><div class="sub-inner"><div class="sub-body">
<p><strong>Workflow (Flujo de trabajo):</strong>  Es el mapa o la carretera que sigue el proceso. Define qué paso va primero y cuál va después para que la IA no improvise la estructura del trabajo.secuencia organizada de pasos.</p>            <p><strong>Handoff (Transferencia):</strong> Es el relevo en una carrera de velocidad. Ocurre cuando un agente termina su parte especializada (por ejemplo, programar un código) y le pasa el resultado a otro agente especializado (por ejemplo, probar si el código tiene errores).</p>
<p><strong>Multi-agent:(Multi-agente)</strong> Es el trabajo en equipo. En lugar de tener una sola IA que intente hacerlo todo, creas un "departamento" de mini-IAs donde cada una tiene un rol (un redactor, un editor, un diseñador) y colaboran entre sí.</p>
<p><strong>Human in the loop: (Humano en el ciclo)</strong> Es el control de calidad. El sistema automatizado se detiene por completo en un punto crítico para ser revisado, se apruebe o se corrija lo que la IA ha hecho antes de que continúe.</p>
<div class="teacher-note"><strong>Para explicar:</strong> “Más autonomía no significa abandonar el control. Nosotros seguimos revisando lo que la IA hace”.</div>
</div></div></div>
</div>

<div class="subaccordion">
<button class="sub-trigger"><span>Guía</span><span class="sub-icon"></span></button>
<div class="sub-content"><div class="sub-inner"><div class="sub-body">
<div class="slide-box" data-slides="ia-evolucion">
<div class="slide-head"><span>Paso a paso</span><span class="slide-counter"></span></div>
<div class="slide-stage"></div>
<div class="slide-nav"><button class="slide-btn prev">← Anterior</button><span class="slide-dots"></span><button class="slide-btn next">Siguiente →</button></div>
</div>
</div></div></div>
</div>
`
},

{
title:"2. Qué tipos de uso de  IA puede incorporar una aplicación",
body:`
<p>Qué capacidad inteligente aporta a la aplicación. Una app puede combinar más de una, pero <strong> el MVP </strong> debería escoger solo la que realmente ayude.</p>

<div class="subaccordion">
<button class="sub-trigger"><span>IA generativa y asistentes</span><span class="sub-icon"></span></button>
<div class="sub-content"><div class="sub-inner"><div class="sub-body">
<p><strong>Qué hace:</strong> genera texto, imágenes, código, audio o respuestas conversacionales.</p>
<div class="example"><strong>Control de Retardos:</strong> un asistente podría responder “¿cuántos retardos tengo este mes?” o resumir los casos de un curso.</div>
<p><strong>Otros proyectos:</strong> generar descripciones, redactar recomendaciones, explicar resultados, ayudar a llenar formularios.</p>
</div></div></div>
</div>

<div class="subaccordion">
<button class="sub-trigger"><span>Sistemas de recomendación</span><span class="sub-icon"></span></button>
<div class="sub-content"><div class="sub-inner"><div class="sub-body">
<p><strong>Qué hacen:</strong> sugieren opciones según datos, preferencias, comportamiento o reglas del contexto.</p>
<div class="grid">
<div class="card"><h4>Ejemplo comercial</h4><p>Recomendar productos según compras o intereses.</p></div>
<div class="card blue"><h4>Ejemplo educativo</h4><p>Sugerir recursos de apoyo según dificultades detectadas.</p></div>
<div class="card"><h4>Control de Retardos</h4><p>Sugerir qué casos requieren seguimiento prioritario según reincidencia y motivo.</p></div>
<div class="card blue"><h4>Salud / bienestar</h4><p>Sugerir hábitos o contenidos, sin reemplazar decisiones profesionales.</p></div>
</div>
</div></div></div>
</div>

<div class="subaccordion">
<button class="sub-trigger"><span>Clasificación y reconocimiento</span><span class="sub-icon"></span></button>
<div class="sub-content"><div class="sub-inner"><div class="sub-body">
<p><strong>Qué hace:</strong> aprende a colocar una entrada en una categoría.</p>
<div class="example"><strong>Control de Retardos:</strong> clasificar un motivo escrito como transporte, salud, familiar u otro.</div>
<p>También puede clasificar imágenes, sonidos o posturas.</p>
</div></div></div>
</div>

<div class="subaccordion">
<button class="sub-trigger"><span>Entrenar un modelo propio: Teachable Machine</span><span class="sub-icon"></span></button>
<div class="sub-content"><div class="sub-inner"><div class="sub-body">
<p><strong>Entrenamiento no es otro “tipo” de IA:</strong> es la forma de enseñarle al modelo ejemplos para que aprenda a reconocer categorías.</p>
<p><strong>Teachable Machine</strong> permite crear modelos de clasificación sin programar, usando imágenes, sonidos o poses.</p>
<div class="slide-box" data-slides="teachable">
<div class="slide-head"><span>Teachable Machine · paso a paso</span><span class="slide-counter"></span></div>
<div class="slide-stage"></div>
<div class="slide-nav"><button class="slide-btn prev">← Anterior</button><span class="slide-dots"></span><button class="slide-btn next">Siguiente →</button></div>
</div>
<div class="teacher-note"><strong>Ejemplo:</strong> una app ambiental podría entrenar un clasificador sencillo para diferenciar tipos de residuos mediante imágenes. Una app de ejercicios podría reconocer dos o tres posturas. No todos los proyectos necesitan entrenar un modelo.</div>
</div></div></div>
</div>

<div class="subaccordion">
<button class="sub-trigger"><span>Predicción, visión y voz</span><span class="sub-icon"></span></button>
<div class="sub-content"><div class="sub-inner"><div class="sub-body">
<p><strong>Predicción:</strong> estima un resultado futuro usando datos históricos. Requiere suficientes datos y evaluación.</p>
<p><strong>Visión:</strong> interpreta imágenes o video. Ej.: reconocer objetos, leer documentos o analizar fotografías.</p>
<p><strong>Voz:</strong> convierte voz a texto, texto a voz o permite interacción hablada.</p>
<div class="project"><strong>Para este curso:</strong> chatbot, resumen, clasificación o recomendación suelen ser más viables que una predicción compleja.</div>
</div></div></div>
</div>
`
},

{
title:"3. Del proyecto a las instrucciones para la IA",
body:`
<p>Los ejes anteriores son los insumos que ahora se convierten en instrucciones de construcción.</p>

<div class="slide-box" data-slides="ejes">
<div class="slide-head"><span>Cómo se transforma el proyecto</span><span class="slide-counter"></span></div>
<div class="slide-stage"></div>
<div class="slide-nav"><button class="slide-btn prev">← Anterior</button><span class="slide-dots"></span><button class="slide-btn next">Siguiente →</button></div>
</div>

<div class="subaccordion">
<button class="sub-trigger"><span>Construir el prompt </span><span class="sub-icon"></span></button>
<div class="sub-content"><div class="sub-inner"><div class="sub-body">
<div class="steps">
<div class="step"><span class="n">1</span><div><strong>Problema.</strong><br>Escribe qué situación debe ayudar a resolver la app.</div></div>
<div class="step"><span class="n">2</span><div><strong>Usuarios y roles.</strong><br>Quién entra y qué puede hacer cada persona.</div></div>
<div class="step"><span class="n">3</span><div><strong>Datos.</strong><br>Qué información debe guardar o consultar.</div></div>
<div class="step"><span class="n">4</span><div><strong>Funciones del MVP.</strong><br>Solo lo indispensable para demostrar la solución.</div></div>
<div class="step"><span class="n">5</span><div><strong>UX.</strong><br>Cómo debería verse y sentirse.</div></div>
<div class="step"><span class="n">6</span><div><strong>Función de IA.</strong><br>Qué capacidad inteligente aporta valor y con qué datos trabajará.</div></div>
<div class="step"><span class="n">7</span><div><strong>Límite.</strong><br>Qué no debe construir todavía.</div></div>
</div>
</div></div></div>

<div class="subaccordion">

<div class="project">

Abrir guía de Lovable
</a>
</div>
</div></div></div>
</div>
`
},

{
title:"4. De Google Sheets y AppSheet a Lovable y Supabase",
body:`
<p>En AppSheet aprendimos que <strong>unos datos organizados pueden convertirse en una aplicación</strong>. Ahora veremos una arquitectura más completa.</p>

<div class="slide-box" data-slides="datos">
<div class="slide-head"><span>De datos a aplicación · paso a paso</span><span class="slide-counter"></span></div>
<div class="slide-stage"></div>
<div class="slide-nav"><button class="slide-btn prev">← Anterior</button><span class="slide-dots"></span><button class="slide-btn next">Siguiente →</button></div>
</div>

<div class="subaccordion">
<button class="sub-trigger"><span>¿Qué es Supabase?</span><span class="sub-icon"></span></button>
<div class="sub-content"><div class="sub-inner"><div class="sub-body">
<p>Supabase es el <strong>backend</strong>: la parte que queda detrás de la aplicación. Puede ofrecer base de datos PostgreSQL, usuarios/autenticación, almacenamiento y funciones de servidor.</p>
<div class="teacher-note"><strong>Explicación sencilla:</strong> “Lovable construye lo que el usuario ve. Supabase es la parte de atrás que guarda datos y controla servicios”.</div>
</div></div></div>
</div>

title:"1. Prototipo funcional (Lovable + Supabase + IA)",
body:`
<p>El prototipo debe demostrar el flujo principal de la solución. No se busca construir un producto completo, sino una versión funcional que permita probar la idea, verificar los datos y mostrar cómo responde al problema.</p>
<div class="grid">
<div class="card"><h4>Lovable</h4><p>Construye las pantallas, la navegación y las acciones visibles para el usuario.</p></div>
<div class="card blue"><h4>Supabase</h4><p>Guarda, organiza y relaciona los datos que utiliza la aplicación.</p></div>
<div class="card purple"><h4>Función de IA</h4><p>Aporta una capacidad inteligente útil, justificable y demostrable dentro del MVP.</p></div>
<div class="card"><h4>Validación</h4><p>Permite comprobar el flujo, detectar errores y corregir antes de presentar.</p></div>
</div>
<div class="subaccordion"><button class="sub-trigger"><span>De AppSheet a Lovable + Supabase</span><span class="sub-icon"></span></button><div class="sub-content"><div class="sub-inner"><div class="sub-body">
<p>En AppSheet, las tablas organizadas en Google Sheets eran la fuente de datos de la aplicación: formularios, vistas y acciones trabajaban sobre esas filas y columnas.</p>
<div class="grid">
  <div class="card"><h4>Antes: AppSheet</h4><p>Google Sheets almacenaba los datos y AppSheet los convertía en formularios, vistas y acciones.</p></div>
  <div class="card blue"><h4>Ahora: Lovable + Supabase</h4><p>Supabase almacena y relaciona los datos; Lovable construye la interfaz y utiliza esos datos para registrar, consultar y actualizar información.</p></div>
</div>
<div class="project">.</div>
</div></div></div></div>

<div class="subaccordion">
  <button class="sub-trigger">
    <span>Supabase (pasos básicos)</span>
    <span class="sub-icon"></span>
  </button>
  <div class="sub-content"><div class="sub-inner"><div class="sub-body">

    <p>Las tablas que ya tienen en Google Sheets se preparan allí, se importan a Supabase y después Lovable se conecta a ese proyecto de Supabase.</p>

    <div class="steps">
      <div class="step"><span class="n">1</span><div><strong>Registrarse.</strong><br>Entrar a Supabase, crear una cuenta y crear un proyecto nuevo para la aplicación.</div></div>

      <div class="step"><span class="n">2</span><div><strong>Revisar las tablas de Sheets.</strong><br>Cada hoja debe representar una tabla, con encabezados claros y una columna identificadora única. Ejemplo: <code>estudiante_id</code>.</div></div>

      <div class="step"><span class="n">3</span><div><strong>Exportar desde Google Sheets.</strong><br>Descargar cada hoja como archivo CSV. No se conecta Lovable directamente a esas hojas en este ejercicio.</div></div>

      <div class="step"><span class="n">4</span><div><strong>Importar en Supabase.</strong><br>En Supabase abrir <em>Table Editor</em>, crear o importar una tabla y cargar el CSV correspondiente.</div></div>

      <div class="step"><span class="n">5</span><div><strong>Revisar los tipos de datos.</strong><br>Confirmar que cada campo sea texto, número, fecha/hora, booleano o identificador según corresponda.</div></div>

      <div class="step"><span class="n">6</span><div><strong>Relacionar las tablas.</strong><br>Usar los identificadores para conectar la información. Ejemplo: <code>registros_asistencia.estudiante_id</code> debe relacionarse con <code>estudiantes.id</code>. Lo que en AppSheet conocimos como <em>Ref</em>, aquí se maneja con una clave foránea.</div></div>

      <div class="step"><span class="n">7</span><div><strong>Conectar Lovable.</strong><br>En Lovable abrir <em>Settings → Integrations → Supabase</em>, iniciar la conexión, autorizar la cuenta y seleccionar el proyecto de Supabase que utilizará la app.</div></div>

      <div class="step"><span class="n">8</span><div><strong>Probar.</strong><br>Crear un registro desde la app y comprobar en <em>Table Editor</em> que la fila quedó guardada correctamente.</div></div>
    </div>

    <div class="project">
      <strong>Ejemplo aplicado:</strong><br>
      La pantalla de llegada guarda en <code>registros_asistencia</code> los campos estudiante, fecha, hora y estado. El dashboard consulta esa misma tabla para calcular y mostrar los retardos.
    </div>

  </div></div></div>
</div>


<div class="subaccordion">
  <button class="sub-trigger">
    <span>Lovable (Prompt maestro)</span>

  </button>

    <p>Antes de construir, el equipo prepara un único prompt maestro. Ese prompt debe permitir que Lovable comprenda el proyecto completo antes de generar las pantallas.</p>

    <div class="steps">
      <div class="step"><span class="n">1</span><div><strong>Problemática.</strong><br>Qué situación existe, a quién afecta y qué consecuencias genera.</div></div>

      <div class="step"><span class="n">2</span><div><strong>Solución.</strong><br>Qué propone la aplicación y cuál es el objetivo concreto del MVP.</div></div>

      <div class="step"><span class="n">3</span><div><strong>Flujo de funcionamiento.</strong><br>Describir el recorrido completo: qué hace cada usuario desde que entra hasta que termina su tarea.</div></div>

      <div class="step"><span class="n">4</span><div><strong>Perfiles y permisos.</strong><br>Indicar cada perfil, qué puede hacer, qué puede consultar, qué puede modificar y qué información no debe visualizar.</div></div>

      <div class="step"><span class="n">5</span><div><strong>Pantallas por perfil.</strong><br>Definir qué ve cada usuario: inicio, formulario, historial, dashboard, alertas, configuración u otras pantallas necesarias.</div></div>

      <div class="step"><span class="n">6</span><div><strong>Tablas y datos.</strong><br>Incluir el nombre de las tablas, campos principales, identificadores y relaciones. Estas tablas se migrarán desde Google Sheets a Supabase.</div></div>

      <div class="step"><span class="n">7</span><div><strong>Reglas del negocio.</strong><br>Explicar cálculos, estados, validaciones y condiciones. Ejemplo: cuándo un registro se considera retardo y cómo se calcula.</div></div>

      <div class="step"><span class="n">8</span><div><strong>Identidad corporativa.</strong><br>Indicar nombre de la app, colores, estilo visual y tipografía. Se pueden adjuntar al proyecto el logo, imágenes, referentes visuales o manual de identidad para que Lovable los use como contexto.</div></div>

      <div class="step"><span class="n">9</span><div><strong>Función de IA.</strong><br>Indicar qué tipo de IA se integrará, qué hace, con qué datos trabaja, qué resultado entrega y con qué herramienta puede implementarse.</div></div>

      <div class="step"><span class="n">10</span><div><strong>Límites del MVP.</strong><br>Definir qué no debe construir todavía para evitar funciones innecesarias.</div></div>
    </div>

    <div class="project">
      <strong>Después del prompt:</strong><br>
      conectar Lovable con Supabase desde <em>Settings → Integrations → Supabase</em> y seleccionar el proyecto que contiene las tablas importadas.
    </div>

    <div class="project">
      <strong>Recurso:</strong>
      <a href="https://cgviviana.github.io/Asignaturas-FUAA/SaberConocer/Virtual/Eje4/Lovable/" target="_blank" rel="noopener noreferrer">Abrir guía de Lovable</a>
    </div>

  </div></div></div>
</div>


<div class="subaccordion">

    <span>Originalidad e incorporación de IA</span>
    <span class="sub-icon"></span>
  </button>
  <div class="sub-content"><div class="sub-inner"><div class="sub-body">

    <p>El componente de IA debe justificar qué aporta de diferente a la solución y cómo puede implementarse de manera realista dentro del MVP.</p>

    <div class="steps">
      <div class="step"><span class="n">1</span><div><strong>Aporte original.</strong><br>Qué mejora, descubre, automatiza o permite hacer frente a otras soluciones similares.</div></div>
      <div class="step"><span class="n">2</span><div><strong>Tipo de IA.</strong><br>Definir si es generativa, recomendación, clasificación, reconocimiento, predicción, detección de patrones u otra.</div></div>
      <div class="step"><span class="n">3</span><div><strong>Función concreta.</strong><br>Qué tarea realiza exactamente dentro de la aplicación.</div></div>
      <div class="step"><span class="n">4</span><div><strong>Datos.</strong><br>Qué información necesita para poder trabajar.</div></div>
      <div class="step"><span class="n">5</span><div><strong>Funcionamiento.</strong><br>Qué información recibe, qué análisis realiza y qué resultado entrega.</div></div>
      <div class="step"><span class="n">6</span><div><strong>Herramientas.</strong><br>Con qué programa, servicio o modelo puede implementarse.</div></div>
      <div class="step"><span class="n">7</span><div><strong>Viabilidad.</strong><br>Si puede probarse con los datos, tiempo y recursos disponibles en el proyecto.</div></div>
    </div>

    <div class="subaccordion">
      <button class="sub-trigger">
        <span>Ejemplo: "Hora Cero Insight"</span>
        <span class="sub-icon"></span>
      </button>
      <div class="sub-content"><div class="sub-inner"><div class="sub-body">

        <div class="grid">
          <div class="card">
            <h4>Aporte original</h4>
            <p>No se limita a registrar asistencia o mostrar cuántos retardos existen. Analiza varias variables del contexto escolar para encontrar patrones que ayuden a comprender en qué condiciones se concentra la impuntualidad.</p>
          </div>

          <div class="card blue">
            <h4>Tipo de IA</h4>
            <p>Detección de patrones mediante aprendizaje automático sobre datos tabulares ( organizados en tablas, como los registros de asistencia almacenados en Sheets o Supabase).</p>
          </div>

          <div class="card purple">
            <h4>Qué hace</h4>
            <p>Busca relaciones entre los registros de retardo y variables como día, grado, jornada, franja de llegada, reincidencia u otras variables disponibles en la base de datos.</p>
          </div>

          <div class="card">
            <h4>Datos que utiliza</h4>
            <p>Registros de asistencia, hora de llegada, hora de inicio, minutos de retardo, curso o grado, fecha, jornada, estado del registro y otras variables que el colegio decida incluir.</p>
          </div>
        </div>

        <div class="project">
          <strong>Cómo funciona:</strong><br>
          El modelo recibe los registros históricos de asistencia, analiza qué variables aparecen juntas con mayor frecuencia en los casos de retardo y genera resultados que permiten identificar concentraciones o patrones. Coordinación revisa esos hallazgos y decide qué acciones tomar.
        </div>

        <div class="grid">
          <div class="card">
            <h4>Lovable</h4>
            <p>Muestra la interfaz, los resultados del análisis y las vistas para coordinación.</p>
          </div>

          <div class="card blue">
            <h4>Supabase</h4>
            <p>Almacena los registros de asistencia y las variables que alimentan el análisis.</p>
          </div>

          <div class="card purple">
            <h4>Google Colab</h4>
            <p>Permite preparar los datos, probar el modelo y ejecutar el análisis sin instalar software adicional.</p>
          </div>

          <div class="card">
            <h4>scikit-learn</h4>
            <p>Puede utilizarse para aplicar técnicas de aprendizaje automático sobre datos tabulares y evaluar los resultados.</p>
          </div>
        </div>

        <div class="project">
          <strong>Viabilidad:</strong><br>
          Para el MVP puede trabajarse con herramientas gratuitas o de bajo costo. El modelo se prueba con datos de ejemplo o históricos, y luego los resultados se muestran en la aplicación. Si el proyecto creciera, se evaluaría si necesita automatizar el análisis o usar infraestructura adicional.
        </div>

      </div></div></div>
    </div>

  </div></div></div>
</div>

function renderTopic(key){
const topic=topics[key];
document.getElementById("eyebrow").textContent=topic.eyebrow;
document.getElementById("topicTitle").textContent=topic.title;
document.getElementById("topicIntro").textContent=topic.intro;
document.getElementById("accordions").innerHTML=topic.sections.map(s=>`
<article class="accordion">
<button class="accordion-trigger"><span>${s.title}</span><span class="accordion-icon"></span></button>
<div class="accordion-content"><div class="accordion-inner"><div class="accordion-body">${s.body}</div></div></div>
</article>`).join("");
bindInteractions();
}

function bindInteractions(){
document.querySelectorAll(".accordion-trigger").forEach(btn=>{
btn.onclick=()=>btn.parentElement.classList.toggle("open");
});
document.querySelectorAll(".sub-trigger").forEach(btn=>{
btn.onclick=()=>btn.parentElement.classList.toggle("open");
});
document.querySelectorAll(".slide-box").forEach(box=>{
const key=box.dataset.slides, slides=slideSets[key]||[];
let i=0;
const stage=box.querySelector(".slide-stage");
const counter=box.querySelector(".slide-counter");
const dots=box.querySelector(".slide-dots");
const render=()=>{
const s=slides[i];
stage.innerHTML=`<h4>${s.t}</h4><p>${s.b}</p>`;
counter.textContent=`${i+1} / ${slides.length}`;
dots.textContent="● ".repeat(i+1)+"○ ".repeat(slides.length-i-1);
box.querySelector(".prev").disabled=i===0;
box.querySelector(".next").disabled=i===slides.length-1;
};
box.querySelector(".prev").onclick=()=>{if(i>0){i--;render()}};
box.querySelector(".next").onclick=()=>{if(i<slides.length-1){i++;render()}};
render();
});
}

document.querySelectorAll(".topic-button").forEach(btn=>{
btn.onclick=()=>{
document.querySelectorAll(".topic-button").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
renderTopic(btn.dataset.topic);
}
});
renderTopic("encuentro1");
</script>
