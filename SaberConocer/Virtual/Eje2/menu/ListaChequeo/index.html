const CHECK = '<svg viewBox="0 0 20 20"><path d="M3 10.5l4.5 4.5L17 4.5" fill="none" stroke="#2fb52f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const list=document.getElementById('list'),arrow=document.getElementById('arrow'),panel=document.getElementById('panel');
let pagina=0,cur=-1;
const marcados=[new Set(),new Set()];
function llenar(){
 list.innerHTML='';
 GRUPOS[pagina].forEach((it,i)=>{
  let li=document.createElement('li');
  li.innerHTML='<button type="button"><span class="box">'+CHECK+'</span>'+it.t+'</button>';
  li.firstChild.onclick=()=>show(i);
  list.appendChild(li);
 });
 document.querySelector('.titlebar').textContent=TITULOS[pagina];
}
function show(i){
 cur=i;
 const botones=list.querySelectorAll('button');
 botones.forEach(b=>b.classList.remove('active'));
 const it=i<0?INTRODUCCIONES[pagina]:GRUPOS[pagina][i];
 document.getElementById('ptitle').textContent=it.t;
 const tx=document.getElementById('ptext');
 const ps=it.p.map(x=>'<p>'+x+'</p>').join('');
 tx.innerHTML=i<0?'<div class="intro"><div>'+ps+'</div><img src="'+PRESENTER+'" alt=""></div>':ps;
 tx.scrollTop=0;
 if(i>=0){
  marcados[pagina].add(i);
  botones[i].classList.add('active');
  marcados[pagina].forEach(k=>botones[k].classList.add('done'));
  placeArrow(botones[i]);
 }else{arrow.style.display='none';marcados[pagina].forEach(k=>botones[k].classList.add('done'));}
 document.getElementById('prev').disabled=(pagina===0&&i<0);
 document.getElementById('next').disabled=(pagina===1&&i===GRUPOS[pagina].length-1);
 document.getElementById('counter').textContent=(pagina+1)+' de 2 · '+(i<0?'Lista de chequeo':(i+1)+' de '+GRUPOS[pagina].length);
}
function placeArrow(btn){
 if(window.innerWidth<=620){arrow.style.display='none';return;}
 const pr=panel.getBoundingClientRect(),br=btn.getBoundingClientRect();
 arrow.style.display='block';
 arrow.style.left=(br.left+br.width*.62-pr.left)+'px';
 arrow.style.width=(pr.left-(br.left+br.width*.62)+6)+'px';
 arrow.setAttribute('preserveAspectRatio','none');
 arrow.style.top=(br.top+br.height/2-pr.top-7)+'px';
}
function cambiar(n){pagina=n;llenar();show(-1);}
document.getElementById('prev').onclick=()=>{if(cur>=0)show(cur-1);else if(pagina===1){cambiar(0);show(GRUPOS[0].length-1);}};
document.getElementById('next').onclick=()=>{
 if(cur<GRUPOS[pagina].length-1)show(cur+1);
 else if(pagina===0)cambiar(1);
};
window.addEventListener('resize',()=>{if(cur>=0)placeArrow(list.querySelectorAll('button')[cur])});
cambiar(0);
</script></body></html>
