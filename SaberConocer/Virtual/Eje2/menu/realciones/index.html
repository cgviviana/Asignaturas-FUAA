.computed{font-weight:800;color:#234f6a;white-space:nowrap}.statebadge{display:inline-block;border-radius:6px;padding:5px 7px;font-weight:800;font-size:11px;white-space:nowrap}.on-time{background:#d8f3d6;color:#28612e}.tolerance{background:#fff0bb;color:#775612}.late{background:#ffe0dc;color:#9d352b}</style></head><body><div class="wrap"><div class="top"><div class="logo">🧱 MISIÓN DATOS</div><div class="tag">ACADEMIA DE BLOQUES</div><div class="stats"><div class="chip" id="score">⭐ 0 / 3</div><div class="chip">🏫 Colegio</div></div></div><div class="terrain"><header class="terrain-header"><div class="pixel" id="levelIcon">📦</div><div class="hgroup"><h1 id="levelTitle">Nivel 1</h1><p id="levelSubtitle">Construye el sistema de retardos</p></div><div class="levelstrip"><div class="leveldot now" id="dot0">1</div><div class="leveldot" id="dot1">2</div><div class="leveldot" id="dot2">3</div></div></header><div class="progress"><div id="bar" style="width:0"></div></div><main class="playzone" id="game"></main></div><footer>Aprendiendo con @LaProfeVivy</footer></div><script>
const students=[['EST-014','Lucía Rojas','7B'],['EST-027','Mateo Díaz','8A'],['EST-039','Sofía Ruiz','7B']];
const arriving=[['L-101','Lucía Rojas','12/10/2026','07:02','EST-014'],['L-102','Mateo Díaz','12/10/2026','07:09','EST-027'],['L-103','Lucía Rojas','13/10/2026','07:12','EST-014'],['L-104','Sofía Ruiz','12/10/2026','07:01','EST-039'],['L-105','Mateo Díaz','13/10/2026','07:06','EST-027']];
function delayMinutes(t){const [h,m]=t.split(':').map(Number);return Math.max(0,h*60+m-420)}
function arrivalState(t){const d=delayMinutes(t);return d===0?'Puntual':d<=5?'Tolerancia':'Retardo'}
function stateClass(t){return delayMinutes(t)===0?'on-time':delayMinutes(t)<=5?'tolerance':'late'}
const levels=[{title:'Construye la tabla',subtitle:'Tres estudiantes y sus datos',icon:'📋',story:'Completa los nombres y cursos de los tres estudiantes. En el inventario también hay datos que pertenecen a otros campos: identifica cuáles necesitas para esta tabla.'},{title:'Conecta las llegadas',subtitle:'Registros diarios y cálculo de retrasos',icon:'🔗',story:'El docente abre la primera clase del día y proyecta un QR temporal. El estudiante ingresa a la aplicación con su correo institucional y escanea el código QR generado por el docente. La aplicación reconoce su cuenta, busca su correo en la tabla ESTUDIANTES e identifica su ID_Estudiante. Así registra automáticamente la fecha y la hora de llegada a la primera clase del día. Al registrar la llegada, crea un ID_Registro nuevo para identificar ese evento y guarda también el ID_Estudiante para saber a quién pertenece. Por eso hay dos códigos distintos: ID_Registro identifica una llegada; ID_Estudiante identifica a la persona y puede repetirse en fechas diferentes. Solo se permite una llegada por estudiante cada día. En esta misión, relaciona cada llegada con el estudiante correcto arrastrando su ID_Estudiante. Después observa cómo se calculan los minutos desde las 07:00 y el estado con tolerancia de 5 minutos.'},{title:'Activa las reglas',subtitle:'El sistema toma decisiones',icon:'⚙️',story:'La clase comienza a las 07:00 y tiene cinco minutos de tolerancia. Después se registra un retraso. Las justificaciones y la cantidad de incidencias permiten decidir qué seguimiento corresponde.',tiles:[['b','Calcular minutos de retraso'],['c','Comprobar justificación'],['a','Guardar registro'],['d','Avisar a coordinación'],['e','Borrar registros anteriores'],['f','Cambiar nombre del estudiante']],slots:[['Llegó a las 07:08. ¿Qué función se ejecuta?','b'],['Presentó excusa médica. ¿Qué se comprueba?','c'],['Terminó el análisis. ¿Qué se hace con la información?','a'],['Tercera incidencia injustificada. ¿Qué función se ejecuta?','d']]}];
let level=0, selected=null, placed={},won=false, solved=false;
const game=document.getElementById('game');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function common(){const L=levels[level];document.getElementById('levelTitle').textContent='NIVEL '+(level+1)+' · '+L.title;document.getElementById('levelSubtitle').textContent=L.subtitle;document.getElementById('levelIcon').textContent=L.icon;document.getElementById('score').textContent='⭐ '+level+' / 3';document.getElementById('bar').style.width=(level/3*100)+'%';for(let i=0;i<3;i++)document.getElementById('dot'+i).className='leveldot '+(i<level?'done':i===level?'now':'');}
function choices(items,reuse=false){return '<div class="choicepool">'+items.map(([id,label])=>'<button class="tile '+(selected===id?'active ':'')+(!reuse&&Object.keys(placed).some(k=>k.startsWith('__')&&placed[k]===id)?'used':'')+'" data-pick="'+esc(id)+'" draggable="true">'+esc(label)+'</button>').join('')+'</div>'}
function cell(k){return '<div class="dropcell '+(placed[k]?'filled':'')+'" role="button" tabindex="0" data-drop="'+esc(k)+'">'+(placed[k]?esc(placed[k]):'Colocar dato')+'</div>'}
function render(){if(won){document.getElementById('levelTitle').textContent='MISIÓN COMPLETADA';document.getElementById('levelSubtitle').textContent='Tres niveles superados';document.getElementById('score').textContent='⭐ 3 / 3';document.getElementById('bar').style.width='100%';for(let i=0;i<3;i++)document.getElementById('dot'+i).className='leveldot done';game.innerHTML='<div class="final"><div class="trophy">🏆</div><h2>¡Misión completada!</h2><p>Construiste una tabla con varios registros, conectaste cada llegada con su estudiante y aplicaste reglas de seguimiento.</p><button class="btn secondary" onclick="restart()">Volver a jugar</button></div>';return;}
common();const L=levels[level];let h='<div class="story"><b>🎮 MISIÓN '+(level+1)+'</b><p>'+esc(L.story)+'</p></div>';
if(level===0){let pool=[];students.forEach((r,i)=>{pool.push(['n'+i,r[1]],['c'+i,r[2]])});pool=[pool[3],['extra1','mateo@colegio.edu.co'],pool[0],pool[5],['extra2','9C'],pool[2],['extra3','Teléfono 3001234567'],pool[1],pool[4]];h+='<section class="field"><h2>Tabla: ESTUDIANTES</h2><div class="tablegame"><table><thead><tr><th>ID del estudiante</th><th>Nombre</th><th>Curso</th></tr></thead><tbody>';students.forEach((r,i)=>{h+='<tr><td><strong>'+r[0]+'</strong></td><td>'+cell('n'+i)+'</td><td>'+cell('c'+i)+'</td></tr>'});h+='</tbody></table></div><h3 class="sectiontitle">Datos para completar la tabla</h3>'+choices(pool)+'<p class="hint">Arrastra un dato o selecciónalo y toca una casilla. Si no corresponde, se marcará en rojo y regresará al inventario.</p></section>'}
if(level===1){h+='<div class="twofields"><section class="field"><h2>Tabla: ESTUDIANTES</h2><div class="tablegame"><table class="students-db"><thead><tr><th>ID del estudiante</th><th>Nombre</th><th>Curso</th></tr></thead><tbody>';students.forEach(r=>h+='<tr><td><strong>'+r[0]+'</strong></td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>');h+='</tbody></table></div></section><section class="field"><h2>Tabla: LLEGADAS</h2><div class="tablegame"><table class="arrivals-db"><thead><tr><th>ID_Registro</th><th>ID_Estudiante</th><th>Estudiante</th><th>Fecha</th><th>Hora_Llegada</th><th>Minutos_Retraso</th><th>Estado</th></tr></thead><tbody>';arriving.forEach((r,i)=>h+='<tr><td><strong>'+r[0]+'</strong></td><td>'+cell('l'+i)+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td><td class="computed">'+delayMinutes(r[3])+'</td><td><span class="statebadge '+stateClass(r[3])+'">'+arrivalState(r[3])+'</span></td></tr>');h+='</tbody></table></div></section></div><section class="field codes-field"><h3 class="sectiontitle">Códigos disponibles</h3>'+choices(students.map(r=>[r[0],r[0]]),true)+'</section>'}
if(level===2){h+='<div class="workspace"><section class="inventory"><p class="label">INVENTARIO DE FUNCIONES</p>';L.tiles.forEach(([id,label])=>h+='<button class="tile '+(selected===id?'active ':'')+(Object.values(placed).includes(id)?'used':'')+'" data-pick="'+id+'" draggable="true">'+esc(label)+'</button>');h+='</section><section class="field"><h2>Funciones del sistema</h2><div class="slots">';L.slots.forEach(([label,id],i)=>h+='<div class="slot '+(placed['f'+i]?'filled':'')+'" tabindex="0" role="button" data-drop="f'+i+'"><span>'+esc(label)+'</span><strong>'+(placed['f'+i]?esc(L.tiles.find(x=>x[0]===placed['f'+i])?.[1]):'Colocar función')+'</strong></div>');h+='</div></section></div>'}
h+='<div class="bottom"><div class="msg" id="msg">Coloca las piezas: las respuestas incorrectas se marcan en rojo y regresan al inventario.</div><div class="actions"><button class="btn secondary" id="clear">Limpiar</button><button class="btn" id="check">COMPROBAR ✓</button></div></div>';game.innerHTML=h;
document.querySelectorAll('[data-pick]').forEach(b=>{b.onclick=()=>{selected=b.dataset.pick;document.querySelectorAll('[data-pick]').forEach(x=>x.classList.toggle('active',x.dataset.pick===selected))};b.ondragstart=e=>{selected=b.dataset.pick;e.dataTransfer.setData('text/plain',selected)}});
document.querySelectorAll('[data-drop]').forEach(el=>{el.onclick=()=>{if(selected)put(el.dataset.drop,selected);else removePiece(el.dataset.drop)};el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}};el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();put(el.dataset.drop,e.dataTransfer.getData('text/plain'))}});
document.getElementById('clear').onclick=()=>{if(solved)return;placed={};selected=null;render()};document.getElementById('check').onclick=()=>{if(solved){advance();return;}check()};}
function removePiece(slot){if(solved||!placed[slot])return;delete placed[slot];delete placed['__'+slot];selected=null;render();document.getElementById('msg').textContent='Pieza devuelta al inventario. Selecciona otra para colocarla.';}
function expectedPiece(slot,id){
  if(level===0){
    const index=Number(slot.slice(1));
    if(!/^[nc]\d+$/.test(slot)||!students[index])return false;
    return slot[0]==='n'?id==='n'+index:id==='c'+index;
  }
  if(level===1){
    const index=Number(slot.slice(1));
    return /^l\d+$/.test(slot)&&arriving[index]&&id===arriving[index][4];
  }
  if(level===2){
    const index=Number(slot.slice(1));
    return /^f\d+$/.test(slot)&&levels[2].slots[index]&&id===levels[2].slots[index][1];
  }
  return false;
}
function displayPiece(id){
  if(level===0)return id.startsWith('extra')?({extra1:'mateo@colegio.edu.co',extra2:'9C',extra3:'Teléfono 3001234567'}[id]):id[0]==='n'?students[Number(id.slice(1))][1]:students[Number(id.slice(1))][2];
  if(level===2)return levels[2].tiles.find(x=>x[0]===id)?.[1]||id;
  return id;
}
let rejectionLocked=false;
function put(slot,id){
  if(!id||solved||rejectionLocked)return;
  const valid=level===0?[...students.map((_,i)=>'n'+i),...students.map((_,i)=>'c'+i),'extra1','extra2','extra3'].includes(id):level===1?students.some(r=>r[0]===id):levels[2].tiles.some(t=>t[0]===id);
  if(!valid)return;
  if(!expectedPiece(slot,id)){
    // Mostrar la pieza equivocada en rojo, después devolverla automáticamente al inventario.
    rejectionLocked=true;
    const target=document.querySelector('[data-drop="'+slot+'"]');
    const previous=target.innerHTML;
    target.classList.add('wrong');
    if(level===2){const strong=target.querySelector('strong');if(strong)strong.textContent=displayPiece(id)}
    else target.textContent=displayPiece(id);
    const msg=document.getElementById('msg');
    msg.textContent='❌ Esa pieza no corresponde a esta casilla. Regresa al inventario para que pruebes otra.';
    msg.style.background='#ffe8d7';
    selected=null;
    document.querySelectorAll('[data-pick]').forEach(x=>x.classList.remove('active'));
    setTimeout(()=>{
      target.innerHTML=previous;
      target.classList.remove('wrong');
      rejectionLocked=false;
      msg.textContent='Elige otra pieza para continuar.';
      msg.style.background='#f8f7e9';
    },700);
    return;
  }
  if(level!==1){
    for(const k of Object.keys(placed)){
      if(placed[k]===id||(level===0&&k.startsWith('__')&&placed[k]===id)){
        const base=k.startsWith('__')?k.slice(2):k;
        delete placed[base];delete placed['__'+base];
      }
    }
  }
  placed[slot]=level===0?displayPiece(id):id;
  if(level===0)placed['__'+slot]=id;
  selected=null;
  render();
  const msg=document.getElementById('msg');
  if(msg)msg.textContent='✅ Pieza correcta. Continúa con las demás casillas.';
}
function advance(){level++;solved=false;selected=null;placed={};if(level>=3)won=true;render()}
function check(){
let ok=false, bad=[];
if(level===0){
  students.forEach((r,i)=>{
    if(placed['n'+i]!==r[1])bad.push({key:'n'+i,id:r[0],field:'Nombre'});
    if(placed['c'+i]!==r[2])bad.push({key:'c'+i,id:r[0],field:'Curso'});
  });
  ok=bad.length===0;
}
if(level===1){arriving.forEach((r,i)=>{if(placed['l'+i]!==r[4])bad.push({key:'l'+i,id:r[0],field:'Identificador'})});ok=bad.length===0;}
if(level===2){levels[2].slots.forEach((x,i)=>{if(placed['f'+i]!==x[1])bad.push({key:'f'+i,id:'',field:'Función'})});ok=bad.length===0;}
const msg=document.getElementById('msg');
document.querySelectorAll('[data-drop]').forEach(el=>el.classList.remove('wrong'));
if(!ok){
  bad.forEach(b=>{let el=document.querySelector('[data-drop="'+b.key+'"]');if(el)el.classList.add('wrong')});
  const first=bad[0];
  if(level===0){msg.textContent='🔎 Revisa '+first.field+' en la fila '+first.id+'. Cada nombre y curso deben corresponder al ID correcto. Hay '+bad.length+' casilla(s) por corregir.';}
  else if(level===1){msg.textContent='🔎 En la llegada '+first.id+' falta identificar al estudiante. Busca su ID_Estudiante en la tabla ESTUDIANTES. Faltan '+bad.length+' casilla(s).';}
  else {msg.textContent='🔎 Revisa la función seleccionada en las casillas señaladas.';}
  msg.style.background='#ffe8d7';return;
}
if(level===2){solved=true;won=true;render();return;}
solved=true;msg.textContent=level===0?'✅ ¡Correcto! Los datos adicionales no pertenecen a Nombre ni Curso. ¡Nivel superado!':'✅ ¡Muy bien! ID_Registro identifica la llegada e ID_Estudiante relaciona esa llegada con la persona. ¡Nivel superado!';msg.style.background='#def4ce';let b=document.getElementById('check');b.textContent='SIGUIENTE NIVEL ▶';b.onclick=advance;
}
function restart(){level=0;won=false;solved=false;selected=null;placed={};render()}render();</script></body></html>
