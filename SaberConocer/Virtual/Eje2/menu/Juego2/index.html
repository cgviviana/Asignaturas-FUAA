  .screen{position:absolute;inset:0;display:none;padding:6% 5% 5% 6%}
  .screen.on{display:flex}
  .content{flex:1;display:flex;flex-direction:column;min-width:0;padding-right:2%}
  .char{flex:0 0 30%;display:flex;align-items:flex-end;justify-content:center}
  .char img{max-width:100%;max-height:92%;object-fit:contain;mix-blend-mode:normal;animation:floatTeacher 3.2s ease-in-out infinite;filter:drop-shadow(0 8px 5px rgba(0,0,0,.09))}
  @keyframes floatTeacher{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .bubble{position:relative;background:#7fb241;color:#fff;border-radius:14px;padding:14px 18px;font-size:clamp(15px,2.3vw,21px);font-weight:600;line-height:1.3;margin-bottom:18px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
  .bubble:after{content:"";position:absolute;right:-16px;top:22px;border:10px solid transparent;border-left:16px solid #7fb241}
  .kind{font-size:13px;color:#5d8f22;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid #d4d4d4;border-radius:8px;padding:10px 14px;font-size:clamp(14px,2vw,18px);cursor:pointer;text-align:left;font-family:inherit;color:#222}
  .opt:hover{border-color:#7fb241}
  .opt .mk{width:22px;height:22px;border:2px solid #999;flex:none;display:grid;place-items:center}
  .opt.radio .mk{border-radius:50%}
  .opt.radio .mk{border-radius:50%}
  .opt.sel{border-color:#5d8f22;background:#f2f9e9}
  .opt.sel .mk{border-color:#5d8f22}
  .opt.sel .mk:after{content:"";width:12px;height:12px;background:#5d8f22;border-radius:inherit}
  .opt.check.sel .mk:after{border-radius:2px}
  .hint{font-size:13px;color:#666;margin:-6px 0 10px}
  .actions{margin-top:auto;display:flex;justify-content:flex-end;gap:10px;padding-top:12px}
  .btn{border:none;background:#5d8f22;color:#fff;font-weight:700;font-size:15px;padding:10px 22px;border-radius:6px;cursor:pointer;font-family:inherit}
  .btn:disabled{background:#a9c48a;cursor:default}
  .btn.gray{background:#777}
  /* matching */
  .match{display:grid;grid-template-columns:1fr 1.25fr;gap:8px 14px;align-items:center}
  .tgt{background:#f3f3f3;border:1px solid #ccc;border-radius:6px;padding:8px 10px;font-weight:600;font-size:clamp(13px,1.8vw,16px)}
  .slot{min-height:40px;border:2px dashed #b5b5b5;border-radius:6px;display:flex;align-items:center;padding:3px;background:#fff}
  .slot.over,.slot.ready{border-color:#5d8f22;background:#f2f9e9}
  .bank{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;min-height:40px;padding:6px;border-radius:6px;background:rgba(0,0,0,.04)}
  .chip{background:#fff;border:2px solid #7fb241;border-radius:6px;padding:6px 10px;font-size:clamp(12px,1.7vw,15px);cursor:grab;user-select:none;touch-action:none;width:fit-content}
  .slot .chip{width:100%}
  .chip.picked{background:#7fb241;color:#fff}
  .chip.drag{position:fixed;z-index:50;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.3)}
  /* hotspot */
  .urlwrap{position:relative;width:100%;max-width:560px;border:1px solid #ccc}
  .urlwrap img{width:100%;display:block}
  .hs{position:absolute;width:9%;height:15%;transform:translate(-50%,-50%);border-radius:50%;border:3px solid transparent;background:none;cursor:pointer}
  .hs:hover{border-color:rgba(93,143,34,.6)}
  .hs.sel{border-color:#5d8f22;background:rgba(127,178,65,.25)}
  /* feedback */
  .fb{position:absolute;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:20}
  .fb.on{display:flex}
  .fbox{background:#fff;border-radius:10px;width:min(80%,440px);text-align:center;padding:26px 22px 20px;box-shadow:0 6px 24px rgba(0,0,0,.3)}
  .fic{width:64px;height:64px;border-radius:50%;margin:-58px auto 12px;display:grid;place-items:center;border:4px solid #fff}
  .fic.ok{background:#2fae4e}.fic.no{background:#d33}
  .fbox h3{margin:0 0 6px;font-size:22px}
  .fbox p{margin:0 0 18px;color:#444}
  /* intro / results */
  .big{font-size:clamp(28px,5vw,48px);font-weight:800;color:#5d8f22;margin:6% 0 8px;line-height:1.1}
  .sub{font-size:clamp(17px,2.6vw,24px);color:#333;margin-bottom:24px}
  .row{display:flex;justify-content:space-between;max-width:380px;font-size:18px;padding:10px 0;border-bottom:1px solid #ddd}
  .row b{color:#5d8f22}
  .msg{font-size:20px;font-weight:700;margin:20px 0}
  .review .opt{cursor:default}
  .ok-b{border-color:#2fae4e!important;background:#eaf8ee!important}
  .no-b{border-color:#d33!important;background:#fdeeee!important}
  .counter{font-size:13px}
  @media (max-width:620px){
    .stage{aspect-ratio:auto;min-height:560px;background:#fff;border:8px solid #92d050}
    .screen{position:relative;inset:auto;padding:28px 16px 18px}
    .screen:not(.on){display:none}
    .char{display:flex;flex:0 0 26%;min-width:80px;align-items:flex-end} .char img{max-height:200px}
    .bubble:after{display:none}
    .match{grid-template-columns:1fr}
    .slot{margin-bottom:6px}
  }
  .credit{font-size:12px;text-align:center;color:#555;padding:8px 0 2px}
</style>
</head>
<body>
<div class="player">
  <div class="top"><span>SABER CONOCER · EJE 2 · ENCUENTRO 2</span><span class="counter" id="counter"></span></div>
  <div class="stage" id="stage">
    <!-- Inicio -->
    <section class="screen on" id="s-start">
      <div class="content">
        <div class="big">¡Juguemos un poco!</div>
        <div class="sub">Datos, diagramas de flujo y tablas</div>
        <div style="font-size:16px;color:#444;line-height:1.5">6 preguntas para repasar lo aprendido</div>

 {type:"single",img:"p5",q:"Lucía entra a la aplicación con su correo institucional y escanea el QR de la primera clase. La app encuentra su código EST-014. ¿Para qué guarda ese código en la tabla LLEGADAS?",opts:["Para generar un correo distinto cada día.","Para identificar al docente que generó el QR.","Para reemplazar la fecha de la llegada.","Para relacionar esa llegada con Lucía en la tabla ESTUDIANTES."],ok:[3]},
 {type:"single",img:"p6",q:"Lucía se registra el lunes y vuelve a registrarse el miércoles, siempre en la primera clase del día. ¿Cómo reconoce la aplicación que son dos llegadas diferentes?",opts:["Mantiene el mismo ID de Lucía y registra una fecha distinta en cada llegada.","Crea un ID de estudiante nuevo cada día.","Guarda ambas llegadas con la misma fecha y hora.","Deja el campo Fecha vacío y solo almacena el nombre."],ok:[0]},
 {type:"single",img:"think",q:"Una estudiante llega a las 07:09. El colegio inicia clases a las 07:00 y permite cinco minutos de tolerancia. La docente adjunta una excusa médica. ¿Qué debe registrar la aplicación?",opts:["Marcarla puntual porque presentó la excusa.","Calcular cuatro minutos de retraso y cerrar el caso.","Calcular nueve minutos de retraso y enviar la justificación a coordinación para revisión.","Eliminar la llegada mientras coordinación estudia la excusa."],ok:[2]}
];
const KIND={tf:"Verdadero / Falso",single:"Refuerza lo aprendido",multi:"Selecciona las respuestas",match:"Relaciona",hotspot:"Observa y responde"};
const $=id=>document.getElementById(id);
let idx=0, answers=[], cur=null, reviewing=false, attempts=Array(Q.length).fill(0), locked=false;

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function start(){idx=0;answers=[];reviewing=false;attempts=Array(Q.length).fill(0);render();}
function render(){
  const q=Q[idx]; show('s-q');
  $('counter').textContent='Pregunta '+(idx+1)+' de '+Q.length;
  $('qtext').textContent=q.q; $('qimg').src=IMG.point;
  const body=$('qbody'); body.innerHTML=''; body.classList.toggle('review',reviewing); $('try-again').style.display='none';
  const sub=$('submit'); sub.textContent=reviewing?(idx<Q.length-1?'Siguiente':'Volver a resultados'):'Enviar';
  sub.disabled=!reviewing;
  cur={sel:new Set(),map:{}};
  const prev=answers[idx];
  if(q.type==='tf'||q.type==='single'||q.type==='multi'){
    if(q.type==='multi'){const h=document.createElement('div');h.className='hint';h.textContent='Puedes elegir más de una opción.';body.appendChild(h);}
    const box=document.createElement('div');box.className='opts';body.appendChild(box);
    q.opts.forEach((t,i)=>{
      const b=document.createElement('button');b.className='opt '+(q.type==='multi'?'check':'radio');
      b.innerHTML='<span class="mk"></span><span></span>';b.lastChild.textContent=t;
      if(reviewing){ if(prev.sel.has(i))b.classList.add('sel'); if(q.ok.includes(i))b.classList.add('ok-b'); else if(prev.sel.has(i))b.classList.add('no-b'); }
      else b.onclick=()=>{
        if(q.type==='multi'){cur.sel.has(i)?cur.sel.delete(i):cur.sel.add(i);}else{cur.sel=new Set([i]);}
        box.querySelectorAll('.opt').forEach((o,k)=>o.classList.toggle('sel',cur.sel.has(k)));
        sub.disabled=cur.sel.size===0;
      };
      box.appendChild(b);
    });
  } else if(q.type==='hotspot'){
    const w=document.createElement('div');w.className='urlwrap';w.innerHTML='<img alt="Estructura de una URL: https://www.mineducacion.gov.co/">';w.firstChild.src=IMG.url;
    q.spots.forEach(([x,y],i)=>{
      const b=document.createElement('button');b.className='hs';b.style.left=x+'%';b.style.top=y+'%';b.setAttribute('aria-label','Fragmento '+(i+1));
      if(reviewing){ if(q.ok.includes(i))b.classList.add('sel'); if(prev.sel.has(i)&&!q.ok.includes(i))b.style.borderColor='#d33'; }
      else b.onclick=()=>{cur.sel=new Set([i]);w.querySelectorAll('.hs').forEach((o,k)=>o.classList.toggle('sel',k===i));sub.disabled=false;};
      w.appendChild(b);
    });
    body.appendChild(w);
  } else if(q.type==='match'){ buildMatch(q,body,prev); }
}

function buildMatch(q,body,prev){
  const grid=document.createElement('div');grid.className='match';
  const bank=document.createElement('div');bank.className='bank';
  const slots=[];
  q.pairs.forEach(([t],i)=>{
    const l=document.createElement('div');l.className='tgt';l.textContent=t;
    const s=document.createElement('div');s.className='slot';s.dataset.i=i;slots.push(s);
    grid.append(l,s);
  });
  body.append(grid);
  if(reviewing){
    slots.forEach((s,i)=>{const got=prev.map[i];const c=document.createElement('div');c.className='chip';c.textContent=got!=null?q.pairs[got][1]:'—';s.appendChild(c);
      s.style.borderStyle='solid';s.style.borderColor=got===i?'#2fae4e':'#d33';
      if(got!==i){const r=document.createElement('div');r.style.cssText='font-size:12px;color:#2a7a3d;padding:2px 6px';r.textContent='✓ '+q.pairs[i][1];s.style.flexDirection='column';s.style.alignItems='stretch';s.appendChild(r);}});
    return;
  }
  body.append(bank);
  shuffle(q.pairs.map((p,i)=>i)).forEach(i=>{const c=document.createElement('div');c.className='chip';c.textContent=q.pairs[i][1];c.dataset.v=i;bank.appendChild(c);});
  let picked=null;
  const update=()=>{cur.map={};slots.forEach((s,i)=>{const c=s.querySelector('.chip');if(c)cur.map[i]=+c.dataset.v;});$('submit').disabled=Object.keys(cur.map).length<q.pairs.length;};
  const place=(chip,target)=>{
    if(target&&target.classList.contains('slot')){const ex=target.querySelector('.chip');if(ex&&ex!==chip){const from=chip.parentElement;(from.classList.contains('slot')?from:bank).appendChild(ex);}target.appendChild(chip);}
    else if(target===bank) bank.appendChild(chip);
    chip.classList.remove('picked');picked=null;slots.forEach(s=>s.classList.remove('ready'));update();
  };
  // tocar para elegir, tocar el espacio para colocar
  body.addEventListener('click',e=>{
    if(drag.moved) return;
    const chip=e.target.closest('.chip'), slot=e.target.closest('.slot');
    if(chip&&(!picked||picked===chip||!slot)){ if(picked===chip){chip.classList.remove('picked');picked=null;slots.forEach(s=>s.classList.remove('ready'));return;}
      if(picked)picked.classList.remove('picked'); picked=chip;chip.classList.add('picked');slots.forEach(s=>s.classList.add('ready'));return;}
    if(picked&&slot){place(picked,slot);return;}
    if(picked&&e.target.closest('.bank')){place(picked,bank);}
  });
  // arrastrar
  const drag={chip:null,ghost:null,moved:false};
  body.addEventListener('pointerdown',e=>{const c=e.target.closest('.chip');if(!c)return;drag.chip=c;drag.moved=false;drag.x=e.clientX;drag.y=e.clientY;});
  window.onpointermove=e=>{
    if(!drag.chip)return;
    if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;
    if(!drag.moved){drag.moved=true;drag.ghost=drag.chip.cloneNode(true);drag.ghost.classList.add('drag');drag.ghost.style.width=drag.chip.offsetWidth+'px';document.body.appendChild(drag.ghost);drag.chip.style.opacity=.35;}
    drag.ghost.style.left=(e.clientX-20)+'px';drag.ghost.style.top=(e.clientY-18)+'px';
    const el=document.elementFromPoint(e.clientX,e.clientY);slots.forEach(s=>s.classList.toggle('over',s===(el&&el.closest('.slot'))));
  };
  window.onpointerup=e=>{
    if(!drag.chip)return;
    if(drag.moved){const el=document.elementFromPoint(e.clientX,e.clientY);const t=el&&(el.closest('.slot')||el.closest('.bank'));drag.ghost.remove();drag.chip.style.opacity='';if(t)place(drag.chip,t);slots.forEach(s=>s.classList.remove('over'));setTimeout(()=>drag.moved=false,0);}
    drag.chip=null;
  };
}

function isCorrect(q,a){
  if(q.type==='match') return q.pairs.every((p,i)=>a.map[i]===i);
  return a.sel.size===q.ok.length && q.ok.every(i=>a.sel.has(i));
}
$('submit').onclick=()=>{
  if(reviewing){ if(idx<Q.length-1){idx++;render();} else results(); return; }
  const q=Q[idx]; const a={sel:new Set(cur.sel),map:{...cur.map}};
  const ok=isCorrect(q,a); if(ok){a.ok=true;a.earned=Math.max(40,100-attempts[idx]*10);answers[idx]=a;}
  $('fic').className='fic '+(ok?'ok':'no');
  $('fic').innerHTML=ok?'<svg width="34" height="34" viewBox="0 0 20 20"><path d="M3 10.5l4.5 4.5L17 4.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>':'<svg width="28" height="28" viewBox="0 0 20 20"><path d="M4 4l12 12M16 4L4 16" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></svg>';
  $('fh').textContent=ok?'¡Correcto!':'¡Puedes intentarlo de nuevo!';
  $('fp').textContent=ok?'¡Bien hecho! Cada intento ayuda a aprender.':'Revisa la idea principal y vuelve a intentarlo. El siguiente intento descuenta 10 puntos de esta pregunta.'; $('qimg').src=ok?IMG.good:IMG.think; $('cont').textContent=ok?'Continuar':'Reintentar';
  $('fb').classList.add('on');
};
$('cont').onclick=()=>{$('fb').classList.remove('on'); if(!answers[idx]?.ok){attempts[idx]++;render();$('qimg').src=IMG.present;return;} if(idx<Q.length-1){idx++;render();} else results();};
function results(){
  reviewing=false; show('s-res'); $('counter').textContent='';
  const aciertos=answers.filter(a=>a&&a.ok).length;
  const pts=Math.round(answers.reduce((sum,a)=>sum+(a?.earned||0),0)/Q.length);
  $('rscore').textContent=pts+'% ('+aciertos+' de '+Q.length+' resueltas)';
  const pass=aciertos>=4;
  $('rmsg').textContent='¡Misión cumplida! Aprendiste resolviendo cada pregunta.';
  $('rmsg').style.color='#2a8a3d';
  $('rimg').src=IMG.cheer;
}
$('review').onclick=()=>{reviewing=true;idx=0;render();};
$('retry').onclick=start; $('try-again').onclick=()=>{attempts[idx]++;render();};
$('go').onclick=start;
</script>
</body>
</html>
