<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Misión Flujo · Mundo de bloques</title><style>
:root{--ink:#f9f5d5;--dark:#182b29;--grass:#6eb34a;--gold:#ffde73}*{box-sizing:border-box}body{margin:0;background:#152b35;color:var(--ink);font-family:system-ui,Segoe UI,Arial,sans-serif}button{font:inherit;cursor:pointer}.game{min-height:100vh;max-width:1320px;margin:auto;position:relative;background:linear-gradient(#6ab7db 0 46%,#bde6e3 46% 51%,#74ad59 51% 54%,#765339 54%);overflow:hidden}.cloud{position:absolute;background:#eefbff;box-shadow:20px 0 #eefbff,40px 0 #eefbff,20px -16px #eefbff;width:42px;height:20px;opacity:.85}.c1{left:6%;top:18%}.c2{right:16%;top:13%;transform:scale(1.35)}.c3{left:54%;top:32%;transform:scale(.8)}.pixel{font-weight:900;text-transform:uppercase;letter-spacing:.075em;text-shadow:3px 3px 0 #183329}.hud{position:relative;z-index:2;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#152c35c9;border-bottom:5px solid #335456}.logo{font-size:clamp(19px,3vw,30px)}.stats{display:flex;gap:9px;align-items:center;font-weight:800}.chip{background:#23433f;border:3px solid #477c68;box-shadow:3px 3px #102623;padding:7px 13px;white-space:nowrap}.intro{position:relative;z-index:2;margin:14px auto 0;width:min(950px,calc(100% - 24px));background:#1c393ad9;border:3px solid #7dbb72;box-shadow:5px 5px #142c30;padding:12px 17px}.intro strong{color:#ffe182}.intro p{margin:4px 0 0;line-height:1.45;font-size:14px}.world{position:relative;z-index:2;max-width:1050px;margin:15px auto 0;padding:0 12px}.quest{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px}.quest h2{font-size:clamp(18px,2.7vw,27px);margin:0;text-shadow:2px 2px #21443e}.quest small{font-size:12px;font-weight:700;color:#f8f6db}.board{background:linear-gradient(180deg,#203c46eb,#1f403bdc);border:5px solid #3d6a61;box-shadow:6px 7px 0 #142e2c;padding:12px;min-height:255px}.slots{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;min-height:216px}.slot-wrap{display:flex;align-items:center;gap:8px}.arrow{font-size:23px;font-weight:900;color:#f5df76}.slot{width:clamp(100px,15vw,160px);height:135px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:#223f39;border:3px dashed #95c6bb;outline:3px solid #122b2a;outline-offset:-9px;transition:.12s;position:relative}.slot.over{background:#3c6b56;border-color:#fff6a1;transform:scale(1.035)}.slot.filled{border-style:solid;border-color:#ffe18d;background:#365945}.slot b{font-size:12px;text-align:center;line-height:1.2;padding:0 5px}.slot .num{position:absolute;top:3px;left:6px;font-size:11px;color:#c1e1d6}.shape{display:flex;justify-content:center;align-items:center;color:#172c2a;font-size:12px;font-weight:900;line-height:1.1;text-align:center;user-select:none;filter:drop-shadow(3px 3px 0 #112522)}.shape.oval{width:87px;height:44px;background:#ffe19b;border:3px solid #ad6939;border-radius:50%}.shape.rect{width:88px;height:52px;background:#99d8a8;border:3px solid #31774b}.shape.para{width:93px;height:51px;background:#b3dff6;border:3px solid #4a81b0;clip-path:polygon(17% 0,100% 0,83% 100%,0 100%);padding:0 11px}.shape.diamond{width:69px;height:69px;background:#fbc08a;border:3px solid #ad6d3e;transform:rotate(45deg);margin:6px}.shape.diamond span{transform:rotate(-45deg);font-size:11px}.shop{background:#203a37ee;border:4px solid #678f47;box-shadow:5px 6px #162c2e;margin:13px auto 0;max-width:1050px;padding:10px 13px 14px;position:relative;z-index:2}.shopheader{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.shopheader b{font-size:15px}.shopheader span{font-size:12px;color:#d4e5ce}.pieces{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.piece{width:128px;min-height:99px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;border:3px solid #789989;background:#37624d;box-shadow:4px 4px 0 #122c28;cursor:grab;color:white;padding:8px 4px}.piece:focus-visible,.slot:focus-visible{outline:3px solid yellow}.piece[aria-pressed=true]{border-color:#ffe77c;background:#6a7040}.piece em{font-style:normal;font-size:11px;font-weight:800}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:15px 10px 25px;position:relative;z-index:3}.btn{border:3px solid #172f29;background:#f3d56b;color:#283024;padding:10px 20px;font-weight:900;box-shadow:4px 4px 0 #192d2e;text-transform:uppercase}.btn.secondary{background:#aed4c7}.btn:active{transform:translate(3px,3px);box-shadow:1px 1px}.toast{position:relative;z-index:3;text-align:center;font-weight:800;color:#fff8ca;min-height:27px;margin-top:5px}.terrain{height:90px;position:relative;background:repeating-linear-gradient(90deg,#845534 0 36px,#78502f 36px 40px);border-top:13px solid #4a8a3e}.terrain:before{content:'';position:absolute;top:-23px;width:100%;height:11px;background:repeating-linear-gradient(90deg,#77bc4b 0 28px,#5ca542 28px 40px)}.overlay{position:fixed;inset:0;background:#0c2020de;display:none;align-items:center;justify-content:center;z-index:10;padding:15px}.overlay.show{display:flex}.modal{background:#24443b;border:5px solid #8dbf64;box-shadow:8px 8px #0c1e1c;padding:28px;max-width:440px;text-align:center}.modal h2{font-size:28px;color:#ffe082;margin:3px 0 12px}.modal p{line-height:1.45}.character{font-size:52px;filter:drop-shadow(3px 4px #193327)}.muted{opacity:.8;font-size:12px}.levelbar{display:flex;gap:6px}.levelbar i{height:10px;width:38px;background:#445c50;border:2px solid #a6b79b}.levelbar i.on{background:#f5d66f}@media(max-width:650px){.slot{height:115px;width:109px}.board{padding:8px}.arrow{font-size:18px}.piece{width:100px;min-height:92px}.intro{font-size:13px}.chip{padding:5px}.slot-wrap{gap:4px}}
</style></head><body><div class="game"><span class="cloud c1"></span><span class="cloud c2"></span><span class="cloud c3"></span><header class="hud"><div class="logo pixel">⛏️ MISIÓN FLUJO</div><div class="stats"><span class="chip" id="levelLabel">NIVEL 1/3</span><span class="chip" id="stars">⭐ 0</span></div></header><section class="intro"><strong>📜 ALGORITMO DE LA MISIÓN</strong><p id="algo"></p></section><main class="world"><div class="quest"><div><h2 class="pixel" id="title"></h2><small>Construye el camino con las piezas correctas</small></div><div class="levelbar" id="levelbar"></div></div><div class="board"><div id="slots" class="slots" aria-label="Zona de construcción"></div></div></main><section class="shop"><div class="shopheader"><b>🎒 INVENTARIO DE BLOQUES</b><span>Arrastra una pieza al hueco · o selecciónala y toca el hueco</span></div><div class="pieces" id="pieces"></div></section><div class="toast" id="toast" aria-live="polite"></div><div class="controls"><button class="btn secondary" id="reset">↻ REINICIAR</button><button class="btn" id="check">✓ COMPROBAR</button></div><div class="terrain"></div></div><div class="overlay" id="overlay"><div class="modal"><div class="character" id="avatar">🏆</div><h2 id="winTitle">¡Bien hecho!</h2><p id="winText"></p><button class="btn" id="next">SIGUIENTE NIVEL →</button></div></div><script>
const types={oval:{name:'INICIO / FIN',short:'Inicio/Fin'},para:{name:'ENTRADA / SALIDA',short:'Dato'},rect:{name:'PROCESO',short:'Acción'},diamond:{name:'DECISIÓN',short:'¿Sí/No?'}};
const levels=[{title:'☕ LA TAZA DE CAFÉ',algo:'Quieres preparar una taza de café. Primero revisas si queda café en casa. Cuando hay café, preparas la bebida y la sirves. Si se ha acabado, informas que no puedes prepararlo. En cualquiera de los dos casos, la tarea termina.',steps:[['oval','Inicio'],['diamond','¿Hay café?'],['rect','Preparar / avisar'],['para','Mostrar resultado'],['oval','Fin']]},{title:'☂️ MISIÓN PARAGUAS',algo:'Antes de salir de casa, consultas el pronóstico del tiempo. Si va a llover, guardas un paraguas en la mochila; si no, sales sin él. Luego comunicas qué decidiste llevar y terminas de prepararte.',steps:[['oval','Inicio'],['para','Leer pronóstico'],['diamond','¿Lloverá?'],['rect','Preparar mochila'],['para','Mostrar recomendación'],['oval','Fin']]},{title:'🏫 PORTAL DE LLEGADA',algo:'En el colegio se registra la hora a la que llega un estudiante y se consulta la hora establecida para su clase. Se calcula cuántos minutos han transcurrido. Si el retraso supera los cinco minutos de tolerancia, se registra una incidencia; en caso contrario, se registra como puntual o dentro de la tolerancia. Finalmente, se informa el resultado y se guarda en su historial.',steps:[['oval','Inicio'],['para','Leer hora'],['rect','Calcular diferencia'],['diamond','¿Más de 5 min?'],['rect','Guardar estado'],['para','Mostrar resultado'],['oval','Fin']]}];
let level=0,chosen=null,placed=[],score=0;const $=id=>document.getElementById(id);function shape(type){return `<span class="shape ${type}">${type==='diamond'?'<span>¿Sí / No?</span>':type==='oval'?'Inicio / Fin':type==='para'?'Dato':'Proceso'}</span>`}function pick(type){chosen=type;document.querySelectorAll('.piece').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.type===type)));$('toast').textContent='Pieza '+types[type].short+' seleccionada. Elige una casilla.'}function put(i,type){if(!type)return;placed[i]=type;drawSlots();$('toast').textContent='Pieza colocada. Puedes cambiarla cuando quieras.'}function drawSlots(){const host=$('slots');host.innerHTML='';levels[level].steps.forEach((s,i)=>{const wrap=document.createElement('div');wrap.className='slot-wrap';const slot=document.createElement('div');slot.className='slot'+(placed[i]?' filled':'');slot.tabIndex=0;slot.setAttribute('role','button');slot.setAttribute('aria-label','Casilla '+(i+1)+': '+s[1]);slot.innerHTML=`<span class="num">${String(i+1).padStart(2,'0')}</span>${placed[i]?shape(placed[i]):'<span style="font-size:32px;opacity:.55">＋</span>'}<b>${s[1]}</b>`;slot.addEventListener('dragover',e=>{e.preventDefault();slot.classList.add('over')});slot.addEventListener('dragleave',()=>slot.classList.remove('over'));slot.addEventListener('drop',e=>{e.preventDefault();slot.classList.remove('over');put(i,e.dataTransfer.getData('text/plain')||chosen)});slot.addEventListener('click',()=>put(i,chosen));slot.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();put(i,chosen)}});wrap.appendChild(slot);if(i<levels[level].steps.length-1){const a=document.createElement('span');a.className='arrow';a.textContent='➜';wrap.appendChild(a)}host.appendChild(wrap)})}function load(){placed=[];chosen=null;$('levelLabel').textContent=`NIVEL ${level+1}/3`;$('title').textContent=levels[level].title;$('algo').textContent=levels[level].algo;$('levelbar').innerHTML=[0,1,2].map(i=>`<i class="${i<=level?'on':''}"></i>`).join('');$('pieces').innerHTML=Object.keys(types).map(t=>`<button class="piece" draggable="true" data-type="${t}" aria-pressed="false">${shape(t)}<em>${types[t].name}</em></button>`).join('');document.querySelectorAll('.piece').forEach(el=>{el.addEventListener('click',()=>pick(el.dataset.type));el.addEventListener('dragstart',e=>{chosen=el.dataset.type;e.dataTransfer.setData('text/plain',el.dataset.type)})});drawSlots();$('toast').textContent='Completa el camino desde INICIO hasta FIN.'}function check(){const target=levels[level].steps.map(x=>x[0]);let correct=0;target.forEach((t,i)=>{if(placed[i]===t)correct++});if(correct===target.length){score++;$('stars').textContent='⭐ '+score;$('winTitle').textContent=level===2?'¡MUNDO COMPLETADO!':'¡NIVEL SUPERADO!';$('winText').textContent=level===2?'Construiste correctamente los diagramas de los tres niveles.':'¡Los bloques coinciden con el algoritmo! Tu portal al siguiente nivel está abierto.';$('next').style.display=level===2?'none':'inline-flex';$('next').textContent='SIGUIENTE NIVEL →';$('overlay').classList.add('show')}else{$('toast').textContent=`🧩 ${correct} de ${target.length} símbolos correctos. Revisa el algoritmo y vuelve a intentar.`;document.querySelectorAll('.slot').forEach((el,i)=>{el.style.borderColor=placed[i]===target[i]?'#99dc81':'#f8a38e'})}}$('check').addEventListener('click',check);$('reset').addEventListener('click',load);$('next').addEventListener('click',()=>{$('overlay').classList.remove('show');if(level<2){level++;load()}});load();
</script></body></html>
