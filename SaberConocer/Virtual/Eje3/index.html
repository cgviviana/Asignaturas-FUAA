
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saber Conocer | Eje 3</title>

  <style>
    :root{
      --verde:#86a91e;
      --verde-oscuro:#5f7d14;
      --verde-suave:#eef5dc;
      --tinta:#26322b;
      --gris:#667168;
      --borde:#dce3d9;
      --fondo:#f6f8f5;
      --amarillo:#d7a527;
      --amarillo-suave:#fff9e8;
      --blanco:#ffffff;
      --oscuro:#29352d;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:var(--fondo);
      color:var(--tinta);
    }

    .topbar{
      height:30px;
      background:var(--oscuro);
    }

    header{
      background:#fff;
      padding:16px 7%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      border-bottom:1px solid var(--borde);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:14px;
    }

    .brand img{
      width:116px;
      max-height:42px;
      object-fit:contain;
    }

    .brand span{
      color:var(--gris);
      border-left:1px solid var(--borde);
      padding-left:14px;
      font-size:14px;
    }

    .badge{
      background:var(--verde-suave);
      color:var(--verde-oscuro);
      border:1px solid #cbdca6;
      padding:8px 14px;
      border-radius:20px;
      font-size:13px;
      font-weight:bold;
    }

    .app{
      width:min(1180px,90%);
      min-height:650px;
      margin:32px auto;
      display:grid;
      grid-template-columns:305px 1fr;
      background:#fff;
      border:1px solid var(--borde);
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 12px 35px rgba(37,55,39,.08);
    }

    /* MENÚ */
    .sidebar{
      padding:30px 20px;
      background:#fbfcfa;
      border-right:1px solid var(--borde);
    }

    .sidebar h1{
      margin:0 0 8px;
      color:var(--verde-oscuro);
      font-size:20px;
    }

    .sidebar-intro{
      margin:0 0 26px;
      color:var(--gris);
      font-size:13px;
      line-height:1.5;
    }

    .topic-button{
      width:100%;
      display:flex;
      gap:11px;
      align-items:flex-start;
      text-align:left;
      border:0;
      border-radius:11px;
      background:transparent;
      color:#465047;
      padding:15px 11px;
      margin:7px 0;
      cursor:pointer;
      font-size:14px;
      line-height:1.4;
      transition:.2s;
    }

    .topic-button:hover{background:#f0f5e5}

    .topic-button.active{
      background:var(--verde);
      color:#fff;
      font-weight:bold;
    }

    .number{
      min-width:34px;
      height:34px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:#e4ecd4;
      color:var(--verde-oscuro);
      font-size:12px;
      font-weight:bold;
      flex-shrink:0;
    }

    .topic-button.active .number{
      background:#fff;
      color:var(--verde-oscuro);
    }

    .topic-text strong{
      display:block;
      margin-bottom:3px;
      font-size:12px;
      text-transform:uppercase;
    }

    .topic-text span{display:block}

    /* CONTENIDO */
    .workspace{
      padding:42px 46px 48px;
    }

    .eyebrow{
      margin:0 0 10px;
      color:var(--verde-oscuro);
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:1px;
      font-weight:bold;
    }

    h2{
      margin:0;
      font-size:30px;
      line-height:1.18;
    }

    .intro{
      max-width:790px;
      margin:14px 0 28px;
      color:var(--gris);
      font-size:15px;
      line-height:1.65;
    }

    /* ACORDEONES */
    .accordion{
      margin-bottom:12px;
      overflow:hidden;
      border:1px solid var(--borde);
      border-radius:12px;
      background:#fff;
    }

    .accordion-trigger{
      width:100%;
      padding:17px 19px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
      border:0;
      background:#fff;
      color:var(--tinta);
      text-align:left;
      font-size:15px;
      font-weight:bold;
      cursor:pointer;
    }

    .accordion-trigger:hover{background:#fafcf7}

    .accordion.open .accordion-trigger{
      background:var(--verde-suave);
      color:var(--verde-oscuro);
    }

    .accordion-icon{
      width:27px;
      height:27px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:#e5edd5;
      color:var(--verde-oscuro);
      flex-shrink:0;
      font-size:19px;
    }

    .accordion.open .accordion-icon::after{content:"−"}
    .accordion:not(.open) .accordion-icon::after{content:"+"}

    .accordion-content{
      display:grid;
      grid-template-rows:0fr;
      transition:grid-template-rows .25s ease;
    }

    .accordion.open .accordion-content{grid-template-rows:1fr}

    .accordion-inner{overflow:hidden}

    .accordion-body{
      padding:21px;
      color:#475149;
      font-size:14px;
      line-height:1.65;
    }

    .accordion-body p:first-child{margin-top:0}

    /* BLOQUES */
    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
      margin-top:14px;
    }

    .card{
      padding:14px 16px;
      border-left:4px solid var(--verde);
      border-radius:0 8px 8px 0;
      background:#f8faf5;
    }

    .card h4{
      margin:0 0 6px;
      color:var(--verde-oscuro);
      font-size:12px;
      text-transform:uppercase;
    }

    .card p{margin:0}

    .example{
      margin-top:14px;
      padding:16px;
      border:1px dashed #b9cc84;
      border-radius:9px;
      background:#f4f7ed;
    }

    .project{
      margin-top:14px;
      padding:16px 17px;
      border-left:4px solid var(--amarillo);
      border-radius:0 8px 8px 0;
      background:var(--amarillo-suave);
    }

    .project strong{color:#86620a}

    .code{
      display:block;
      margin-top:12px;
      padding:14px;
      border-radius:8px;
      background:#26342c;
      color:#eaf3d6;
      white-space:pre-line;
      font-family:Consolas, monospace;
      font-size:13px;
      line-height:1.7;
    }

    .steps{
      display:grid;
      gap:10px;
      margin-top:14px;
    }

    .step{
      display:grid;
      grid-template-columns:32px 1fr;
      gap:11px;
      align-items:start;
      padding:12px 14px;
      border:1px solid #e0e7da;
      border-radius:8px;
      background:#f8faf5;
    }

    .step-number{
      width:29px;
      height:29px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:var(--verde);
      color:#fff;
      font-size:12px;
      font-weight:bold;
    }

    .step strong{color:var(--verde-oscuro)}

    /* FLUJO */
    .flowchart{
      margin-top:16px;
      display:grid;
      justify-items:center;
      gap:8px;
    }

    .flow-node{
      width:min(460px,100%);
      padding:11px 15px;
      text-align:center;
      border:2px solid var(--verde);
      background:#fff;
      border-radius:8px;
      font-weight:bold;
      font-size:13px;
    }

    .flow-node.start{
      width:190px;
      border-color:#26342c;
      background:#26342c;
      color:#fff;
      border-radius:28px;
    }

    .flow-node.decision{
      width:240px;
      border-radius:4px;
      transform:skew(-10deg);
      background:#f8faf5;
    }

    .flow-node.decision span{
      display:block;
      transform:skew(10deg);
    }

    .down{
      color:var(--verde-oscuro);
      font-weight:bold;
      font-size:18px;
      line-height:1;
    }

    /* TABLAS CONCEPTUALES */
    .mini-table{
      width:100%;
      border-collapse:collapse;
      margin-top:14px;
      font-size:13px;
    }

    .mini-table th,
    .mini-table td{
      border:1px solid #dde5d9;
      padding:10px 11px;
      text-align:left;
      vertical-align:top;
    }

    .mini-table th{
      background:var(--verde-suave);
      color:var(--verde-oscuro);
    }

    .mini-table tr:nth-child(even) td{background:#fbfcfa}

    /* PANTALLAS */
    .screen-map{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
      margin-top:15px;
    }

    .screen-box{
      padding:10px 13px;
      border:1px solid #cad8a8;
      background:#f4f7ed;
      border-radius:7px;
      font-size:13px;
      font-weight:bold;
    }

    .arrow{
      color:var(--verde-oscuro);
      font-weight:bold;
    }

    /* CHECKLIST */
    .checklist{
      margin:12px 0 0;
      padding:0;
      list-style:none;
      display:grid;
      gap:8px;
    }

    .checklist li{
      padding:9px 11px 9px 34px;
      position:relative;
      background:#fafcf8;
      border:1px solid #e3e9df;
      border-radius:7px;
    }

    .checklist li::before{
      content:"✓";
      position:absolute;
      left:12px;
      color:var(--verde-oscuro);
      font-weight:bold;
    }


    /* CONTENEDORES CON PESTAÑAS */
    .tab-container{
      margin-top:16px;
      border:1px solid var(--borde);
      border-radius:14px;
      overflow:hidden;
      background:#fff;
      box-shadow:0 7px 20px rgba(37,55,39,.05);
    }

    .tab-bar{
      display:flex;
      flex-wrap:wrap;
      gap:0;
      background:#f4f7ed;
      border-bottom:1px solid var(--borde);
    }

    .tab-btn{
      flex:1 1 170px;
      min-height:54px;
      padding:12px 14px;
      border:0;
      border-right:1px solid var(--borde);
      background:#f4f7ed;
      color:#4b584e;
      font-size:13px;
      line-height:1.3;
      font-weight:bold;
      cursor:pointer;
      transition:.18s ease;
      text-align:center;
    }

    .tab-btn:last-child{border-right:0}

    .tab-btn:hover{
      background:#e9f0da;
      color:var(--verde-oscuro);
    }

    .tab-btn.active{
      background:var(--verde);
      color:#fff;
    }

    .tab-panel{
      display:none;
      padding:22px;
      animation:tabFade .18s ease;
    }

    .tab-panel.active{display:block}

    @keyframes tabFade{
      from{opacity:.35; transform:translateY(2px)}
      to{opacity:1; transform:translateY(0)}
    }

    .tab-title{
      margin:0 0 8px;
      color:var(--verde-oscuro);
      font-size:18px;
      line-height:1.3;
    }

    .tab-lead{
      margin:0 0 15px;
      color:var(--gris);
      line-height:1.6;
    }

    .resource-row{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin:14px 0 16px;
    }

    .resource-row .resource-btn{
      margin-top:0;
    }

    .resource-btn.secondary{
      background:#fff;
      color:var(--verde-oscuro);
      border-color:#b9cc84;
    }

    .resource-btn.secondary:hover{
      background:var(--verde-suave);
      color:var(--verde-oscuro);
      border-color:#9fb55f;
    }

    .mini-table.pretty{
      border-collapse:separate;
      border-spacing:0;
      border:1px solid #dbe4d7;
      border-radius:11px;
      overflow:hidden;
      box-shadow:0 4px 12px rgba(37,55,39,.04);
      background:#fff;
    }

    .mini-table.pretty th{
      background:#edf4dc;
      color:#587313;
      border-top:0;
    }

    .mini-table.pretty th,
    .mini-table.pretty td{
      border-left:0;
      border-right:0;
      border-bottom:1px solid #e1e8dc;
      padding:11px 12px;
    }

    .mini-table.pretty tr:last-child td{
      border-bottom:0;
    }

    .mini-table.pretty tbody tr:hover td{
      background:#fafcf7;
    }

    .compact-check{
      margin:12px 0 0;
      padding:0;
      list-style:none;
      display:grid;
      gap:8px;
    }

    .compact-check li{
      position:relative;
      padding:10px 12px 10px 36px;
      border:1px solid #e1e7dd;
      border-radius:8px;
      background:#fafcf8;
      margin:0;
    }

    .compact-check li::before{
      content:"✓";
      position:absolute;
      left:13px;
      top:9px;
      color:var(--verde-oscuro);
      font-weight:bold;
    }

    .flow-strip{
      display:grid;
      gap:8px;
      margin-top:15px;
    }

    .flow-step{
      display:grid;
      grid-template-columns:34px 1fr;
      gap:10px;
      align-items:start;
      padding:11px 13px;
      border:1px solid #e1e7dd;
      border-radius:9px;
      background:#fbfcfa;
    }

    .flow-step span:first-child{
      width:28px;
      height:28px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:var(--verde);
      color:#fff;
      font-size:12px;
      font-weight:bold;
    }

    .doc-table td:first-child{
      width:34%;
      font-weight:bold;
      color:#506c13;
    }


    .resource-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      margin-top:14px;
      padding:9px 15px;
      background:var(--verde);
      border:1px solid var(--verde);
      border-radius:6px;
      color:#fff;
      text-decoration:none;
      font-size:13px;
      font-weight:bold;
    }

    .resource-btn:hover{
      background:var(--verde-oscuro);
      border-color:var(--verde-oscuro);
    }

    ul{
      margin:8px 0;
      padding-left:20px;
    }

    li{margin:6px 0}

    footer{
      padding:4px 5% 28px;
      text-align:center;
      color:#7b837c;
      font-size:12px;
    }

    @media(max-width:800px){
      header{padding:14px 5%}
      .brand span{display:none}

      .app{
        width:94%;
        grid-template-columns:1fr;
      }

      .sidebar{
        border-right:0;
        border-bottom:1px solid var(--borde);
      }

      .workspace{padding:29px 22px}
      h2{font-size:25px}
      .grid{grid-template-columns:1fr}
      .tab-bar{display:grid;grid-template-columns:1fr}
      .tab-btn{border-right:0;border-bottom:1px solid var(--borde)}
      .tab-btn:last-child{border-bottom:0}

      .mini-table{
        display:block;
        overflow-x:auto;
      }
    }
  </style>
</head>

<body>

  <div class="topbar"></div>

  <header>
    <div class="brand">
      <img
        src="https://cms.areandina.edu.co/sites/default/files/styles/max_650x650_webp/public/2023-03/AREANDINA%20%281%29.png.webp?itok=r5N1M-5x"
        alt="Areandina"
      >
      <span>Aprendiendo con @LaProfeVivy</span>
    </div>

    <div class="badge">Eje 3</div>
  </header>

  <main class="app">

    <aside class="sidebar">
      <h1>Temáticas del eje</h1>
      <p class="sidebar-intro">
        De la solución definida a una aplicación organizada y funcional.
      </p>

      <button class="topic-button active" data-topic="encuentro1" type="button">
        <span class="number">01</span>
        <span class="topic-text">
          <strong>Encuentro 1</strong>
          <span>Diseñar y representar la solución</span>
        </span>
      </button>

      <button class="topic-button" data-topic="encuentro2" type="button">
        <span class="number">02</span>
        <span class="topic-text">
          <strong>Encuentro 2</strong>
          <span>Construir la app</span>
        </span>
      </button>
    </aside>

    <section class="workspace">
      <p class="eyebrow" id="eyebrow"></p>
      <h2 id="topicTitle"></h2>
      <p class="intro" id="topicIntro"></p>
      <div id="accordions"></div>
    </section>

  </main>

  <footer>
    Aprendiendo con @LaProfeVivy · Saber Conocer
  </footer>

  <script>
    const topics = {

      /* =====================================================
         ENCUENTRO 1
         ===================================================== */

      encuentro1: {
        eyebrow: "Saber Conocer · Eje 3 · Encuentro 1",
        title: "Diseñar y representar la solución",
        intro:
          "En este encuentro se organiza la solución propuesta: se representa su funcionamiento, se identifican las funciones que requiere, se determina la estructura básica de datos y se preparan los documentos mínimos de PMV y UX para orientar su construcción.",

        sections: [

          {
            title: "1. Del problema a la solución",
            body: `
              <p>
                En los ejes anteriores ya se identificó la problemática y se propuso una solución.
                Ahora el objetivo es describir <strong>cómo funcionará esa solución</strong> antes de construirla.
              </p>

              <div class="grid">
                <div class="card">
                  <h4>Problema</h4>
                  <p>¿Qué situación concreta debe mejorar?</p>
                </div>

                <div class="card">
                  <h4>Usuario</h4>
                  <p>¿Quién utilizará la solución y qué necesita hacer?</p>
                </div>

                <div class="card">
                  <h4>Acción</h4>
                  <p>¿Qué debe permitir registrar, consultar, calcular o gestionar?</p>
                </div>

                <div class="card">
                  <h4>Resultado</h4>
                  <p>¿Qué información o decisión debe producir?</p>
                </div>
              </div>

              <div class="example">
                <strong>Ejemplo: control de retardos.</strong><br><br>
                La solución debe permitir registrar la llegada de un estudiante, identificar la sesión,
                calcular si existe retardo, guardar el motivo, controlar reincidencias y facilitar el
                seguimiento de coordinación.
              </div>
            `
          },

          {
            title: "2. Representación de la solución",
            body: `
              <div class="tab-container">
                <div class="tab-bar">
                  <button class="tab-btn active" type="button" data-tab="dfd">
                    Diagrama de flujo
                  </button>
                  <button class="tab-btn" type="button" data-tab="revision">
                    Revisión de la solución
                  </button>
                  <button class="tab-btn" type="button" data-tab="funciones">
                    Funciones de la app
                  </button>
                  <button class="tab-btn" type="button" data-tab="ejemplo">
                    Ejemplo aplicado
                  </button>
                </div>

                <div class="tab-panel active" data-panel="dfd">
                  <h3 class="tab-title">Diagrama de flujo</h3>
                  <p class="tab-lead">
                    Representa gráficamente la secuencia de acciones, decisiones y datos que intervienen
                    en la solución. Sirve para ordenar cómo funcionará el proceso antes de construir la app.
                  </p>

                  <div class="resource-row">
                    <a class="resource-btn" href="https://cgviviana.github.io/Asignaturas-FUAA/PtoComp/JuegoDFD0/" target="_blank" rel="noopener">
                      Símbolos DFD
                    </a>
                    <a class="resource-btn secondary" href="https://cgviviana.github.io/Asignaturas-FUAA/PtoComp/ConceptoAlgYDfd/index.html" target="_blank" rel="noopener">
                      ¿Qué es un algoritmo?
                    </a>
                  </div>

                  <table class="mini-table pretty">
                    <thead>
                      <tr>
                        <th>Elemento</th>
                        <th>¿Qué representa?</th>
                        <th>Ejemplo en una solución</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <td><strong>Inicio / Fin</strong></td>
                        <td>El comienzo o cierre del proceso.</td>
                        <td>Inicio del registro / proceso finalizado.</td>
                      </tr>
                      <tr>
                        <td><strong>Proceso</strong></td>
                        <td>Una acción que realiza el usuario o la app.</td>
                        <td>Registrar llegada, calcular minutos, guardar información.</td>
                      </tr>
                      <tr>
                        <td><strong>Decisión</strong></td>
                        <td>Una condición que genera caminos diferentes.</td>
                        <td>¿Llegó después de la hora permitida?</td>
                      </tr>
                      <tr>
                        <td><strong>Entrada / salida</strong></td>
                        <td>Información que ingresa, se registra o se presenta.</td>
                        <td>Correo, hora de ingreso, motivo o reporte.</td>
                      </tr>
                      <tr>
                        <td><strong>Flechas</strong></td>
                        <td>La dirección y el orden del recorrido.</td>
                        <td>Indican qué ocurre después de cada acción o decisión.</td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                <div class="tab-panel" data-panel="revision">
                  <h3 class="tab-title">Revisión de la solución</h3>
                  <p class="tab-lead">
                    Antes de construirla, revisa si el recorrido representa de manera completa
                    lo que debe ocurrir desde el inicio hasta el resultado final.
                  </p>

                  <ul class="compact-check">
                    <li>Está claro quién inicia el proceso.</li>
                    <li>Se identifican los datos que necesita la solución.</li>
                    <li>Se distinguen las acciones del usuario y las acciones de la app.</li>
                    <li>Las decisiones tienen salidas claras, por ejemplo Sí / No.</li>
                    <li>Se indica qué información se registra, calcula, consulta o muestra.</li>
                    <li>Se contempla qué ocurre cuando aparece una situación alternativa o contingencia.</li>
                    <li>El proceso termina con un resultado concreto y verificable.</li>
                  </ul>
                </div>

                <div class="tab-panel" data-panel="funciones">
                  <h3 class="tab-title">Del flujo a las funciones de la app</h3>
                  <p class="tab-lead">
                    Las acciones y decisiones del diagrama permiten identificar qué funciones
                    deberá realizar la aplicación.
                  </p>

                  <table class="mini-table pretty">
                    <thead>
                      <tr>
                        <th>En el flujo aparece...</th>
                        <th>La app necesita...</th>

      const topic = topics[topicKey];

      eyebrow.textContent = topic.eyebrow;

      topicIntro.textContent = topic.intro;

        accordion.className = "accordion";

        accordion.innerHTML = `
          <button class="accordion-trigger" type="button">

            </div>
          </div>

          accordion.classList.toggle("open");

          tabButton.addEventListener("click", (event) => {
            event.stopPropagation();

            const tabBox = tabButton.closest(".tab-container");
            const target = tabButton.dataset.tab;

            tabBox.querySelectorAll(".tab-btn").forEach((btn) => {
              btn.classList.remove("active");
            });

            tabBox.querySelectorAll(".tab-panel").forEach((panel) => {
              panel.classList.remove("active");
            });

            tabButton.classList.add("active");

            const targetPanel = tabBox.querySelector(`[data-panel="${target}"]`);
            if (targetPanel) {
              targetPanel.classList.add("active");
            }
          });
        });

        accordionsContainer.appendChild(accordion);
      });
    }

    topicButtons.forEach((button) => {
      button.addEventListener("click", () => {
        topicButtons.forEach((btn) => btn.classList.remove("active"));
        button.classList.add("active");
        renderTopic(button.dataset.topic);
      });
    });

    renderTopic("encuentro1");
  </script>

</body>
</html>
