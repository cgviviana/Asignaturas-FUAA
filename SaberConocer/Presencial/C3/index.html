<div class="footer">Aprendiendo con @LaProfeVivy</div><script>
const slides=[...document.querySelectorAll('.slide')];let idx=0,token=0;
const sleep=t=>new Promise(r=>setTimeout(r,t));
function show(n){if(n<0||n>=slides.length)return;token++;slides[idx].classList.remove('active');idx=n;slides[idx].classList.add('active');document.getElementById('counter').textContent=(idx+1)+' / '+slides.length;document.getElementById('prev').disabled=idx===0;document.getElementById('next').disabled=idx===slides.length-1;animate(token)}
async function animate(myToken){const items=[...slides[idx].querySelectorAll('[data-step]')];for(const el of items){el.classList.remove('on','play','done');if(el.tagName==='path'){let l=el.getTotalLength();el.style.setProperty('--length',l+'px')}}await sleep(180);while(myToken===token){for(const el of items){if(myToken!==token)return;if(el.tagName==='rect'){el.classList.add('on');await sleep(410);el.classList.remove('on')}else{el.classList.add('play');await sleep(710);el.classList.add('done');await sleep(110);el.classList.remove('play','done')}}await sleep(700)}}
document.getElementById('prev').onclick=()=>show(idx-1);document.getElementById('next').onclick=()=>show(idx+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(idx+1);if(e.key==='ArrowLeft')show(idx-1)});show(0);
</script></body></html>
