<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi primera app en AppSheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#152039;--y:#ffc83d;--teal:#14b39a;--muted:#5a6683;--g:#1a73e8;--ok:#137333}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0f1830;overflow:hidden}
body{font-family:Rubik,system-ui,Arial,sans-serif;color:var(--ink)}
button{font:inherit;cursor:pointer;color:inherit}
#view{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1280px;height:720px;position:relative;flex:0 0 auto;transform-origin:center;background:linear-gradient(180deg,#8fd0f8,#d4efff 70%,#e9f8ee);overflow:hidden;border-radius:4px}
#stage:after{content:"";position:absolute;left:-40px;right:-40px;bottom:-60px;height:130px;background:#6cc070;border-radius:50%;z-index:0}
.sl{position:absolute;inset:0;padding:40px 64px 90px;display:none;z-index:1}
.sl.on{display:flex;animation:in .4s}
@keyframes in{from{opacity:0;transform:translateX(30px)}}
/* portada */
.cover{flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cover .av{width:190px;height:190px;margin-bottom:22px}
.av svg{width:100%;height:100%;border-radius:50%;border:5px solid var(--ink);background:#fff;box-shadow:0 7px 0 var(--ink)}
.cover h1{font-size:72px;line-height:1;margin:0 0 16px;font-weight:800}
.cover p{font-size:30px;margin:0;color:#24345e}
.pill{display:inline-block;background:var(--y);border:4px solid var(--ink);border-radius:16px;padding:6px 20px;font-weight:800;font-size:24px;margin-bottom:22px}
/* pasos */
.two{gap:56px;align-items:center}
.txt{flex:0 0 430px}
.img{min-width:0}
.num{display:inline-flex;align-items:center;justify-content:center;width:76px;height:76px;border-radius:50%;background:var(--y);border:5px solid var(--ink);box-shadow:0 5px 0 var(--ink);font-size:38px;font-weight:800;margin-bottom:22px}
.txt h2{font-size:52px;line-height:1.08;margin:0 0 20px;font-weight:800}
.txt p{font-size:28px;line-height:1.4;margin:0}
.txt p b,.txt h2 u{text-decoration:none;background:linear-gradient(transparent 58%,#ffd95c 58%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 2px}
.code{display:inline-block;font-family:ui-monospace,Consolas,monospace;font-size:30px;font-weight:700;background:#fff;border:4px solid var(--ink);border-radius:14px;padding:8px 18px;margin-top:6px;color:#3c2fb8}
.img{flex:1;display:flex;align-items:center;justify-content:center}
.win{width:100%;overflow:visible!important;background:#fff;border:4px solid var(--ink);border-radius:20px;box-shadow:0 10px 0 var(--ink);overflow:hidden;font-size:22px}
.wtop{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:2px solid #e8eaed;font-size:20px}
.wtop .brand{color:var(--g);font-weight:800}
.wtop .sp{flex:1}
.btn{background:var(--g);color:#fff;border-radius:8px;padding:6px 18px;font-weight:700}
.mark{outline:6px solid var(--y);outline-offset:4px;border-radius:10px;position:relative;animation:pul 1.3s infinite}
@keyframes pul{50%{outline-color:#ff6b57}}
.mark:after{content:"👈";position:absolute;right:-62px;top:50%;transform:translateY(-50%);font-size:40px;animation:tap 1s infinite}
@keyframes tap{50%{right:-70px}}
.menu{display:flex;flex-direction:column;gap:6px;padding:18px}
.menu div{padding:14px 20px;border-radius:12px;color:#5f6368;font-size:26px}
.menu div.a{background:#e8f0fe;color:var(--g);font-weight:700;width:max-content}
.list{padding:10px 20px 18px}
.list div{display:flex;justify-content:space-between;align-items:center;padding:16px 10px;border-bottom:2px solid #f1f3f4;font-size:26px}
.list small{color:#5f6368;font-size:20px;background:#f1f3f4;border-radius:8px;padding:2px 12px}
.list .pen{width:max-content}
.field{padding:20px 24px}
.field label{display:block;font-weight:700;font-size:24px;margin-bottom:10px}
.field .box{background:#f1f3f4;border-radius:10px;padding:14px 18px;font-family:ui-monospace,Consolas,monospace;font-size:26px;color:#80868b;width:85%}
.field .box.ok{background:#e6f4ea;color:var(--ok);font-weight:700}
.field+.field{border-top:2px solid #f1f3f4}
.write{margin:22px 24px 10px;border:4px solid var(--g);border-radius:12px;padding:20px;font-family:ui-monospace,Consolas,monospace;font-size:32px;min-height:90px}
.okmsg{margin:0 24px 16px;color:var(--ok);font-weight:700;font-size:24px}
.foot2{display:flex;justify-content:flex-end;gap:24px;align-items:center;padding:16px 24px 22px;border-top:2px solid #e8eaed}
.foot2 span{color:var(--g)}
.foot2 span.btn{color:#fff}
.mark.l:after{content:"👆";right:auto;left:50%;top:auto;bottom:-58px;transform:translateX(-50%);animation:tapl 1s infinite}
@keyframes tapl{50%{bottom:-64px}}
.code{white-space:nowrap}
/* hoja */
.grid{border-collapse:collapse;width:100%;font-size:24px}
.grid td{border:2px solid #e2e3e3;padding:14px 16px}
.grid tr:first-child td{font-weight:800;background:#f1f8f4}
.grid td.t{background:#fff6d8}
/* celular */
.phone{width:380px;border:12px solid #1f2235;border-radius:44px;overflow:hidden;background:#fff;box-shadow:0 10px 0 #0b0f1d}
.ph{background:var(--g);color:#fff;font-weight:800;font-size:26px;padding:20px 24px}
.it{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:2px solid #f0f0f0;font-size:24px}
.it small{display:block;color:#5f6368;font-size:18px}
.it b.t{color:var(--ok);font-size:28px}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:14px;display:flex;justify-content:center;align-items:center;gap:14px;z-index:5}
.gbtn{background:var(--y);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);font-weight:800;font-size:17px;padding:10px 22px}
.gbtn.w{background:#fff}.gbtn:disabled{opacity:.4;cursor:default}
.gbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.cnt{background:#fff;border:3px solid var(--ink);border-radius:99px;padding:6px 14px;font-weight:800}
.brandv{position:absolute;right:28px;bottom:26px;z-index:2;font-weight:700;color:#fff;font-size:18px;text-shadow:0 2px 0 rgba(0,0,0,.25)}

.sec{flex-direction:column;align-items:center;justify-content:center;text-align:center}
.sec .big{font-size:120px;line-height:1}
.sec h1{font-size:70px;margin:10px 0 12px;font-weight:800}
.sec p{font-size:30px;margin:0;color:#24345e}
.calc{width:270px;background:#2b3553;border:5px solid var(--ink);border-radius:30px;padding:22px;box-shadow:0 10px 0 var(--ink)}
.cd{background:#d7f0c8;border-radius:12px;padding:10px 14px;text-align:right;font-family:ui-monospace,Consolas,monospace;font-size:34px;font-weight:700;margin-bottom:16px}
.cd small{display:block;font-size:20px;color:#456}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.keys span{background:#fff;border-radius:10px;padding:7px 0;text-align:center;font-weight:800;font-size:22px}
.keys span.o{background:var(--y)}
.vs{display:flex;flex-direction:column;align-items:center;gap:10px}
.vs .arrow{transform:rotate(90deg);font-size:44px;line-height:1}
.arrow{font-size:60px;font-weight:800}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%}
.tile{background:#fff;border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:18px 22px}
.tile .s{font-size:52px;font-weight:800;line-height:1;color:#c2410c;font-family:ui-monospace,Consolas,monospace}
.tile .n{font-size:22px;font-weight:700;margin:6px 0}
.tile .f{font-family:ui-monospace,Consolas,monospace;font-size:20px;color:#3c2fb8}
.tile .r{font-size:20px;color:var(--muted)}
.tile .r b{color:var(--ok)}
.rows{display:flex;flex-direction:column;gap:12px;width:100%}
.rw{display:flex;align-items:center;gap:18px;background:#fff;border:4px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:14px 22px;font-size:24px}
.rw .k{font-family:ui-monospace,Consolas,monospace;font-weight:800;font-size:26px;min-width:200px;white-space:nowrap;color:#3c2fb8}
.rw .k.s{color:#c2410c;min-width:80px;font-size:36px}
.rw .d{flex:1}
.rw .e{font-family:ui-monospace,Consolas,monospace;color:var(--muted);font-size:21px}
.rw .e b{color:var(--ok)}
.c-col{color:#16653a}.c-txt{color:#c5221f}.c-num{color:#c2410c}.c-fn{color:#5b3fd1}
.formula{font-family:ui-monospace,Consolas,monospace;font-size:34px;font-weight:700;background:#fff;border:4px solid var(--ink);border-radius:16px;padding:14px 22px;box-shadow:0 6px 0 var(--ink);text-align:center;white-space:nowrap}
.res{display:flex;flex-direction:column;gap:12px;width:100%;margin-top:26px}
.res div{display:flex;justify-content:space-between;background:#fff;border-radius:14px;padding:12px 20px;font-size:24px;border:3px solid #cfd6e6}
.res b{color:var(--ok)}
.col{display:flex;flex-direction:column;align-items:center;width:100%}
.tree{display:flex;flex-direction:column;align-items:center;width:100%}
.tq{background:var(--y);border:4px solid var(--ink);border-radius:18px;padding:14px 26px;font-size:28px;font-weight:800;box-shadow:0 5px 0 var(--ink)}
.tb{display:flex;gap:70px;margin-top:44px;position:relative}
.tb:before{content:"";position:absolute;top:-36px;left:22%;right:22%;height:30px;border:4px solid var(--ink);border-bottom:0;border-radius:14px 14px 0 0}
.tb div{border:4px solid;border-radius:16px;padding:12px 28px;font-size:28px;font-weight:800;text-align:center;background:#fff}
.tb small{display:block;font-size:20px}
.tb .si{border-color:#16653a;color:#16653a;background:#e6f4ea}.tb .no{border-color:#c5221f;color:#c5221f;background:#fde8e4}
.blend{display:flex;align-items:center;gap:12px}
.blend .arrow{font-size:40px}
.blend>div{background:#fff;border:4px solid var(--ink);border-radius:18px;padding:16px 20px;text-align:center;font-size:22px;box-shadow:0 5px 0 var(--ink)}
.blend>div b{display:block;font-size:30px}
.blend .mid{background:#f1effd}
.blend .out{background:var(--y)}
.tables{display:flex;align-items:center;gap:20px}
.tbl{background:#fff;border:4px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:0 5px 0 var(--ink);font-size:20px}
.tbl h5{margin:0;padding:10px 14px;background:#0f1830;color:#fff;font-size:20px}
.tbl table{border-collapse:collapse}
.tbl td{padding:9px 14px;border-top:2px solid #eef}
.tbl td.h{font-weight:800;background:#f1f8f4}
.tbl td.m{background:#fff6d8;font-weight:800}
.small{font-size:22px!important;color:var(--muted)}
.where{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;font-size:26px;font-weight:800}
.where span{background:#fff;border:4px solid var(--ink);border-radius:14px;padding:10px 18px;box-shadow:0 5px 0 var(--ink)}
.where i{font-style:normal;font-size:34px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:22px;width:100%}
.cmp .tile h3{margin:0 0 8px;font-size:28px}
.cmp .tile p{font-size:21px;margin:0 0 10px}
.err{display:flex;flex-direction:column;gap:14px;width:100%}
.err{gap:12px!important}
.err div{display:grid;grid-template-columns:1fr;gap:2px;background:#fff;border:4px solid var(--ink);border-radius:16px;padding:12px 18px;font-family:ui-monospace,Consolas,monospace;font-size:22px;box-shadow:0 4px 0 var(--ink)}
.err .bad{color:#c5221f}.err .good{color:var(--ok)}
.err small{font-family:Rubik,sans-serif;color:var(--muted);font-size:19px}

.tight{gap:8px!important}.tight .rw{padding:8px 22px}
.stack{display:flex;flex-direction:column;align-items:center;gap:22px;width:100%}
.mt{background:#fff;border:4px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:0 6px 0 var(--ink);font-size:21px}
.mt h5{margin:0;padding:8px 16px;background:#0f1830;color:#fff;font-size:18px;font-weight:700}
.mt table{border-collapse:collapse}
.mt td{padding:9px 16px;border-top:2px solid #eef;white-space:nowrap}
.mt tr.h td{font-weight:800;background:#f1f8f4;border-top:0}
.mt td.n{background:#fff3c4;font-weight:700;color:#137333}
.mt tr.h td.n{background:#ffd95c;color:var(--ink)}
.form{width:330px;border:12px solid #1f2235;border-radius:40px;overflow:hidden;background:#fff;box-shadow:0 10px 0 #0b0f1d}
.form .ph{font-size:22px;padding:14px 20px}
.fl{padding:9px 20px}
.fl small{display:block;color:#5f6368;font-size:16px}
.fl div{border-bottom:3px solid #1a73e8;font-size:22px;padding:2px 0}
.fl.auto div{border-bottom:3px dashed #b0b8c8;color:#137333;font-weight:800;background:#f1f8f4}
.fl.init div{color:#1a73e8;font-weight:700}
.tagr{display:inline-block;background:#e6f4ea;color:#137333;font-size:13px;border-radius:6px;padding:0 6px;margin-left:6px;font-weight:700}
.tagb{display:inline-block;background:#e8f0fe;color:#1a73e8;font-size:13px;border-radius:6px;padding:0 6px;margin-left:6px;font-weight:700}
.sbtn{display:inline-block;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:6px 16px;box-shadow:0 4px 0 var(--ink);font-weight:800;font-size:28px;margin:4px}
.sbtn.o{background:var(--y)}
.keyrow{display:flex;align-items:center;gap:12px;font-size:30px;font-weight:800}

.ag{width:100%;background:#fff;border:4px solid var(--ink);border-radius:18px;box-shadow:0 8px 0 var(--ink);overflow:visible;font-size:19px}
.ag .bar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:2px solid #e8eaed;font-size:18px}
.ag .bar b{color:#1a73e8}.ag .bar .sp{flex:1}
.ag table{border-collapse:collapse;width:100%}
.ag th{font-size:13px;color:#5f6368;text-align:left;padding:8px 10px;font-weight:700;letter-spacing:.03em}
.ag td{padding:7px 10px;border-top:2px solid #f1f3f4;white-space:nowrap}
.ag .c{background:#f1f3f4;border-radius:6px;padding:5px 10px;display:inline-block;min-width:90px}
.ag .c.f{font-family:ui-monospace,Consolas,monospace;color:#1a73e8;min-width:190px}
.ag .c.sel{min-width:80px}
.ag .c.sel:after{content:" ▾";color:#80868b}
.side{display:flex;width:100%;background:#fff;border:4px solid var(--ink);border-radius:18px;box-shadow:0 8px 0 var(--ink);font-size:22px;overflow:visible}
.side .l{width:260px;border-right:2px solid #e8eaed;padding:16px}
.side .l .h{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:12px}
.side .l .it2{padding:8px 12px;border-radius:10px;color:#3c4043}
.side .l .it2.a{background:#e8f0fe;color:#1a73e8}
.side .r{flex:1;padding:16px;color:#80868b;font-size:18px}
.gmenu{width:100%;background:#fff;border:4px solid var(--ink);border-radius:18px;box-shadow:0 8px 0 var(--ink);font-size:22px;overflow:visible}
.gmenu .mb{display:flex;gap:14px;font-size:19px;padding:12px 18px;border-bottom:2px solid #e8eaed;color:#3c4043}
.gmenu .dd{margin:0 0 16px 210px;width:330px;background:#fff;border:2px solid #dadce0;border-radius:10px;box-shadow:0 6px 16px rgba(0,0,0,.15);padding:6px 0}
.gmenu .dd div{padding:10px 18px}
.gmenu .sub{margin:-8px 0 18px 430px;width:300px;background:#fff;border:2px solid #dadce0;border-radius:10px;box-shadow:0 6px 16px rgba(0,0,0,.15);padding:6px 0}
.gmenu .sub div{padding:10px 18px}
.pnl{width:100%;background:#fff;border:4px solid var(--ink);border-radius:18px;box-shadow:0 8px 0 var(--ink);font-size:21px;overflow:visible}
.pnl .ph2{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:2px solid #e8eaed;font-weight:800}
.pnl .rowp{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;gap:16px}
.pnl .rowp small{display:block;font-size:15px;color:#5f6368;font-weight:400}
.pnl .seg{display:flex;border:2px solid #dadce0;border-radius:8px;overflow:visible}
.pnl .seg span{padding:6px 14px;font-size:17px;color:#5f6368}
.ea2{width:100%;background:#fff;border:4px solid var(--ink);border-radius:18px;box-shadow:0 8px 0 var(--ink);font-size:20px;overflow:visible}
.ea2 .t{padding:12px 18px;font-weight:800;border-bottom:2px solid #e8eaed}
.ea2 .sub2{padding:10px 18px 0;color:#3c4043;font-size:18px}
.ea2 .box2{margin:10px 18px;background:#f1f3f4;border-radius:8px;padding:16px;font-family:ui-monospace,Consolas,monospace;font-size:28px;color:#c2185b}
.ea2 .ok2{margin:0 18px 12px;color:#137333;font-weight:800}
.ea2 .bad2{margin:0 18px 12px;background:#fde8e4;color:#9c2e1a;border-radius:8px;padding:8px 12px;font-size:17px}
.ea2 .ft{display:flex;justify-content:flex-end;gap:22px;align-items:center;padding:12px 18px;border-top:2px solid #e8eaed}
.ea2 .ft span{color:#1a73e8}
.ea2 .ft .sv{background:#1a73e8;color:#fff;border-radius:99px;padding:6px 22px;font-weight:700}
.savebar{display:flex;align-items:center;gap:22px;justify-content:flex-end;width:100%;background:#fff;border:4px solid var(--ink);border-radius:18px;box-shadow:0 8px 0 var(--ink);padding:18px 24px;font-size:22px}
.savebar .g{background:#e8eaed;color:#9aa0a6;border-radius:6px;padding:6px 18px;font-weight:700}
.savebar .chk{color:#137333;font-size:34px;font-weight:800}
.note2{background:#fff;border:4px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:14px 20px;font-size:22px;margin-top:4px}

.gs{width:100%;background:#fff;border:4px solid var(--ink);border-radius:18px;box-shadow:0 8px 0 var(--ink);overflow:visible;font-size:20px}
.gs .gt{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:2px solid #e8eaed;font-weight:700}
.gs .gt i{width:18px;height:22px;background:#0f9d58;border-radius:3px;display:inline-block}
.gs table{border-collapse:collapse;width:100%}
.gs td{border:1px solid #e2e3e3;padding:8px 10px;white-space:nowrap;height:40px}
.gs td.l{background:#f8f9fa;color:#5f6368;text-align:center;font-size:15px;width:34px;padding:4px}
.gs tr.hd td:not(.l){font-weight:800;background:#e6f4ea}
.gs .tabs{display:flex;gap:4px;align-items:center;padding:6px 10px;background:#f8f9fa;border-top:2px solid #e8eaed;font-size:17px}
.gs .tabs span{padding:4px 14px;border-radius:6px 6px 0 0;color:#5f6368}
.gs .tabs span.on{background:#e8f0fe;color:#1a73e8;font-weight:700}
.vc{width:100%;background:#fff;border:4px solid var(--ink);border-radius:18px;box-shadow:0 8px 0 var(--ink);font-size:21px;overflow:visible}
.vc .ph2{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:2px solid #e8eaed;font-weight:800}
.vc .rowp{padding:12px 18px}
.vc .rowp small{display:block;font-size:15px;color:#5f6368;margin-bottom:6px}
.vc .in2{background:#f1f3f4;border-radius:8px;padding:8px 12px;font-family:ui-monospace,Consolas,monospace;font-size:20px}
.vc .in2.f{color:#1a73e8}
.ck{display:inline-block;width:22px;height:22px;border:2px solid #5f6368;border-radius:4px;vertical-align:middle}
.ck.on{background:#1a73e8;border-color:#1a73e8;position:relative}
.ck.on:after{content:"✓";color:#fff;position:absolute;left:3px;top:-3px;font-size:17px;font-weight:800}
.det{width:340px;border:12px solid #1f2235;border-radius:40px;overflow:hidden;background:#fff;box-shadow:0 10px 0 #0b0f1d;font-size:20px}
.det .dl{padding:8px 18px}.det .dl small{display:block;color:#5f6368;font-size:14px}
.det table{border-collapse:collapse;width:100%;font-size:16px;margin:4px 0}
.det td{padding:6px 10px;border-top:1px solid #e8eaed}
.det tr:first-child td{font-weight:800}
</style>
</head>
<body>
<div id="view"><div id="stage"></div></div>
<div class="nav"><button class="gbtn w" id="prev" type="button">← Atrás</button><span class="cnt" id="cnt"></span><button class="gbtn" id="next" type="button">Siguiente →</button></div>
<script>
const $=s=>document.querySelector(s);
let avn=0;

const els=[...document.querySelectorAll('.sl')
];let k=0;
function show(i){k=Math.max(0,Math.min(els.length-1,i));els.forEach((e,j)=>e.classList.toggle('on',j===k));$('#prev').disabled=k===0;$('#next').textContent=k===els.length-1?'Inicio ↺':'Siguiente →';$('#cnt').textContent=(k+1)+' / '+els.length}
function fit(){const s=Math.min(innerWidth/1280,(innerHeight-70)/720);$('#stage').style.transform=`scale(${s})`;$('#stage').style.marginBottom='60px'}
addEventListener('resize',fit);fit();
$('#prev').onclick=()=>show(k-1);$('#next').onclick=()=>show(k===els.length-1?0:k+1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')show(k+1);if(e.key==='ArrowLeft')show(k-1)});
$('#stage').onclick=e=>{if(!e.target.closest('button'))show(k+1)};
show(0);
</script>
</body>
</html>
