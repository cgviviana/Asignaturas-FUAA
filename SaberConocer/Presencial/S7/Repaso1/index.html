<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Repasa · Reto de tablas y relaciones</title>
<style>
:root{
  --v:#7fb536;--vo:#668e2c;--g:#343434;--bg:#f4f6f8;--b:#dfe3e6;
  --c1:#e74c3c;--c2:#3478f6;--c3:#e5a823;--c4:#7e57c2;
}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--g)}
.top{background:#343434;color:#fff;padding:9px 18px;font-size:12px;text-align:right}
.wrap{width:min(980px,calc(100% - 28px));margin:auto;padding:22px 0 44px}
.hero{background:#fff;border:1px solid var(--b);border-bottom:4px solid var(--v);padding:20px 22px;margin-bottom:14px}
.hero h1{margin:0;font-size:29px}.hero p{margin:7px 0 0;line-height:1.45}
.status{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;margin:12px 0}
.bar{height:12px;background:#e5e8eb;border-radius:20px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--v);transition:.25s}
.badge{background:#fff;border:1px solid var(--b);padding:7px 10px;font-weight:800;font-size:13px}
.game{background:#fff;border:1px solid var(--b);padding:22px}
.topic{color:var(--vo);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.phase{display:inline-block;margin-top:6px;background:#eef6e3;color:var(--vo);padding:5px 9px;font-weight:800}
.question{font-size:24px;font-weight:800;line-height:1.35;margin:18px 0 8px}
.prompt{color:#666;margin-bottom:16px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.answer{min-height:92px;border:0;color:white;padding:16px;font-size:16px;font-weight:800;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;border-radius:8px}
.answer span:first-child{display:grid;place-items:center;flex:0 0 34px;width:34px;height:34px;background:rgba(255,255,255,.22);border-radius:50%;font-size:18px}
.answer.a{background:var(--c1)}.answer.b{background:var(--c2)}.answer.c{background:var(--c3)}.answer.d{background:var(--c4)}
.answer:disabled{cursor:default;opacity:.88}
.answer.correct{outline:5px solid #b9e39b;filter:saturate(1.15)}
.answer.wrong{outline:5px solid #f4b0b0;opacity:.55}
.feedback{min-height:48px;margin-top:16px;padding:12px 14px;border-left:5px solid #bbb;background:#fafafa;line-height:1.45}
.feedback.ok{border-color:var(--v);background:#f0f8e9}.feedback.bad{border-color:#c74646;background:#fff1f1}
.next{margin-top:14px;border:1px solid var(--v);background:var(--v);color:#fff;padding:10px 16px;font-weight:800;cursor:pointer}
.next[hidden]{display:none}
.finish{text-align:center;padding:30px 14px}.finish h2{color:var(--vo);font-size:28px}
.review{margin-top:18px;text-align:left;border-top:1px solid #ddd;padding-top:15px}
.review div{margin:7px 0}
@media(max-width:720px){.answers{grid-template-columns:1fr}.question{font-size:21px}.status{grid-template-columns:1fr 1fr}.bar{grid-column:1/-1}}
</style>
</head>
<body>
<div class="top">Saber Conocer · Corte 2</div>
<div class="wrap">
  <section class="hero">
    <h1>Repasa · Reto de tablas y relaciones</h1>
    <p>Responde una pregunta a la vez. Cada intento adicional reduce el puntaje.</p>
  </section>
  <div class="status">
    <div class="bar"><span id="bar"></span></div>
    <div class="badge" id="score">⭐ 0</div>
    <div class="badge" id="streak">Intentos: 1</div>
  </div>
  <main class="game" id="game">
    <div class="topic" id="topic"></div>
    <div class="phase" id="phase"></div>
    <div class="question" id="question"></div>
    <div class="prompt">Elige el término que corresponde a la definición.</div>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback" aria-live="polite">Selecciona una opción.</div>
    <button class="next" id="next" hidden>Siguiente</button>
  </main>
  <section class="game finish" id="finish" hidden>
    <h2>¡Repaso completado!</h2>
    <p id="finalText"></p>
    <button class="next" id="restart">Jugar de nuevo</button>
    <div class="review" id="review"></div>
  </section>
</div>
<footer style="text-align:center;padding:12px 0 22px;font-size:13px;color:#666">Aprendiendo con @LaProfeVivy</footer>
<script>
const topics=[
  {name:"Estructura de datos",es:[
    ["Entidad","Elemento del sistema sobre el que se necesita guardar información, como un estudiante o una clase."],
    ["Atributo","Característica de una entidad, como el nombre o el curso de un estudiante."],
    ["Registro","Conjunto de valores que describe a un estudiante o una llegada específica dentro de una tabla."],
    ["Tabla","Estructura que reúne registros del mismo tipo y organiza sus datos en filas y columnas."]
  ],en:[
    ["Entity","Elemento del sistema sobre el que se necesita guardar información, como un estudiante o una clase."],
    ["Attribute","Característica de una entidad, como el nombre o el curso de un estudiante."],
    ["Record","Conjunto de valores que describe a un estudiante o una llegada específica dentro de una tabla."],
    ["Table","Estructura que reúne registros del mismo tipo y organiza sus datos en filas y columnas."]
  ]},
  {name:"Organización e identificación",es:[
    ["Clave primaria","Campo cuyo valor permite identificar de forma única cada registro de una tabla."],
    ["Clave foránea","Campo que contiene el identificador de otra tabla para establecer una relación."],
    ["Redundancia","Repetición innecesaria de un mismo dato en varios registros."]
  ],en:[
    ["Primary Key","Campo cuyo valor permite identificar de forma única cada registro de una tabla."],
    ["Foreign Key","Campo que contiene el identificador de otra tabla para establecer una relación."],
    ["Redundancy","Repetición innecesaria de un mismo dato en varios registros."]
  ]},
  {name:"Tipos de relaciones",es:[
    ["Relación 1:1","Asociación en la que cada registro de una tabla corresponde, como máximo, a uno de la otra."],
    ["Relación 1:N","Asociación en la que un registro de una tabla puede vincularse con varios registros de otra."],
    ["Relación N:M","Asociación en la que varios registros de una tabla pueden vincularse con varios de otra."]
  ],en:[
    ["One-to-One (1:1)","Asociación en la que cada registro de una tabla corresponde, como máximo, a uno de la otra."],
    ["One-to-Many (1:N)","Asociación en la que un registro de una tabla puede vincularse con varios registros de otra."],
    ["Many-to-Many (N:M)","Asociación en la que varios registros de una tabla pueden vincularse con varios de otra."]
  ]},
  {name:"Funcionamiento de la aplicación",es:[
    ["Evento de clase","Registro que representa una clase específica abierta por un docente en una fecha y hora."],
    ["Registro de asistencia","Fila que vincula a un estudiante con el evento de clase e indica a qué hora llegó."],
    ["Justificación","Información o soporte asociado a un registro particular de llegada tarde."]
  ],en:[
    ["Class Event","Registro que representa una clase específica abierta por un docente en una fecha y hora."],
    ["Attendance Record","Fila que vincula a un estudiante con el evento de clase e indica a qué hora llegó."],
    ["Justification","Información o soporte asociado a un registro particular de llegada tarde."]
  ]}
];
let t=0,phase="es",q=0,score=1000,attempts=0,totalErrors=0;
let order=[],correctAnswer="",questionLocked=false;
const $=s=>document.querySelector(s);
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}
function makeOrder(){order=shuffle(topics[t][phase].map((_,i)=>i));q=0;}
function choices(correct,data){
  const own=data.map(x=>x[0]).filter(x=>x!==correct);
  const extra=topics.flatMap(topic=>topic[phase].map(x=>x[0])).filter(x=>x!==correct&&!own.includes(x));
  return shuffle([correct,...shuffle([...own,...shuffle(extra).slice(0,Math.max(0,3-own.length))]).slice(0,3)]);
}
function updateStatus(){
  let done=0,total=0;
  topics.forEach((topic,i)=>{total+=topic.es.length+topic.en.length;if(i<t)done+=topic.es.length+topic.en.length;});
  done+=(phase==="en"?topics[t].es.length:0)+q;
  $("#bar").style.width=Math.round(done/total*100)+"%";
  $("#score").textContent="⭐ "+score;
  $("#streak").textContent="Intentos: "+(attempts+1);
}
function render(){
  questionLocked=false;attempts=0;$("#next").hidden=true;
  const data=topics[t][phase],item=data[order[q]];
  correctAnswer=item[0];
  $("#topic").textContent=`Tema ${t+1} de ${topics.length} · ${topics[t].name}`;
  $("#phase").textContent=phase==="es"?"Fase 1 · Español":"Fase 2 · English";
  $("#question").textContent=item[1];
  $("#feedback").className="feedback";$("#feedback").textContent="Elige la mejor opción.";
  const labels=["▲","◆","●","■"],cls=["a","b","c","d"];
  $("#answers").innerHTML="";
  choices(correctAnswer,data).forEach((op,i)=>{
    const b=document.createElement("button");b.type="button";b.className=`answer ${cls[i]}`;
    const symbol=document.createElement("span");symbol.textContent=labels[i];
    const title=document.createElement("span");title.textContent=op;
    b.append(symbol,title);b.addEventListener("click",()=>answer(b,op));$("#answers").appendChild(b);
  });
  updateStatus();
}
function answer(btn,value){
  if(questionLocked)return;
  if(value===correctAnswer){
    questionLocked=true;
    document.querySelectorAll(".answer").forEach(b=>b.disabled=true);
    btn.classList.add("correct");
    const earned=Math.max(100,1000-attempts*200);score+=earned;
    $("#feedback").className="feedback ok";
    $("#feedback").innerHTML=`<strong>¡Muy bien!</strong> Este término corresponde a la definición presentada.<br><strong>+${earned} puntos</strong>`;
    $("#next").hidden=false;
  }else{
    attempts++;totalErrors++;score=Math.max(0,score-100);
    btn.classList.add("wrong");btn.disabled=true;
    const messages=["Relee la definición y piensa en la función de cada término.","Inténtalo otra vez: fíjate en la característica que se describe.","Compara las opciones restantes con la definición."];
    $("#feedback").className="feedback bad";
    $("#feedback").innerHTML=`<strong>Aún no.</strong> ${messages[Math.min(attempts-1,messages.length-1)]}<br>Puedes seleccionar otra opción.`;
    updateStatus();
  }
}
$("#next").addEventListener("click",()=>{
  q++;if(q<order.length){render();return;}
  if(phase==="es"){phase="en";makeOrder();render();return;}
  t++;phase="es";
  if(t<topics.length){makeOrder();render();return;}
  finish();
});
function finish(){
  $("#game").hidden=true;$("#finish").hidden=false;$("#bar").style.width="100%";
  const msg=totalErrors===0?"Relacionaste todos los conceptos sin errores.":`Tuviste ${totalErrors} intento${totalErrors===1?"":"s"} adicional${totalErrors===1?"":"es"}.`;
  $("#finalText").innerHTML=`Puntaje final: <strong>${score}</strong>.<br>${msg}`;
  $("#review").innerHTML="<strong>Repasa lo aprendido:</strong><div>Español → comprensión de los conceptos.</div><div>English → reconocimiento del vocabulario técnico.</div>";
}
$("#restart").addEventListener("click",()=>{
  t=0;phase="es";q=0;score=1000;attempts=0;totalErrors=0;
  $("#finish").hidden=true;$("#game").hidden=false;makeOrder();render();
});
makeOrder();render();
</script>
</body>
</html>
