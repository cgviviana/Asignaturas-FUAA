<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saber Conocer Virtual | 2026-II</title>
  <style>
    @font-face{font-family:Brown;src:local("BrownStd-Regular"),url("https://www.areandina.edu.co/assets/font-brown/BrownStd-Regular.woff2") format("woff2");font-display:swap}
    @font-face{font-family:Brown;src:local("BrownStd-Bold"),url("https://www.areandina.edu.co/assets/font-brown/BrownStd-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
    :root{--green:#7fb536;--green-dark:#668e2c;--ink:#3f3f3f;--muted:#6e6e6e;--line:#d8d8d8;--wash:#f5f5f5}
    *{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font:16px/1.4 Brown,Arial,sans-serif}
    .topbar{height:30px;background:#414141}.topbar div,.header-inner,.page,.footer-inner{width:min(1180px,calc(100% - 48px));margin:auto}.topbar div{height:100%;display:flex;align-items:center;justify-content:flex-end;color:#fff;font-size:12px}
    header{background:#fff;border-bottom:1px solid #dedede}.header-inner{height:82px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand img{display:block;width:180px;height:48px;object-fit:contain;object-position:left}.section-name{margin:0;color:#4a4a4a;font-size:18px;font-weight:700}.section-name span{color:var(--green-dark)}
    .page{padding:30px 0 64px}.panel{overflow:hidden;border:1px solid #e0e0e0;background:#fff}.panel-head{display:flex;align-items:flex-end;justify-content:space-between;gap:25px;padding:29px 32px 24px;border-bottom:1px solid var(--line)}.eyebrow{margin:0 0 6px;color:var(--green-dark);font-size:14px;font-weight:700}.panel h1{margin:0;font-size:30px;line-height:1.1;letter-spacing:-.5px}.period{margin:0;padding:7px 12px;border:1px solid #b9cf94;border-radius:18px;background:#f0f6e5;color:var(--green-dark);font-size:13px;font-weight:700}
    .tabs{display:flex;gap:8px;padding:20px 32px 0}.tab{min-height:43px;padding:9px 18px;border:1px solid #7d7d7d;border-radius:5px;background:#fff;color:#414141;font:700 14px Brown,Arial,sans-serif;cursor:pointer}.tab:hover,.tab.active{border-color:var(--green);background:var(--green);color:#fff}.document{padding:20px 32px 32px}.document-toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}.document-toolbar h2{margin:0;color:#414141;font-size:19px}.open-link{display:inline-flex;align-items:center;justify-content:center;min-height:39px;padding:7px 13px;border:1px solid #515151;border-radius:5px;color:#414141;text-decoration:none;font:700 13px Brown,Arial,sans-serif}.open-link:hover{border-color:var(--green);background:var(--green);color:#fff}.document-frame{width:100%;height:760px;border:1px solid #d1d1d1;background:#fff}
    footer{background:#414141;color:#e8e8e8}.footer-inner{padding:20px 0;font-size:13px}footer strong{color:#fff}
    @media(max-width:700px){.header-inner{height:72px}.brand img{width:145px}.section-name{font-size:15px}.panel-head{align-items:flex-start;flex-direction:column;padding:24px 20px}.tabs,.document{padding-left:20px;padding-right:20px}.document-toolbar{align-items:flex-start;flex-direction:column}.document-frame{height:620px}.topbar div,.header-inner,.page,.footer-inner{width:calc(100% - 30px)}}
  </style>
</head>
<body>
  <div class="topbar"><div>Académica · Informática Educativa</div></div>
  <header><div class="header-inner"><a class="brand" href="#inicio" aria-label="Inicio"><img src="https://cms.areandina.edu.co/sites/default/files/styles/max_650x650_webp/public/2023-03/AREANDINA%20%281%29.png.webp?itok=r5N1M-5x" alt="Areandina"></a><p class="section-name">Saber Conocer / <span>Virtual</span></p></div></header>
  <main class="page" id="inicio">
    <section class="panel">
      <div class="panel-head"><div><p class="eyebrow">Documentos académicos</p><h1>Saber Conocer</h1></div><p class="period">2026-II</p></div>
      <nav class="tabs" aria-label="Documentos de la asignatura">
        <button class="tab active" type="button" data-doc="micro">Microcurrículo</button>
        <button class="tab" type="button" data-doc="planeador">Planeador</button>
      </nav>
      <div class="document">
        <div class="document-toolbar"><h2 id="documentTitle">Microcurrículo</h2><a class="open-link" id="openDocument" href="https://docs.google.com/spreadsheets/d/1oQ9zwIfG4pG3imQrbKuoAfr2BC4vKxs9/edit?usp=drive_link&ouid=109469599526912264889&rtpof=true&sd=true" target="_blank" rel="noopener">Abrir en nueva pestaña</a></div>
        <iframe class="document-frame" id="documentFrame" title="Microcurrículo Saber Conocer Virtual" src="https://docs.google.com/spreadsheets/d/1oQ9zwIfG4pG3imQrbKuoAfr2BC4vKxs9/preview"></iframe>
      </div>
    </section>
  </main>
  <footer><div class="footer-inner"><strong>Areandina</strong> · Saber Conocer · Modalidad virtual</div></footer>
  <script>
    const documents={
      micro:{title:'Microcurrículo',view:'https://docs.google.com/spreadsheets/d/1oQ9zwIfG4pG3imQrbKuoAfr2BC4vKxs9/preview',open:'https://docs.google.com/spreadsheets/d/1oQ9zwIfG4pG3imQrbKuoAfr2BC4vKxs9/edit?usp=drive_link&ouid=109469599526912264889&rtpof=true&sd=true'},
      planeador:{title:'Planeador',view:'https://docs.google.com/spreadsheets/d/13qvtXtnc64zfbk_qdAvslRla13o1hz07/preview',open:'https://docs.google.com/spreadsheets/d/13qvtXtnc64zfbk_qdAvslRla13o1hz07/edit?usp=drive_link&ouid=109469599526912264889&rtpof=true&sd=true'}
    };
    const frame=document.querySelector('#documentFrame'),title=document.querySelector('#documentTitle'),link=document.querySelector('#openDocument');
    document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>{
      const current=documents[button.dataset.doc];
      document.querySelectorAll('.tab').forEach(item=>item.classList.remove('active'));
      button.classList.add('active');
      title.textContent=current.title;
      link.href=current.open;
      frame.title=current.title+' Saber Conocer Virtual';
      frame.src=current.view;
    }));
  </script>
</body>
</html>
