    footer{background:#414141;color:#e8e8e8}.footer-inner{width:min(1180px,calc(100% - 48px));margin:auto;padding:20px 0;font-size:13px}footer strong{color:#fff}
    @media(max-width:800px){.page{grid-template-columns:1fr}.workspace-head{display:block}.search{margin-top:18px;max-width:none}.resource-grid{grid-template-columns:1fr}.workspace h2{font-size:26px}.header-inner{height:72px}.section-name{font-size:15px}.brand img{width:145px}.topbar div,.header-inner,.page,.footer-inner{width:calc(100% - 30px)}}

<body>

  <main class="page" id="inicio">
    <aside class="sidebar"><h1>Asignaturas</h1><nav class="subject-index" id="subjectIndex" aria-label="Asignaturas"></nav></aside>
    <section class="workspace" aria-live="polite"><div class="workspace-head"><div><h2>Planeadores y microcurrículos</h2></div><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.7"></circle><path d="m16 16 4.4 4.4"></path></svg><input id="search" type="search" placeholder="Buscar asignatura" aria-label="Buscar asignatura"></label></div><div id="content"></div></section>

    {p:'Pto Computacional 2026 (p)',pUrl:'https://docs.google.com/spreadsheets/d/1PcmX9L2x7nD9VVET8UVntdn1wWlmluW8/edit?usp=drive_link&ouid=109469599526912264889&rtpof=true&sd=true',v:'Pto Computacional 2026 (v)',vUrl:'https://docs.google.com/spreadsheets/d/1ZooVYxbWiCXx0iG_FoUkxDM-L4GyVlb2/edit?usp=drive_link&ouid=109469599526912264889&rtpof=true&sd=true'},

  ]},

  {name:'Didáctica y Uso de las TIC',records:[{p:'Didáctica y Uso de las TIC (p)',pUrl:'https://docs.google.com/spreadsheets/d/1cRALPlfFdA9-YnBMpPNtDjR2S9FzuI2E/edit?usp=drive_link&ouid=109469599526912264889&rtpof=true&sd=true',mp:'https://docs.google.com/spreadsheets/d/1q5dRnHU-mBSqDQJXRqTd0A2qGSkHkITz/edit?usp=sharing&ouid=109469599526912264889&rtpof=true&sd=true'}]},
  {name:'Creatividad, Desarrollo e Innovación I',records:[{p:'Creatividad, Desarrollo e Innovación I (p)',pUrl:'https://docs.google.com/spreadsheets/d/1xDkVlxfj3jiSJlBo9hpuOGRSTJTS8GxP/edit?usp=sharing&ouid=109469599526912264889&rtpof=true&sd=true',mp:'https://docs.google.com/spreadsheets/d/1v4BGK_taqlH9hyELpcM2llAsUr9EhUWE/edit?usp=sharing&ouid=109469599526912264889&rtpof=true&sd=true',v:'Creatividad, Diseño e Innovación I (v)',vUrl:'https://docs.google.com/spreadsheets/d/18rU8WpAKojrnOIEGgYB3XYj2wi-SxOjs/edit?usp=drive_link&ouid=109469599526912264889&rtpof=true&sd=true',mv:'https://docs.google.com/spreadsheets/d/1CJOZZBagGpUEprs0aX_QTjpM6hb2Rlel/edit?usp=sharing&ouid=109469599526912264889&rtpof=true&sd=true'}]},
  {name:'Creatividad, Desarrollo e Innovación II',records:[{p:'Creatividad, Desarrollo e Innovación II (p)',pUrl:'https://docs.google.com/spreadsheets/d/1iNaFL7_BDyQ5O60XOfRfg9qImrmgaHjb/edit?usp=drive_link&ouid=109469599526912264889&rtpof=true&sd=true',mp:'https://docs.google.com/spreadsheets/d/1lxE09Tof9H-yEXE7VC6OjZK9eWboRJb9/edit?usp=sharing&ouid=109469599526912264889&rtpof=true&sd=true',v:'Creatividad, Diseño e Innovación II (v)',vUrl:'https://docs.google.com/spreadsheets/d/1mFqVJ2NixZWlx_vcVGAQ3508tew3Uh2C/edit?usp=drive_link&ouid=109469599526912264889&rtpof=true&sd=true',mv:'https://docs.google.com/spreadsheets/d/1puyMpMpRQ8vdETtq6hF6rzRsumVLLo6O/edit?usp=sharing&ouid=109469599526912264889&rtpof=true&sd=true'}]},
  {name:'Gestión I e Informática',childrenFrom:0,records:[
    {p:'Gestión de la Información (p)',pUrl:'https://docs.google.com/spreadsheets/d/1g2n_ALssU-NDUuS2M35ZfSzNIS_N0WJZ/edit?usp=drive_link&ouid=109469599526912264889&rtpof=true&sd=true',mp:'https://docs.google.com/spreadsheets/d/1Sf_B8Qaf7_V3KhKiqoNNVcvHRx4tHgme/edit?usp=sharing&ouid=109469599526912264889&rtpof=true&sd=true',v:'Gestión de la Información (v)',vUrl:'https://docs.google.com/spreadsheets/d/1dgD-zAv4mLdl2fpJd2BEyX7YJXrshydJ/edit?usp=drive_link&ouid=109469599526912264889&rtpof=true&sd=true',mv:'https://docs.google.com/spreadsheets/d/1NyCraf6Llvcpha-oRfP5RWx-kCrp1oi0/edit?usp=drive_link&ouid=109469599526912264889&rtpof=true&sd=true'},
    {p:'Gestión de la Información I (p)',pUrl:'https://docs.google.com/spreadsheets/d/1wfrzKWWR5BVfR_7aeA6dFhqlaMFVgBqS/edit?usp=drive_link&ouid=109469599526912264889&rtpof=true&sd=true',mp:'https://docs.google.com/spreadsheets/d/1Op2XhoH7uGvQKMliT4lLLPHvz5xj7RLz/edit?usp=sharing&ouid=109469599526912264889&rtpof=true&sd=true',v:'Gestión de la Información I (v)',vUrl:'https://docs.google.com/spreadsheets/d/1lNGHLq5yfJMrEug902TnGSs8dlRdVqtc/edit?usp=drive_link&ouid=109469599526912264889&rtpof=true&sd=true',mv:'https://docs.google.com/spreadsheets/d/1I4nk2jMHMwOXwxGSuYnsBUoX9heBovj0/edit?usp=sharing&ouid=109469599526912264889&rtpof=true&sd=true'},
    {p:'Informática Básica (p)',pUrl:'https://docs.google.com/spreadsheets/d/1xnCJj2y-tNzLSuzWk1so8n83UnErPGho/edit?usp=drive_link&ouid=109469599526912264889&rtpof=true&sd=true',mp:'https://docs.google.com/spreadsheets/d/1iY1fLd0FroZHsdKhN1oB2wmaF47fLEYm/edit?usp=drive_link&ouid=109469599526912264889&rtpof=true&sd=true'},
    {p:'Informática General (p)',pUrl:'https://docs.google.com/spreadsheets/d/1SgbyG_uYd0IT2DqUfizu5B_nYrNXlGbk/edit?usp=drive_link&ouid=109469599526912264889&rtpof=true&sd=true',mp:'https://docs.google.com/spreadsheets/d/1tguMb-7EdT7FKCpDucPJdydLSsa3bJnN/edit?usp=sharing&ouid=109469599526912264889&rtpof=true&sd=true'},
    {p:'Informática para Entrenamiento Deportivo (p)',pUrl:'https://docs.google.com/spreadsheets/d/1kA50Gp0YD-lujU8anKWvM_pmQJAjjnAo/edit?usp=drive_link&ouid=109469599526912264889&rtpof=true&sd=true',mp:'https://docs.google.com/spreadsheets/d/1udTY_rr5lUSYInHRQ6of6VE4qFUR77oW/edit?usp=sharing&ouid=109469599526912264889&rtpof=true&sd=true'}
  ]},
  {name:'Gestión II y Conocimiento',childrenFrom:0,records:[
    {p:'Gestión de la Información II (p)',pUrl:'https://docs.google.com/spreadsheets/d/1-YGtB8EGBBoLtlfJMomyPGCdXQlK9ZKV/edit?usp=drive_link&ouid=109469599526912264889&rtpof=true&sd=true',mp:'https://docs.google.com/spreadsheets/d/12as4q46rdYZo1jHULPPMia_3j479E5-O/edit?usp=sharing&ouid=109469599526912264889&rtpof=true&sd=true',v:'Gestión de la Información II (v)',vUrl:'https://docs.google.com/spreadsheets/d/1OUgwmut5AguV84U6ZGGbF7vbQhKwhbMV/edit?usp=drive_link&ouid=109469599526912264889&rtpof=true&sd=true',mv:'https://docs.google.com/spreadsheets/d/1YF3EkNXNXipkDTXTxBjNsd1xX-0_cYJ4/edit?usp=sharing&ouid=109469599526912264889&rtpof=true&sd=true'},
    {p:'Gestión del Conocimiento (p)',pUrl:'https://docs.google.com/spreadsheets/d/1A88lA9QQEC-CdZC-rEuvF6A4R7o9dsA7/edit?usp=drive_link&ouid=109469599526912264889&rtpof=true&sd=true',mp:'https://docs.google.com/spreadsheets/d/1Mk1bB1gJdDMd1B8xrRAK0QSEV_YS7Yl5/edit?usp=sharing&ouid=109469599526912264889&rtpof=true&sd=true',v:'Gestión del Conocimiento (v)',vUrl:'https://docs.google.com/spreadsheets/d/1dc5DWzqJCfjUjhjodP9ahgSgULl9NIK_/edit?usp=drive_link&ouid=109469599526912264889&rtpof=true&sd=true',mv:'https://docs.google.com/spreadsheets/d/1ecaWGY5CXu6Oeyw7pcGFFfO3XPrEiJjn/edit?usp=sharing&ouid=109469599526912264889&rtpof=true&sd=true'}
  ]},
  {name:'De la Gestión de la Información al Conocimiento',records:[{v:'De la Gestión de la Información al Conocimiento (v)',vUrl:'https://docs.google.com/spreadsheets/d/1jTVUhQwCmUPef2kr2GQ3KlSFnNu5fGwt/edit?usp=drive_link&ouid=109469599526912264889&rtpof=true&sd=true',mv:'https://docs.google.com/spreadsheets/d/1asqa0nq8Lmy1VBpHKZFtpXZqgXu8PwWP/edit?usp=sharing&ouid=109469599526912264889&rtpof=true&sd=true'}]}
  ];

  const subjectIndex=document.querySelector('#subjectIndex');
  const content=document.querySelector('#content');
  const search=document.querySelector('#search');
  let activeBlock=0,activeSubject=0,openBlock=-1;

  const cleanName=r=>(r.p||r.v||'').replace(/ \([pv]\)$/i,'');
  const access=(label,url)=>url?`<a class="access" href="${url}" target="_blank" rel="noopener">${label}</a>`:`<span class="access missing">${label}</span>`;

  function card(kind,r){
    const present=kind==='presencial';
    const has=present?(r.mp||r.pUrl):(r.mv||r.vUrl);
    if(!has)return '';
    return `<article class="mode-card ${kind}"><div class="mode-image"><p class="mode-label">${present?'Presencial':'Virtual'}</p></div><div class="card-content"><div class="accesses">${access('Microcurrículo',present?r.mp:r.mv)}${access('Planeador',present?r.pUrl:r.vUrl)}</div></div></article>`;
  }

  function renderIndex(){
    subjectIndex.innerHTML=blocks.map((block,bi)=>{
      const hasChildren=Number.isInteger(block.childrenFrom);
      const childItems=hasChildren?block.records.slice(block.childrenFrom).map((record,offset)=>{
        const ri=block.childrenFrom+offset;
        return `<button class="subject-btn ${bi===activeBlock&&ri===activeSubject?'active':''}" type="button" data-subject="${bi}|${ri}">${cleanName(record)}</button>`;
      }).join(''):'';
      return hasChildren?`<section class="subject-group ${bi===openBlock?'open':''}">
        <button class="group-btn ${bi===activeBlock&&activeSubject===0?'active':''}" type="button" data-group="${bi}">
          <span>${block.name}</span><span class="group-chevron">⌄</span>
        </button><div class="group-subjects">${childItems}</div></section>`:
        `<button class="subject-btn ${bi===activeBlock?'active':''}" type="button" data-subject="${bi}|0">${block.name}</button>`;
    }).join('');

    document.querySelectorAll('[data-group]').forEach(button=>{
      button.onclick=()=>{
        const bi=+button.dataset.group;
        activeBlock=bi;activeSubject=0;openBlock=openBlock===bi?-1:bi;
        render();
      };
    });
    document.querySelectorAll('[data-subject]').forEach(button=>{
      button.onclick=()=>{
        [activeBlock,activeSubject]=button.dataset.subject.split('|').map(Number);
        openBlock=activeBlock;
        render();
      };
    });
  }

  function renderContent(){
    const record=blocks[activeBlock].records[activeSubject];
    const cards=[card('presencial',record),card('virtual',record)].filter(Boolean).join('');
    content.innerHTML=`<div class="selected-subject"><h3>${cleanName(record)}</h3><p>2026-II</p></div><div class="resource-grid">${cards}</div>`;
  }

  function render(){renderIndex();renderContent()}

  search.addEventListener('input',()=>{
    const term=search.value.trim().toLocaleLowerCase('es');
    if(!term){render();return}
    const match=[];
    blocks.forEach((block,bi)=>block.records.forEach((record,ri)=>{
      if(cleanName(record).toLocaleLowerCase('es').includes(term))match.push([bi,ri]);
    }));
    if(match.length){
      [activeBlock,activeSubject]=match[0];
      openBlock=activeBlock;
      render();
    }else{
      subjectIndex.innerHTML='';
      content.innerHTML='<div class="no-results">No se encontraron asignaturas con ese nombre.</div>';
    }
  });

  render();
  </script>
</body>
</html>
