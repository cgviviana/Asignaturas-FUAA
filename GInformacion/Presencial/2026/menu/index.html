
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gestión de la Información e Informática (ED)</title>

  <style>
    @font-face{
      font-family:Brown;
      src:local("BrownStd-Regular"),url("https://www.areandina.edu.co/assets/font-brown/BrownStd-Regular.woff2") format("woff2");
      font-display:swap;
    }
    @font-face{
      font-family:Brown;
      src:local("BrownStd-Bold"),url("https://www.areandina.edu.co/assets/font-brown/BrownStd-Bold.woff2") format("woff2");
      font-weight:700;
      font-display:swap;
    }

    :root{
      --verde:#7fb536;
      --verde-o:#668e2c;
      --verde-s:#f0f6e5;
      --gris-o:#414141;
      --gris-c:#e1e1e1;
      --fondo:#f5f5f5;
      --sombra:0 8px 22px rgba(0,0,0,.08);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      font-family:Brown,Arial,sans-serif;
      color:var(--gris-o);
      background:var(--fondo);
    }
    button{font:inherit}
    .limit{width:min(1180px,calc(100% - 48px));margin:auto}
    .topbar{height:30px;background:var(--gris-o)}
    .topbar .limit{
      height:100%;display:flex;justify-content:flex-end;align-items:center;
      color:#fff;font-size:12px;
    }
    .site-header{background:#fff;border-bottom:1px solid #dedede}
    .header-inner{
      min-height:82px;display:flex;align-items:center;
      justify-content:space-between;gap:20px;padding:10px 0;
    }
    .brand img{
      display:block;width:180px;height:48px;
      object-fit:contain;object-position:left;
    }
    .section-name{margin:0;font-size:18px;font-weight:700;text-align:right}
    .section-name span{color:var(--verde-o)}
    .wrap{padding:30px 0 64px}
    .main-header{
      background:#fff;border:1px solid var(--gris-c);
      border-bottom:4px solid var(--verde);padding:22px 26px;
      margin-bottom:18px;box-shadow:var(--sombra);
    }
    .eyebrow{
      margin:0 0 5px;color:var(--verde-o);font-size:13px;
      font-weight:700;text-transform:uppercase;letter-spacing:.5px;
    }
    .main-header h1{margin:0;font-size:30px;line-height:1.1}
    .intro{max-width:850px;margin:12px 0 0;color:#5d5d5d;line-height:1.55;font-size:15px}
    .frame{display:grid;grid-template-columns:285px minmax(0,1fr);gap:18px;align-items:start}
    .tabs,.content{background:#fff;border:1px solid var(--gris-c);box-shadow:var(--sombra)}
    .tabs{padding-bottom:14px;position:sticky;top:16px}
    .tabs-title{background:var(--gris-o);color:#fff;padding:15px 18px;font-weight:700}
    .tab-btn{
      width:100%;border:0;border-bottom:1px solid #e6e6e6;
      border-left:5px solid transparent;background:#fff;color:#505050;
      padding:15px 17px;text-align:left;cursor:pointer;
      font-size:14px;font-weight:700;line-height:1.35;
    }
    .tab-btn:hover{background:#f7f7f7;color:var(--verde-o);border-left-color:#b9d58f}
    .tab-btn.active{background:var(--verde);color:#fff;border-left-color:var(--verde-o)}
    .content{min-height:640px;overflow:hidden}
    .section{border-bottom:12px solid var(--fondo);scroll-margin-top:16px}
    .section:last-of-type{border-bottom:0}
    .section-head{
      width:100%;border:0;background:var(--gris-o);color:#fff;
      padding:18px 22px;border-bottom:4px solid var(--verde);
      display:flex;align-items:center;justify-content:space-between;
      gap:18px;cursor:pointer;text-align:left;
    }
    .section-head:hover{background:#363636}
    .section-head small{
      color:#cfe7ad;font-size:13px;font-weight:700;
      display:block;margin-bottom:3px;text-transform:uppercase;
    }
    .section-head strong{display:block;font-size:23px;line-height:1.18}
    .round-plus{
      flex:0 0 36px;width:36px;height:36px;display:grid;place-items:center;
      border-radius:50%;background:#fff;color:var(--verde-o);
      font-size:23px;font-weight:700;transition:.2s;
    }
    .round-plus.small{
      width:30px;height:30px;flex-basis:30px;
      font-size:18px;border:1px solid #cfcfcf;
    }
    .section.open>.section-head .round-plus,
    .acc-item.open .round-plus{transform:rotate(45deg)}
    .section-body{display:none;padding:22px}
    .section.open>.section-body{display:block}
    .lead{
      border-left:5px solid var(--verde);background:var(--verde-s);
      padding:14px 16px;margin-bottom:18px;line-height:1.55;
    }
    .accordion{display:grid;gap:12px}
    .acc-item{border:1px solid #dcdcdc;overflow:hidden}
    .acc-btn{
      width:100%;border:0;background:#f4f4f4;color:var(--gris-o);
      padding:14px 16px;text-align:left;display:flex;
      justify-content:space-between;align-items:center;gap:14px;
      cursor:pointer;font-size:15px;font-weight:700;line-height:1.35;
      border-left:5px solid var(--verde);
    }
    .acc-btn:hover{background:#ebebeb;color:var(--verde-o)}
    .acc-item.open .acc-btn{background:var(--verde);color:#fff}
    .topic-code{display:inline-block;margin-right:8px;color:var(--verde-o)}
    .acc-item.open .topic-code{color:#fff}
    .acc-content{display:none;padding:17px 20px 19px 24px;line-height:1.58;color:#555}
    .acc-item.open .acc-content{display:block}
    .acc-content p{margin:0}
    .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
    .tag{
      padding:6px 10px;border:1px solid #c9dca8;
      background:#f7faef;color:var(--verde-o);
      font-size:13px;font-weight:700;
    }
    .tag-button{font-family:inherit;cursor:pointer}
    .tag-button:hover{background:var(--verde);border-color:var(--verde);color:#fff}
    .resource{margin-top:16px}
    .resource-btn{
      display:inline-flex;align-items:center;justify-content:center;
      min-height:40px;padding:8px 15px;border:1px solid var(--verde);
      border-radius:4px;background:var(--verde);color:#fff;
      font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;
    }
    .resource-btn:hover{background:var(--verde-o);border-color:var(--verde-o)}
    .resource-btn.pending{border-color:#d0d0d0;background:#efefef;color:#777}
    footer{
      margin-top:18px;background:var(--gris-o);color:#fff;
      padding:15px 20px;text-align:center;font-size:13px;
    }
    footer strong{color:#cfe7ad}
    .modal-backdrop{
      position:fixed;inset:0;z-index:50;display:none;place-items:center;
      padding:22px;background:rgba(28,28,28,.62);
    }
    .modal-backdrop.visible{display:grid}
    .modal-card{
      position:relative;width:min(520px,100%);border-top:5px solid var(--verde);
      background:#fff;padding:28px 30px 30px;box-shadow:0 24px 70px rgba(0,0,0,.3);
    }
    .modal-card h2{margin:2px 42px 10px 0;color:var(--gris-o);font-size:25px}
    .modal-card p:last-child{margin:0;color:#555;line-height:1.65}
    .modal-kicker{
      margin:0;color:var(--verde-o);font-size:12px;font-weight:700;
      text-transform:uppercase;letter-spacing:.6px;
    }
    .modal-close{
      position:absolute;top:15px;right:16px;width:34px;height:34px;
      border:0;border-radius:50%;background:var(--gris-o);color:#fff;
      font-size:23px;line-height:1;cursor:pointer;
    }
    .modal-close:hover{background:var(--verde-o)}
    button:focus-visible,a:focus-visible{outline:3px solid #242424;outline-offset:3px}

    @media(max-width:900px){
      .frame{grid-template-columns:1fr}
      .tabs{position:static}
      .main-header h1{font-size:26px}
    }
    @media(max-width:700px){
      .limit{width:calc(100% - 30px)}
      .brand img{width:145px}
      .section-name{font-size:15px}
      .main-header{padding:18px}
      .section-head strong{font-size:20px}
      .section-body{padding:15px}
    }
    @media(max-width:480px){
      .section-name{display:none}
      .main-header h1{font-size:24px}
      .section-head strong{font-size:18px}
    }
  </style>
</head>

    const menu = document.getElementById('menu');
    const contenido = document.getElementById('contenido');

    cortes.forEach((corte,index) => {
      const id = `corte-${index + 1}`;
      menu.insertAdjacentHTML('beforeend',
        `<button class="tab-btn" data-id="${id}" type="button">${corte.numero}</button>`
      );

      const temas = corte.temas.map(tema => {
        const etiquetas = tema.etiquetas.map(etiqueta => {
          if(tema.ventanas){
            return `<button class="tag tag-button type-button" type="button" data-type="${etiqueta}">${etiqueta}</button>`;
          }
          return `<span class="tag">${etiqueta}</span>`;
        }).join('');

        const botonActividad = tema.actividad
          ? `<button class="resource-btn activity-download" type="button">Actividad ↗</button>`
          : `<button class="resource-btn pending pending-activity" type="button">Actividad</button>`;

        return `
          <article class="acc-item">
            <button class="acc-btn" type="button" aria-expanded="false">
              <span><span class="topic-code">${tema.codigo}</span>${tema.titulo}</span>
              <span class="round-plus small" aria-hidden="true">+</span>
            </button>
            <div class="acc-content">
              <p>${tema.descripcion}</p>
              <div class="tags">${etiquetas}</div>
              <div class="resource">${botonActividad}</div>
            </div>
          </article>`;
      }).join('');

      contenido.insertAdjacentHTML('beforeend', `
        <section class="section" id="${id}">
          <button class="section-head" type="button" aria-expanded="false">
            <span><small>${corte.numero}</small><strong>${corte.titulo}</strong></span>
            <span class="round-plus" aria-hidden="true">+</span>
          </button>
          <div class="section-body">
            <div class="lead">${corte.resumen}</div>
            <div class="accordion">${temas}</div>
          </div>
        </section>`
      );
    });

    contenido.insertAdjacentHTML('beforeend',
      '<footer>Aprendiendo con <strong>@LaProfeVivy</strong></footer>'
    );

    function toggleSection(section){
      const open = section.classList.contains('open');
      document.querySelectorAll('.section').forEach(item => {
        item.classList.remove('open');
        item.querySelector('.section-head').setAttribute('aria-expanded','false');
      });
      document.querySelectorAll('.tab-btn').forEach(button => button.classList.remove('active'));

      if(!open){
        section.classList.add('open');
        section.querySelector('.section-head').setAttribute('aria-expanded','true');
        document.querySelector(`.tab-btn[data-id="${section.id}"]`).classList.add('active');
      }
    }

    document.querySelectorAll('.tab-btn').forEach(button => {
      button.addEventListener('click',() => {
        const section = document.getElementById(button.dataset.id);
        toggleSection(section);
        section.scrollIntoView({behavior:'smooth',block:'start'});
      });
    });

    document.querySelectorAll('.section-head').forEach(button => {
      button.addEventListener('click',() => toggleSection(button.closest('.section')));
    });

    document.querySelectorAll('.acc-btn').forEach(button => {
      button.addEventListener('click',() => {
        const item = button.closest('.acc-item');
        const open = item.classList.toggle('open');
        button.setAttribute('aria-expanded',String(open));
      });
    });

    document.querySelectorAll('.pending-activity').forEach(button => {
      button.addEventListener('click',() => alert('Este tema aún no tiene actividad'));
    });

    document.querySelectorAll('.activity-download').forEach(button => {
      button.addEventListener('click',descargarActividad);
    });

    function descargarActividad(){
      const binary = atob(actividadDocxBase64);
      const bytes = new Uint8Array(binary.length);
      for(let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

      const blob = new Blob([bytes],{
        type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
      });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'IED-S2-TGrupo-Lluvia-de-ideas.docx';
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url),1000);
    }

    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const modalText = document.getElementById('modal-text');

    function abrirModal(tipo){
      modalTitle.textContent = tipo;
      modalText.textContent = explicaciones[tipo];
      modal.classList.add('visible');
      document.getElementById('modal-close').focus();
    }

    function cerrarModal(){
      modal.classList.remove('visible');
    }

    document.querySelectorAll('.type-button').forEach(button => {
      button.addEventListener('click',() => abrirModal(button.dataset.type));
    });

    document.getElementById('modal-close').addEventListener('click',cerrarModal);
    modal.addEventListener('click',event => {
      if(event.target === modal) cerrarModal();
    });
    document.addEventListener('keydown',event => {
      if(event.key === 'Escape') cerrarModal();
    });
  </script>
</body>
