

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gestión de la Información e Informática (ED)</title>

  <style>
    @font-face{
      font-family:Brown;
      src:local("BrownStd-Regular"),url("https://www.areandina.edu.co/assets/font-brown/BrownStd-Regular.woff2") format("woff2");
      font-display:swap;
    }
    @font-face{
      font-family:Brown;
      src:local("BrownStd-Bold"),url("https://www.areandina.edu.co/assets/font-brown/BrownStd-Bold.woff2") format("woff2");
      font-weight:700;
      font-display:swap;
    }

    :root{
      --verde:#7fb536;
      --verde-o:#668e2c;
      --verde-s:#f0f6e5;
      --gris-o:#414141;
      --gris-c:#e1e1e1;
      --fondo:#f5f5f5;
      --sombra:0 8px 22px rgba(0,0,0,.08);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      font-family:Brown,Arial,sans-serif;
      color:var(--gris-o);
      background:var(--fondo);
    }
    button{font:inherit}
    .limit{width:min(1180px,calc(100% - 48px));margin:auto}
    .topbar{height:30px;background:var(--gris-o)}
    .topbar .limit{
      height:100%;display:flex;justify-content:flex-end;align-items:center;
      color:#fff;font-size:12px;
    }
    .site-header{background:#fff;border-bottom:1px solid #dedede}
    .header-inner{
      min-height:82px;display:flex;align-items:center;
      justify-content:space-between;gap:20px;padding:10px 0;
    }
    .brand img{
      display:block;width:180px;height:48px;
      object-fit:contain;object-position:left;
    }
    .section-name{margin:0;font-size:18px;font-weight:700;text-align:right}
    .section-name span{color:var(--verde-o)}
    .wrap{padding:30px 0 64px}
    .main-header{
      background:#fff;border:1px solid var(--gris-c);
      border-bottom:4px solid var(--verde);padding:22px 26px;
      margin-bottom:18px;box-shadow:var(--sombra);
    }
    .eyebrow{
      margin:0 0 5px;color:var(--verde-o);font-size:13px;
      font-weight:700;text-transform:uppercase;letter-spacing:.5px;
    }
    .main-header h1{margin:0;font-size:30px;line-height:1.1}
    .intro{max-width:850px;margin:12px 0 0;color:#5d5d5d;line-height:1.55;font-size:15px}
    .frame{display:grid;grid-template-columns:285px minmax(0,1fr);gap:18px;align-items:start}
    .tabs,.content{background:#fff;border:1px solid var(--gris-c);box-shadow:var(--sombra)}
    .tabs{padding-bottom:14px;position:sticky;top:16px}
    .tabs-title{background:var(--gris-o);color:#fff;padding:15px 18px;font-weight:700}
    .tab-btn{
      width:100%;border:0;border-bottom:1px solid #e6e6e6;
      border-left:5px solid transparent;background:#fff;color:#505050;
      padding:15px 17px;text-align:left;cursor:pointer;
      font-size:14px;font-weight:700;line-height:1.35;
    }
    .tab-btn:hover{background:#f7f7f7;color:var(--verde-o);border-left-color:#b9d58f}
    .tab-btn.active{background:var(--verde);color:#fff;border-left-color:var(--verde-o)}
    .content{min-height:640px;overflow:hidden}
    .section{border-bottom:12px solid var(--fondo);scroll-margin-top:16px}
    .section:last-of-type{border-bottom:0}
    .section-head{
      width:100%;border:0;background:var(--gris-o);color:#fff;
      padding:18px 22px;border-bottom:4px solid var(--verde);
      display:flex;align-items:center;justify-content:space-between;
      gap:18px;cursor:pointer;text-align:left;
    }
    .section-head:hover{background:#363636}
    .section-head small{
      color:#cfe7ad;font-size:13px;font-weight:700;
      display:block;margin-bottom:3px;text-transform:uppercase;
    }
    .section-head strong{display:block;font-size:23px;line-height:1.18}
    .round-plus{
      flex:0 0 36px;width:36px;height:36px;display:grid;place-items:center;
      border-radius:50%;background:#fff;color:var(--verde-o);
      font-size:23px;font-weight:700;transition:.2s;
    }
    .round-plus.small{
      width:30px;height:30px;flex-basis:30px;
      font-size:18px;border:1px solid #cfcfcf;
    }
    .section.open>.section-head .round-plus,
    .acc-item.open .round-plus{transform:rotate(45deg)}
    .section-body{display:none;padding:22px}
    .section.open>.section-body{display:block}
    .lead{
      border-left:5px solid var(--verde);background:var(--verde-s);
      padding:14px 16px;margin-bottom:18px;line-height:1.55;
    }
    .accordion{display:grid;gap:12px}
    .acc-item{border:1px solid #dcdcdc;overflow:hidden}
    .acc-btn{
      width:100%;border:0;background:#f4f4f4;color:var(--gris-o);
      padding:14px 16px;text-align:left;display:flex;
      justify-content:space-between;align-items:center;gap:14px;
      cursor:pointer;font-size:15px;font-weight:700;line-height:1.35;
      border-left:5px solid var(--verde);
    }
    .acc-btn:hover{background:#ebebeb;color:var(--verde-o)}
    .acc-item.open .acc-btn{background:var(--verde);color:#fff}
    .topic-code{display:inline-block;margin-right:8px;color:var(--verde-o)}
    .acc-item.open .topic-code{color:#fff}
    .acc-content{display:none;padding:17px 20px 19px 24px;line-height:1.58;color:#555}
    .acc-item.open .acc-content{display:block}
    .acc-content p{margin:0}
    .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
    .tag{
      padding:6px 10px;border:1px solid #c9dca8;
      background:#f7faef;color:var(--verde-o);
      font-size:13px;font-weight:700;
    }
    .tag-button{font-family:inherit;cursor:pointer}
    .tag-button:hover{background:var(--verde);border-color:var(--verde);color:#fff}
    .resource{margin-top:16px}
    .resource-btn{
      display:inline-flex;align-items:center;justify-content:center;
      min-height:40px;padding:8px 15px;border:1px solid var(--verde);
      border-radius:4px;background:var(--verde);color:#fff;
      font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;
    }
    .resource-btn:hover{background:var(--verde-o);border-color:var(--verde-o)}
    .resource-btn.pending{border-color:#d0d0d0;background:#efefef;color:#777}
    footer{
      margin-top:18px;background:var(--gris-o);color:#fff;
      padding:15px 20px;text-align:center;font-size:13px;
    }
    footer strong{color:#cfe7ad}
    .modal-backdrop{
      position:fixed;inset:0;z-index:50;display:none;place-items:center;
      padding:22px;background:rgba(28,28,28,.62);
    }
    .modal-backdrop.visible{display:grid}
    .modal-card{
      position:relative;width:min(520px,100%);border-top:5px solid var(--verde);
      background:#fff;padding:28px 30px 30px;box-shadow:0 24px 70px rgba(0,0,0,.3);
    }
    .modal-card h2{margin:2px 42px 10px 0;color:var(--gris-o);font-size:25px}
    .modal-card p:last-child{margin:0;color:#555;line-height:1.65}
    .modal-kicker{
      margin:0;color:var(--verde-o);font-size:12px;font-weight:700;
      text-transform:uppercase;letter-spacing:.6px;
    }
    .modal-close{
      position:absolute;top:15px;right:16px;width:34px;height:34px;
      border:0;border-radius:50%;background:var(--gris-o);color:#fff;
      font-size:23px;line-height:1;cursor:pointer;
    }
    .modal-close:hover{background:var(--verde-o)}
    button:focus-visible,a:focus-visible{outline:3px solid #242424;outline-offset:3px}

    @media(max-width:900px){
      .frame{grid-template-columns:1fr}
      .tabs{position:static}
      .main-header h1{font-size:26px}
    }
    @media(max-width:700px){
      .limit{width:calc(100% - 30px)}
      .brand img{width:145px}
      .section-name{font-size:15px}
      .main-header{padding:18px}
      .section-head strong{font-size:20px}
      .section-body{padding:15px}
    }
    @media(max-width:480px){
      .section-name{display:none}
      .main-header h1{font-size:24px}
      .section-head strong{font-size:18px}
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="limit">Gestión de la Información e Informática · ED</div>
  </div>

  <header class="site-header">
    <div class="limit header-inner">
      <a class="brand" href="#inicio" aria-label="Ir al inicio">
        <img
          src="https://cms.areandina.edu.co/sites/default/files/styles/max_650x650_webp/public/2023-03/AREANDINA%20%281%29.png.webp?itok=r5N1M-5x"
          alt="Areandina">
      </a>
      <p class="section-name">Gestión de la Información e Informática / <span>ED</span></p>
    </div>
  </header>

  <div class="limit wrap" id="inicio">
    <header class="main-header">
      <p class="eyebrow">Contenido de aprendizaje</p>
      <h1>Gestión de la Información e Informática</h1>
      <p class="intro">
        Explora los cortes del curso y abre cada tema para consultar su propósito y los contenidos asociados.
      </p>
    </header>

    <div class="frame">
      <aside class="tabs" aria-label="Cortes del curso">
        <div class="tabs-title">Cortes</div>
        <div id="menu"></div>
      </aside>

      <main class="content" id="contenido"></main>
    </div>
  </div>

  <div class="modal-backdrop" id="modal" role="presentation">
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" id="modal-close" type="button" aria-label="Cerrar">×</button>
      <p class="modal-kicker">Información del tema</p>
      <h2 id="modal-title"></h2>
      <p id="modal-text"></p>
    </section>
  </div>


  <script>
    const cortes = [
      {
        numero: 'Corte 1',
        titulo: 'Búsqueda y curación de la información',
        resumen: 'Comprensión del entorno informacional y desarrollo de criterios para localizar, comparar y seleccionar información pertinente y confiable.',
        temas: [
          {
            codigo: '1.1',
            titulo: 'Sociedad de la información vs. sociedad del conocimiento',
            descripcion: 'Diferencia entre disponer de grandes cantidades de información y transformarla en conocimiento mediante su análisis, interpretación y uso responsable.',
            botonInicial: {
              texto: 'Sociedades',
              url: 'https://cgviviana.github.io/AndinaCode-X/MISIONES/MISION%201/MOT1/Index.html'
            },
            etiquetas: ['Información','Conocimiento','Análisis crítico'],
            actividadUrl: 'https://docs.google.com/document/d/1pZd_Fxug_zlIsQcdelenN-UfpgT7mTVu/edit?usp=drivesdk&ouid=109469599526912264889&rtpof=true&sd=true'
          },
          {
            codigo: '1.2',
            titulo: 'Revolución de las TIC y su impacto en la gestión de la información',
            descripcion: 'Reconocimiento de los cambios producidos por las tecnologías digitales en la creación, acceso, almacenamiento y circulación de la información.',
            etiquetas: ['TIC','Transformación digital','Acceso'],
            enlacesEtiqueta: {
              'TIC': 'https://cgviviana.github.io/Asignaturas-FUAA/GInformacion/Presencial/2026/sesiones/RevolTIC/'
            },
            sinActividad: true
          },
          {
            codigo: '1.3',
            titulo: 'Tipos de información: académica, científica, institucional e informal',
            descripcion: 'Identificación de las características, finalidades y contextos de uso de distintos tipos de información.',
            etiquetas: ['Tipos','Académica','Científica','Institucional','Informal'],
            enlacesEtiqueta: {
              'Tipos': 'https://cgviviana.github.io/Asignaturas-FUAA/Saber%20Hacer/Fuentes/index.html'
            },
            sinActividad: true
          },
          {
            codigo: '1.4',
            titulo: 'Fuentes confiables vs. no confiables',
            descripcion: 'Aplicación de criterios básicos de autoridad, actualidad, evidencia, propósito y transparencia para valorar una fuente.',
            botonInicial: {
              texto: 'Concepto',
              url: 'https://cgviviana.github.io/Asignaturas-FUAA/GInformacion/Presencial/2026/sesiones/FtesConf/index.html'
            },
            etiquetas: ['Autoridad','Actualidad','Evidencia','Propósito'],
            actividadUrl: 'https://docs.google.com/document/d/1TF-1gooVZuxwlz1KKxURyawS_GQD2a7c/edit?usp=drivesdk&ouid=109469599526912264889&rtpof=true&sd=true'
          },
          {
            codigo: '1.5',
            titulo: 'Canales y plataformas para búsqueda especializada',
            descripcion: 'Exploración de buscadores, repositorios, bibliotecas digitales y portales especializados según la necesidad de información.',
            etiquetas: ['Buscadores','Repositorios','Bibliotecas digitales']
          },
          {
            codigo: '1.6',
            titulo: 'Estrategias de búsqueda efectiva de información',
            descripcion: 'Construcción de búsquedas mediante palabras clave, sinónimos, filtros y operadores para obtener resultados más precisos.',
            etiquetas: ['Palabras clave','Operadores','Filtros']
          },
          {
            codigo: '1.7',
            titulo: 'Bases de datos: institucional, Google Académico y Scopus',
            descripcion: 'Reconocimiento de las posibilidades de consulta y recuperación de información académica en diferentes bases de datos.',
            etiquetas: ['Base institucional','Google Académico','Scopus']
          }
        ]
      },
      {
        numero: 'Corte 2',
        titulo: 'Organización y presentación de la información',
        resumen: 'Organización ética y estructurada de la información mediante herramientas que facilitan su comprensión, representación y uso correcto.',
        temas: [
          {
            codigo: '2.1',
            titulo: 'Ética informacional',
            descripcion: 'Reflexión sobre el acceso, uso, manejo y difusión responsable de la información en entornos académicos y digitales.',
            etiquetas: ['Responsabilidad','Privacidad','Uso ético']
          },
          {
            codigo: '2.2',
            titulo: 'Derechos de autor y licencias de uso (Creative Commons)',
            descripcion: 'Reconocimiento de la autoría, las condiciones de reutilización y las licencias que orientan el uso legal de contenidos.',
            etiquetas: ['Derechos de autor','Licencias','Creative Commons']
          },
          {
            codigo: '2.3',
            titulo: 'Citación y referenciación (norma APA, última edición)',
            descripcion: 'Aplicación de criterios de citación y construcción de referencias para atribuir correctamente las ideas y fuentes utilizadas.',
            etiquetas: ['Citas','Referencias','APA']
          },
          {
            codigo: '2.4',
            titulo: 'Herramientas para organizar información',
            descripcion: 'Uso de recursos digitales para clasificar, registrar, relacionar y recuperar información durante un proceso académico.',
            etiquetas: ['Clasificación','Registro','Gestión']
          },
          {
            codigo: '2.5',
            titulo: 'Herramientas para representar la información',
            descripcion: 'Selección de herramientas adecuadas para convertir información en esquemas, mapas, tablas y otras representaciones.',
            etiquetas: ['Mapas','Esquemas','Tablas']
          },
          {
            codigo: '2.6',
            titulo: 'Representación visual para comunicar',
            descripcion: 'Organización de datos, conceptos y relaciones en recursos visuales claros, legibles y coherentes con el propósito comunicativo.',
            etiquetas: ['Jerarquía visual','Claridad','Comunicación']
          },
          {
            codigo: '2.7',
            titulo: 'Integración narrativa y curaduría visual',
            descripcion: 'Articulación de textos y elementos visuales seleccionados para construir un mensaje coherente, pertinente y comprensible.',
            etiquetas: ['Narrativa','Curaduría','Coherencia']
          }
        ]
      },
      {
        numero: 'Corte 3',
        titulo: 'Producción y comunicación de la información',
        resumen: 'Producción de contenidos claros y fundamentados para comunicar información con intención, rigor y pertinencia en medios académicos y digitales.',
        temas: [
          {
            codigo: '3.1',
            titulo: 'Narración digital: comunicar con propósito',
            descripcion: 'Construcción de mensajes digitales que articulan contenido, audiencia, medio y propósito comunicativo.',
            etiquetas: ['Narración digital','Audiencia','Propósito']
          },
          {
            codigo: '3.2',
            titulo: 'Estrategias de redacción, argumentación y comunicación académica',
            descripcion: 'Desarrollo de textos claros, cohesionados y sustentados que presentan una postura o explicación apoyada en información seleccionada.',
            etiquetas: ['Redacción','Argumentación','Comunicación académica']
          },
          {
            codigo: '3.3',
            titulo: 'Estrategias de divulgación digital de información',
            descripcion: 'Adaptación y publicación de contenidos en formatos y canales digitales acordes con la audiencia y el propósito del mensaje.',
            etiquetas: ['Divulgación','Formatos digitales','Canales']
          }
        ]
      }
    ];

    const explicaciones = {
      '1.1|Información': 'La información está formada por datos organizados y contextualizados que permiten comprender un hecho, una situación o un tema. Disponer de información no significa todavía haber construido conocimiento.',
      '1.1|Conocimiento': 'El conocimiento surge cuando la información se analiza, interpreta, relaciona con experiencias o saberes previos y se utiliza para comprender, explicar o tomar decisiones.',
      '1.1|Análisis crítico': 'Consiste en revisar la información con criterio: cuestionar su origen, propósito, evidencia, coherencia y pertinencia antes de aceptarla o utilizarla.',

      '1.2|Transformación digital': 'La transformación digital implica integrar tecnologías digitales para modificar procesos, formas de trabajo y maneras de crear, organizar, compartir y utilizar información; no consiste únicamente en cambiar el papel por una pantalla.',
      '1.2|Acceso': 'Las TIC ampliaron el acceso a la información al permitir consultar contenidos desde diferentes lugares y dispositivos. Este acceso más rápido también exige saber seleccionar y evaluar lo que se encuentra.',

      '1.3|Académica': 'Se produce en contextos educativos para desarrollar y comunicar conocimiento. Incluye trabajos, ensayos, materiales formativos, libros y publicaciones universitarias.',
      '1.3|Científica': 'Surge de procesos de investigación sistemáticos y presenta métodos, datos, resultados y conclusiones. Con frecuencia es evaluada por especialistas antes de publicarse.',
      '1.3|Institucional': 'Es elaborada y publicada oficialmente por organizaciones públicas o privadas, como normas, informes, estadísticas, comunicados y documentos técnicos.',
      '1.3|Informal': 'Circula en conversaciones, redes sociales, blogs personales o mensajes sin un proceso formal de validación. Puede orientar, pero debe verificarse antes de utilizarla como sustento.',

      '1.4|Autoridad': 'Revisa quién es responsable de la información. La autoría, formación, experiencia o respaldo de una institución ayudan a valorar si la fuente tiene competencia para tratar el tema.',
      '1.4|Actualidad': 'Comprueba la fecha de publicación o actualización y decide si es adecuada para el tema. En áreas que cambian rápidamente, la vigencia de la información es especialmente importante.',
      '1.4|Evidencia': 'Una fuente sólida sustenta sus afirmaciones con datos, referencias, documentos, métodos o enlaces verificables. Las afirmaciones sin respaldo deben tratarse con cautela.',
      '1.4|Propósito': 'Identifica para qué fue creado el contenido: informar, enseñar, persuadir, vender, entretener o influir. Reconocer el propósito ayuda a detectar posibles sesgos e intereses.',

      '1.5|Buscadores': 'Herramientas que rastrean e indexan contenidos de la web para recuperar resultados a partir de palabras o expresiones de búsqueda. Conviene usar filtros y revisar cuidadosamente la procedencia de los resultados.',
      '1.5|Repositorios': 'Sistemas digitales que almacenan, organizan y permiten consultar documentos académicos o científicos, como tesis, artículos, informes, datos y producción institucional.',
      '1.5|Bibliotecas digitales': 'Colecciones organizadas de libros, revistas, documentos y otros recursos en formato digital, generalmente acompañadas de herramientas de búsqueda y acceso controlado o abierto.',

      '1.6|Palabras clave': 'Términos principales que representan los conceptos de una necesidad de información. Elegir palabras precisas y sus sinónimos ayuda a mejorar los resultados de búsqueda.',
      '1.6|Operadores': 'Conectores como AND, OR y NOT permiten combinar, ampliar o excluir términos para controlar mejor una búsqueda en bases de datos y buscadores especializados.',
      '1.6|Filtros': 'Opciones que permiten limitar resultados por fecha, idioma, tipo de documento, autor, tema u otros criterios para acercarse a la información realmente pertinente.',

      '1.7|Base institucional': 'Es el conjunto de bases de datos, recursos bibliográficos y servicios de información a los que una institución ofrece acceso a su comunidad mediante suscripciones o colecciones propias.',
      '1.7|Google Académico': 'Buscador especializado en literatura académica que permite localizar artículos, tesis, libros, ponencias y otros documentos. Los resultados deben evaluarse porque no todos tienen el mismo nivel de calidad.',
      '1.7|Scopus': 'Base de datos bibliográfica y de citas que indexa literatura académica de múltiples áreas y permite explorar autores, documentos, revistas, referencias y relaciones de citación.',

      '2.1|Responsabilidad': 'Implica asumir las consecuencias del modo en que se busca, utiliza, modifica y comparte información, procurando no causar daño ni difundir contenidos engañosos.',
      '2.1|Privacidad': 'Se refiere a la protección de datos personales y a la capacidad de controlar cómo se recopila, almacena, utiliza y comparte información sobre una persona.',
      '2.1|Uso ético': 'Supone utilizar información de forma honesta, respetuosa y responsable, reconociendo autorías, evitando manipulación y protegiendo datos sensibles.',

      '2.2|Derechos de autor': 'Protegen las obras originales y reconocen a sus creadores ciertos derechos sobre reproducción, distribución, adaptación y comunicación de sus contenidos.',
      '2.2|Licencias': 'Indican qué usos permite el titular de una obra y bajo qué condiciones. Revisarlas evita utilizar contenidos de una manera no autorizada.',
      '2.2|Creative Commons': 'Conjunto de licencias estandarizadas que permiten a los autores comunicar de forma clara qué usos autorizan de sus obras, por ejemplo compartir, adaptar o reutilizar con determinadas condiciones.',

      '2.3|Citas': 'Son menciones dentro del texto que indican de dónde proviene una idea, dato, argumento o fragmento utilizado y permiten relacionarlo con su referencia completa.',

        nombre: '2  IED S3. TGrupo () Lluvia de ideas.docx'
      }
    };

    const menu = document.getElementById('menu');
    const contenido = document.getElementById('contenido');

    cortes.forEach((corte,index) => {
      const id = `corte-${index + 1}`;
      menu.insertAdjacentHTML('beforeend',
        `<button class="tab-btn" data-id="${id}" type="button">${corte.numero}</button>`
      );

      const temas = corte.temas.map(tema => {
        const etiquetas = tema.etiquetas.map(etiqueta => {
          if(tema.enlacesEtiqueta && tema.enlacesEtiqueta[etiqueta]){
            return `<button class="tag tag-button external-link" type="button" data-url="${tema.enlacesEtiqueta[etiqueta]}">${etiqueta}</button>`;
          }

          return `<button class="tag tag-button type-button" type="button" data-type="${tema.codigo}|${etiqueta}">${etiqueta}</button>`;
        }).join('');

        const botonInicial = tema.botonInicial
          ? `<button class="tag tag-button external-link" type="button" data-url="${tema.botonInicial.url}">${tema.botonInicial.texto}</button>`
          : '';

        let botonActividad = '';

        if(tema.actividadUrl){
          botonActividad = `<a class="resource-btn" href="${tema.actividadUrl}" target="_blank" rel="noopener">Actividad ↗</a>`;
        }else if(!tema.sinActividad){
          botonActividad = `<button class="resource-btn pending pending-activity" type="button">Actividad</button>`;
        }

        return `
          <article class="acc-item">
            <button class="acc-btn" type="button" aria-expanded="false">
              <span><span class="topic-code">${tema.codigo}</span>${tema.titulo}</span>
              <span class="round-plus small" aria-hidden="true">+</span>
            </button>
            <div class="acc-content">
              <p>${tema.descripcion}</p>
              <div class="tags">${botonInicial}${etiquetas}</div>
              ${botonActividad ? `<div class="resource">${botonActividad}</div>` : ''}
            </div>
          </article>`;
      }).join('');

      contenido.insertAdjacentHTML('beforeend', `
        <section class="section" id="${id}">
          <button class="section-head" type="button" aria-expanded="false">
            <span><small>${corte.numero}</small><strong>${corte.titulo}</strong></span>
            <span class="round-plus" aria-hidden="true">+</span>
          </button>
          <div class="section-body">
            <div class="lead">${corte.resumen}</div>
            <div class="accordion">${temas}</div>
          </div>
        </section>`
      );
    });

    contenido.insertAdjacentHTML('beforeend',
      '<footer>Aprendiendo con <strong>@LaProfeVivy</strong></footer>'
    );

    function toggleSection(section){
      const open = section.classList.contains('open');

      document.querySelectorAll('.section').forEach(item => {
        item.classList.remove('open');
        item.querySelector('.section-head').setAttribute('aria-expanded','false');
      });

      document.querySelectorAll('.tab-btn').forEach(button => button.classList.remove('active'));

      if(!open){
        section.classList.add('open');
        section.querySelector('.section-head').setAttribute('aria-expanded','true');
        document.querySelector(`.tab-btn[data-id="${section.id}"]`).classList.add('active');
      }
    }

    document.querySelectorAll('.tab-btn').forEach(button => {
      button.addEventListener('click',() => {
        const section = document.getElementById(button.dataset.id);
        toggleSection(section);
        section.scrollIntoView({behavior:'smooth',block:'start'});
      });
    });

    document.querySelectorAll('.section-head').forEach(button => {
      button.addEventListener('click',() => toggleSection(button.closest('.section')));
    });

    document.querySelectorAll('.acc-btn').forEach(button => {
      button.addEventListener('click',() => {
        const item = button.closest('.acc-item');
        const open = item.classList.toggle('open');
        button.setAttribute('aria-expanded',String(open));
      });
    });

    document.querySelectorAll('.external-link').forEach(button => {
      button.addEventListener('click',() => {
        window.open(button.dataset.url,'_blank','noopener');
      });
    });

    document.querySelectorAll('.pending-activity').forEach(button => {
      button.addEventListener('click',() => alert('Este tema aún no tiene actividad'));
    });

    document.querySelectorAll('.activity-download').forEach(button => {
      button.addEventListener('click',() => descargarActividad(button.dataset.file));
    });

    function descargarActividad(clave){
      const actividad = actividades[clave];
      if(!actividad) return;

      const binary = atob(actividad.base64);
      const bytes = new Uint8Array(binary.length);

      for(let i = 0; i < binary.length; i++){
        bytes[i] = binary.charCodeAt(i);
      }

      const blob = new Blob([bytes],{
        type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');

      link.href = url;
      link.download = actividad.nombre;

      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => URL.revokeObjectURL(url),1000);
    }

    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const modalText = document.getElementById('modal-text');

    function abrirModal(tipo){
      modalTitle.textContent = tipo.includes('|') ? tipo.split('|')[1] : tipo;
      modalText.textContent = explicaciones[tipo] || 'Información en construcción.';
      modal.classList.add('visible');
      document.getElementById('modal-close').focus();
    }

    function cerrarModal(){
      modal.classList.remove('visible');
    }

    document.querySelectorAll('.type-button').forEach(button => {
      button.addEventListener('click',() => abrirModal(button.dataset.type));
    });

    document.getElementById('modal-close').addEventListener('click',cerrarModal);

    modal.addEventListener('click',event => {
      if(event.target === modal) cerrarModal();
    });

    document.addEventListener('keydown',event => {
      if(event.key === 'Escape') cerrarModal();
    });
  </script>

</body>
